        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [teams]
      operationId: updateCapacityPeriod
      summary: Replace a capacity period
      description: >-
        Replaces a capacity period. ADMIN or the team's active manager; `404`, then `403`, then the body. An absent or null `wipLimit`
        clears the limit. A start date another active period of the team holds is `409`. A PUT that changes nothing is `204` and writes
        nothing, except on a `FLOW` period: any PUT takes it over (it becomes `MANUAL` and forgets its sprint, so the capacity import no
        longer updates or removes it). The plan revision does not move.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapacityPeriodRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Replaced
        '400': { $ref: '#/components/responses/BadRequest' }
