      operationId: createProgram
      summary: Create a program under a work stream
      description: >-
        Creates a program under the work stream. The stream's owner or ADMIN; `404` for a missing stream, then `403`, then the
        body. `ownerPersonId` must be an active person (`400` otherwise). The name must be unique among active programs,
        case-insensitively and across work streams (`409`). A closed work stream still accepts programs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new program (`/api/v1/programs/{id}`)
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/work-streams/{id}/program-order:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [plan]
      operationId: replaceProgramOrder
      summary: Replace a work stream's program order
      description: >-
        Replaces the order of the work stream's programs wholesale: the listed programs get positions 1 to n, the stream's other
        programs follow them by name, and an empty list resets to name order. The order is shared: the Plan and Programs pages draw
        it. The stream's owner or ADMIN; `404` for an unknown or deleted work stream before the `403`, then the body (a forbidden
        caller's malformed body is `403`); the chain and the guard are re-checked under the write, so a stream deleted or an owner
        demoted meanwhile is `404` or `403`, nothing written. `expectedRevision` is this stream's program order revision, so no other
        write stales it; `409` `urn:astrolabe:problem:stale-revision`, nothing written, when it is below the stored one or above the
        current plan revision (an unordered stream accepts any value up to it). `400` for an id listed twice, naming no program, a
        deleted one or one of another work stream, more than 1000 ids, or a negative `expectedRevision`. Every accepted PUT, a no-op
        included, bumps the plan revision by one; the answer carries it, now this stream's program order revision. Deleting or moving
        a program takes it out of the list without changing this order's revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramOrderUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The order was replaced; the body carries the new plan revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanOrderResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`expectedRevision` is stale for THIS stream''s program order (`type` is `urn:astrolabe:problem:stale-revision`)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/work-stream-order:
    put:
      tags: [plan]
      operationId: replaceWorkStreamOrder
      summary: Replace the work stream order
      description: >-
        Replaces the order of the work streams wholesale: the listed streams get positions 1 to n, the other streams follow them by
        name, and an empty list resets to name order. Closed work streams are always shown after the open ones, whatever their stored
        position. The order is shared: the Plan page and the Programs page draw it. ADMIN only; every other caller gets `403` before
        the body is read. `expectedRevision` is the work stream order's revision, so no other write stales it; `409`
        `urn:astrolabe:problem:stale-revision`, nothing written, when it is below the stored one or above the current plan revision (an
        order never written accepts any value up to the plan revision). `400` for an id listed twice, naming no work stream or a
        deleted one, more than 1000 ids, or a negative `expectedRevision`. Every accepted PUT, one that keeps the order included,
        bumps the plan revision by one; the answer carries it, now the work stream order's revision. Deleting a work stream takes it out of
        the list without changing this order's revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkStreamOrderUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The order was replaced; the body carries the new plan revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanOrderResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`expectedRevision` is stale for the work stream order (`type` is `urn:astrolabe:problem:stale-revision`)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
