    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [plan]
      operationId: getWorkStream
      summary: Get a work stream
      description: Any authenticated user.
      responses:
        '200':
          description: The work stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkStreamResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [plan]
      operationId: updateWorkStream
      summary: Replace a work stream's fields, owner and dates
      description: >-
        Replaces a work stream's fields, owner and dates. The stream's owner or ADMIN; a missing stream is `404` for every caller,
        before the `403`, and a forbidden caller's malformed body is still `403`. A full replace: an omitted `description` or
        `endDate` is unset (unsetting `endDate` reopens a closed stream, setting it closes it). Any caller who may edit may
        reassign the owner to another active person (`400` otherwise). A name clash with another active work stream is `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkStreamUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
