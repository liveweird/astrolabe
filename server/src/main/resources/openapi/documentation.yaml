      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new connection
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraConnection'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/jira/connections/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [jira]
      operationId: getJiraConnection
      summary: Get a Jira connection
      description: ADMIN only, guard before the id lookup (a non-admin gets a uniform `403`). The API token is never returned.
      responses:
        '200':
          description: The connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraConnection'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [jira]
      operationId: updateJiraConnection
      summary: Update a Jira connection
      description: |
        ADMIN only, guard before the id lookup. A full replace of the name, account email, auth scheme, project keys and `enabled`; an
        omitted or blank `apiToken` keeps the stored token, a present one rotates it. The site is the connection's identity: a different
        `siteUrl` is `409` (create a new connection). A case-insensitive name clash with another active connection is `409` too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JiraConnectionRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [jira]
      operationId: deleteJiraConnection
      summary: Delete a Jira connection (soft)
      description: ADMIN only, guard before the id lookup. Soft delete - the name is freed for reuse.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/jira/connections/test:
    post:
      tags: [jira]
      operationId: testJiraConnectionAdHoc
      summary: Test a Jira connection that is not (yet) stored
      description: |
        ADMIN only (guarded before the body decodes), rate limited per IP (`jira-test`, 10 a minute). Probes the Jira site with the credentials in
        the body - the same shape as a create (`apiToken` required) - and answers one row per endpoint probed. Never `502`: a failed probe, an
        upstream failure and a timeout are rows in a `200`. Nothing is stored. The token travels only in the body and is never logged, audited or
        echoed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JiraConnectionRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The probe rows (and the cloud id once `tenant_info` answered)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraTestResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/jira/connections/{id}/test:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [jira]
      operationId: testJiraConnection
      summary: Test a stored Jira connection
      description: |
        ADMIN only (guard before the id lookup), rate limited per IP (`jira-test`, 10 a minute). Probes the site with the STORED token (decrypted in
        memory for the call only) and answers one row per endpoint probed. Never `502`; a stored token that cannot be decrypted (a changed
        `DATA_ENCRYPTION_KEY`) is one failed `stored_token` row with code `TOKEN_UNREADABLE` - re-enter the token. The outcome is recorded on the
        connection (`lastTestedAt`, `lastTestOk` - the real verdict -, and the `cloudId` once resolved), and the field and issue-type discovery is
        stored whenever both the `field` and `issuetype` probes answered, even if another probe failed. `discoveredAt` in the answer is the
        instant of the snapshot now stored (this test's, or an earlier one's); `recorded` is false when an edit of the connection raced the test
        and the result was dropped.
      responses:
        '200':
          description: The probe rows (and the cloud id once `tenant_info` answered)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraTestResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/jira/connections/{id}/discovery:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [jira]
      operationId: getJiraDiscovery
      summary: The stored field and issue-type discovery of a Jira connection
      description: |
        ADMIN only, guard before the id lookup. The snapshot a passing Test connection stored: the date, number and recognised fields, the issue
        types, the hierarchy levels and what the name rules resolved (`markers`: Plans' "Target start"/"Target end" - by date-typed name, else by
        their `jpo-custom-field-baseline-*` custom type -, "Start date", `duedate`, story points, the Team field and the legacy parent links - an
        omitted marker is "not found"). `fieldsTruncated` says the site had more fields than the snapshot keeps. `409` with type
        `urn:astrolabe:problem:jira-not-discovered` before any test has stored a snapshot (both `field` and `issuetype` must have answered). A bounded document (at most 2,000 fields and 500 issue
        types), not a paged list.
      responses:
        '200':
          description: The discovery snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraDiscovery'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/jira/connections/{id}/mapping:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [jira]
      operationId: getJiraMapping
      summary: The field mapping of a Jira connection
      description: |
        ADMIN only, guard before the id lookup. `mapping` is the document last saved (null = never saved), `defaults` what the stored discovery
        resolves by name and `schema.custom` (Plans' "Target start"/"Target end", else "Start date"/`duedate`; the first story-points number
        field; the Team field; milestone = Epic level 1, project = 2 and program = 3 when the site has them; null before any discovery),
        and `effective` the one a run would use (`mapping`, else `defaults`). A read never answers `409`: before a discovery `defaults`
        and `effective` are null (and `mapping` too when it was never saved). `problems` lists why the stored mapping no longer fits the
        current discovery (empty when it fits); the Team field must be the site's `atlassian-team` field.
      responses:
        '200':
          description: The stored, default and effective mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraMappingResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [jira]
      operationId: updateJiraMapping
      summary: Save the field mapping of a Jira connection
      description: |
        ADMIN only, guard before the body. A full replace of the document, stored canonical; audited `jira.mapping_changed` with the SHA-256
        of the canonical document before and after. The milestone level is required; present levels must be strictly decreasing
        (program > project > milestone); hierarchy levels are 0 or more and every named one needs at least one non-sub-task issue type in the
        discovery; start/end
        fields must be `date` fields (a `datetime` is refused: its date depends on a time zone), the estimate field a `number` field and
        the Team field the site's `atlassian-team` field; `manDaysPerUnit` is greater than 0 and at most 1000 with at most two decimals - each
        violation a `400`. `409` with type `urn:astrolabe:problem:jira-not-discovered` when no Test connection has stored a discovery yet
        (the rules are checked against it). Nothing else is rewritten: bindings and observations keep what they hold, and the next run
        reads the mapped fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JiraMapping'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Saved
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/jira/connections/{id}/peek:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [jira]
      operationId: peekJiraIssue
      summary: Read one Jira issue through the mapping
      description: |
        ADMIN only, guard before the id lookup, rate limited per IP (`jira-test`, 10 a minute, shared with Test connection). Reads the issue
        `key` (`ABC-12`) from the site with the STORED token - the cheapest way to see what the mapping reads on a real site before any
        binding - and answers its system fields, the values the mapping resolves (the Astrolabe level its hierarchy level maps to, start,
        end, estimate, unit, team name) and `raw`: the mapped fields' values exactly as the site sent them, and nothing else of the issue.
        Uses the stored mapping, else the defaults. Not stored, not audited. `400` for a key that is not an issue key or whose project is not
        one of the connection's project keys (a moved issue is judged by its new key; a repeated `key` is a `400` too); `404` for an unknown connection or a key Jira does
        not know; `409` before a discovery (`urn:astrolabe:problem:jira-not-discovered`) or when the stored token cannot be decrypted
        (`urn:astrolabe:problem:jira-token-unreadable`, enter it again); `502` (`urn:astrolabe:problem:jira-upstream`) when Jira cannot
        be reached or refuses - the detail names the failure code only (`AUTHENTICATION_FAILED`, `UPSTREAM_UNAVAILABLE`, ...).
      parameters:
        - name: key
          in: query
          required: true
          schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,9}-[0-9]{1,10}$', maxLength: 21 }
          description: The Jira issue key, e.g. `ABC-12`.
      responses:
        '200':
          description: The issue read through the mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraPeekResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      # int32: ids are 32-bit server-side; a non-numeric or out-of-range id is a 400. Ids are database sequences that
      # start at 1, so 0 never addresses anything (it answers 404, like any unknown id).
      schema: { type: integer, format: int32, minimum: 1 }
    BaselineQuery:
      name: baseline
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 0 }
      description: |
        The id of an ACTIVE baseline to compare the view with (`baselines` registry). Absent: no comparison, and the document is exactly
        what it was before baselines existed. A repeated key or a value that is not a non-negative integer is a `400`; an id that is
        unknown or soft-deleted is a `400` whose `type` is `urn:astrolabe:problem:unknown-baseline` (the caller held the id, e.g. a
        remembered pick: it clears the pick and asks again) - answered AFTER the view's own rules, so a deleted project or team is
        still `404`. The comparison is computed in the same snapshot as the view, so its figures are consistent with the rows.
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: 1-based page index. Defaults to 1.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Rows per page. Defaults to 20, maximum 100.
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string }
      description: |
        Sort spec. Format: `field` (ascending) or `-field` (descending). Multiple fields are
        comma-separated, leftmost wins: `sort=-updatedAt,name`. The endpoint declares its
        sortable-field whitelist; unknown fields are rejected with `400`. `id` ascending is
        always appended as a deterministic tiebreaker.
  responses:
    UnsupportedMediaType:
      description: Request body must use application/json. A missing body or Content-Type remains a 400.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Missing, invalid or no longer valid token (revoked, or the account was deleted, demoted or re-credentialed since it was issued)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Caller is not permitted to perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Conflict with an existing resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TooManyRequests:
      description: >-
        Throttled — either the per-IP rate-limit bucket is exhausted (generic detail), on a telemetry read
        (`/api/v1/telemetry/**`) the per-USER telemetry bucket is exhausted (30/min), or, on /login, the
        per-account lockout is active (account-specific detail), or, on the self password change, the per-user
        wrong-current-password lock is active. All carry a ProblemDetail body.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    PayloadTooLarge:
      description: >-
        Request body exceeds the global 10 MiB ceiling — a memory-DoS backstop shared by
        every endpoint, so declared on every operation that takes a body (field-level maxLength
        rules reject oversized values far earlier on ordinary payloads). Cross-cutting for the
        coverage gate: pinned once by `PayloadValidationTest`, never once per operation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    BadGateway:
      description: >-
        The Jira site could not be reached or refused the request (`type` `urn:astrolabe:problem:jira-upstream`; the detail names the failure
        code only, never a URL, a body or a credential).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InternalServerError:
      description: >-
        Unexpected server error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Always `ok` on a 200 — a failed probe is a problem body, never a status word.
          example: ok
    PasswordResetConfirmRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Single-use 256-bit reset credential from the email; never logged or returned.
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 71
          description: The new password; at most 71 UTF-8 bytes (bcrypt ceiling).

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [token, expiresAt, refreshToken, refreshExpiresAt, userId, roles, disabledFeatures, language]
      properties:
        token:
          type: string
          description: "Short-lived access token; send as the `Authorization: Bearer` value."
        expiresAt:
          type: integer
          format: int64
          description: Access-token expiry as Unix epoch milliseconds.
        refreshToken:
          type: string
          description: Longer-lived token; POST to /api/v1/refresh to obtain a fresh pair.
        refreshExpiresAt:
          type: integer
          format: int64
          description: Refresh-token expiry as Unix epoch milliseconds.
        userId: { type: integer, format: int32, minimum: 0 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles of the authenticated user — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserRole:
      type: string
      enum: [ADMIN]
      description: >-
        An additional role. Every user is implicitly a regular user; the array only ever
        carries privileges added on top of that baseline.

    Feature:
      type: string
      enum: [MFA]
      description: >-
        A per-user gateable feature. Stored as the DISABLED set (no row = enabled).
        MFA is the one inverted-default, login-scoped flag: users start with it disabled
        (email MFA is opt-in), and it gates only the login flow.

    Permission:
      type: string
      enum: [ROADMAP_EDITOR]
      description: >-
        A per-user permission, stored as the GRANTED set (a row = held) and read from the database on every
        request. ROADMAP_EDITOR may rank the projects and set any project's target window.

    Language:
      type: string
      enum: [en, pl]
      description: >-
        A supported UI/email language. The ONE synced per-user language (V1) — set at
        create, changed only via PUT /users/{id}/language; drives the SPA at sign-in and
        every email sent to the user.

    UserLanguageUpdateRequest:
      type: object
      required: [language]
      properties:
        language:
          $ref: '#/components/schemas/Language'

    UserFeaturesUpdateRequest:
      type: object
      required: [disabledFeatures]
      properties:
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: The complete new DISABLED set — an empty array enables everything.

    UserPermissionsUpdateRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
          description: The complete new GRANTED set - an empty array revokes everything.

    MfaChallengeResponse:
      type: object
      required: [mfaRequired, challengeId, expiresAt]
      properties:
        mfaRequired:
          type: boolean
          description: Always true — the discriminator against LoginResponse in the login 200.
        challengeId:
          type: string
          description: Opaque single-use challenge id; send it back with the emailed code.
        expiresAt:
          type: integer
          format: int64
          description: Challenge (and code) expiry as Unix epoch milliseconds.

    MfaVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code:
          type: string
          description: The 6-digit code from the sign-in email.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Optional refresh token to revoke together with the access token.

    UserCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        password:
          type: string
          minLength: 10
          maxLength: 71
          description: >-
            Client-generated; at most 71 UTF-8 bytes (the bcrypt ceiling). Stored only as a
            hash and never returned.
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles; omitted/empty = a regular user.
        language:
          allOf: [{ $ref: '#/components/schemas/Language' }]
          nullable: true
          description: Create-only (the whole-user PUT never touches it); omitted = en.

    UserUpdateRequest:
      type: object
      required: [name, email, roles]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }

    UserResponse:
      type: object
      required: [id, name, email, roles, disabledFeatures, language, permissions]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles only — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
          description: Per-user permissions - the GRANTED set (read from the database per request, not a token claim); empty = none.

    UserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    PasswordUpdateRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 10
          maxLength: 71
          description: The new password (at least 10 characters, at most 71 UTF-8 bytes).
        currentPassword:
          type: string
          description: >-
            Required when the caller changes their OWN password (even an admin); omitted
            for an admin resetting somebody else's.

    PersonCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email:
          type: string
          maxLength: 254
          nullable: true
          description: Optional mailbox; unique among active people when set (case-insensitive). Blank = none.
        userId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The person's login, a user; must be active (`400` otherwise) and not linked to another active person (`409`).
    PersonUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email:
          type: string
          maxLength: 254
          nullable: true
          description: Optional mailbox; unique among active people when set (case-insensitive). Omitted on PUT (a full replace) = none.
        userId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The person's login, a user; must be active (`400` otherwise) and not linked to another active person (`409`). Omitted on PUT (a full replace) = unlinked.
    PersonResponse:
      type: object
      required: [id, name, email, userId, userEmail, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string, nullable: true }
        userId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The person's login; null when unset or when the linked user was soft-deleted.
        userEmail: { type: string, nullable: true, description: The login's email; null with `userId`. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    PersonListItem:
      type: object
      required: [id, name, email, userId, userEmail, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string, nullable: true }
        userId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The person's login; null when unset or when the linked user was soft-deleted.
        userEmail: { type: string, nullable: true, description: The login's email; null with `userId`. }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    PersonPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PersonListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0

    TeamCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        managerPersonId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The team's manager, a person of the people directory; must be active (`400` otherwise).
    TeamUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        managerPersonId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The team's manager, a person of the people directory; must be active (`400` otherwise). Omitted on PUT (a full replace) = no manager.
    TeamResponse:
      type: object
      required: [id, name, managerPersonId, managerName, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        managerPersonId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The team's manager (a person); null when unset or when the assigned person was soft-deleted.
        managerName: { type: string, nullable: true, description: The manager's name; null with `managerPersonId`. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    TeamListItem:
      type: object
      required: [id, name, managerPersonId, managerName, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        managerPersonId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The team's manager (a person); null when unset or when the assigned person was soft-deleted.
        managerName: { type: string, nullable: true, description: The manager's name; null with `managerPersonId`. }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    TeamPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0

    CapacityPeriodRequest:
      type: object
      required: [effectiveFrom, mdPerWeek]
      properties:
        effectiveFrom:
          type: string
          format: date
          description: >-
            The first day the capacity applies - any calendar day (years 1900-2999, past or future); a weekend date applies from the next
            working day. The week a period starts in counts each working day at the capacity in force that day.
        mdPerWeek:
          type: number
          format: double
          minimum: 0
          description: Man-days per week, `0 <= x < 1000000` with at most two decimals, else `400`; zero = the team is on hold.
        wipLimit:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
          nullable: true
          description: >-
            The most milestones in progress on one working day while this period is in force, `1..99` (`400` otherwise); absent or null =
            no limit. On PUT (a full replace) absent = the limit is cleared.
    CapacityPeriodResponse:
      type: object
      required: [id, teamId, effectiveFrom, mdPerWeek, wipLimit, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        teamId: { type: integer, format: int32, minimum: 0 }
        effectiveFrom: { type: string, format: date }
        mdPerWeek: { type: number, format: double, minimum: 0, description: Man-days per week with at most two decimals. }
        wipLimit: { type: integer, format: int32, minimum: 1, maximum: 99, nullable: true, description: Null = no WIP limit. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    CapacityPeriodList:
      type: object
      required: [items]
      description: A team's ACTIVE capacity periods in `effectiveFrom` order - a bounded list (a handful per team per year), not paged.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CapacityPeriodResponse'
    PublicHolidayResponse:
      type: object
      required: [id, date, name]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        date: { type: string, format: date }
        name: { type: string, minLength: 1, maxLength: 100 }
    PublicHolidayList:
      type: object
      required: [items]
      description: The whole public-holiday dictionary in date order - a bounded list (ADMIN-curated, about 14 rows a year), not paged.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicHolidayResponse'
    PublicHolidayCreateRequest:
      type: object
      required: [date, name]
      properties:
        date: { type: string, format: date, description: 'The day nobody works: `YYYY-MM-DD`, years 1900-2999, any weekday (a weekend holiday is stored and changes nothing).' }
        name: { type: string, minLength: 1, maxLength: 100, description: Trimmed; a control character is a `400`. }
    HolidayPresetRequest:
      type: object
      required: [preset, year]
      properties:
        preset:
          type: string
          enum: [POLISH]
          description: The holiday set to add.
        year: { type: integer, format: int32, minimum: 1900, maximum: 2999 }
    HolidayPresetResponse:
      type: object
      required: [added, skipped]
      properties:
        added:
          type: array
          description: The holidays this call stored, in date order.
          items:
            $ref: '#/components/schemas/PublicHolidayResponse'
        skipped:
          type: array
          description: The ISO dates of the preset's set that already had a holiday (left untouched, name included), in date order.
          items: { type: string, format: date }
    BaselineCreator:
      type: object
      required: [userId, name]
      description: The login that took a baseline. `name` is the login's linked ACTIVE person's name, else the login's display name (never its email).
      properties:
        userId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
    BaselineResponse:
      type: object
      required: [id, name, description, planRevision, createdAt, createdBy, milestoneCount, projectCount]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        planRevision:
          type: integer
          format: int64
          description: The plan revision this baseline EQUALS - the one its creation left behind. A view whose `revision` equals it shows no movement.
        createdAt: { type: integer, format: int64, description: Epoch millis }
        createdBy:
          nullable: true
          description: Null when the login that took the baseline is gone.
          allOf:
            - $ref: '#/components/schemas/BaselineCreator'
        milestoneCount: { type: integer, format: int32, minimum: 0, description: 'The active milestones the baseline captured.' }
        projectCount: { type: integer, format: int32, minimum: 0, description: 'The active projects the baseline captured.' }
    BaselineList:
      type: object
      required: [items, can]
      description: The active baselines, newest first - a bounded list (at most 100 by the cap), not paged.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BaselineResponse'
        can:
          $ref: '#/components/schemas/BaselineCan'
    BaselineCan:
      type: object
      required: [manage]
      properties:
        manage: { type: boolean, description: 'The caller may take, rename and delete baselines (ADMIN or a `ROADMAP_EDITOR`).' }
    BaselineCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: 'Trimmed; a control character is a `400`. Unique among the active baselines, case-insensitively.' }
        description: { type: string, maxLength: 500, nullable: true }
    BaselineUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: 'Trimmed; a control character is a `400`. Unique among the active baselines, case-insensitively.' }
        description: { type: string, maxLength: 500, nullable: true, description: 'A full replace - omitted clears it.' }
    Movement:
      type: object
      required: [kind, startDays, endDays, estimateDelta]
      description: >-
        What happened to one row since a baseline. `startDays`/`endDays` are signed WORKING days on the CURRENT calendar (positive =
        later) and are non-null only for a row dated on both sides; `estimateDelta` (live minus frozen, man-days) is non-null whenever
        the row exists on both sides, whatever the kind (an estimate change alone leaves the kind `UNCHANGED`).
      properties:
        kind:
          type: string
          enum: [UNCHANGED, MOVED, SCHEDULED, UNSCHEDULED, ADDED, REMOVED]
          description: >-
            `ADDED` = no row in the baseline; `REMOVED` = no live row; `SCHEDULED`/`UNSCHEDULED` = a dated/undated flip; `MOVED` =
            dated on both sides with a non-zero start or end delta; `UNCHANGED` otherwise.
        startDays: { type: integer, format: int32, nullable: true }
        endDays: { type: integer, format: int32, nullable: true }
        estimateDelta: { type: number, format: double, nullable: true }
    MovementTotals:
      type: object
      required: [unchanged, moved, later, earlier, scheduled, unscheduled, added, removed]
      description: The counts of rows by movement kind; `later`/`earlier` are the `moved` rows whose END is later/earlier.
      properties:
        unchanged: { type: integer, format: int32, minimum: 0 }
        moved: { type: integer, format: int32, minimum: 0 }
        later: { type: integer, format: int32, minimum: 0 }
        earlier: { type: integer, format: int32, minimum: 0 }
        scheduled: { type: integer, format: int32, minimum: 0 }
        unscheduled: { type: integer, format: int32, minimum: 0 }
        added: { type: integer, format: int32, minimum: 0 }
        removed: { type: integer, format: int32, minimum: 0 }
    BaselineRef:
      type: object
      required: [id, name, planRevision]
      description: The baseline a view's `baseline` blocks compare to.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        planRevision: { type: integer, format: int64, description: The plan revision the baseline equals. }
    SpanBaseline:
      type: object
      required: [span, movement]
      description: A project's, program's or work stream's span in the baseline and what became of it.
      properties:
        span:
          nullable: true
          description: The derived span then; null when nothing was scheduled.
          allOf:
            - $ref: '#/components/schemas/DateSpan'
        movement:
          $ref: '#/components/schemas/Movement'
    BaselineMilestone:
      type: object
      required: [milestoneId, teamIdThen, start, end, estimateMd, movement]
      description: A live milestone the baseline also froze - the figures it had then and its movement.
      properties:
        milestoneId: { type: integer, format: int32, minimum: 0 }
        teamIdThen: { type: integer, format: int32, minimum: 0, description: The team the milestone sat on in the baseline. }
        start: { type: string, format: date, nullable: true, description: The start then; null = it was unscheduled. }
        end: { type: string, format: date, nullable: true }
        estimateMd: { type: number, format: double, description: 'The estimate then, in man-days.' }
        movement:
          $ref: '#/components/schemas/Movement'
    RemovedMilestone:
      type: object
      required: [milestoneId, projectId, name, teamId, teamName, estimateMd, start, end]
      description: >-
        A milestone the baseline froze that is no longer where the view looks, as it was then. `now` is present only on the team view
        and only when the milestone still exists on another team; absent = it was deleted.
      properties:
        milestoneId: { type: integer, format: int32, minimum: 0 }
        projectId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        teamId: { type: integer, format: int32, minimum: 0, description: The team it sat on in the baseline. }
        teamName: { type: string }
        estimateMd: { type: number, format: double }
        start: { type: string, format: date, nullable: true }
        end: { type: string, format: date, nullable: true }
        now:
          type: object
          required: [teamId, teamName]
          properties:
            teamId: { type: integer, format: int32, minimum: 0 }
            teamName: { type: string }
    ProjectBaseline:
      type: object
      required: [id, name, planRevision, project, milestones, removed]
      description: Present only with `?baseline=N`.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        planRevision: { type: integer, format: int64 }
        project:
          nullable: true
          description: The project's own span then and its movement; null when the project is newer than the baseline.
          allOf:
            - $ref: '#/components/schemas/SpanBaseline'
        milestones:
          type: array
          description: One entry per live milestone of the project (scheduled or in the tray) that the baseline also froze, by id.
          items:
            $ref: '#/components/schemas/BaselineMilestone'
        removed:
          type: array
          description: The baseline's milestones of this project that are gone, by start (undated last), end, name and id.
          items:
            $ref: '#/components/schemas/RemovedMilestone'
    TeamBaseline:
      type: object
      required: [id, name, planRevision, milestones, removed]
      description: Present only with `?baseline=N`.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        planRevision: { type: integer, format: int64 }
        milestones:
          type: array
          description: >-
            One entry per live milestone of the team that the baseline also froze (whatever team it sat on then - `teamIdThen`), by id.
          items:
            $ref: '#/components/schemas/BaselineMilestone'
        removed:
          type: array
          description: The baseline's milestones of THIS team that are not on it any more (deleted, or moved - `now`), by start, end, name and id.
          items:
            $ref: '#/components/schemas/RemovedMilestone'
    RemovedProject:
      type: object
      required: [projectId, name, programName, workStreamName, span]
      description: A project the baseline froze that is gone now, with its names as they were.
      properties:
        projectId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        programName: { type: string }
        workStreamName: { type: string }
        span:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DateSpan'
    RoadmapBaseline:
      type: object
      required: [id, name, planRevision, removedProjects]
      description: Present only with `?baseline=N`.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        planRevision: { type: integer, format: int64 }
        removedProjects:
          type: array
          description: The baseline's projects that are gone, by work stream, program and name (case-insensitive) then id.
          items:
            $ref: '#/components/schemas/RemovedProject'
    RoadmapProjectBaseline:
      type: object
      required: [span, movement, rankPosition, targetStart, targetEnd]
      description: >-
        A project row against the baseline. Present only with `?baseline=N` and only for a project the baseline also froze (absent =
        the project is newer than the baseline).
      properties:
        span:
          nullable: true
          description: The derived span then; null when nothing was scheduled.
          allOf:
            - $ref: '#/components/schemas/DateSpan'
        movement:
          $ref: '#/components/schemas/Movement'
        rankPosition: { type: integer, format: int32, minimum: 1, nullable: true, description: The rank position then; null = it was unranked. }
        targetStart: { type: string, format: date, nullable: true }
        targetEnd: { type: string, format: date, nullable: true }
    BaselineView:
      type: object
      required: [revision, baseline, totals, projects, milestones]
      properties:
        revision: { type: integer, format: int64, minimum: 0, description: 'The plan revision, read before the rows.' }
        baseline:
          $ref: '#/components/schemas/BaselineResponse'
        totals:
          type: object
          required: [milestones, projects]
          description: The movement counts over EVERY milestone row and every project row (changed or not).
          properties:
            milestones:
              $ref: '#/components/schemas/MovementTotals'
            projects:
              $ref: '#/components/schemas/MovementTotals'
        projects:
          type: array
          description: The union of the baseline's and the live projects, by work stream, program and name (case-insensitive) then id.
          items:
            $ref: '#/components/schemas/BaselineViewProject'
        milestones:
          type: array
          description: Only the CHANGED milestone rows (any kind but `UNCHANGED`, or a different estimate), in the projects' order, then by start, end, name and id.
          items:
            $ref: '#/components/schemas/BaselineViewMilestone'
    BaselineViewProject:
      type: object
      required: [projectId, name, programName, workStreamName, rankThen, rankNow, baselineSpan, span, movement, counts]
      properties:
        projectId: { type: integer, format: int32, minimum: 0 }
        name: { type: string, description: The live name; the frozen one for a project that is gone. }
        programName: { type: string }
        workStreamName: { type: string }
        rankThen: { type: integer, format: int32, minimum: 1, nullable: true, description: 'Null = unranked then, or the project is newer than the baseline.' }
        rankNow: { type: integer, format: int32, minimum: 1, nullable: true, description: 'Null = unranked now, or the project is gone.' }
        baselineSpan:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DateSpan'
        span:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DateSpan'
        movement:
          $ref: '#/components/schemas/Movement'
        counts:
          $ref: '#/components/schemas/MovementTotals'
    BaselineFigures:
      type: object
      required: [start, end, estimateMd]
      properties:
        start: { type: string, format: date, nullable: true, description: Null = unscheduled. }
        end: { type: string, format: date, nullable: true }
        estimateMd: { type: number, format: double }
    BaselineViewMilestone:
      type: object
      required: [milestoneId, name, projectId, teamId, teamName, frozen, live, movement]
      description: A changed milestone. `frozen` is null for one added since the baseline, `live` for one removed; the name and team are the live ones when it exists now.
      properties:
