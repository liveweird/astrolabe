openapi: 3.1.0
info:
  title: astrolabe-api
  version: 0.4.0
  description: |
    JWT-authenticated REST API for Astrolabe — a planning and roadmapping tool. It serves the Astrolabe web app and is
    versioned by its `/api/v1` path prefix. This foundation exposes the accounts, teams, feature-flag and operational
    surface (people and teams included) and the first planning feature: the plan structure (work streams, programs, projects).

    Authorization model: every user is implicitly a regular user; additional global roles (`ADMIN`) are carried as
    the `roles` array and only ever ADD privileges on top of that baseline. Every operation requires a bearer
    access token except the seven that declare `security: []` (`/login`, `/login/mfa`, `/refresh`, `/password-reset`,
    `/password-reset/confirm` and the two probes). Beyond that each operation states its own rule: user management (`/users`, apart from
    reading or changing one's own record where noted) and the writes on people and teams are `ADMIN` only; reading people and teams is open to
    any authenticated user; telemetry is `ADMIN` only. A caller without the right gets a `403`. On the plan nodes (`/work-streams`, `/programs`, `/projects`) any
    authenticated user reads, creating a work stream is `ADMIN` only, and every other write needs the owner of the node or of anything above it
    (or `ADMIN`) - checked after the node is found, so a missing node is a `404` for every caller; elsewhere the `403` is uniform whether or
    not the addressed resource exists.

    List operations page with `page` / `pageSize` / `sort` into an `{items, page, pageSize, total}` envelope.

    All error responses use RFC 7807 `application/problem+json` (`ProblemDetail`). Any endpoint may additionally
    return `500` (`InternalServerError`) on an unexpected server fault.
servers:
  - url: http://localhost:8086
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: health
    description: Public liveness and readiness probes; they disclose nothing but a status.
  - name: auth
    description: Login (with the optional email second factor), token refresh, logout and the self-service password reset.
  - name: users
    description: Astrolabe's own login accounts - ADMIN-managed CRUD, per-user feature flags and permissions, language and password change.
  - name: people
    description: The people directory - the people who own plan nodes and manage teams, optionally linked to a login. Readable by any authenticated user (emails included), written by ADMIN only.
  - name: teams
    description: Flat teams, the ownership unit planning features scope to - readable by any authenticated user, written by ADMIN only. A team's manager is a person of the people directory.
  - name: plan
    description: The plan structure - work streams, programs and projects with their owners (people), and the whole-tree plan view. Readable by any authenticated user; writes are scoped to the owners on a node's chain (and ADMIN).
  - name: roadmap
    description: The global project ranking - one dense rank over the projects, rewritten wholesale under the plan lock, with a revision of its own. Readable by any authenticated user; written by ADMIN and ROADMAP_EDITOR holders.
  - name: telemetry
    description: Astrolabe's own vital signs (process memory, JVM, storage, request latency) and their 24h/7d/90d trends - ADMIN only.

paths:
  /api/v1/health:
    get:
      tags: [health]
      operationId: health
      summary: Liveness probe
      description: |
        Public and unauthenticated (the container HEALTHCHECK and the k8s liveness probe call it):
        `200` proves the process answers requests. It touches nothing — use `/api/v1/ready` for the
        database round trip.
      security: []
      responses:
        '200':
          description: The process is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/ready:
    get:
      tags: [health]
      operationId: ready
      summary: Readiness probe
      description: |
        Public and unauthenticated (the k8s readiness probe and the e2e global setup call it): `200`
        once a database round trip succeeds within a short budget, `503` while it does not — the pod
        leaves the Service until the database is back.
        Rate-limited per client IP (default 60/min, `READY_RATE_LIMIT_PER_MINUTE`; the kubelet needs
        12/min): over the bucket it answers `429`. `/api/v1/health` is not bucketed.
      security: []
      responses:
        '200':
          description: The app and its database answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: The database did not answer within the probe's budget
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for a JWT
      description: |
        Rate-limited per client IP, and additionally throttled per account: after several
        consecutive failures for one email (default 5, `LOGIN_LOCKOUT_THRESHOLD`), further
        attempts for that account — even with the correct password — are rejected with `429`
        for a lockout window (default 15 min, `LOGIN_LOCKOUT_DURATION_SECONDS`). A successful
        login resets the counter. The in-memory lockout store admits at most
        `LOGIN_LOCKOUT_MAX_TRACKED` identities (default 10,000). At capacity a new identity
        receives `429` before password verification; existing tracked identities continue,
        and expired state frees capacity. This applies equally to existing and unknown emails.

        **Email MFA (opt-in via the `MFA` feature flag):** when the account has MFA enabled,
        correct credentials answer `200` with an `MfaChallengeResponse` instead of tokens — a
        6-digit code is emailed to the account, and the client exchanges it together with the
        `challengeId` at `POST /api/v1/login/mfa` for the ordinary `LoginResponse`. On a
        deployment without outbound email (`MAIL_TRANSPORT=disabled`) an MFA-enabled login
        fails closed with `503`. The pending challenge store admits at most
        `MFA_MAX_TRACKED` challenges (default 10,000); new issuance at capacity receives
        `429` without sending a code, while existing challenges remain verifiable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: Token issued, or (MFA-enabled accounts) a second-factor challenge
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/MfaChallengeResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: MFA is enabled for the account but this deployment cannot send email
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/login/mfa:
    post:
      tags: [auth]
      operationId: verifyMfa
      summary: Exchange an MFA challenge and emailed code for a JWT pair
      description: |
        Second login step for MFA-enabled accounts. The `challengeId` comes from the login
        response, the 6-digit `code` from the email. Challenges are single-use, expire after
        a short TTL (default 5 min, `MFA_CODE_TTL_SECONDS`), and allow a few attempts
        (default 5, `MFA_MAX_ATTEMPTS`); every failure mode — unknown challenge, expired,
        wrong code, attempts exhausted, user gone, password changed — answers the uniform `401`. Rate-limited
        per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Exchange a refresh token for a fresh access + refresh pair
      description: |
        Pure-sliding session renewal with refresh-token rotation. Accepts a valid, unexpired,
        non-revoked refresh token and returns a brand-new access token and refresh token (each with
        a full TTL). The presented refresh token is retired: it is blocklisted until its own expiry,
        so it works once. A replay of an already-rotated token is `401`, except that a replay within
        a short grace window after the rotation (60 seconds by default; it covers a response lost in
        flight, at most twice per token, and not after a logout that reached the server) is answered with another fresh pair.
        The superseded access token is not revoked and
        lives until its own expiry. Requires no `Authorization` header (the access token may
        already be expired). Returns `401` for a missing/invalid/expired/revoked/already-used
        refresh token, if the user no longer exists, or if the token's credential revision no
        longer matches the user's current credentials. Password changes invalidate earlier refresh
        tokens even within the same clock second. Legacy tokens without a credential revision
        require a fresh sign-in after upgrading to 0.14.1.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: A fresh token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the bearer token (server-side denylist)
      description: |
        Revokes the access token carried in the `Authorization` header. If a `refreshToken` is
        supplied in the body, it is revoked too. The body is optional.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Token revoked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Request a self-service password reset
      description: |
        Normally answers `202` for a well-formed request, whether or not an account with that
        email exists (no account enumeration; the actual work happens asynchronously). If the
        account exists, a single-use reset link is emailed to its stored address. Requesting or
        opening a link never changes the password or any session: nothing changes until the owner
        confirms the link and chooses a new password (`POST /api/v1/password-reset/confirm`).
        Links expire after 15 minutes by default (`PASSWORD_RESET_TOKEN_TTL_SECONDS`, 1 to 3600
        seconds). Only a SHA-256 digest of the 256-bit random token is persisted, and the browser
        receives the token in a URL fragment, never in a server-visible path or query string.
        Throttled per submitted email — one request per interval
        (default 60 s, `PASSWORD_RESET_MIN_INTERVAL_SECONDS`) — uniformly for existing and
        unknown addresses, and rate-limited per client IP. The in-memory cooldown store admits
        at most `PASSWORD_RESET_MAX_TRACKED` identities (default 10,000). At capacity a new
        identity receives `429` and no reset email is scheduled; elapsed cooldowns free space.
        A soft-deleted account is unknown here (no link is minted or emailed, and the response
        follows the same acceptance and throttling rules). Answers `503` on deployments without
        outbound email (`MAIL_TRANSPORT=disabled`) or without a configured `MAIL_APP_URL` (the
        deployment's https origin, validated at startup, never derived from the `Host` header).
        Several requested links may coexist; completing one invalidates all of them.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '202':
          description: Accepted — if the account exists, an email is on its way
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: This deployment cannot send email, or has no `MAIL_APP_URL` (password reset unavailable)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Choose a new password using a single-use reset link
      description: |
        Public credential exchange: the reset token authorizes only this operation, never
        bearer-authenticated API calls. Send it in the JSON body, not the URL. A valid token is
        checked before the password is validated. Expired, used, malformed and unknown tokens,
        deleted accounts, and tokens predating a password or email change all answer one uniform
        `401`. Consumption of the token, the password replacement and the credential-generation
        advance commit atomically; concurrent confirmations cannot both succeed, including with
        different links for one account. A password the rules refuse (`400`) does not consume the
        token. Success invalidates every access and refresh session of the account and any pending
        MFA challenge. There is no automatic sign-in: sign in normally, with the MFA code if it is
        enabled. A best-effort confirmation email contains neither password nor token; a delivery
        failure does not undo the reset. Rate-limited to 10 requests per minute per client IP. A
        lost success response can make a retry answer `401`: try signing in with the chosen
        password, or request another link. A link issued earlier still works if outbound mail is
        later disabled.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Password replaced and existing sessions revoked; sign in again
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users (management view)
      description: |
        ADMIN only — the whole management surface is admin-gated; regular users keep only
        their self password change.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `name`, `email` (deliberately not `roles` — a set has no
          order). Default sort is `id` ascending; `id` ascending is always appended as a
          deterministic tiebreaker.
        - Filters (optional, whitelisted):
          - `name` / `email` — case- and accent-insensitive substring matches.
          - `role` — `ADMIN` (holders of the additional role) or `USER` (plain users).
          - `feature` + `featureEnabled` — feature-flag state (the pair must come
            together, `400` otherwise; `featureEnabled` is a strict boolean).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: email
          in: query
          required: false
          schema: { type: string }
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [ADMIN, USER] }
        - name: feature
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Feature' }
          description: Feature-flag state filter — must be paired with `featureEnabled` (400 otherwise).
        - name: featureEnabled
          in: query
          required: false
          schema: { type: boolean }
          description: Strict boolean — only users with `feature` enabled (true) or disabled (false).
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      description: |
        ADMIN only. The initial password is CLIENT-generated (the SPA's 96-bit generator) and
        shown to the admin exactly once — the server stores only the bcrypt hash and no
        response ever carries plaintext. The email is canonicalized (trimmed + lowercased);
        a duplicate among active accounts is a `409` (a soft-deleted account frees its email).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new user resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error (blank/too-long name or email, password rules)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [users]
      operationId: getUser
      summary: Fetch a user
      description: Target user or ADMIN (guard-before-read — an unauthorized caller 403s uniformly).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [users]
      operationId: updateUser
      summary: Update a user's name, email, and roles
      description: |
        ADMIN only. The password is deliberately not writable here (it has its own endpoint).
        Demoting the LAST active administrator is a `409` — the management surface must stay
        reachable. An email already used by another active account is also a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user
      description: |
        ADMIN only, soft delete: the account can no longer sign in, outstanding refresh
        tokens die (`user_gone`), the email is freed for reuse, and the user's catalog files
        stay with a deleted-creator marker. Deleting YOURSELF is a `403`; deleting the LAST
        active administrator is a `409`.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN, or attempted to delete their own account
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/features:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserDisabledFeatures
      summary: Replace a user's disabled-feature set (ADMIN only)
      description: |
        Per-user feature flags: a **wholesale replace** of the target user's DISABLED set —
        an empty array re-enables everything (idempotent, a same-set re-PUT is `204` again).
        **ADMIN-only**; changing one's OWN flags is allowed (the users routes themselves are
        never feature-gated, so an admin can always find their way back). `MFA` is the one
        inverted-default flag: users start with it in the disabled set, and a set omitting it
        — the empty "re-enable everything" array included — ENABLES the login second factor.
        The set rides the JWT, so a change takes effect at the target's next token refresh
        (≤15 min) or login. Audited as `user.features_changed` on an actual change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFeaturesUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Disabled-feature set replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/permissions:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserPermissions
      summary: Replace a user's granted-permission set (ADMIN only)
      description: |
        Per-user permissions: a **wholesale replace** of the target user's GRANTED set — an empty array revokes
        everything (idempotent, a same-set re-PUT is `204` again and audits nothing). **ADMIN-only**; changing
        one's OWN set is allowed (the features precedent). Unlike the feature flags (a disabled set riding the
        JWT), permissions are rows read from the database on **every request**, so a grant or a revoke takes
        effect on the target's very next request, never at the next token refresh. `ROADMAP_EDITOR` lets the user
        rank the projects and set any project's target window. Audited as `user.permissions_changed` on an actual change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPermissionsUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Granted-permission set replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/language:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserLanguage
      summary: Set a user's language (target user or ADMIN)
      description: |
        The ONE synced per-user language: it drives the UI at sign-in (rides `LoginResponse`,
        applied by the SPA on login/MFA/refresh) and the language of every email sent to the
        user (read fresh at send time, so a change takes effect immediately for emails; the
        UI picks it up at the next sign-in or token refresh). **Target user or ADMIN** — the
        header language switcher is the self-service writer (switching while signed in also
        saves here); an admin may fix a mis-set language. Idempotent (a same-value re-PUT is
        `204` again); an unsupported code is `400`. Audited as `user.language_changed` on an
        actual change. Set initially at create (`UserCreateRequest.language`, default `en`);
        the whole-user PUT deliberately never touches it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLanguageUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Language set }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: changeUserPassword
      summary: Change a user's password
      description: |
        Sets a new password for the user (minimum 10 characters). Only the password is
        changed; no other fields are touched. Requires the caller to be the target user,
        or to be ADMIN. When the caller changes their OWN password (even an admin),
        `currentPassword` is required and must match; an admin resetting another user's
        password omits it. A successful change invalidates all outstanding refresh tokens
        and pending MFA challenges, including changes within the same clock second
        (already-issued access tokens expire naturally within their TTL).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Password updated }
        '400':
          description: New password shorter than 10 characters or longer than 71 UTF-8 bytes
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN, or the required current password is missing/incorrect
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

