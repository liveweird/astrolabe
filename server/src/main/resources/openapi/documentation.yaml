openapi: 3.0.3
info:
  title: astrolabe-api
  version: 1.27.1
  description: |
    REST API of Astrolabe, a planning and roadmapping app: the plan (work streams, programs, projects, milestones, dependencies, baselines),
    the views over it, teams, people, users with their permissions and the Jira and Flow syncs. It serves the Astrolabe web app and is
    versioned by its `/api/v1` path prefix.

    Every operation requires a bearer JWT access token except the seven that declare `security: []` (`/login`, `/login/mfa`, `/refresh`,
    `/password-reset`, `/password-reset/confirm` and the two health probes). Global roles (`ADMIN`) only add privileges to the baseline of an
    authenticated user; each operation states who may call it, and a caller without the right gets a `403`.

    Errors are RFC 7807 `application/problem+json` documents; the problem types are listed in `ProblemDetail.type`. A `429` from a rate
    bucket carries `Retry-After`.

    Lists are paged envelopes (`page`, `pageSize`, `sort`, `q` into `{items, page, pageSize, total}`). Views (`/views/…`) answer one
    document each; ten of them carry a weak `ETag` and answer `If-None-Match` with `304`. Dates are ISO dates (`YYYY-MM-DD`); instants
    are epoch milliseconds.
servers:
  - url: http://localhost:8086
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: health
    description: Public liveness and readiness probes; they disclose nothing but a status.
  - name: auth
    description: Login (with the optional email second factor), token refresh, logout and the self-service password reset.
  - name: users
    description: Astrolabe's own login accounts - ADMIN-managed CRUD, per-user feature flags and permissions, language and password change.
  - name: people
    description: The people directory - the people who own plan nodes and manage teams, optionally linked to a login. Readable by any authenticated user (emails included), written by ADMIN only.
  - name: teams
    description: Flat teams, the ownership unit planning features scope to - readable by any authenticated user, written by ADMIN only. A team's manager is a person of the people directory.
  - name: plan
    description: The plan structure - work streams, programs and projects with their owners (people), the whole-tree plan view and the baselines (named, immutable copies of the plan's dated structure). Readable by any authenticated user; node writes are scoped to the owners on a node's chain (and ADMIN), baseline writes to ADMIN and ROADMAP_EDITOR holders.
  - name: roadmap
    description: >-
      The global project ranking - one dense rank over the projects, rewritten wholesale, with a revision of its own. Readable by any
      authenticated user; written by ADMIN and ROADMAP_EDITOR holders.
  - name: calendar
    description: The global public-holiday dictionary - days nobody works, skipped by every working-day figure. Readable by any authenticated user; written by ADMIN only (a plan write, it bumps the plan revision).
  - name: jira
    description: The Jira sync - ADMIN-managed Jira Cloud connections (the API token is encrypted at rest and never returned). The sync only observes; nothing is ever written to Jira.
  - name: flow
    description: >-
      The Flow sync - ADMIN-managed Flow connections (the service token is encrypted at rest and never returned) and the 1:1 links of
      teams to Flow teams (by the team's manager or ADMIN) with a team's Flow roster and sprints. The sync only reads Flow; nothing is
      ever written to Flow.
  - name: telemetry
    description: Astrolabe's own vital signs (process memory, JVM, storage, request latency) and their 24h/7d/90d trends - ADMIN only.

paths:
  /api/v1/health:
    get:
      tags: [health]
      operationId: health
      summary: Liveness probe
      description: >-
        Liveness probe. Public. `200` proves the process answers; it touches nothing, so it does not prove the database (see
        `/api/v1/ready`). Not rate-limited.
      security: []
      responses:
        '200':
          description: The process is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/ready:
    get:
      tags: [health]
      operationId: ready
      summary: Readiness probe
      description: >-
        Readiness probe. Public. `200` once a database round trip succeeds within a short budget, `503` while it does not. Rate-limited
        per client IP (default 60 a minute): `429` over the bucket. `/api/v1/health` is not.
      security: []
      responses:
        '200':
          description: The app and its database answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: The database did not answer within the probe's budget
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for a JWT
      description: >-
        Exchanges an email and password for a token pair or, for an account with the `MFA` feature enabled, an `MfaChallengeResponse`: a
        6-digit code is emailed and the client finishes at `POST /api/v1/login/mfa`. Public. Rate-limited per client IP and throttled
        per account: 5 consecutive failures (default) lock the email for 15 minutes (default), `429` even with the correct password and
        for unknown emails too; a success resets the count. `429` also when the in-memory lockout or challenge store is full (10,000
        entries by default), before any password check and without sending a code. `503` when MFA is enabled for the account but the
        deployment cannot send email. An account holds at most 3 live challenges (default); a further login drops the oldest, so its
        code stops working. MFA failures do not feed the lockout.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: Token issued, or (MFA-enabled accounts) a second-factor challenge
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/MfaChallengeResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: MFA is enabled for the account but this deployment cannot send email
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/login/mfa:
    post:
      tags: [auth]
      operationId: verifyMfa
      summary: Exchange an MFA challenge and emailed code for a JWT pair
      description: >-
        Second login step: exchanges the `challengeId` of the login answer and the emailed 6-digit `code` for the ordinary
        `LoginResponse`. Public; rate-limited per client IP. A challenge is single-use, expires after 5 minutes (default) and allows 5
        attempts (default). Every failure (unknown challenge, expired, wrong code, attempts exhausted, user gone, password changed)
        answers one uniform `401`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Exchange a refresh token for a fresh access + refresh pair
      description: >-
        Exchanges a refresh token for a new access and refresh pair, each with a full lifetime (a sliding session). Public: no
        `Authorization` header is needed, the access token may be expired. The presented refresh token is retired and works once; a
        replay within a 60-second grace after the rotation (default; it covers a lost response, at most twice per token, and not after a
        logout) answers another fresh pair. The superseded access token lives until its own expiry. `401` for a missing, invalid,
        expired, revoked or already-used token, a user that no longer exists, a token issued before a password change, or a token
        without a credential revision.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: A fresh token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the bearer token (server-side denylist)
      description: >-
        Revokes the access token in the `Authorization` header and, when the optional body carries a `refreshToken`, that refresh token
        too. Any authenticated caller.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Token revoked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Request a self-service password reset
      description: >-
        Requests a reset link for an email. Public; rate-limited per client IP. Answers `202` for any well-formed request whether or not
        an account exists (a soft-deleted one counts as unknown); if one does, a single-use link, valid 15 minutes by default, is
        emailed, its token in the URL fragment. Nothing changes until the owner confirms the link (`POST
        /api/v1/password-reset/confirm`). One request per email per interval (60 seconds by default), uniformly for known and unknown
        addresses: `429` when throttled, or when the in-memory cooldown store is full (10,000 entries by default; no email is
        scheduled). `503` without outbound email or without a configured application URL. Several links may coexist; completing one
        invalidates them all.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '202':
          description: Accepted — if the account exists, an email is on its way
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: This deployment cannot send email, or has no configured application URL (password reset unavailable)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Choose a new password using a single-use reset link
      description: >-
        Chooses a new password with the token of an emailed reset link. Public; the token authorizes only this operation. Rate-limited
        to 10 requests a minute per client IP. A valid token is checked before the password rules, and a refused password (`400`) does
        not consume it. One uniform `401` for an expired, used, malformed or unknown token, a deleted account, or a token that predates
        a password or email change. Concurrent confirmations cannot both succeed. Success (`204`) revokes every session of the account
        and any pending MFA challenge; there is no automatic sign-in. A retry after a lost success response answers `401`. A link issued
        earlier still works if outbound mail is later disabled. A confirmation email follows on a best-effort basis.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Password replaced and existing sessions revoked; sign in again
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users (management view)
      description: >-
        Lists users for management. ADMIN only. Paged; sortable by `id` (default), `name` and `email` (not `roles`), `id` ascending
        always breaking ties. Filters: `name` and `email` (case- and accent-insensitive substring), `role` (`ADMIN` holders or `USER`
        plain users), and `feature` with `featureEnabled`, which must come together (`400` otherwise).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/NameQuery'
        - $ref: '#/components/parameters/EmailQuery'
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [ADMIN, USER] }
        - name: feature
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Feature' }
          description: Feature-flag state filter — must be paired with `featureEnabled` (400 otherwise).
        - name: featureEnabled
          in: query
          required: false
          schema: { type: boolean }
          description: Strict boolean — only users with `feature` enabled (true) or disabled (false).
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      description: >-
        Creates a login. ADMIN only. The initial password is generated by the client, shown to the admin once and never returned. The
        email is trimmed and lowercased; a duplicate among active accounts is `409` (a deleted account frees its email). With
        `alsoCreatePerson: true` a person with the login's name and email is created and linked in the same transaction and the answer
        carries `personId`; a clash on the person side (`409`, or `400` for the people rules) fails the whole request and creates no
        login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new user resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error (blank/too-long name or email, password rules, or the person's rules when alsoCreatePerson)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >-
            The email is taken by another user (plain problem), or, with `alsoCreatePerson`, by an active person (`type`
            `urn:astrolabe:problem:person-email-taken`); no login is created
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [users]
      operationId: getUser
      summary: Fetch a user
      description: The target user or ADMIN; any other caller gets `403` whether or not the id exists.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [users]
      operationId: updateUser
      summary: Update a user's name, email, and roles
      description: >-
        Updates name, email and roles; the password and the language have their own operations. ADMIN only. Demoting the last active
        administrator, or an email used by another active account, is `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The user is the last active administrator and cannot be demoted (`type` `urn:astrolabe:problem:last-admin`), or the email is taken by
            another user (plain problem)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user
      description: >-
        Soft-deletes a user. ADMIN only. The account can no longer sign in, its refresh tokens die and its email is freed for reuse.
        Deleting yourself is `403`; deleting the last active administrator is `409`.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN, or attempted to delete their own account
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The user is the last active administrator and cannot be deleted (`type` `urn:astrolabe:problem:last-admin`); nothing is written
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/features:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserDisabledFeatures
      summary: Replace a user's disabled-feature set (ADMIN only)
      description: >-
        Replaces the user's disabled-feature set wholesale; an empty array re-enables everything. ADMIN only; changing your own flags is
        allowed. Idempotent (a same-set PUT is `204` again). `MFA` is the inverted-default flag: users start with it disabled, and a set
        that omits it, the empty array included, ENABLES the login second factor. The set rides the JWT, so a change reaches the target
        at their next token refresh (within 15 minutes) or login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFeaturesUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Disabled-feature set replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/permissions:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserPermissions
      summary: Replace a user's granted-permission set (ADMIN only)
      description: >-
        Replaces the user's granted-permission set wholesale; an empty array revokes everything. ADMIN only; changing your own set is
        allowed. Idempotent. Permissions are read on every request, so a grant or a revoke applies to the target's very next request.
        `ROADMAP_EDITOR` lets the user rank the projects and set any project's target window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPermissionsUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Granted-permission set replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/language:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserLanguage
      summary: Set a user's language (target user or ADMIN)
      description: >-
        Sets the user's one language, which drives the UI at sign-in and the language of every email sent to them (an email follows a
        change at once, the UI at the next sign-in or token refresh). The target user or ADMIN. Idempotent; an unsupported code is
        `400`. Set initially at create; the whole-user update never touches it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLanguageUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Language set }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: changeUserPassword
      summary: Change a user's password
      description: >-
        Sets a new password (at least 10 characters, at most 71 UTF-8 bytes) and nothing else. The target user or ADMIN. A caller changing their
        OWN password, an admin too, must send a matching `currentPassword`; an admin resetting another user's omits it. Success revokes
        the user's refresh tokens and pending MFA challenges; issued access tokens expire naturally. Both cases share a per-caller
        bucket of 10 requests a minute (`429` with `Retry-After`, `type` `about:blank`). The self change is also locked after 5
        consecutive wrong or missing current passwords (the login lockout's defaults, counted apart): `429` with `type`
        `urn:astrolabe:problem:password-change-locked` and no `Retry-After`, even with the right password, until the window expires, a
        password is verified or reset, or the server restarts. An admin reset is never locked. Order: `429` bucket, `403` guard, `429`
        lock, `400` (malformed body, then a refused new password, checked before the current one so it reveals nothing), `403` wrong or
        missing current password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204': { description: Password updated }
        '400':
          description: New password shorter than 10 characters or longer than 71 UTF-8 bytes
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN, or the required current password is missing/incorrect
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/people:
    get:
      tags: [people]
      operationId: listPeople
      summary: List people
      description: >-
        Lists people, the owners and managers of the plan. Any authenticated user (emails included); every write is ADMIN only. Paged;
