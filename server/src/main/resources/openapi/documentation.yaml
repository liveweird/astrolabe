                $ref: '#/components/schemas/MilestonePage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/milestones/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [plan]
      operationId: getMilestone
      summary: Get a milestone
      description: Any authenticated user. `404` when the milestone, or its project, program or work stream, is deleted.
      responses:
        '200':
          description: The milestone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [plan]
      operationId: updateMilestone
      summary: Replace a milestone's plan fields
      description: |
        An owner on the milestone's project chain - the project's own owner included - or ADMIN; a TEAM MANAGER who owns nothing on the
        chain gets `403` (a manager schedules, never edits plan fields). Read-before-guard (404, then 403, then the body). A full replace
        of name, description, team and estimate; the dates never change here (`PUT .../schedule`). A change of team keeps the dates: the
        new team's manager inherits the bar and may move or unschedule it (audited as `milestone.team_changed`, besides
        `milestone.updated`); the milestone leaves the old team's milestone order (`PUT /teams/{id}/milestone-order`) in the same write. The team must be active and the estimate valid (`400`); a name clash within the project is `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [plan]
      operationId: deleteMilestone
      summary: Delete a milestone (soft)
      description: |
        An owner on the milestone's project chain - the project's own owner included - or ADMIN, read-before-guard (404, then 403). Soft
        delete - the name is freed in its project and the milestone leaves its team's timeline and milestone order. Every ACTIVE dependency with this
        milestone at either end is soft-deleted with it, in the same locked transaction. Audited as `milestone.deleted` (with
        `dependencyCount`).
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/milestones/{id}/schedule:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [plan]
      operationId: scheduleMilestone
      summary: Set or clear a milestone's dates
      description: |
        ADMIN or the ACTIVE manager of the milestone's team - the project's owner is NOT enough (`403`). Read-before-guard (404, then 403,
        then the body); the guard is re-run under the plan lock against the milestone's stored team, so a manager revoked meanwhile is a
        `403`, not a `409`. `startDate` and `endDate` are both set or both null (`400` otherwise); both null unschedules (back to the
        tray). Dates are inclusive, the end not before the start, and the span must contain a Monday-Friday day (`400` "A milestone
        must cover at least one working day"). Concurrency is PER MILESTONE: `expectedRevision` is the plan revision of the client's view
        (the `revision` of a plan view document, or of its previous schedule answer); the write is `409` with `type`
        `urn:astrolabe:problem:stale-revision` only when THIS milestone's schedule was written at a later revision (or the value is
        above the current plan revision) - unrelated plan writes never stale it. A negative value is `400`. The answer carries the new plan revision. Every accepted PUT bumps the plan revision; it is audited as
        `milestone.scheduled` when the dates actually change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneScheduleRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The schedule was written; the body carries the new plan revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`expectedRevision` is stale for THIS milestone (`type` is `urn:astrolabe:problem:stale-revision`)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/projects/{id}/dependencies:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [plan]
      operationId: createDependency
      summary: Link a milestone or project to this project or one of its milestones
      description: |
        Creates a dependency whose SUCCESSOR (the constrained side: "it waits for the predecessor") is project `{id}` itself or one of
        its ACTIVE milestones (`400` otherwise). The caller must own something on THIS project's chain - the project's own owner
        included - or be ADMIN, read-before-guard (404, then 403, then the body); the PREDECESSOR's owner is asked nothing, and a team
        manager as such has no say (a dependency never moves a date). The predecessor is any active milestone or project, in this
        project or another (`400` "Unknown or deleted milestone ids: N" / "... project ids: N"). `type` is FS (the successor starts
        after the predecessor finishes), SS (starts after it starts), FF (finishes after it finishes) or SF (finishes after it
        starts); `lagDays` are WORKING days (Monday-Friday), negative = a lead, -365..365 (`400` outside; default 0). Linking an
        endpoint to itself is `400`. A violated link is only a warning in the project view and never moves anything.
        `409` in two cases, both with nothing written and no revision bump: the two endpoints are already linked (at most one
        active link per unordered pair, any type and either direction; change the type by deleting the link and adding another),
        or the link would close a directed cycle on the start/end
        time-point graph (a project contains its milestones) - then `type` is `urn:astrolabe:problem:dependency-cycle` and `cycle`
        names the entities, the first repeated last. Audited as `dependency.created`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependencyCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new dependency (`/api/v1/dependencies/{id}`)
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The two endpoints are already linked (either direction), or the link would close a cycle (`type` is
            `urn:astrolabe:problem:dependency-cycle` and `cycle` lists the entities)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/dependencies/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [plan]
      operationId: getDependency
      summary: Get a dependency
      description: |
        Any authenticated user. Both ends are resolved (a project's dates are its DERIVED span, null while nothing in it is
        scheduled). `404` when the dependency, or either end's project, program or work stream, is deleted.
      responses:
        '200':
          description: The dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [plan]
      operationId: deleteDependency
      summary: Delete a dependency (soft)
      description: |
        An owner on the SUCCESSOR's project chain - that project's own owner included - or ADMIN, read-before-guard (404, then 403); the
        predecessor's owner may not delete a link another project depends on. Re-checked under the plan lock. Soft delete - the
        ordered pair is free to link again. Audited as `dependency.deleted`.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/plan:
    get:
      tags: [plan]
      operationId: getPlanView
      summary: The whole plan tree with the caller's actions
      description: |
        Any authenticated user. One document with every active work stream, its programs and their projects (a deliberate exception
        to the paged envelope, bounded by the plan's scale of about 5 streams, 20 programs and 100 projects), open work streams first
        and then closed ones, each level by name. Every node carries `can`, the actions THIS caller may take, computed with the same
        rules the writes enforce. `revision` is the plan revision read before the rows.
      responses:
        '200':
          description: The plan tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/project/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [plan]
      operationId: getProjectView
      summary: One project with its milestones, the derived span and its drift
      description: |
        Any authenticated user; `404` when the project, its program or its work stream is deleted, for every caller. One document (a
        deliberate exception to the paged envelope, bounded by ONE project's milestones, about 50). `revision` is the plan revision read
        before the rows - send it back as a schedule write's `expectedRevision`. The milestones are split into `scheduled` (the timeline
        rows, by start date, end date, name and id) and `unscheduled` (the tray, by name and id); names sort case-insensitively. `span`
        is the earliest start to the latest end over the scheduled milestones (null when none is scheduled) and `drift` is that span
        against the project's target window as signed calendar-day deltas (positive = later than the target; null unless both the span and
        the window exist) - both are derived at request time and never stored. `project.can` and every milestone's `can` are the actions
        THIS caller may take, computed with the same rules the writes enforce: `createMilestone`, `edit` and `delete` follow the project's
        owner chain (the project's own owner included) or ADMIN; a milestone's `schedule` is true only for ADMIN or the active manager of
        THAT milestone's team - never for the project's owner as such.

        `dependencies` are the project's links: every active link with an end in this project (the project itself or one of its
        milestones), both ends resolved (an end in another project carries that project's name, so the page can draw a ghost row; a
        project end carries its DERIVED span, never its target window) and checked on the Monday-Friday working-day index. Bounded
        by one project's links and the external projects they touch. Ordered so that the top IS the conflict list: `VIOLATED` first
        (the largest `shortfallDays` first), then `OK`, then `UNSCHEDULED` (an end without dates: not evaluated, no warning); within a
        group by the successor's name, the predecessor's name (case-insensitive) and the id. A violated link only warns - nothing is
        ever moved. `project.can.createDependency` is `createMilestone`'s arithmetic (an owner on the project's chain, or ADMIN); a link's
        `can.delete` is the same arithmetic on the SUCCESSOR's project chain (so the owner of the predecessor's project alone cannot
        delete it).
      responses:
        '200':
          description: The project view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectView'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/team/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [plan]
      operationId: getTeamView
      summary: One team's milestones, weekly load against capacity, and WIP
      description: |
        Any authenticated user; `404` when the team is deleted, for every caller. One document (a deliberate exception to the paged
        envelope, bounded by ONE team's milestones - about 100 at the assumed scale -, their links and at most 520 weeks). `revision` is
        the plan revision read before the rows - send it back as a schedule write's `expectedRevision`; the team's order revision
        travels separately as `order.revision` (the `expectedRevision` of `PUT /teams/{id}/milestone-order`).

        The team's milestones are split into `scheduled` (the timeline rows) and `unscheduled` (the tray), both in the team's
        EFFECTIVE order. That order is the team's own where the manager set one (`order.custom`): the listed milestones first, exactly as
        listed, then the rest by the global PROJECT RANK (ranked projects before unranked ones, then project name and id), then a
        milestone's start date, end date, name and id with undated work last. The project rank is only the top-down suggestion and the
        default; a manager's override is never reshuffled by a later rank change, only unlisted milestones follow the rank.

        `weeks` has one row per ISO week from the Monday of the earliest scheduled start to the Sunday of the latest scheduled end
        (empty while nothing is scheduled; at most 520 weeks from the start, then `weeksTruncated`). A milestone's estimate is spread
        evenly over its Monday-Friday working days, so a week's `load` is the sum of the shares of the working days inside it.
        `capacity` is the sum over the week's working days of the man-days per week in force THAT day, divided by 5 - so the week a
        capacity period starts in is prorated by working days - and null ("no capacity", never zero, never flagged) when no period is
        in force on any working day of the week. `load` and `capacity` are rounded half-up to two decimals and `overloaded` compares the
        two rounded figures (`overloadMd` is their difference, only when overloaded). `maxWip` is the most scheduled milestones in
        progress on one working day of the week (a milestone is in progress on the working days of its effective span, the first
        working day on or after its start to the last on or before its end) and `wipExceeded` is true when some working day's count
        exceeds the WIP limit in force that day; a day without a limit never flags. An overloaded week and a week over the WIP limit
        are warnings only - nothing is ever moved.

        `team.can` carries the actions THIS caller may take, all with one arithmetic: ADMIN or the team's ACTIVE manager (`schedule` is
        `PUT /milestones/{id}/schedule` for this team's milestones, `editCapacity` the capacity period writes, `editOrder` the order
        PUT). `dependencies` are the project view's links for the links with an end among the team's milestones, both ends resolved
        and checked on the working-day index, violated first; a link's other end may lie in another team or project and is not listed
        as a row of its own.
      responses:
        '200':
          description: The team view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamView'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/roadmap:
    get:
      tags: [roadmap]
      operationId: getRoadmapView
      summary: The global project ranking with the caller's right to change it
      description: |
        Any authenticated user. One document (a deliberate exception to the paged envelope, bounded by the plan's scale of about 100
        projects): `ranked` in position order (dense 1..n) and `unranked`, the active projects without a position, by name. Each project
        carries its program, work stream and owner names. `can.editRank` is whether THIS caller may `PUT /roadmap/ranking` (ADMIN or a
        ROADMAP_EDITOR holder). `revision` is the RANKING's revision (the plan revision at which the rank was last written), read before the rows - send it back as `expectedRevision`. Plan writes elsewhere do not move it.
      responses:
        '200':
          description: The ranking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/roadmap/ranking:
    put:
      tags: [roadmap]
      operationId: replaceRoadmapRanking
      summary: Replace the global project ranking
      description: |
        ADMIN or a holder of the `ROADMAP_EDITOR` permission; every other caller gets `403` BEFORE the body is read (the route addresses
        no node). The permission is re-checked under the plan lock, so a grant revoked while the request was in flight refuses the write.
        Wholesale: the listed projects get positions 1..n in the given order and every other project becomes unranked (omit a project to
        unrank it; append an unranked one to rank it at the end). `expectedRevision` is the ranking's revision (`RoadmapView.revision`, or the previous answer): the PUT is `409` with
        `type` `urn:astrolabe:problem:stale-revision` and nothing is written only when the ranking was written at a later revision (another ranking PUT, or the delete of a
        ranked project) or the value is above the current plan revision - a plan write elsewhere never stales it. Reload the view and retry. `400` when an id is listed
        twice, is unknown or belongs to a deleted project, or more than 1000 ids are sent. Every accepted PUT, even one that keeps the
        order, bumps the plan revision by one and is audited as `roadmap.ranked`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RankingUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The ranking was replaced; the body carries the new plan revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`expectedRevision` is stale (`type` is `urn:astrolabe:problem:stale-revision`)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/milestone-order:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [plan]
      operationId: replaceTeamMilestoneOrder
      summary: Replace a team's milestone order
      description: |
        ADMIN or the team's ACTIVE manager, read-before-guard (`404` for an unknown or deleted team, then `403`, then the body: a forbidden
        caller's malformed body is still `403`). The project owner, the other teams' managers and every other caller get `403`. The
        guard is re-run under the plan lock, so a manager cleared while the request was in flight refuses the write.
        The team's milestone order is the order of ACTUAL EXECUTION and belongs to the team: the global project rank (`/roadmap/ranking`)
        is only the top-down suggestion and the DEFAULT of this order. Wholesale: the listed milestones get positions 1..n in the given
        order; the team's other milestones are unlisted and follow the listed ones in the default order (the project rank). An empty
        list resets the team to the default order. The positions are the team's own and absolute: a later project-rank change never
        reorders them. `expectedRevision` is this TEAM's order revision (`order.revision` of the team view), so another team's reorder or
        any other plan write elsewhere never makes it stale; a team whose order was never written accepts any `expectedRevision` up to
        the current plan revision. A smaller revision than the stored one, or one above the current plan revision, is `409` with `type`
        `urn:astrolabe:problem:stale-revision` and nothing is written - reload the team view and retry. `400` when an id is listed twice,
        names no milestone, a deleted milestone or a milestone of another team, more than 1000 ids are sent, or `expectedRevision` is
        negative. Every accepted PUT, even one that keeps the order, bumps the plan revision by one and is audited as
        `team.milestone_order_changed`; the answer carries that revision, which is now the team's order revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamOrderUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The order was replaced; the body carries the new plan revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamOrderResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`expectedRevision` is stale for THIS team''s order (`type` is `urn:astrolabe:problem:stale-revision`)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/telemetry/current:
    get:
      tags: [telemetry]
      operationId: getTelemetryCurrent
      summary: Astrolabe's own vital signs - processes, storage, request latency
      description: |
        ADMIN only (operational data: process sizes, container limits, storage sizes), read-only, no audit event;
        both telemetry reads share one per-user rate bucket (30/min, `429`). `.claude/docs/observability.md` "Telemetry".
        `processes` lists each sampling process (role `app`) with its latest raw sample: every live process, and the
        newest stale one when none is alive (a process that stopped stays visible for a day). `stale` = no sample for more than three
        sample intervals. A figure the process could not measure is null (no container limit outside a cgroup, no `memory.peak` on an
        old kernel) - never zero; `percentOfLimit` is the cgroup working set over the container limit, in percent. `storage` is the
        newest database / per-schema size (null before the first measurement). `requests` is the latest sample interval of the live
        processes: the `*` total and the 15 busiest routes.
      responses:
        '200':
          description: The current figures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryCurrent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/telemetry/history:
    get:
      tags: [telemetry]
      operationId: getTelemetryHistory
      summary: The trend of one telemetry section over 24 hours, 7 days or 90 days
      description: |
        ADMIN only (guard before the query is read: `403` outranks `400`), read-only, no audit event.
        `group` picks the section and `range` the span; both are required. Buckets: `24h` = the raw sample interval (widened to a whole
        multiple of it when that would exceed 400 points), `7d` = one hour (the hourly rollups plus the raw rows of the hours not yet
        rolled up), `90d` = six hours; `bucketSeconds` says which. At most 400 points per series and 40 series (`truncated` when more
        matched); a series has points only for the buckets that hold data.
        Per-process groups merge the processes of one `role` into one series, so a trend survives a restart (`memory`, `jvm`), or all
        processes into one series per route (`requests`, `role` null); `storage` is cluster-wide (`role` null). `requests` keeps the `*`
        total (count, p50, p95, 5xx, 429) and the ten busiest routes of the range (count, p50, p95). A DELTA series' `avg` is the
        bucket's TOTAL and its `max` the largest single sample interval; a GAUGE or PERCENTILE series' `avg` is the n-weighted mean and
        `max` the largest sample. `historyFrom` is the oldest instant the range can actually hold: the first sampler boot (a fresh
        install, or retention shorter than the range).
      parameters:
        - name: group
          in: query
          required: true
          schema:
            type: string
            enum: [memory, storage, requests, jvm]
          description: The panel section.
        - name: range
          in: query
          required: true
          schema:
            type: string
            enum: [24h, 7d, 90d]
          description: How far back the history reaches.
      responses:
        '200':
          description: The series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHistory'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      # int32: ids are 32-bit server-side; a non-numeric or out-of-range id is a 400. Ids are database sequences that
      # start at 1, so 0 never addresses anything (it answers 404, like any unknown id).
      schema: { type: integer, format: int32, minimum: 1 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: 1-based page index. Defaults to 1.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Rows per page. Defaults to 20, maximum 100.
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string }
      description: |
        Sort spec. Format: `field` (ascending) or `-field` (descending). Multiple fields are
        comma-separated, leftmost wins: `sort=-updatedAt,name`. The endpoint declares its
        sortable-field whitelist; unknown fields are rejected with `400`. `id` ascending is
        always appended as a deterministic tiebreaker.
  responses:
    UnsupportedMediaType:
      description: Request body must use application/json. A missing body or Content-Type remains a 400.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Missing, invalid or no longer valid token (revoked, or the account was deleted, demoted or re-credentialed since it was issued)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Caller is not permitted to perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Conflict with an existing resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TooManyRequests:
      description: >-
        Throttled — either the per-IP rate-limit bucket is exhausted (generic detail), on a telemetry read
        (`/api/v1/telemetry/**`) the per-USER telemetry bucket is exhausted (30/min), or, on /login, the
        per-account lockout is active (account-specific detail). All carry a ProblemDetail body.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    PayloadTooLarge:
      description: >-
        Request body exceeds the global 10 MiB ceiling — a memory-DoS backstop shared by
        every endpoint, so declared on every operation that takes a body (field-level maxLength
        rules reject oversized values far earlier on ordinary payloads). Cross-cutting for the
        coverage gate: pinned once by `PayloadValidationTest`, never once per operation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InternalServerError:
      description: >-
        Unexpected server error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Always `ok` on a 200 — a failed probe is a problem body, never a status word.
          example: ok
    PasswordResetConfirmRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Single-use 256-bit reset credential from the email; never logged or returned.
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 71
          description: The new password; at most 71 UTF-8 bytes (bcrypt ceiling).

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [token, expiresAt, refreshToken, refreshExpiresAt, userId, roles, disabledFeatures, language]
      properties:
        token:
          type: string
          description: "Short-lived access token; send as the `Authorization: Bearer` value."
        expiresAt:
          type: integer
          format: int64
          description: Access-token expiry as Unix epoch milliseconds.
        refreshToken:
          type: string
          description: Longer-lived token; POST to /api/v1/refresh to obtain a fresh pair.
        refreshExpiresAt:
          type: integer
          format: int64
          description: Refresh-token expiry as Unix epoch milliseconds.
        userId: { type: integer, format: int32, minimum: 0 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles of the authenticated user — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserRole:
      type: string
      enum: [ADMIN]
      description: >-
        An additional role. Every user is implicitly a regular user; the array only ever
        carries privileges added on top of that baseline.

    Feature:
      type: string
      enum: [MFA]
      description: >-
        A per-user gateable feature. Stored as the DISABLED set (no row = enabled).
        MFA is the one inverted-default, login-scoped flag: users start with it disabled
        (email MFA is opt-in), and it gates only the login flow.

    Permission:
      type: string
      enum: [ROADMAP_EDITOR]
      description: >-
        A per-user permission, stored as the GRANTED set (a row = held) and read from the database on every
        request. ROADMAP_EDITOR may rank the projects and set any project's target window.

    Language:
      type: string
      enum: [en, pl]
      description: >-
        A supported UI/email language. The ONE synced per-user language (V1) — set at
        create, changed only via PUT /users/{id}/language; drives the SPA at sign-in and
        every email sent to the user.

    UserLanguageUpdateRequest:
      type: object
      required: [language]
      properties:
        language:
          $ref: '#/components/schemas/Language'

    UserFeaturesUpdateRequest:
      type: object
      required: [disabledFeatures]
      properties:
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: The complete new DISABLED set — an empty array enables everything.

    UserPermissionsUpdateRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
          description: The complete new GRANTED set - an empty array revokes everything.

    MfaChallengeResponse:
      type: object
      required: [mfaRequired, challengeId, expiresAt]
      properties:
        mfaRequired:
          type: boolean
          description: Always true — the discriminator against LoginResponse in the login 200.
        challengeId:
          type: string
          description: Opaque single-use challenge id; send it back with the emailed code.
        expiresAt:
          type: integer
          format: int64
          description: Challenge (and code) expiry as Unix epoch milliseconds.

    MfaVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code:
          type: string
          description: The 6-digit code from the sign-in email.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Optional refresh token to revoke together with the access token.

    UserCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        password:
          type: string
          minLength: 10
          maxLength: 71
          description: >-
            Client-generated; at most 71 UTF-8 bytes (the bcrypt ceiling). Stored only as a
            hash and never returned.
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles; omitted/empty = a regular user.
        language:
          allOf: [{ $ref: '#/components/schemas/Language' }]
          nullable: true
          description: Create-only (the whole-user PUT never touches it); omitted = en.

    UserUpdateRequest:
      type: object
      required: [name, email, roles]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }

    UserResponse:
      type: object
      required: [id, name, email, roles, disabledFeatures, language, permissions]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles only — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
          description: Per-user permissions - the GRANTED set (read from the database per request, not a token claim); empty = none.

    UserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    PasswordUpdateRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 10
          maxLength: 71
          description: The new password (at least 10 characters, at most 71 UTF-8 bytes).
        currentPassword:
          type: string
          description: >-
            Required when the caller changes their OWN password (even an admin); omitted
            for an admin resetting somebody else's.

    PersonCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email:
          type: string
          maxLength: 254
          nullable: true
          description: Optional mailbox; unique among active people when set (case-insensitive). Blank = none.
        userId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The person's login, a user; must be active (`400` otherwise) and not linked to another active person (`409`).
    PersonUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email:
          type: string
          maxLength: 254
          nullable: true
          description: Optional mailbox; unique among active people when set (case-insensitive). Omitted on PUT (a full replace) = none.
        userId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The person's login, a user; must be active (`400` otherwise) and not linked to another active person (`409`). Omitted on PUT (a full replace) = unlinked.
    PersonResponse:
      type: object
      required: [id, name, email, userId, userEmail, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string, nullable: true }
        userId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
