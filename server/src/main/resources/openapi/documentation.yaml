        projectId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        teamId: { type: integer, format: int32, minimum: 0 }
        teamName: { type: string }
        estimateMd: { type: number, format: double, minimum: 0, description: Man-days with at most two decimals. }
        startDate: { type: string, format: date, nullable: true, description: Null = unscheduled (both dates are null together). }
        endDate: { type: string, format: date, nullable: true }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    DependencyType:
      type: string
      enum: [FS, SS, FF, SF]
      description: >-
        Finish-to-start (the successor starts after the predecessor finishes), start-to-start, finish-to-finish or
        start-to-finish. The SUCCESSOR is always the constrained side.
    EndpointKind:
      type: string
      enum: [MILESTONE, PROJECT]
    EndpointRef:
      type: object
      required: [kind, id]
      properties:
        kind: { $ref: '#/components/schemas/EndpointKind' }
        id: { type: integer, format: int32, minimum: 1 }
    DependencyCreateRequest:
      type: object
      required: [predecessor, successor, type]
      properties:
        predecessor:
          allOf: [{ $ref: '#/components/schemas/EndpointRef' }]
          description: >-
            Any active milestone or project (`400` "Unknown or deleted milestone ids: N" / "... project ids: N").
        successor:
          allOf: [{ $ref: '#/components/schemas/EndpointRef' }]
          description: The path project itself or one of its active milestones (`400` otherwise); never equal to the predecessor (`400`).
        type: { $ref: '#/components/schemas/DependencyType' }
        lagDays:
          type: integer
          format: int32
          minimum: -365
          maximum: 365
          default: 0
          description: WORKING days (Monday-Friday without the public holidays) the successor waits after the predecessor's anchor; negative = a lead.
    DependencyUpdateRequest:
      type: object
      required: [type, lagDays]
      description: The editable part of a link; the ends are fixed.
      properties:
        type: { $ref: '#/components/schemas/DependencyType' }
        lagDays:
          type: integer
          format: int32
          minimum: -365
          maximum: 365
          description: WORKING days (Monday-Friday without the public holidays) the successor waits after the predecessor's anchor; negative = a lead.
    DependencyEndpoint:
      type: object
      description: >-
        One resolved end of a dependency. A project's dates are its DERIVED span (earliest start to latest end over its scheduled
        milestones), never its target window; they are null while nothing in it is scheduled.
      required: [kind, id, name, projectId, projectName, teamId, teamName, startDate, endDate]
      properties:
        kind: { $ref: '#/components/schemas/EndpointKind' }
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        projectId: { type: integer, format: int32, minimum: 0, description: The milestone's project; the project's own id for a project. }
        projectName: { type: string }
        teamId: { type: integer, format: int32, minimum: 0, nullable: true, description: A milestone's team; null for a project. }
        teamName: { type: string, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
    DependencyResponse:
      type: object
      required: [id, predecessor, successor, type, lagDays, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        predecessor: { $ref: '#/components/schemas/DependencyEndpoint' }
        successor: { $ref: '#/components/schemas/DependencyEndpoint' }
        type: { $ref: '#/components/schemas/DependencyType' }
        lagDays: { type: integer, format: int32, minimum: -365, maximum: 365, description: Working days; negative = a lead. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    PlanView:
      type: object
      required: [revision, can, workStreams]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The plan revision, read before the rows; bumped by every plan write.
        can:
          type: object
          required: [createWorkStream]
          properties:
            createWorkStream: { type: boolean, description: The caller may create a work stream (ADMIN). }
        workStreams:
          type: array
          items:
            $ref: '#/components/schemas/PlanWorkStream'
    PlanWorkStream:
      type: object
      required: [id, name, description, ownerPersonId, ownerName, startDate, endDate, createdAt, updatedAt, can, programs]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true, description: Set only when the work stream is closed. }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        can:
          type: object
          required: [edit, delete, createProgram]
          properties:
            edit: { type: boolean }
            delete: { type: boolean, description: 'A rights flag: the caller may delete the node. The server can still answer 409 while it has active children.' }
            createProgram: { type: boolean }
        programs:
          type: array
          items:
            $ref: '#/components/schemas/PlanProgram'
    PlanProgram:
      type: object
      required: [id, workStreamId, name, description, ownerPersonId, ownerName, createdAt, updatedAt, can, projects]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        workStreamId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        can:
          type: object
          required: [edit, delete, createProject, move]
          properties:
            edit: { type: boolean }
            delete: { type: boolean, description: 'A rights flag: the caller may delete the node. The server can still answer 409 while it has active children.' }
            createProject: { type: boolean }
            move: { type: boolean, description: 'The caller may move this program to another work stream (ADMIN, or the owner of its work stream); offer the work streams whose `createProgram` is set.' }
        projects:
          type: array
          items:
            $ref: '#/components/schemas/PlanProject'
    PlanProject:
      type: object
      required: [id, programId, workStreamId, name, description, ownerPersonId, ownerName, targetStart, targetEnd, createdAt, updatedAt, can]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        programId: { type: integer, format: int32, minimum: 0 }
        workStreamId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        targetStart: { type: string, format: date, nullable: true }
        targetEnd: { type: string, format: date, nullable: true }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        can:
          type: object
          required: [edit, delete, editTargetWindow, move]
          properties:
            edit: { type: boolean }
            delete: { type: boolean, description: 'A rights flag: the caller may delete the node. The server can still answer 409 while it has active children.' }
            editTargetWindow: { type: boolean, description: 'The caller may set the target window (ADMIN, an owner above the project, or a roadmap editor).' }
            move: { type: boolean, description: 'The caller may move this project to another program (ADMIN, or an owner of its program or work stream - the project''s own owner alone may not); offer the programs whose `createProject` is set.' }

    ProjectView:
      type: object
      required: [revision, project, span, drift, scheduled, unscheduled, dependencies, idleGaps, criticalPath]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The plan revision, read before the rows; send it back as `expectedRevision` of a schedule write.
        project:
          $ref: '#/components/schemas/ProjectViewProject'
        span:
          nullable: true
          description: The earliest start to the latest end over the scheduled milestones; null when none is scheduled.
          allOf:
            - $ref: '#/components/schemas/DateSpan'
        drift:
          nullable: true
          description: '`span` against the project''s target window; null unless both exist.'
          allOf:
            - $ref: '#/components/schemas/Drift'
        scheduled:
          type: array
          description: The milestones with dates, by start date, end date, name (case-insensitive) and id.
          items:
            $ref: '#/components/schemas/ProjectMilestone'
        unscheduled:
          type: array
          description: The milestones without dates (the tray), by name (case-insensitive) and id.
          items:
            $ref: '#/components/schemas/ProjectMilestone'
        dependencies:
          type: array
          description: >-
            The active links with an end in this project, violated first (the largest shortfall first), then OK, then unscheduled;
            within a group by successor name, predecessor name and id.
          items:
            $ref: '#/components/schemas/ProjectDependency'
        idleGaps:
          type: array
          description: >-
            The idle gaps inside the span of the milestones that hold a working day: the maximal runs of 3 or more working days on which none of the project's milestones is in
            progress (weekends and public holidays neither count nor break a run), by start date; empty when there are none.
          items:
            $ref: '#/components/schemas/IdleGap'
        criticalPath:
          $ref: '#/components/schemas/CriticalPath'
        baseline:
          $ref: '#/components/schemas/ProjectBaseline'
    CriticalPath:
      type: object
      required: [upstream, upstreamTruncated]
      description: >-
        The milestones and projects of OTHER projects that lie upstream of this project's end (their slip would eventually move it),
        the critical ones first, then the rest by slack.
      properties:
        upstream:
          type: array
          description: >-
            The critical entries in full (the chain from its origin: start date, end date, name case-insensitive, kind, id), then at most
            100 others by slack ascending (then like the chain).
          items:
            $ref: '#/components/schemas/UpstreamEntity'
        upstreamTruncated:
          type: boolean
          description: True when more than 100 non-critical entries existed (the critical ones are never cut).
    UpstreamEntity:
      type: object
      required: [kind, id, name, projectId, projectName, startDate, endDate, slackDays, critical, hops]
      description: A milestone or project of another project upstream of the viewed project's end.
      properties:
        kind: { $ref: '#/components/schemas/EndpointKind' }
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        projectId: { type: integer, format: int32, minimum: 0, description: 'The entity''s own project (for a project, its own id).' }
        projectName: { type: string }
        startDate: { type: string, format: date, description: The stored start (a project's derived span start). }
        endDate: { type: string, format: date }
        slackDays: { type: integer, format: int32, minimum: 0, description: Working days it could slip before the viewed project's end moves. }
        critical: { type: boolean, description: Zero slack - it drives the viewed project's end. }
        hops: { type: integer, format: int32, minimum: 1, description: 'The fewest links between it and the viewed project (containment is free, so every milestone of a project a link names is 1); not a filter for the ends already in `dependencies`.' }
    ProjectDependency:
      type: object
      required: [id, predecessor, successor, type, lagDays, check, critical, can]
      description: A link of the project view (and of the team view) - both ends resolved, the check of the pure kernel and the caller's action.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        predecessor: { $ref: '#/components/schemas/DependencyEndpoint' }
        successor: { $ref: '#/components/schemas/DependencyEndpoint' }
        type: { $ref: '#/components/schemas/DependencyType' }
        lagDays: { type: integer, format: int32, minimum: -365, maximum: 365, description: Working days; negative = a lead. }
        check: { $ref: '#/components/schemas/DependencyCheck' }
        critical: { type: boolean, description: 'On the project view: a zero-slack link on the viewed project''s critical chain. On the team view always false - no per-project path is computed there.' }
        can:
          type: object
          required: [edit, delete]
          properties:
            edit: { type: boolean, description: 'The caller may change the link''s type and lag (`PUT /dependencies/{id}`): an owner on the SUCCESSOR''s project chain, or ADMIN.' }
            delete: { type: boolean, description: 'The caller may delete the link: an owner on the SUCCESSOR''s project chain, or ADMIN.' }
    DependencyStatus:
      type: string
      enum: [OK, VIOLATED, UNSCHEDULED]
      description: >-
        VIOLATED = the successor is short of what the type requires (a warning only); UNSCHEDULED = an end has no dates (a milestone
        without dates, a project with no scheduled milestone): not evaluated.
    DependencyCheck:
      type: object
      required: [status, shortfallDays, requiredDate, actualDate]
      description: >-
        The check of one link on the working-day index (Monday-Friday without the public holidays), with the effective start (the first working day on or after
        `start`) and end (the last working day on or before `end`) of each end. FS requires the successor's start on the working day after
        the predecessor's end; SS its start on the predecessor's start; FF its end on the predecessor's end; SF its end on the
        working day before the predecessor's start - each shifted by `lagDays` working days.
      properties:
        status: { $ref: '#/components/schemas/DependencyStatus' }
        shortfallDays:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: How many working days short the successor is; present (at least 1) only when `status` is `VIOLATED`.
        requiredDate:
          type: string
          format: date
          nullable: true
          description: The working day the type requires for the successor's start or end; null when `UNSCHEDULED`.
        actualDate:
          type: string
          format: date
          nullable: true
          description: The successor's effective start (FS, SS) or end (FF, SF); null when `UNSCHEDULED`.
    DateSpan:
      type: object
      required: [start, end]
      description: An inclusive span of calendar days.
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date, description: Not before `start`. }
    Drift:
      type: object
      required: [startDays, endDays]
      description: Calendar-day deltas of a derived span against a target window; positive = later than the target, negative = ahead, zero = on target.
      properties:
        startDays: { type: integer, format: int64, description: '`span.start` minus `target.start`.' }
        endDays: { type: integer, format: int64, description: '`span.end` minus `target.end`.' }
    ProjectViewProject:
      type: object
      required: [id, programId, workStreamId, programName, workStreamName, name, description, ownerPersonId, ownerName, targetStart, targetEnd, createdAt, updatedAt, can]
      description: The `PlanProject` fields plus the names of the project's program and work stream.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        programId: { type: integer, format: int32, minimum: 0 }
        workStreamId: { type: integer, format: int32, minimum: 0 }
        programName: { type: string }
        workStreamName: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        targetStart: { type: string, format: date, nullable: true }
        targetEnd: { type: string, format: date, nullable: true }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        can:
          type: object
          required: [edit, delete, editTargetWindow, createMilestone, createDependency]
          properties:
            edit: { type: boolean }
            delete: { type: boolean, description: 'A rights flag: the caller may delete the project (its milestones go with it).' }
            editTargetWindow: { type: boolean, description: 'The caller may set the target window (ADMIN, an owner above the project, or a roadmap editor).' }
            createMilestone: { type: boolean, description: 'The caller may create a milestone under the project (an owner on its chain, or ADMIN).' }
            createDependency: { type: boolean, description: 'The caller may create a dependency whose successor is the project or one of its milestones (an owner on its chain, or ADMIN).' }
    ProjectMilestone:
      type: object
      required: [id, projectId, name, description, teamId, teamName, estimateMd, startDate, endDate, createdAt, updatedAt, slackDays, critical, can]
      description: A milestone as the project view shows it - the `MilestoneResponse` fields plus the caller's actions. Both dates are null in `unscheduled`, both set in `scheduled`.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        projectId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        teamId: { type: integer, format: int32, minimum: 0 }
        teamName: { type: string }
        estimateMd: { type: number, format: double, minimum: 0, description: Man-days with at most two decimals. }
        startDate: { type: string, format: date, nullable: true, description: Null = unscheduled (both dates are null together). }
        endDate: { type: string, format: date, nullable: true }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
        slackDays: { type: integer, format: int32, minimum: 0, nullable: true, description: 'Working days this milestone could slip before THIS project''s end moves; null = unscheduled.' }
        critical: { type: boolean, description: 'Zero slack: on the critical path of this project.' }
        can:
          type: object
          required: [edit, delete, schedule]
          properties:
            edit: { type: boolean, description: 'The caller may change the plan fields (an owner on the project''s chain, or ADMIN).' }
            delete: { type: boolean }
            schedule: { type: boolean, description: 'The caller may set or clear the dates: ADMIN or the active manager of the milestone''s team - never the project''s owner as such.' }

    TeamView:
      type: object
      required: [revision, team, order, capacity, weeks, weeksTruncated, scheduled, unscheduled, dependencies, idleGaps]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The plan revision, read before the rows; send it back as `expectedRevision` of a schedule write.
        team:
          $ref: '#/components/schemas/TeamViewTeam'
        order:
          $ref: '#/components/schemas/TeamViewOrder'
        capacity:
          $ref: '#/components/schemas/TeamViewCapacity'
        weeks:
          type: array
          description: >-
            One row per ISO week, Monday-keyed, from the earliest scheduled start's Monday to the latest scheduled end's Sunday (at most
            520); empty while nothing is scheduled.
          items:
            $ref: '#/components/schemas/WeekLoad'
        weeksTruncated:
          type: boolean
          description: True when the range of scheduled milestones is longer than 520 weeks and `weeks` stops there.
        scheduled:
          type: array
          description: The milestones with dates (the timeline rows) in the team's effective order.
          items:
            $ref: '#/components/schemas/TeamMilestone'
        unscheduled:
          type: array
          description: The milestones without dates (the tray) in the team's effective order (the dates are null, so name and id decide within a project).
          items:
            $ref: '#/components/schemas/TeamMilestone'
        dependencies:
          type: array
          description: >-
            The active links with an end among the team's milestones, violated first (the largest shortfall first), then OK, then
            unscheduled; within a group by successor name, predecessor name and id. Ends are resolved, not listed: there are no ghost rows.
          items:
            $ref: '#/components/schemas/ProjectDependency'
        idleGaps:
          type: array
          description: >-
            The idle gaps inside the span of the team's scheduled milestones: the maximal runs of 3 or more working days on which none of
            them is in progress (weekends and public holidays neither count nor break a run), by start date; empty when there are none.
          items:
            $ref: '#/components/schemas/IdleGap'
        baseline:
          $ref: '#/components/schemas/TeamBaseline'
    IdleGap:
      type: object
      required: [start, end, workingDays]
      description: A run of idle working days, answered as its first and last working day.
      properties:
        start: { type: string, format: date, description: The first idle working day. }
        end: { type: string, format: date, description: 'The last idle working day (a working day, never a weekend or holiday).' }
        workingDays: { type: integer, format: int32, minimum: 3, description: The number of idle working days from `start` to `end` (weekends and holidays not counted). }
    TeamViewTeam:
      type: object
      required: [id, name, managerPersonId, managerName, createdAt, updatedAt, can]
      description: The `TeamResponse` fields plus what the caller may do with the team's plan.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        managerPersonId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The team's manager (a person); null when unset or when the assigned person was soft-deleted.
        managerName: { type: string, nullable: true, description: The manager's name; null with `managerPersonId`. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
        can:
          type: object
          required: [schedule, editCapacity, editOrder]
          description: Three names with one arithmetic - ADMIN, or the caller is the active manager of THIS team.
          properties:
            schedule: { type: boolean, description: 'The caller may set or clear the dates of this team''s milestones (`PUT /milestones/{id}/schedule`).' }
            editCapacity: { type: boolean, description: 'The caller may add, change and delete this team''s capacity periods.' }
            editOrder: { type: boolean, description: 'The caller may replace this team''s milestone order (`PUT /teams/{id}/milestone-order`).' }
    TeamViewOrder:
      type: object
      required: [custom, revision, milestoneIds]
      properties:
        custom: { type: boolean, description: True when the team's manager has set an order (the project rank is then only the default for the unlisted tail). }
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The team's order revision (0 when never written); send it back as `expectedRevision` of the order PUT.
        milestoneIds:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: integer, format: int32, minimum: 0 }
          description: >-
            The stored custom order: the manager's listed milestones that are still ACTIVE milestones of this team, scheduled or not, in
            stored position order (empty when `custom` is false). The unscheduled ones are listed here only; a client that writes the
            order again keeps their places (`planning-model.md` "The team milestone order").
    TeamViewCapacity:
      type: object
      required: [periods]
      properties:
        periods:
          type: array
          description: The team's active capacity periods in `effectiveFrom` order, with their WIP limits.
          items:
            $ref: '#/components/schemas/CapacityPeriodResponse'
    WeekLoad:
      type: object
      required: [weekStart, load, capacity, overloaded, overloadMd, maxWip, wipExceeded]
      description: One ISO week of the team's load against its capacity and WIP limit. Warnings only.
      properties:
        weekStart: { type: string, format: date, description: The week's Monday. }
        load:
          type: number
          format: double
          minimum: 0
          description: The man-days of the scheduled milestones falling in the week (each estimate spread evenly over its working days), two decimals.
        capacity:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: >-
            The sum over the week's working days of the capacity in force that day, over 5 (two decimals); null when no capacity period
            is in force on any working day of the week.
        overloaded: { type: boolean, description: 'True when `capacity` is set and `load` exceeds it (compared as rounded).' }
        overloadMd: { type: number, format: double, minimum: 0, nullable: true, description: '`load` minus `capacity`; only when `overloaded`.' }
        maxWip:
          type: integer
          format: int32
          minimum: 0
          description: The most scheduled milestones in progress on one working day of the week.
        wipExceeded: { type: boolean, description: Some working day's in-progress count exceeds the WIP limit in force that day. }
    TeamMilestone:
      type: object
      required: [id, projectId, name, description, teamId, teamName, estimateMd, startDate, endDate, createdAt, updatedAt, projectName, programName, workStreamName, rankPosition]
      description: A milestone as the team view shows it - the `MilestoneResponse` fields plus the names of its project chain and its project's rank. Both dates are null in `unscheduled`.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        projectId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        teamId: { type: integer, format: int32, minimum: 0 }
        teamName: { type: string }
        estimateMd: { type: number, format: double, minimum: 0, description: Man-days with at most two decimals. }
        startDate: { type: string, format: date, nullable: true, description: Null = unscheduled (both dates are null together). }
        endDate: { type: string, format: date, nullable: true }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
        projectName: { type: string }
        programName: { type: string }
        workStreamName: { type: string }
        rankPosition: { type: integer, format: int32, minimum: 1, nullable: true, description: The project's position in the global project rank; null = unranked. }

    RoadmapView:
      type: object
      required: [revision, can, teams, ranked, unranked, links]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The ranking's revision (the plan revision at which the rank was last written), read before the rows; send it back as `expectedRevision`.
        can:
          type: object
          required: [editRank]
          properties:
            editRank: { type: boolean, description: The caller may replace the ranking (ADMIN or a roadmap editor). }
        teams:
          type: array
          description: The active teams with at least one active milestone in the plan, by name (case-insensitive) and id.
          items:
            $ref: '#/components/schemas/RoadmapTeam'
        ranked:
          type: array
          description: The ranked projects in position order.
          items:
            $ref: '#/components/schemas/RoadmapRankedProject'
        unranked:
          type: array
          description: The active projects without a position, by name.
          items:
            $ref: '#/components/schemas/RoadmapProject'
        links:
          type: array
          description: The dependencies between projects, rolled up per ordered pair (predecessor, successor project id).
          items:
            $ref: '#/components/schemas/RoadmapLink'
        baseline:
          $ref: '#/components/schemas/RoadmapBaseline'
    RoadmapTeam:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
    RoadmapRankedProject:
      type: object
      required: [position, project]
      properties:
        position: { type: integer, format: int32, minimum: 1, description: 'Dense: the ranked projects hold 1..n.' }
        project:
          $ref: '#/components/schemas/RoadmapProject'
    RoadmapProject:
      type: object
      required: [id, name, programId, programName, workStreamId, workStreamName, ownerPersonId, ownerName, targetStart, targetEnd, rankPosition, teamIds, span, drift, flags, can]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        programId: { type: integer, format: int32, minimum: 0 }
        programName: { type: string }
        workStreamId: { type: integer, format: int32, minimum: 0 }
        workStreamName: { type: string }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        targetStart: { type: string, format: date, nullable: true }
        targetEnd: { type: string, format: date, nullable: true }
        rankPosition: { type: integer, format: int32, minimum: 1, nullable: true, description: The project's position in the global rank; null = unranked. }
        teamIds:
          type: array
          description: The distinct teams of the project's active milestones (scheduled or not), ascending.
          items: { type: integer, format: int32, minimum: 0 }
        span:
          nullable: true
          description: The earliest start to the latest end over the project's scheduled milestones; null when none is scheduled.
          allOf:
            - $ref: '#/components/schemas/DateSpan'
        drift:
          nullable: true
          description: '`span` against the target window; null unless both exist.'
          allOf:
            - $ref: '#/components/schemas/Drift'
        flags:
          type: array
          description: The drift and rank-inversion flags raised on this project; WARNING first, then by kind, team and other project.
          items:
            $ref: '#/components/schemas/PlanFlag'
        can:
          type: object
          required: [editTargetWindow]
          properties:
            editTargetWindow: { type: boolean, description: 'The caller may `PUT /projects/{id}/target-window`: ADMIN, an owner above the project, or a ROADMAP_EDITOR holder.' }
        baseline:
          $ref: '#/components/schemas/RoadmapProjectBaseline'
    PlanFlag:
      type: object
      required: [kind, severity, days, teamId, otherProjectId]
      description: One flag raised on a project. Warnings only - nothing is ever moved.
      properties:
        kind:
          type: string
          enum: [DRIFT_END_LATE, DRIFT_START_LATE, DRIFT_END_EARLY, RANK_INVERSION]
        severity:
          type: string
          enum: [WARNING, INFO]
        days:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: 'Calendar days: the drift, or for a rank inversion how much earlier this project starts than `otherProjectId`.'
        teamId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The shared team of a per-team rank inversion; null for drift and for the no-shared-team INFO.
        otherProjectId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The higher-ranked project of a rank inversion; null for drift.
    RoadmapLink:
      type: object
      required: [predecessorProjectId, successorProjectId, direct, milestoneLinks]
      description: The dependencies between two projects, rolled up for one ORDERED pair. Links inside one project are not listed.
      properties:
        predecessorProjectId: { type: integer, format: int32, minimum: 0 }
        successorProjectId: { type: integer, format: int32, minimum: 0 }
        direct:
          nullable: true
          description: The project-to-project link of the pair (at most one per ordered pair); null when there is none.
          allOf:
            - $ref: '#/components/schemas/RoadmapDirectLink'
        milestoneLinks:
          $ref: '#/components/schemas/RoadmapLinkBundle'
    RoadmapDirectLink:
      type: object
      required: [id, type, lagDays, check]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        type: { $ref: '#/components/schemas/DependencyType' }
        lagDays: { type: integer, format: int32, description: Working days; negative = a lead. }
        check: { $ref: '#/components/schemas/DependencyCheck' }
    RoadmapLinkBundle:
      type: object
      required: [count, violated, unscheduled]
      description: The links between the pair that have a milestone on either end (a milestone-to-project link counts here).
      properties:
        count: { type: integer, format: int32, minimum: 0 }
        violated: { type: integer, format: int32, minimum: 0, description: How many of them are violated. }
        unscheduled: { type: integer, format: int32, minimum: 0, description: How many could not be evaluated (an end has no dates). }
    FlagCounts:
      type: object
      required: [warnings, infos]
      description: The roll-up of the flags raised on a set of projects (a program's or a work stream's).
      properties:
        warnings: { type: integer, format: int32, minimum: 0, description: How many flags are WARNINGs. }
        infos: { type: integer, format: int32, minimum: 0, description: How many flags are INFOs. }
    ProgramsView:
      type: object
      required: [revision, teams, links, workStreams]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The PLAN revision, read before the rows. Informational - no flow on the programs page sends it back.
        teams:
          type: array
          description: The roadmap view's `teams` (active teams with milestones in the plan, by name).
          items:
            $ref: '#/components/schemas/RoadmapTeam'
        links:
          type: array
          description: The roadmap view's `links` (the dependencies between projects, rolled up per ordered pair).
          items:
            $ref: '#/components/schemas/RoadmapLink'
        workStreams:
          type: array
          description: Open work streams first, then closed ones, each by name (case-insensitive) then id.
          items:
            $ref: '#/components/schemas/ProgramsWorkStream'
        baseline:
          $ref: '#/components/schemas/BaselineRef'
    ProgramsWorkStream:
      type: object
      required: [id, name, ownerName, startDate, endDate, span, flags, programs]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        ownerName: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true, description: Set only when the work stream is closed. }
        span:
          nullable: true
          description: The earliest start to the latest end over its programs' spans; null when none of its projects is scheduled.
          allOf:
            - $ref: '#/components/schemas/DateSpan'
        flags:
          $ref: '#/components/schemas/FlagCounts'
        programs:
          type: array
          description: Every active program of the work stream (empty ones included), by name (case-insensitive) then id.
          items:
            $ref: '#/components/schemas/ProgramsProgram'
        baseline:
          $ref: '#/components/schemas/SpanBaseline'
    ProgramsProgram:
      type: object
      required: [id, name, ownerName, span, flags, projects]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        ownerName: { type: string }
        span:
          nullable: true
          description: The earliest start to the latest end over its projects' derived spans; null when none is scheduled.
          allOf:
            - $ref: '#/components/schemas/DateSpan'
        flags:
          $ref: '#/components/schemas/FlagCounts'
        projects:
          type: array
          description: The program's projects as the roadmap view's rows; ranked first in rank order, then the unranked by name and id.
          items:
            $ref: '#/components/schemas/RoadmapProject'
        baseline:
          $ref: '#/components/schemas/SpanBaseline'
    RankingUpdateRequest:
      type: object
      required: [expectedRevision, projectIds]
      properties:
        expectedRevision:
          type: integer
          format: int64
          description: The ranking's revision the client's list was read at (`RoadmapView.revision`); a `409` when the ranking was written at a later revision, or the value is above the current plan revision.
        projectIds:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: integer, format: int32, minimum: 0 }
          description: The COMPLETE ranking in order, best first. Projects not listed become unranked.
    RankingResponse:
      type: object
      required: [revision]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The plan revision after this write, which is also the ranking's new revision (the next `expectedRevision`).

    TeamOrderUpdateRequest:
      type: object
      required: [expectedRevision, milestoneIds]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
          description: The team's order revision the client's list was read at (`order.revision` of the team view); a stale one is a `409`.
        milestoneIds:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: integer, format: int32, minimum: 0 }
          description: >-
            The listed milestones of the team in execution order, first first - every one an ACTIVE milestone of THIS team. The team's
            milestones not listed follow them in the default order (the project rank). An empty list resets the order to the project rank.
    TeamOrderResponse:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, format: int64, minimum: 0, description: The plan revision after this write - the team's order revision from now on. }
    TeamScheduleBatchRequest:
      type: object
      required: [expectedRevision, items]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The plan revision of the view the items were derived from (a proposal's `revision`); an item is skipped as `STALE` only when
            ITS milestone's schedule was written after it, and a value above the current plan revision is a `409` for the whole batch.
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/TeamScheduleBatchItem' }
          description: One entry per milestone (an id twice is a `400`), applied in this order.
        scopeHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            The proposal's `scopeHash`. Present = the whole batch is refused (`409`, `stale-scope`) when the team's plan changed since that
            proposal; absent = no scope check.
    TeamScheduleBatchItem:
      type: object
      required: [milestoneId]
      description: The single schedule PUT's body for one milestone.
      properties:
        milestoneId: { type: integer, format: int32, minimum: 0 }
        startDate: { type: string, format: date, nullable: true, description: Inclusive. Both dates or neither (neither unschedules). }
        endDate: { type: string, format: date, nullable: true, description: Inclusive; not before `startDate`; the span needs a working day. }
    TeamScheduleBatchResponse:
      type: object
      required: [revision, accepted, skipped]
      properties:
        revision: { type: integer, format: int64, minimum: 0, description: The plan revision after this write (one bump for the whole batch). }
        accepted:
          type: array
          items: { type: integer, format: int32, minimum: 0 }
          description: The milestones whose dates were written, in request order.
        skipped:
          type: array
          items: { $ref: '#/components/schemas/SkippedSchedule' }
          description: The milestones that were not written, in request order, each with its reason.
    SkippedSchedule:
      type: object
      required: [milestoneId, reason]
      properties:
        milestoneId: { type: integer, format: int32, minimum: 0 }
        reason:
          type: string
          enum: [STALE, GONE, NOT_ON_TEAM, NO_WORKING_DAY]
          description: >-
            STALE: the milestone's schedule was written after `expectedRevision`. GONE: no active milestone has this id. NOT_ON_TEAM: the
            milestone is not on this team. NO_WORKING_DAY: the span holds no working day of the current holiday calendar.
    ScheduleProposalRequest:
      type: object
      required: [asOf]
      properties:
        asOf:
          type: string
          format: date
          description: >-
            The viewer's calendar day, from 1900-01-01 to 2990-01-05 (a later day is `400`: a placement may lie 520 weeks past the first
            usable day, and the batch accept refuses dates after 2999-12-31). Milestones of the team that start after it (or have no dates)
            may move; the others are fixed.
    ScheduleProposal:
      type: object
      required: [revision, asOf, teamId, moves, unchanged, unplaced, weeks, weeksTruncated, dependencies, scopeHash]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The plan revision the proposal was computed from; send it back as `expectedRevision` of the batch accept.
        scopeHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            A fingerprint of everything the proposal read about the team that the milestones' own schedule revisions do not cover; send it
            back as `scopeHash` of the batch accept. Stable while the team's plan is unchanged, whatever else happens in the plan.
        asOf: { type: string, format: date, description: 'The request''s `asOf`, echoed.' }
        teamId: { type: integer, format: int32, minimum: 0 }
        moves:
          type: array
          description: The movable milestones that change dates, in the team's effective order.
          items: { $ref: '#/components/schemas/ScheduleProposalMove' }
        unchanged:
          type: array
          description: The movable milestones that land on their current dates, in the team's effective order.
          items: { type: integer, format: int32, minimum: 0 }
        unplaced:
          type: array
          description: The movable milestones that got no dates, in the team's effective order.
          items: { $ref: '#/components/schemas/ScheduleProposalUnplaced' }
        weeks:
          type: array
          description: The team's weekly load AFTER accepting every move, in the team view's row shape (at most 520); empty while nothing would be scheduled.
          items: { $ref: '#/components/schemas/WeekLoad' }
        weeksTruncated: { type: boolean, description: True when `weeks` stops at 520 weeks. }
        dependencies:
          type: array
          description: >-
            The links touching the team (an end among its milestones, or a project end whose span changes) whose verdict is or was
            VIOLATED - before or after the moves; a link that is fine both times, or unscheduled and then fine, is not listed. Violated-after
            first. `before` is the link's status on the stored dates, `check` its check after; the dates are in the check.
          items: { $ref: '#/components/schemas/ScheduleProposalLink' }
    ScheduleProposalMove:
      type: object
      required: [milestoneId, name, projectId, projectName, estimateMd, from, to, workingDays, shiftDays]
      properties:
        milestoneId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        projectId: { type: integer, format: int32, minimum: 0 }
        projectName: { type: string }
        estimateMd: { type: number, format: double, minimum: 0 }
        from:
          allOf:
            - $ref: '#/components/schemas/DateSpan'
          nullable: true
          description: The stored dates; null = unscheduled.
        to:
          allOf:
            - $ref: '#/components/schemas/DateSpan'
          description: The proposed dates (both working days).
        workingDays: { type: integer, format: int32, minimum: 1, description: The working days in `to`. }
        shiftDays:
          type: integer
          format: int32
          nullable: true
          description: >-
            Working days from the current start to the proposed start - positive later, negative earlier; null when newly scheduled. A stored
            span that starts on a weekend or holiday counts from the next working day, so a move can have `shiftDays: 0` while its dates differ.
    ScheduleProposalUnplaced:
      type: object
      required: [milestoneId, name, projectId, projectName, reason]
      properties:
        milestoneId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        projectId: { type: integer, format: int32, minimum: 0 }
        projectName: { type: string }
        reason:
          type: string
          enum: [NO_CAPACITY, NO_ROOM]
          description: >-
            NO_CAPACITY: no working day with capacity at or after the milestone's earliest start (add a capacity period). NO_ROOM: usable
            days exist but no span fits within 520 weeks of the team's first usable day.
    ScheduleProposalLink:
      type: object
      required: [id, predecessor, successor, type, lagDays, before, check]
      description: A link the proposal touches whose verdict is or was VIOLATED - both ends named, the dates in the `check`.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        predecessor: { $ref: '#/components/schemas/ScheduleProposalEnd' }
        successor: { $ref: '#/components/schemas/ScheduleProposalEnd' }
        type: { $ref: '#/components/schemas/DependencyType' }
        lagDays: { type: integer, format: int32, minimum: -365, maximum: 365, description: Working days; negative = a lead. }
        before: { $ref: '#/components/schemas/DependencyStatus' }
        check: { $ref: '#/components/schemas/DependencyCheck' }
    ScheduleProposalEnd:
      type: object
      required: [kind, id, name, projectName]
      description: One end of a proposal link, named and nothing else (no dates, no team).
      properties:
        kind: { $ref: '#/components/schemas/EndpointKind' }
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        projectName:
          type: string
          nullable: true
          description: The milestone's project for a milestone end; null for a project end, whose `name` is the project.

    ProblemDetail:
      type: object
      description: RFC 7807 problem detail. Served as `application/problem+json`; instance is the request path without query parameters.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          default: about:blank
          description: >-
            A URI reference identifying the problem type; `about:blank` unless a problem names its own (`urn:astrolabe:problem:stale-revision` on a stale ranking, milestone-schedule or team-order PUT, or a batch schedule from a future revision, `urn:astrolabe:problem:stale-scope` on a batch accept whose team plan changed since its proposal, `urn:astrolabe:problem:dependency-cycle` on a dependency that would close a cycle).
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference of the specific occurrence (the request path).
        cycle:
          type: array
          items: { $ref: '#/components/schemas/ProblemCycleNode' }
          description: >-
            RFC 7807 extension member, present only on `urn:astrolabe:problem:dependency-cycle`: the cycle the refused link would
            close, as entities in order with the first node repeated last. Every other problem omits it.
    ProblemCycleNode:
      type: object
      required: [kind, id, name]
      properties:
        kind: { $ref: '#/components/schemas/EndpointKind' }
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }

    TelemetryCurrent:
      type: object
      required: [generatedAt, sampleIntervalSeconds, processes, storage, requests]
      properties:
        generatedAt: { type: integer, format: int64, description: Epoch millis }
        sampleIntervalSeconds: { type: integer, format: int32, description: The cadence of the raw samples; also the `requests` window. }
        processes:
          type: array
          items: { $ref: '#/components/schemas/TelemetryProcess' }
        storage:
          allOf: [{ $ref: '#/components/schemas/TelemetryStorage' }]
          nullable: true
          description: The newest storage measurement; null until the cluster section has taken one.
        requests: { $ref: '#/components/schemas/TelemetryRequests' }
    TelemetryProcess:
      type: object
      description: One sampling process (a JVM run) with its latest raw sample.
      required: [id, role, instance, startedAt, lastSeenAt, sampledAt, stale, version, commit, memory, jvm]
      properties:
        id: { type: integer, format: int32 }
        role: { type: string, description: 'The process role; `app`.' }
        instance: { type: string, description: The pod or host name. }
        startedAt: { type: integer, format: int64, description: Epoch millis of the JVM start }
        lastSeenAt: { type: integer, format: int64, description: Epoch millis of the latest sample tick }
        sampledAt: { type: integer, format: int64, nullable: true, description: The bucket of the sample the figures come from; null when none is retained. }
        stale: { type: boolean, description: No sample for more than three sample intervals. }
        version: { type: string, nullable: true, description: The image build version (null outside the image). }
        commit: { type: string, nullable: true, description: The image build commit (null outside the image). }
        memory: { $ref: '#/components/schemas/TelemetryMemory' }
        jvm: { $ref: '#/components/schemas/TelemetryJvm' }
    TelemetryMemory:
      type: object
      description: Bytes; a figure the process could not measure is null.
      required:
        - heapUsedBytes
        - heapCommittedBytes
        - heapMaxBytes
        - oldGenPeakBytes
        - nonHeapBytes
        - directBytes
        - rssBytes
        - cgroupCurrentBytes
        - cgroupAnonBytes
        - workingSetBytes
        - cgroupPeakBytes
        - containerLimitBytes
        - percentOfLimit
      properties:
        heapUsedBytes: { type: integer, format: int64, nullable: true }
        heapCommittedBytes: { type: integer, format: int64, nullable: true }
        heapMaxBytes: { type: integer, format: int64 }
        oldGenPeakBytes: { type: integer, format: int64, nullable: true, description: The old generation's peak over the latest sample interval. }
        nonHeapBytes: { type: integer, format: int64, nullable: true }
        directBytes: { type: integer, format: int64, nullable: true }
        rssBytes: { type: integer, format: int64, nullable: true }
        cgroupCurrentBytes: { type: integer, format: int64, nullable: true }
        cgroupAnonBytes: { type: integer, format: int64, nullable: true }
        workingSetBytes: { type: integer, format: int64, nullable: true, description: '`memory.current - inactive_file`: what the kubelet evicts on.' }
        cgroupPeakBytes: { type: integer, format: int64, nullable: true, description: The cgroup's LIFETIME peak. }
        containerLimitBytes: { type: integer, format: int64, nullable: true }
        percentOfLimit:
          type: number
          format: double
          nullable: true
          description: '`workingSetBytes` over `containerLimitBytes`, in percent (one decimal; may exceed 100); null without a limit or a working set.'
    TelemetryJvm:
      type: object
      required: [cpuRatio, threads, gcCount, gcTimeMs, poolAcquired, poolIdle, poolPending, poolAllocated]
      properties:
        cpuRatio: { type: number, format: double, nullable: true, description: Process CPU time over wall time as a fraction of the available processors (0..1). }
        threads: { type: integer, format: int32, nullable: true }
        gcCount: { type: integer, format: int64, nullable: true, description: 'Collections over the latest sample interval, all collectors summed.' }
        gcTimeMs: { type: integer, format: int64, nullable: true, description: 'Collection time over the latest sample interval, all collectors summed.' }
        poolAcquired: { type: integer, format: int32, nullable: true }
        poolIdle: { type: integer, format: int32, nullable: true }
        poolPending: { type: integer, format: int32, nullable: true }
        poolAllocated: { type: integer, format: int32, nullable: true }
    TelemetryStorage:
      type: object
      required: [measuredAt, databaseBytes, schemas]
      properties:
        measuredAt: { type: integer, format: int64, description: Epoch millis of the measurement's bucket }
        databaseBytes: { type: integer, format: int64, description: '`pg_database_size`.' }
        schemas:
          type: array
          items: { $ref: '#/components/schemas/TelemetrySchemaSize' }
    TelemetrySchemaSize:
      type: object
      required: [name, bytes]
      properties:
        name: { type: string, description: 'public or ops (telemetry''s own cost).' }
        bytes: { type: integer, format: int64, description: "Heap, TOAST and indexes of the schema's tables." }
    TelemetryRequests:
      type: object
      required: [windowSeconds, percentileWindowSeconds, measuredAt, total, routes]
      properties:
        windowSeconds: { type: integer, format: int32, description: The window of the counts - the latest sample interval. }
        percentileWindowSeconds:
          type: integer
          format: int32
          description: The window p50 and p95 cover - the sample interval capped at 300 s (the request timers' reservoir), so it can be shorter than `windowSeconds`.
        measuredAt: { type: integer, format: int64, nullable: true, description: The sample bucket the figures describe; null when no live process has a sample. }
        total: { $ref: '#/components/schemas/TelemetryRouteStats' }
        routes:
          type: array
          maxItems: 15
          items: { $ref: '#/components/schemas/TelemetryRouteStats' }
    TelemetryRouteStats:
      type: object
      description: One route (or `*`, every `/api/` route except the telemetry's own and the probes) over the latest sample interval.
      required: [route, count, p50Ms, p95Ms, serverErrors, rateLimited]
      properties:
        route: { type: string, description: 'The normalised route (`/api/v1/users/{id}`) or `*`.' }
        count: { type: integer, format: int64, minimum: 0 }
        p50Ms: { type: number, format: double, nullable: true, description: Null when nothing was served. }
        p95Ms: { type: number, format: double, nullable: true, description: Null when nothing was served. }
        serverErrors: { type: integer, format: int64, minimum: 0, description: 5xx responses. }
        rateLimited: { type: integer, format: int64, minimum: 0, description: 429 responses. }
    TelemetryHistory:
      type: object
      required: [group, range, bucketSeconds, from, to, historyFrom, truncated, series]
      properties:
        group: { type: string, enum: [memory, storage, requests, jvm] }
        range: { type: string, enum: [24h, 7d, 90d] }
        bucketSeconds: { type: integer, format: int32, description: The width of a point's bucket. }
        from: { type: integer, format: int64, description: Epoch millis of the range start (the first bucket may begin up to one bucket earlier). }
        to: { type: integer, format: int64, description: Epoch millis of the read }
        historyFrom: { type: integer, format: int64, description: The oldest instant the range can actually hold data for. }
        truncated: { type: boolean, description: 'More series matched than were returned (40).' }
        series:
          type: array
          maxItems: 40
          items: { $ref: '#/components/schemas/TelemetrySeries' }
    TelemetrySeries:
      type: object
      description: One chart line; `points` are the buckets that hold data, ascending, at most 400.
      required: [key, metric, label, role, unit, kind, points]
      properties:
        key: { type: string, description: 'Unique within the response (`<role>:<metric>:<label>`, empty parts left out).' }
        metric: { type: string, description: 'The metric name (`mem.heap_used`, `http.p95`, ...).' }
        label: { type: string, description: 'A route, a GC collector or a schema; empty when the metric has none.' }
        role: { type: string, nullable: true, description: 'The process role a `memory` / `jvm` series merges (`app`); null for cluster-wide and `requests` series.' }
        unit: { type: string, enum: [BYTES, MILLISECONDS, COUNT, RATIO] }
        kind:
          type: string
          enum: [GAUGE, DELTA, PERCENTILE]
          description: A DELTA point's `avg` is the bucket's total; for the others it is the n-weighted mean.
        points:
          type: array
          maxItems: 400
          items: { $ref: '#/components/schemas/TelemetryPoint' }
    TelemetryPoint:
      type: object
      required: [t, avg, max]
      properties:
        t: { type: integer, format: int64, description: Epoch millis of the bucket start }
        avg: { type: number, format: double }
        max: { type: number, format: double }
    JiraConnectionRequest:
      type: object
      required: [name, siteUrl, email, projectKeys]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        siteUrl:
          type: string
          maxLength: 253
          pattern: '^https://[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.atlassian\.net$'
          description: The site's origin, exactly `https://<tenant>.atlassian.net` (no path, query, port or trailing slash; Atlassian's own surfaces such as `api` are refused).
        email:
          type: string
          maxLength: 254
          description: The Atlassian account the token belongs to; folded to lower case.
        apiToken:
          type: string
          format: password
          writeOnly: true
          nullable: true
          maxLength: 1000
          description: >-
            Required on create (non-blank). On update an omitted, empty or blank token keeps the stored one and a present one rotates it. Encrypted at rest;
            never returned, logged or audited.
        authScheme:
          type: string
          enum: [BASIC, BEARER]
          default: BASIC
          description: "`BASIC` = `base64(email:token)` (an Atlassian API token), `BEARER` = the token alone."
        projectKeys:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,9}$' }
          description: The Jira project keys in scope (1 to 50, distinct).
        enabled: { type: boolean, default: true }
    JiraConnection:
      type: object
      required: [id, name, siteUrl, email, hasApiToken, authScheme, projectKeys, enabled, cloudId, discoveredAt, lastTestedAt, lastTestOk, mappingSet, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        siteUrl: { type: string }
        email: { type: string }
        hasApiToken:
          type: boolean
          description: Whether a token is stored. The token itself is write-only and appears in no response.
        authScheme: { type: string, enum: [BASIC, BEARER] }
        projectKeys:
          type: array
          maxItems: 50
          items: { type: string }
        enabled: { type: boolean }
        cloudId: { type: string, nullable: true, description: "The site's cloud id, persisted by a passing connection test; null until then." }
        discoveredAt: { type: integer, format: int64, nullable: true, description: Epoch millis of the last field discovery; null until one ran. }
        lastTestedAt: { type: integer, format: int64, nullable: true, description: Epoch millis of the last connection test. }
        lastTestOk: { type: boolean, nullable: true, description: Whether the last connection test passed; null until one ran. }
        mappingSet: { type: boolean, description: Whether a field mapping has been saved. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    JiraConnectionPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JiraConnection'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    JiraTestRow:
      type: object
      required: [name, path, required, ok]
      properties:
        name: { type: string, description: "The probe: `tenant_info`, `myself`, `issuetype`, `search`, `field`, `projects`, `project:<KEY>` (one per configured key), `issue` or `stored_token`." }
        path: { type: string, description: The endpoint probed (no query string). }
        required: { type: boolean, description: Whether a failure fails the test. }
        ok: { type: boolean }
        status: { type: integer, format: int32, nullable: true, description: The upstream HTTP status when one answered. }
        code:
          type: string
          nullable: true
          description: >-
            The failure code: `AUTHENTICATION_FAILED`, `FORBIDDEN_SCOPE`, `NOT_FOUND`, `RATE_LIMITED`, `UPSTREAM_UNAVAILABLE`, `TIMEOUT`,
            `INVALID_RESPONSE`, `LIMIT_EXCEEDED`, `BLOCKED_HOST`, `REDIRECT`, `PROJECT_NOT_VISIBLE` (a configured key the token cannot see) or
            `TOKEN_UNREADABLE` (the stored token cannot be decrypted). A scoped token missing a scope answers 401, not 403, so one failing probe
            while `myself` passes means a missing scope, not bad credentials.
        scopeHint: { type: string, nullable: true, description: The Atlassian scope(s) the probe needs; a comma+space separated list. }
    JiraTestResult:
      type: object
      required: [rows, recorded]
      properties:
        rows:
          type: array
          maxItems: 60
          items:
            $ref: '#/components/schemas/JiraTestRow'
        cloudId: { type: string, nullable: true, description: "The site's cloud id once `tenant_info` answered (validated as a UUID)." }
        discoveredAt: { type: integer, format: int64, nullable: true, description: Epoch millis of the discovery snapshot now stored on the connection (stored-token variant); null when none or ad hoc. }
        recorded: { type: boolean, description: "Whether the result was stored on the connection (false for an ad-hoc test, or when an edit raced the test)." }
    JiraDiscoveredField:
      type: object
      required: [id, name]
      properties:
        id: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        type: { type: string, nullable: true, maxLength: 64, description: "`schema.type`, e.g. `date`, `datetime`, `number`." }
        custom: { type: string, nullable: true, maxLength: 64, description: "`schema.custom`, null for a system field." }
    JiraDiscoveredIssueType:
      type: object
      required: [id, name, subtask]
      properties:
        id: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        hierarchyLevel: { type: integer, format: int32, nullable: true, description: "Jira's hierarchy level (Epic 1, sub-task -1); null when the site did not say." }
        subtask: { type: boolean }
    JiraDiscoveredLevel:
      type: object
      required: [level, typeNames]
      properties:
        level: { type: integer, format: int32 }
        typeNames:
          type: array
          items: { type: string }
    JiraDiscoveryMarkers:
      type: object
      description: What the name and `schema.custom` rules resolved; an absent member is "not found".
      properties:
        targetStart: { $ref: '#/components/schemas/JiraDiscoveredField' }
        targetEnd: { $ref: '#/components/schemas/JiraDiscoveredField' }
        startDate: { $ref: '#/components/schemas/JiraDiscoveredField' }
        dueDate: { $ref: '#/components/schemas/JiraDiscoveredField' }
        storyPoints: { $ref: '#/components/schemas/JiraDiscoveredField' }
        team: { $ref: '#/components/schemas/JiraDiscoveredField' }
        legacyEpicLink: { $ref: '#/components/schemas/JiraDiscoveredField' }
        legacyParentLink: { $ref: '#/components/schemas/JiraDiscoveredField' }
    JiraDiscovery:
      type: object
      required: [discoveredAt, fieldCount, issueTypeCount, fieldsTruncated, fields, issueTypes, levels, markers]
      properties:
        discoveredAt: { type: integer, format: int64, description: Epoch millis }
        fieldCount: { type: integer, format: int32, description: "How many fields the site reported (the snapshot keeps at most 2,000 of them)." }
        issueTypeCount: { type: integer, format: int32 }
        fieldsTruncated: { type: boolean, description: Whether the site had more date/number/recognised fields than the snapshot keeps (the markers are kept first). }
        fields:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/JiraDiscoveredField' }
        issueTypes:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/JiraDiscoveredIssueType' }
        levels:
          type: array
          items: { $ref: '#/components/schemas/JiraDiscoveredLevel' }
        markers: { $ref: '#/components/schemas/JiraDiscoveryMarkers' }
    JiraLevelFields:
      type: object
      description: The Jira field ids one level reads; an omitted or null member is "not mapped".
      properties:
        start: { type: string, nullable: true, maxLength: 64, description: "A `date` field id (`customfield_10015`, `duedate`)." }
        end: { type: string, nullable: true, maxLength: 64, description: "A `date` field id." }
        estimate: { type: string, nullable: true, maxLength: 64, description: "A `number` field id." }
    JiraLevelMapping:
      type: object
      required: [hierarchyLevel]
      properties:
        hierarchyLevel: { type: integer, format: int32, minimum: 0, description: "Jira's hierarchy level (Epic 1, Initiative 2; sub-tasks, -1, are never a plan level); the discovery lists the levels the site has." }
        fields: { $ref: '#/components/schemas/JiraLevelFields' }
    JiraMappingLevels:
      type: object
      required: [milestone]
      properties:
        program:
          nullable: true
          description: Optional; must sit above the project (or milestone) level.
          allOf:
            - $ref: '#/components/schemas/JiraLevelMapping'
        project:
          nullable: true
          description: Optional; must sit above the milestone level.
          allOf:
            - $ref: '#/components/schemas/JiraLevelMapping'
        milestone: { $ref: '#/components/schemas/JiraLevelMapping' }
    JiraEstimateMapping:
      type: object
      properties:
        unit: { type: string, enum: [POINTS, HOURS, DAYS], description: "What the estimate field counts (default `POINTS`). `DAYS` compares as man-days without a factor." }
        manDaysPerUnit:
          type: number
          format: double
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          maximum: 1000
          description: Man-days per unit; greater than 0 and at most 1000 with at most two decimals. Without a factor (and not `DAYS`) the Jira figure is shown, never compared.
    JiraMapping:
      type: object
      required: [levels]
      properties:
        levels: { $ref: '#/components/schemas/JiraMappingLevels' }
        estimate: { $ref: '#/components/schemas/JiraEstimateMapping' }
        teamFieldId: { type: string, nullable: true, maxLength: 64, description: The Team field's id (a field of the discovery). }
    JiraMappingResponse:
      type: object
      required: [mapping, defaults, effective, discoveredAt, problems]
      properties:
        mapping:
          nullable: true
          description: The document last saved; null when none was.
          allOf:
            - $ref: '#/components/schemas/JiraMapping'
        defaults:
          nullable: true
          description: What the stored discovery resolves; null before any discovery.
          allOf:
            - $ref: '#/components/schemas/JiraMapping'
        effective:
          nullable: true
          description: The mapping a run would use - `mapping`, else `defaults`.
          allOf:
            - $ref: '#/components/schemas/JiraMapping'
        discoveredAt: { type: integer, format: int64, nullable: true, description: Epoch millis of the discovery the defaults come from. }
        problems:
          type: array
          items: { type: string }
          description: >-
            Why the stored `mapping` no longer fits the discovery as it is now (a later Test connection can replace the snapshot: a level the
            site lost, a field that changed type) or cannot be read at all. Empty when it fits or none is saved. Nothing is rewritten: save a
            corrected mapping.
    JiraPeekIssue:
      type: object
      required: [id, key, statusCategory]
      properties:
        id: { type: string }
        key: { type: string }
        summary: { type: string, nullable: true, maxLength: 255 }
        typeName: { type: string, nullable: true }
        hierarchyLevel: { type: integer, format: int32, nullable: true, description: "From the issue's own type when the site sent it, else the discovery's." }
        statusCategory: { type: string, enum: [TODO, IN_PROGRESS, DONE, UNKNOWN] }
        parentKey: { type: string, nullable: true }
    JiraPeekResolved:
      type: object
      required: [unit]
      properties:
        level: { type: string, enum: [PROGRAM, PROJECT, MILESTONE], nullable: true, description: "The Astrolabe level the issue's hierarchy level maps to; null when it maps to none (then start, end and estimate are null too)." }
        start: { type: string, format: date, nullable: true }
        end: { type: string, format: date, nullable: true }
        estimate: { type: number, format: double, nullable: true, description: "The mapped estimate field as the site sent it, in `unit`." }
        unit: { type: string, enum: [POINTS, HOURS, DAYS] }
        teamName: { type: string, nullable: true, maxLength: 100 }
    JiraPeekResponse:
      type: object
      required: [issue, resolved, raw]
      properties:
        issue: { $ref: '#/components/schemas/JiraPeekIssue' }
        resolved: { $ref: '#/components/schemas/JiraPeekResolved' }
        raw:
          type: object
          additionalProperties: true
          description: The mapped fields' values exactly as the site sent them, keyed by field id (a field the issue lacks is absent); nothing else of the issue.
