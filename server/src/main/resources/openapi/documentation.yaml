  /api/v1/views/plan:
    get:
      tags: [plan]
      operationId: getPlanView
      summary: The whole plan tree with the caller's actions
      description: |
        Any authenticated user. One document with every active work stream, its programs and their projects (a deliberate exception
        to the paged envelope, bounded by the plan's scale of about 5 streams, 20 programs and 100 projects), open work streams first
        and then closed ones, each level by name. Every node carries `can`, the actions THIS caller may take, computed with the same
        rules the writes enforce. `revision` is the plan revision read before the rows.
      responses:
        '200':
          description: The plan tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/roadmap:
    get:
      tags: [roadmap]
      operationId: getRoadmapView
      summary: The global project ranking with the caller's right to change it
      description: |
        Any authenticated user. One document (a deliberate exception to the paged envelope, bounded by the plan's scale of about 100
        projects): `ranked` in position order (dense 1..n) and `unranked`, the active projects without a position, by name. Each project
        carries its program, work stream and owner names. `can.editRank` is whether THIS caller may `PUT /roadmap/ranking` (ADMIN or a
        ROADMAP_EDITOR holder). `revision` is the plan revision read before the rows - send it back as `expectedRevision`.
      responses:
        '200':
          description: The ranking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/roadmap/ranking:
    put:
      tags: [roadmap]
      operationId: replaceRoadmapRanking
      summary: Replace the global project ranking
      description: |
        ADMIN or a holder of the `ROADMAP_EDITOR` permission; every other caller gets `403` BEFORE the body is read (the route addresses
        no node). The permission is re-checked under the plan lock, so a grant revoked while the request was in flight refuses the write.
        Wholesale: the listed projects get positions 1..n in the given order and every other project becomes unranked (omit a project to
        unrank it; append an unranked one to rank it at the end). `expectedRevision` must equal the current plan revision, else `409` with
        `type` `urn:astrolabe:problem:stale-revision` and nothing is written - reload the view and retry. `400` when an id is listed
        twice, is unknown or belongs to a deleted project, or more than 1000 ids are sent. Every accepted PUT, even one that keeps the
        order, bumps the plan revision by one and is audited as `roadmap.ranked`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RankingUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The ranking was replaced; the body carries the new plan revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`expectedRevision` is stale (`type` is `urn:astrolabe:problem:stale-revision`)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/telemetry/current:
    get:
      tags: [telemetry]
      operationId: getTelemetryCurrent
      summary: Astrolabe's own vital signs - processes, storage, request latency
      description: |
        ADMIN only (operational data: process sizes, container limits, storage sizes), read-only, no audit event;
        both telemetry reads share one per-user rate bucket (30/min, `429`). `.claude/docs/observability.md` "Telemetry".
        `processes` lists each sampling process (role `app`) with its latest raw sample: every live process, and the
        newest stale one when none is alive (a process that stopped stays visible for a day). `stale` = no sample for more than three
        sample intervals. A figure the process could not measure is null (no container limit outside a cgroup, no `memory.peak` on an
        old kernel) - never zero; `percentOfLimit` is the cgroup working set over the container limit, in percent. `storage` is the
        newest database / per-schema size (null before the first measurement). `requests` is the latest sample interval of the live
        processes: the `*` total and the 15 busiest routes.
      responses:
        '200':
          description: The current figures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryCurrent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/telemetry/history:
    get:
      tags: [telemetry]
      operationId: getTelemetryHistory
      summary: The trend of one telemetry section over 24 hours, 7 days or 90 days
      description: |
        ADMIN only (guard before the query is read: `403` outranks `400`), read-only, no audit event.
        `group` picks the section and `range` the span; both are required. Buckets: `24h` = the raw sample interval (widened to a whole
        multiple of it when that would exceed 400 points), `7d` = one hour (the hourly rollups plus the raw rows of the hours not yet
        rolled up), `90d` = six hours; `bucketSeconds` says which. At most 400 points per series and 40 series (`truncated` when more
        matched); a series has points only for the buckets that hold data.
        Per-process groups merge the processes of one `role` into one series, so a trend survives a restart (`memory`, `jvm`), or all
        processes into one series per route (`requests`, `role` null); `storage` is cluster-wide (`role` null). `requests` keeps the `*`
        total (count, p50, p95, 5xx, 429) and the ten busiest routes of the range (count, p50, p95). A DELTA series' `avg` is the
        bucket's TOTAL and its `max` the largest single sample interval; a GAUGE or PERCENTILE series' `avg` is the n-weighted mean and
        `max` the largest sample. `historyFrom` is the oldest instant the range can actually hold: the first sampler boot (a fresh
        install, or retention shorter than the range).
      parameters:
        - name: group
          in: query
          required: true
          schema:
            type: string
            enum: [memory, storage, requests, jvm]
          description: The panel section.
        - name: range
          in: query
          required: true
          schema:
            type: string
            enum: [24h, 7d, 90d]
          description: How far back the history reaches.
      responses:
        '200':
          description: The series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHistory'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      # int32: ids are 32-bit server-side; a non-numeric or out-of-range id is a 400. Ids are database sequences that
      # start at 1, so 0 never addresses anything (it answers 404, like any unknown id).
      schema: { type: integer, format: int32, minimum: 1 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: 1-based page index. Defaults to 1.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Rows per page. Defaults to 20, maximum 100.
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string }
      description: |
        Sort spec. Format: `field` (ascending) or `-field` (descending). Multiple fields are
        comma-separated, leftmost wins: `sort=-updatedAt,name`. The endpoint declares its
        sortable-field whitelist; unknown fields are rejected with `400`. `id` ascending is
        always appended as a deterministic tiebreaker.
  responses:
    UnsupportedMediaType:
      description: Request body must use application/json. A missing body or Content-Type remains a 400.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Missing, invalid or no longer valid token (revoked, or the account was deleted, demoted or re-credentialed since it was issued)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Caller is not permitted to perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Conflict with an existing resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TooManyRequests:
      description: >-
        Throttled — either the per-IP rate-limit bucket is exhausted (generic detail), on a telemetry read
        (`/api/v1/telemetry/**`) the per-USER telemetry bucket is exhausted (30/min), or, on /login, the
        per-account lockout is active (account-specific detail). All carry a ProblemDetail body.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    PayloadTooLarge:
      description: >-
        Request body exceeds the global 10 MiB ceiling — a memory-DoS backstop shared by
        every endpoint, so declared on every operation that takes a body (field-level maxLength
        rules reject oversized values far earlier on ordinary payloads). Cross-cutting for the
        coverage gate: pinned once by `PayloadValidationTest`, never once per operation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InternalServerError:
      description: >-
        Unexpected server error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Always `ok` on a 200 — a failed probe is a problem body, never a status word.
          example: ok
    PasswordResetConfirmRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Single-use 256-bit reset credential from the email; never logged or returned.
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 71
          description: The new password; at most 71 UTF-8 bytes (bcrypt ceiling).

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [token, expiresAt, refreshToken, refreshExpiresAt, userId, roles, disabledFeatures, language]
      properties:
        token:
          type: string
          description: "Short-lived access token; send as the `Authorization: Bearer` value."
        expiresAt:
          type: integer
          format: int64
          description: Access-token expiry as Unix epoch milliseconds.
        refreshToken:
          type: string
          description: Longer-lived token; POST to /api/v1/refresh to obtain a fresh pair.
        refreshExpiresAt:
          type: integer
          format: int64
          description: Refresh-token expiry as Unix epoch milliseconds.
        userId: { type: integer, format: int32, minimum: 0 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles of the authenticated user — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserRole:
      type: string
      enum: [ADMIN]
      description: >-
        An additional role. Every user is implicitly a regular user; the array only ever
        carries privileges added on top of that baseline.

    Feature:
      type: string
      enum: [MFA]
      description: >-
        A per-user gateable feature. Stored as the DISABLED set (no row = enabled).
        MFA is the one inverted-default, login-scoped flag: users start with it disabled
        (email MFA is opt-in), and it gates only the login flow.

    Permission:
      type: string
      enum: [ROADMAP_EDITOR]
      description: >-
        A per-user permission, stored as the GRANTED set (a row = held) and read from the database on every
        request. ROADMAP_EDITOR may rank the projects and set any project's target window.

    Language:
      type: string
      enum: [en, pl]
      description: >-
        A supported UI/email language. The ONE synced per-user language (V1) — set at
        create, changed only via PUT /users/{id}/language; drives the SPA at sign-in and
        every email sent to the user.

    UserLanguageUpdateRequest:
      type: object
      required: [language]
      properties:
        language:
          $ref: '#/components/schemas/Language'

    UserFeaturesUpdateRequest:
      type: object
      required: [disabledFeatures]
      properties:
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: The complete new DISABLED set — an empty array enables everything.

    UserPermissionsUpdateRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
          description: The complete new GRANTED set - an empty array revokes everything.

    MfaChallengeResponse:
      type: object
      required: [mfaRequired, challengeId, expiresAt]
      properties:
        mfaRequired:
          type: boolean
          description: Always true — the discriminator against LoginResponse in the login 200.
        challengeId:
          type: string
          description: Opaque single-use challenge id; send it back with the emailed code.
        expiresAt:
          type: integer
          format: int64
          description: Challenge (and code) expiry as Unix epoch milliseconds.

    MfaVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code:
          type: string
          description: The 6-digit code from the sign-in email.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Optional refresh token to revoke together with the access token.

    UserCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        password:
          type: string
          minLength: 10
          maxLength: 71
          description: >-
            Client-generated; at most 71 UTF-8 bytes (the bcrypt ceiling). Stored only as a
            hash and never returned.
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles; omitted/empty = a regular user.
        language:
          allOf: [{ $ref: '#/components/schemas/Language' }]
          nullable: true
          description: Create-only (the whole-user PUT never touches it); omitted = en.

    UserUpdateRequest:
      type: object
      required: [name, email, roles]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }

    UserResponse:
      type: object
      required: [id, name, email, roles, disabledFeatures, language, permissions]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles only — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
          description: Per-user permissions - the GRANTED set (read from the database per request, not a token claim); empty = none.

    UserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    PasswordUpdateRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 10
          maxLength: 71
          description: The new password (at least 10 characters, at most 71 UTF-8 bytes).
        currentPassword:
          type: string
          description: >-
            Required when the caller changes their OWN password (even an admin); omitted
            for an admin resetting somebody else's.

    PersonCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email:
          type: string
          maxLength: 254
          nullable: true
          description: Optional mailbox; unique among active people when set (case-insensitive). Blank = none.
        userId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The person's login, a user; must be active (`400` otherwise) and not linked to another active person (`409`).
    PersonUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email:
          type: string
          maxLength: 254
          nullable: true
          description: Optional mailbox; unique among active people when set (case-insensitive). Omitted on PUT (a full replace) = none.
        userId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The person's login, a user; must be active (`400` otherwise) and not linked to another active person (`409`). Omitted on PUT (a full replace) = unlinked.
    PersonResponse:
      type: object
      required: [id, name, email, userId, userEmail, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string, nullable: true }
        userId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The person's login; null when unset or when the linked user was soft-deleted.
        userEmail: { type: string, nullable: true, description: The login's email; null with `userId`. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    PersonListItem:
      type: object
      required: [id, name, email, userId, userEmail, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string, nullable: true }
        userId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The person's login; null when unset or when the linked user was soft-deleted.
        userEmail: { type: string, nullable: true, description: The login's email; null with `userId`. }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    PersonPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PersonListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0

    TeamCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        managerPersonId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The team's manager, a person of the people directory; must be active (`400` otherwise).
    TeamUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        managerPersonId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The team's manager, a person of the people directory; must be active (`400` otherwise). Omitted on PUT (a full replace) = no manager.
    TeamResponse:
      type: object
      required: [id, name, managerPersonId, managerName, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        managerPersonId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The team's manager (a person); null when unset or when the assigned person was soft-deleted.
        managerName: { type: string, nullable: true, description: The manager's name; null with `managerPersonId`. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    TeamListItem:
      type: object
      required: [id, name, managerPersonId, managerName, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        managerPersonId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The team's manager (a person); null when unset or when the assigned person was soft-deleted.
        managerName: { type: string, nullable: true, description: The manager's name; null with `managerPersonId`. }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    TeamPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0

    WorkStreamCreateRequest:
      type: object
      required: [name, ownerPersonId, startDate]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        ownerPersonId:
          type: integer
          format: int32
          minimum: 0
          description: The owner, an active person of the people directory (`400` otherwise).
        startDate: { type: string, format: date, description: 'YYYY-MM-DD, years 1900-2999.' }
        endDate:
          type: string
          format: date
          nullable: true
          description: Set only when the work stream is closed; not before `startDate`.
    WorkStreamUpdateRequest:
      type: object
      required: [name, ownerPersonId, startDate]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true, description: Omitted on PUT (a full replace) = none. }
        ownerPersonId:
          type: integer
          format: int32
          minimum: 0
          description: The owner, an active person of the people directory (`400` otherwise).
        startDate: { type: string, format: date, description: 'YYYY-MM-DD, years 1900-2999.' }
        endDate:
          type: string
          format: date
          nullable: true
          description: Omitted on PUT (a full replace) = open (reopens a closed stream); set = closed. Not before `startDate`.
    WorkStreamResponse:
      type: object
      required: [id, name, description, ownerPersonId, ownerName, startDate, endDate, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true, description: Set only when the work stream is closed. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    ProgramCreateRequest:
      type: object
      required: [name, ownerPersonId]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        ownerPersonId:
          type: integer
          format: int32
          minimum: 0
          description: The owner, an active person of the people directory (`400` otherwise).
    ProgramUpdateRequest:
      type: object
      required: [name, ownerPersonId]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true, description: Omitted on PUT (a full replace) = none. }
        ownerPersonId:
          type: integer
          format: int32
          minimum: 0
          description: The owner, an active person of the people directory (`400` otherwise).
    ProgramResponse:
      type: object
      required: [id, workStreamId, name, description, ownerPersonId, ownerName, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        workStreamId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    ProjectCreateRequest:
      type: object
      required: [name, ownerPersonId]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        ownerPersonId:
          type: integer
          format: int32
          minimum: 0
          description: The owner, an active person of the people directory (`400` otherwise).
        targetStart: { type: string, format: date, nullable: true, description: Both target dates or neither. }
        targetEnd: { type: string, format: date, nullable: true, description: Both target dates or neither; not before `targetStart`. }
    ProjectUpdateRequest:
      type: object
      required: [name, ownerPersonId]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true, description: Omitted on PUT (a full replace) = none. }
        ownerPersonId:
          type: integer
          format: int32
          minimum: 0
          description: The owner, an active person of the people directory (`400` otherwise).
    TargetWindowRequest:
      type: object
      properties:
        targetStart: { type: string, format: date, nullable: true, description: Both dates or neither; omitted = none. }
        targetEnd: { type: string, format: date, nullable: true, description: Both dates or neither; not before `targetStart`. }
    ProjectResponse:
      type: object
      required: [id, programId, workStreamId, name, description, ownerPersonId, ownerName, targetStart, targetEnd, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        programId: { type: integer, format: int32, minimum: 0 }
        workStreamId: { type: integer, format: int32, minimum: 0, description: The work stream of the project's program. }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        targetStart: { type: string, format: date, nullable: true }
        targetEnd: { type: string, format: date, nullable: true }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    PlanView:
      type: object
      required: [revision, can, workStreams]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The plan revision, read before the rows; bumped by every plan write.
        can:
          type: object
          required: [createWorkStream]
          properties:
            createWorkStream: { type: boolean, description: The caller may create a work stream (ADMIN). }
        workStreams:
          type: array
          items:
            $ref: '#/components/schemas/PlanWorkStream'
    PlanWorkStream:
      type: object
      required: [id, name, description, ownerPersonId, ownerName, startDate, endDate, createdAt, updatedAt, can, programs]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true, description: Set only when the work stream is closed. }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        can:
          type: object
          required: [edit, delete, createProgram]
          properties:
            edit: { type: boolean }
            delete: { type: boolean, description: 'A rights flag: the caller may delete the node. The server can still answer 409 while it has active children.' }
            createProgram: { type: boolean }
        programs:
          type: array
          items:
            $ref: '#/components/schemas/PlanProgram'
    PlanProgram:
      type: object
      required: [id, workStreamId, name, description, ownerPersonId, ownerName, createdAt, updatedAt, can, projects]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        workStreamId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        can:
          type: object
          required: [edit, delete, createProject]
          properties:
            edit: { type: boolean }
            delete: { type: boolean, description: 'A rights flag: the caller may delete the node. The server can still answer 409 while it has active children.' }
            createProject: { type: boolean }
        projects:
          type: array
          items:
            $ref: '#/components/schemas/PlanProject'
    PlanProject:
      type: object
      required: [id, programId, workStreamId, name, description, ownerPersonId, ownerName, targetStart, targetEnd, createdAt, updatedAt, can]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        programId: { type: integer, format: int32, minimum: 0 }
        workStreamId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        targetStart: { type: string, format: date, nullable: true }
        targetEnd: { type: string, format: date, nullable: true }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        can:
          type: object
          required: [edit, delete, editTargetWindow]
          properties:
            edit: { type: boolean }
            delete: { type: boolean, description: 'A rights flag: the caller may delete the node. The server can still answer 409 while it has active children.' }
            editTargetWindow: { type: boolean, description: 'The caller may set the target window (ADMIN, an owner above the project, or a roadmap editor).' }

    RoadmapView:
      type: object
      required: [revision, can, ranked, unranked]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The plan revision, read before the rows; send it back as `expectedRevision`.
        can:
          type: object
          required: [editRank]
          properties:
            editRank: { type: boolean, description: The caller may replace the ranking (ADMIN or a roadmap editor). }
        ranked:
          type: array
          description: The ranked projects in position order.
          items:
            $ref: '#/components/schemas/RoadmapRankedProject'
        unranked:
          type: array
          description: The active projects without a position, by name.
          items:
            $ref: '#/components/schemas/RoadmapProject'
    RoadmapRankedProject:
      type: object
      required: [position, project]
      properties:
        position: { type: integer, format: int32, minimum: 1, description: 'Dense: the ranked projects hold 1..n.' }
        project:
          $ref: '#/components/schemas/RoadmapProject'
    RoadmapProject:
      type: object
      required: [id, name, programId, programName, workStreamId, workStreamName, ownerName, targetStart, targetEnd]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        programId: { type: integer, format: int32, minimum: 0 }
        programName: { type: string }
        workStreamId: { type: integer, format: int32, minimum: 0 }
        workStreamName: { type: string }
        ownerName: { type: string }
        targetStart: { type: string, format: date, nullable: true }
        targetEnd: { type: string, format: date, nullable: true }
    RankingUpdateRequest:
      type: object
      required: [expectedRevision, projectIds]
      properties:
        expectedRevision:
          type: integer
          format: int64
          description: The plan revision the client's list was read at (`RoadmapView.revision`); a different current revision is a `409`.
        projectIds:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: integer, format: int32, minimum: 0 }
          description: The COMPLETE ranking in order, best first. Projects not listed become unranked.
    RankingResponse:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, format: int64, minimum: 0, description: The plan revision after this write. }

    ProblemDetail:
      type: object
      description: RFC 7807 problem detail. Served as `application/problem+json`; instance is the request path without query parameters.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          default: about:blank
          description: >-
            A URI reference identifying the problem type; `about:blank` unless a problem names its own (`urn:astrolabe:problem:stale-revision` on a stale ranking PUT).
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference of the specific occurrence (the request path).

    TelemetryCurrent:
      type: object
      required: [generatedAt, sampleIntervalSeconds, processes, storage, requests]
      properties:
        generatedAt: { type: integer, format: int64, description: Epoch millis }
        sampleIntervalSeconds: { type: integer, format: int32, description: The cadence of the raw samples; also the `requests` window. }
        processes:
          type: array
          items: { $ref: '#/components/schemas/TelemetryProcess' }
        storage:
          allOf: [{ $ref: '#/components/schemas/TelemetryStorage' }]
          nullable: true
          description: The newest storage measurement; null until the cluster section has taken one.
        requests: { $ref: '#/components/schemas/TelemetryRequests' }
    TelemetryProcess:
      type: object
      description: One sampling process (a JVM run) with its latest raw sample.
      required: [id, role, instance, startedAt, lastSeenAt, sampledAt, stale, version, commit, memory, jvm]
      properties:
        id: { type: integer, format: int32 }
        role: { type: string, description: 'The process role; `app`.' }
        instance: { type: string, description: The pod or host name. }
        startedAt: { type: integer, format: int64, description: Epoch millis of the JVM start }
        lastSeenAt: { type: integer, format: int64, description: Epoch millis of the latest sample tick }
        sampledAt: { type: integer, format: int64, nullable: true, description: The bucket of the sample the figures come from; null when none is retained. }
        stale: { type: boolean, description: No sample for more than three sample intervals. }
        version: { type: string, nullable: true, description: The image build version (null outside the image). }
        commit: { type: string, nullable: true, description: The image build commit (null outside the image). }
        memory: { $ref: '#/components/schemas/TelemetryMemory' }
        jvm: { $ref: '#/components/schemas/TelemetryJvm' }
    TelemetryMemory:
      type: object
      description: Bytes; a figure the process could not measure is null.
      required:
        - heapUsedBytes
        - heapCommittedBytes
        - heapMaxBytes
        - oldGenPeakBytes
        - nonHeapBytes
        - directBytes
        - rssBytes
        - cgroupCurrentBytes
        - cgroupAnonBytes
        - workingSetBytes
        - cgroupPeakBytes
        - containerLimitBytes
        - percentOfLimit
      properties:
        heapUsedBytes: { type: integer, format: int64, nullable: true }
        heapCommittedBytes: { type: integer, format: int64, nullable: true }
        heapMaxBytes: { type: integer, format: int64 }
        oldGenPeakBytes: { type: integer, format: int64, nullable: true, description: The old generation's peak over the latest sample interval. }
        nonHeapBytes: { type: integer, format: int64, nullable: true }
        directBytes: { type: integer, format: int64, nullable: true }
        rssBytes: { type: integer, format: int64, nullable: true }
        cgroupCurrentBytes: { type: integer, format: int64, nullable: true }
        cgroupAnonBytes: { type: integer, format: int64, nullable: true }
        workingSetBytes: { type: integer, format: int64, nullable: true, description: '`memory.current - inactive_file`: what the kubelet evicts on.' }
        cgroupPeakBytes: { type: integer, format: int64, nullable: true, description: The cgroup's LIFETIME peak. }
        containerLimitBytes: { type: integer, format: int64, nullable: true }
        percentOfLimit:
          type: number
          format: double
          nullable: true
          description: '`workingSetBytes` over `containerLimitBytes`, in percent (one decimal; may exceed 100); null without a limit or a working set.'
    TelemetryJvm:
      type: object
      required: [cpuRatio, threads, gcCount, gcTimeMs, poolAcquired, poolIdle, poolPending, poolAllocated]
      properties:
        cpuRatio: { type: number, format: double, nullable: true, description: Process CPU time over wall time as a fraction of the available processors (0..1). }
        threads: { type: integer, format: int32, nullable: true }
        gcCount: { type: integer, format: int64, nullable: true, description: 'Collections over the latest sample interval, all collectors summed.' }
        gcTimeMs: { type: integer, format: int64, nullable: true, description: 'Collection time over the latest sample interval, all collectors summed.' }
        poolAcquired: { type: integer, format: int32, nullable: true }
        poolIdle: { type: integer, format: int32, nullable: true }
        poolPending: { type: integer, format: int32, nullable: true }
        poolAllocated: { type: integer, format: int32, nullable: true }
    TelemetryStorage:
      type: object
      required: [measuredAt, databaseBytes, schemas]
      properties:
        measuredAt: { type: integer, format: int64, description: Epoch millis of the measurement's bucket }
        databaseBytes: { type: integer, format: int64, description: '`pg_database_size`.' }
        schemas:
          type: array
          items: { $ref: '#/components/schemas/TelemetrySchemaSize' }
    TelemetrySchemaSize:
      type: object
      required: [name, bytes]
      properties:
        name: { type: string, description: 'public or ops (telemetry''s own cost).' }
        bytes: { type: integer, format: int64, description: "Heap, TOAST and indexes of the schema's tables." }
    TelemetryRequests:
      type: object
      required: [windowSeconds, percentileWindowSeconds, measuredAt, total, routes]
      properties:
        windowSeconds: { type: integer, format: int32, description: The window of the counts - the latest sample interval. }
        percentileWindowSeconds:
          type: integer
          format: int32
          description: The window p50 and p95 cover - the sample interval capped at 300 s (the request timers' reservoir), so it can be shorter than `windowSeconds`.
        measuredAt: { type: integer, format: int64, nullable: true, description: The sample bucket the figures describe; null when no live process has a sample. }
        total: { $ref: '#/components/schemas/TelemetryRouteStats' }
        routes:
          type: array
          maxItems: 15
          items: { $ref: '#/components/schemas/TelemetryRouteStats' }
    TelemetryRouteStats:
      type: object
      description: One route (or `*`, every `/api/` route except the telemetry's own and the probes) over the latest sample interval.
      required: [route, count, p50Ms, p95Ms, serverErrors, rateLimited]
      properties:
        route: { type: string, description: 'The normalised route (`/api/v1/users/{id}`) or `*`.' }
        count: { type: integer, format: int64, minimum: 0 }
        p50Ms: { type: number, format: double, nullable: true, description: Null when nothing was served. }
        p95Ms: { type: number, format: double, nullable: true, description: Null when nothing was served. }
        serverErrors: { type: integer, format: int64, minimum: 0, description: 5xx responses. }
        rateLimited: { type: integer, format: int64, minimum: 0, description: 429 responses. }
    TelemetryHistory:
      type: object
      required: [group, range, bucketSeconds, from, to, historyFrom, truncated, series]
      properties:
        group: { type: string, enum: [memory, storage, requests, jvm] }
        range: { type: string, enum: [24h, 7d, 90d] }
        bucketSeconds: { type: integer, format: int32, description: The width of a point's bucket. }
        from: { type: integer, format: int64, description: Epoch millis of the range start (the first bucket may begin up to one bucket earlier). }
        to: { type: integer, format: int64, description: Epoch millis of the read }
        historyFrom: { type: integer, format: int64, description: The oldest instant the range can actually hold data for. }
        truncated: { type: boolean, description: 'More series matched than were returned (40).' }
        series:
          type: array
          maxItems: 40
          items: { $ref: '#/components/schemas/TelemetrySeries' }
    TelemetrySeries:
      type: object
      description: One chart line; `points` are the buckets that hold data, ascending, at most 400.
      required: [key, metric, label, role, unit, kind, points]
      properties:
        key: { type: string, description: 'Unique within the response (`<role>:<metric>:<label>`, empty parts left out).' }
        metric: { type: string, description: 'The metric name (`mem.heap_used`, `http.p95`, ...).' }
        label: { type: string, description: 'A route, a GC collector or a schema; empty when the metric has none.' }
        role: { type: string, nullable: true, description: 'The process role a `memory` / `jvm` series merges (`app`); null for cluster-wide and `requests` series.' }
        unit: { type: string, enum: [BYTES, MILLISECONDS, COUNT, RATIO] }
        kind:
          type: string
          enum: [GAUGE, DELTA, PERCENTILE]
          description: A DELTA point's `avg` is the bucket's total; for the others it is the n-weighted mean.
        points:
          type: array
          maxItems: 400
          items: { $ref: '#/components/schemas/TelemetryPoint' }
    TelemetryPoint:
      type: object
      required: [t, avg, max]
      properties:
        t: { type: integer, format: int64, description: Epoch millis of the bucket start }
        avg: { type: number, format: double }
        max: { type: number, format: double }

