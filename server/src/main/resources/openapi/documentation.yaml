        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`expectedRevision` is stale for THIS milestone (`type` is `urn:astrolabe:problem:stale-revision`)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/projects/{id}/dependencies:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [plan]
      operationId: createDependency
      summary: Link a milestone or project to this project or one of its milestones
      description: |
        Creates a dependency whose SUCCESSOR (the constrained side: "it waits for the predecessor") is project `{id}` itself or one of
        its ACTIVE milestones (`400` otherwise). The caller must own something on THIS project's chain - the project's own owner
        included - or be ADMIN, read-before-guard (404, then 403, then the body); the PREDECESSOR's owner is asked nothing, and a team
        manager as such has no say (a dependency never moves a date). The predecessor is any active milestone or project, in this
        project or another (`400` "Unknown or deleted milestone ids: N" / "... project ids: N"). `type` is FS (the successor starts
        after the predecessor finishes), SS (starts after it starts), FF (finishes after it finishes) or SF (finishes after it
        starts); `lagDays` are WORKING days (Monday-Friday without the public holidays), negative = a lead, -365..365 (`400` outside; default 0). Linking an
        endpoint to itself is `400`. A violated link is only a warning in the project view and never moves anything.
        `409` in two cases, both with nothing written and no revision bump: the two endpoints are already linked (at most one
        active link per unordered pair, any type and either direction; change a link's type or lag with `PUT /dependencies/{id}`),
        or the link would close a directed cycle on the start/end
        time-point graph (a project contains its milestones) - then `type` is `urn:astrolabe:problem:dependency-cycle` and `cycle`
        names the entities, the first repeated last. Audited as `dependency.created`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependencyCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new dependency (`/api/v1/dependencies/{id}`)
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The two endpoints are already linked (either direction), or the link would close a cycle (`type` is
            `urn:astrolabe:problem:dependency-cycle` and `cycle` lists the entities)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/dependencies/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [plan]
      operationId: getDependency
      summary: Get a dependency
      description: |
        Any authenticated user. Both ends are resolved (a project's dates are its DERIVED span, null while nothing in it is
        scheduled). `404` when the dependency, or either end's project, program or work stream, is deleted.
      responses:
        '200':
          description: The dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [plan]
      operationId: updateDependency
      summary: Change a dependency's type and lag
      description: |
        Replaces the link's `type` and `lagDays` (both required; the same ranges as the create). The two ENDS are not editable -
        pointing a link at another end is delete + add. An owner on the SUCCESSOR's project chain - that project's own owner included -
        or ADMIN, read-before-guard (404, then 403, then the body); the predecessor's owner is asked nothing. Re-checked under the
        plan lock against the chain re-read there. A changed `type` re-runs the cycle check on the start/end time-point graph WITHOUT
        this link's old edge: `409` with `type` `urn:astrolabe:problem:dependency-cycle` and `cycle` naming the entities (the
        predecessor first, repeated last), nothing written and no revision bump. A lag-only change cannot close a cycle. There is no
        duplicate-pair `409`: the pair is already this link's. An accepted PUT always bumps the plan revision, a no-op one included
        (the conservative rule); only a real change touches `updatedAt` and emits the audit event `dependency.updated`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependencyUpdateRequest'
      responses:
        '204':
          description: Updated (or unchanged)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The new type would close a cycle (`type` is `urn:astrolabe:problem:dependency-cycle` and `cycle` lists the entities)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [plan]
      operationId: deleteDependency
      summary: Delete a dependency (soft)
      description: |
        An owner on the SUCCESSOR's project chain - that project's own owner included - or ADMIN, read-before-guard (404, then 403); the
        predecessor's owner may not delete a link another project depends on. Re-checked under the plan lock. Soft delete - the
        ordered pair is free to link again. Audited as `dependency.deleted`.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/plan:
    get:
      tags: [plan]
      operationId: getPlanView
      summary: The whole plan tree with the caller's actions
      description: |
        Any authenticated user. One document with every active work stream, its programs and their projects (a deliberate exception
        to the paged envelope, bounded by the plan's scale of about 5 streams, 20 programs and 100 projects), open work streams first
        and then closed ones, each level by name. Every node carries `can`, the actions THIS caller may take, computed with the same
        rules the writes enforce. `revision` is the plan revision read before the rows.
      responses:
        '200':
          description: The plan tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/project/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [plan]
      operationId: getProjectView
      summary: One project with its milestones, the derived span and its drift
      parameters:
        - $ref: '#/components/parameters/BaselineQuery'
      description: |
        Any authenticated user; `404` when the project, its program or its work stream is deleted, for every caller. One document (a
        deliberate exception to the paged envelope, bounded by ONE project's milestones, about 50). `revision` is the plan revision read
        before the rows - send it back as a schedule write's `expectedRevision`. The milestones are split into `scheduled` (the timeline
        rows, by start date, end date, name and id) and `unscheduled` (the tray, by name and id); names sort case-insensitively. `span`
        is the earliest start to the latest end over the scheduled milestones (null when none is scheduled) and `drift` is that span
        against the project's target window as signed calendar-day deltas (positive = later than the target; null unless both the span and
        the window exist) - both are derived at request time and never stored. `project.can` and every milestone's `can` are the actions
        THIS caller may take, computed with the same rules the writes enforce: `createMilestone`, `edit` and `delete` follow the project's
        owner chain (the project's own owner included) or ADMIN; a milestone's `schedule` is true only for ADMIN or the active manager of
        THAT milestone's team - never for the project's owner as such.

        `dependencies` are the project's links: every active link with an end in this project (the project itself or one of its
        milestones), both ends resolved (an end in another project carries that project's name, so the page can draw a ghost row; a
        project end carries its DERIVED span, never its target window) and checked on the working-day calendar (Monday-Friday minus the public holidays). Bounded
        by one project's links and the external projects they touch. Ordered so that the top IS the conflict list: `VIOLATED` first
        (the largest `shortfallDays` first), then `OK`, then `UNSCHEDULED` (an end without dates: not evaluated, no warning); within a
        group by the successor's name, the predecessor's name (case-insensitive) and the id. A violated link only warns - nothing is
        ever moved. `project.can.createDependency` is `createMilestone`'s arithmetic (an owner on the project's chain, or ADMIN); a link's
        `can.delete` is the same arithmetic on the SUCCESSOR's project chain (so the owner of the predecessor's project alone cannot
        delete it). `idleGaps` lists the runs of 3 or more working days with none of the project's milestones in progress.

        The critical path is derived from the PLANNED dates over the whole active plan graph (every milestone and link, read in the same
        snapshot; nothing moves). A milestone's `slackDays` is how many working days it could slip, with everything downstream of it
        allowed to slip too, before THIS project's end moves (null while unscheduled); `critical` is zero slack. A link's `critical`
        means it is a zero-slack link on the chain; a VIOLATED link is never critical and ends the chain at the violation.
        `criticalPath.upstream` lists the milestones and projects of OTHER projects whose slip would eventually move this project's end
        - the critical ones first (the chain, from its origin by start date, end date, name and id), then the rest by slack; a project
        is listed only when an included link (not violated, both ends scheduled) names it. The chain is never cut; the others are capped at 100 (`upstreamTruncated`). Entities that
        only lie downstream of this project, or are unconnected to its end, are absent.

        With `?baseline=N` the document gains `baseline` (`ProjectBaseline`): the project's own span then and its movement
        (`project`, null when the project is newer than the baseline), one entry per LIVE milestone the baseline also froze
        (`milestones`: its dates, estimate and team then, and its movement in working days on the CURRENT calendar - a live milestone
        without an entry is new since the baseline) and the baseline's milestones of this project that are gone (`removed`).
      responses:
        '200':
          description: The project view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectView'
        '400':
          description: >-
            Malformed request (an id, or `baseline`, that is not a non-negative integer; a repeated `baseline`), or `baseline` names an
            unknown or deleted baseline (`type` `urn:astrolabe:problem:unknown-baseline`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/team/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [plan]
      operationId: getTeamView
      summary: One team's milestones, weekly load against capacity, and WIP
      parameters:
        - $ref: '#/components/parameters/BaselineQuery'
      description: |
        Any authenticated user; `404` when the team is deleted, for every caller. One document (a deliberate exception to the paged
        envelope, bounded by ONE team's milestones - about 100 at the assumed scale -, their links and at most 520 weeks). `revision` is
        the plan revision read before the rows - send it back as a schedule write's `expectedRevision`; the team's order revision
        travels separately as `order.revision` (the `expectedRevision` of `PUT /teams/{id}/milestone-order`).

        The team's milestones are split into `scheduled` (the timeline rows) and `unscheduled` (the tray), both in the team's
        EFFECTIVE order. That order is the team's own where the manager set one (`order.custom`): the listed milestones first, exactly as
        listed, then the rest by the global PROJECT RANK (ranked projects before unranked ones, then project name and id), then a
        milestone's start date, end date, name and id with undated work last. The project rank is only the top-down suggestion and the
        default; a manager's override is never reshuffled by a later rank change, only unlisted milestones follow the rank.

        `weeks` has one row per ISO week from the Monday of the earliest scheduled start to the Sunday of the latest scheduled end
        (empty while nothing is scheduled; at most 520 weeks from the start, then `weeksTruncated`). A milestone's estimate is spread
        evenly over its working days (Monday-Friday without the public holidays), so a week's `load` is the sum of the shares of the working
        days inside it; a holiday is uncovered and the divisor below stays 5.
        `capacity` is the sum over the week's working days of the man-days per week in force THAT day, divided by 5 - so the week a
        capacity period starts in is prorated by working days - and null ("no capacity", never zero, never flagged) when no period is
        in force on any working day of the week. `load` and `capacity` are rounded half-up to two decimals and `overloaded` compares the
        two rounded figures (`overloadMd` is their difference, only when overloaded). `maxWip` is the most scheduled milestones in
        progress on one working day of the week (a milestone is in progress on the working days of its effective span, the first
        working day on or after its start to the last on or before its end) and `wipExceeded` is true when some working day's count
        exceeds the WIP limit in force that day; a day without a limit never flags. An overloaded week and a week over the WIP limit
        are warnings only - nothing is ever moved.

        `team.can` carries the actions THIS caller may take, all with one arithmetic: ADMIN or the team's ACTIVE manager (`schedule` is
        `PUT /milestones/{id}/schedule` for this team's milestones, `editCapacity` the capacity period writes, `editOrder` the order
        PUT). `dependencies` are the project view's links for the links with an end among the team's milestones, both ends resolved
        and checked on the working-day index, violated first; a link's other end may lie in another team or project and is not listed
        as a row of its own. `idleGaps` lists the runs of 3 or more working days with none of the team's milestones in progress.

        With `?baseline=N` the document gains `baseline` (`TeamBaseline`): one entry per LIVE milestone of the team that the baseline
        also froze (`milestones`, with the team it sat on then - `teamIdThen` - and its movement in working days on the CURRENT
        calendar; a live milestone without an entry is new since the baseline) and the baseline's milestones of THIS team that are not
        on it any more (`removed`: deleted, or moved to another team - `now`).
      responses:
        '200':
          description: The team view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamView'
        '400':
          description: >-
            Malformed request (an id, or `baseline`, that is not a non-negative integer; a repeated `baseline`), or `baseline` names an
            unknown or deleted baseline (`type` `urn:astrolabe:problem:unknown-baseline`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/programs:
    get:
      tags: [plan]
      operationId: getProgramsView
      summary: The plan tree with derived spans, flag roll-ups and each project's roadmap row
      parameters:
        - $ref: '#/components/parameters/BaselineQuery'
      description: |
        Any authenticated user. One document (a deliberate exception to the paged envelope, bounded by the plan's scale of about 5 work
        streams, 20 programs and 100 projects), read in ONE snapshot: `revision` is the PLAN revision read before the rows
        (informational - no write consumes it; the ranking's revision is `GET /views/roadmap`'s).

        `workStreams` lists every active work stream, open ones before closed ones (a closed stream has an `endDate`), each level by
        name (case-insensitive) then id; EMPTY programs and work streams are present. A program's `projects` are the roadmap's
        project rows exactly (`RoadmapProject`: derived span, drift, flags, `can.editTargetWindow`), ranked projects first in rank
        order, then the unranked by name and id. `teams` and `links` are `GET /views/roadmap`'s for the same plan.

        A program's `span` is derived from its projects' spans (earliest start to latest end, null while none is scheduled) and a
        work stream's from its programs' spans; nothing is stored. `flags` roll the projects' flags up: the number of WARNING and INFO
        flags over the program's (work stream's) projects. Programs and work streams carry no target window.

        With `?baseline=N` the document gains `baseline` (the baseline's identity), every project row gains its `baseline` block (as
        `GET /views/roadmap`'s) and a program (work stream) with at least one project the baseline froze gains `baseline`: the span
        those projects (its programs) had, derived like the live span, and its movement against the live span.
      responses:
        '200':
          description: The programs view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramsView'
        '400':
          description: >-
            Malformed request (an id, or `baseline`, that is not a non-negative integer; a repeated `baseline`), or `baseline` names an
            unknown or deleted baseline (`type` `urn:astrolabe:problem:unknown-baseline`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/roadmap:
    get:
      tags: [roadmap]
      operationId: getRoadmapView
      summary: The global project ranking with spans, flags and rolled-up links
      parameters:
        - $ref: '#/components/parameters/BaselineQuery'
      description: |
        Any authenticated user. One document (a deliberate exception to the paged envelope, bounded by the plan's scale of about 100
        projects, 1,000 milestones and 300 project pairs): `ranked` in position order (dense 1..n) and `unranked`, the active projects
        without a position, by name. Each project carries its program, work stream and owner, its `teamIds` (the teams of all its
        active milestones), its DERIVED `span` (earliest start to latest end over its scheduled milestones; null while none is
        scheduled), the `drift` of that span against the target window (null unless both exist) and its `flags`.
        Flags are WARNING first, then by kind, team and other project. Drift: an end later than the target end is a `DRIFT_END_LATE`
        WARNING; a start later than the target start (`DRIFT_START_LATE`) and an end ahead of the target (`DRIFT_END_EARLY`) are INFO;
        an early start raises nothing. Rank inversion (`RANK_INVERSION`, only for ranked projects, raised on the LOWER-ranked project
        B with `otherProjectId` = the higher-ranked A): per team, the ranked projects with scheduled work on that team in rank order,
        and every ADJACENT pair where B's earliest start on the team is strictly before A's is a WARNING with that `teamId` (`days` =
        how much earlier); adjacent ranked projects with a span that share no team with scheduled work and whose B span starts
        strictly before A's are an INFO with a null `teamId`. A tie is no inversion. `teams` are the active teams with milestones in
        the plan (the team filter's options), by name. `links` roll the dependencies up per ORDERED pair of projects, ordered by
        (predecessor, successor) project id: `direct` is the project-to-project link (checked on working days), `milestoneLinks` counts
        the links with a milestone end between the pair (violated, unscheduled); links inside one project are not listed.
        `can.editRank` is whether THIS caller may `PUT /roadmap/ranking` (ADMIN or a ROADMAP_EDITOR holder) and each project's
        `can.editTargetWindow` whether they may `PUT /projects/{id}/target-window` (ADMIN, an owner above the project, or a
        ROADMAP_EDITOR holder). `revision` is the RANKING's revision (the plan revision at which the rank was last written), read before the rows - send it back as `expectedRevision`. Plan writes elsewhere do not move it.

        With `?baseline=N` the document gains `baseline` (the baseline's identity and the projects it froze that are gone) and every
        project the baseline also froze gains a `baseline` block: the derived span, rank position and target window it had and the
        span's movement in working days on the CURRENT calendar (a project row without the block is newer than the baseline).
      responses:
        '200':
          description: The ranking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapView'
        '400':
          description: >-
            Malformed request (`baseline` that is not a non-negative integer, or repeated), or `baseline` names an unknown or deleted
            baseline (`type` `urn:astrolabe:problem:unknown-baseline`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/baseline/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [plan]
      operationId: getBaselineView
      summary: The comparison of one baseline with the plan now
      description: |
        Any authenticated user; `404` when the baseline is unknown or soft-deleted (it is the addressed resource - the views'
        `?baseline=` answers `400` instead, because there the id is a query value the client held). One document (a deliberate
        exception to the paged envelope, bounded by the plan's scale: about 100 project rows and at most about 1,000 milestone rows),
        read in ONE snapshot: `revision` is the plan revision read first. The baseline equals the plan at `baseline.planRevision`, so
        a `revision` equal to it shows no movement.

        `projects` is the union of the baseline's and the live projects (a project newer than the baseline has `movement.kind` `ADDED`,
        one that is gone `REMOVED`), by work stream, program and project name (case-insensitive) then id: the names are the live ones
        when the project exists now, `rankThen`/`rankNow` the rank positions on either side, `baselineSpan`/`span` the derived spans
        then and now, `movement` the span's movement and `counts` the movement counts over the project's milestones (a removed
        project: its removed milestones). `milestones` lists ONLY the changed milestone rows - every `movement.kind` but `UNCHANGED`,
        or a different estimate (`movement.estimateDelta` not zero) - in the projects' order, then by start (the live one, else the
        frozen one; undated last), end, name and id; the unchanged rows are in `totals` and `counts`.

        Movement is measured in WORKING days on the CURRENT calendar (Monday-Friday minus the public holidays), positive = later:
        `startDays`/`endDays` are present only for a milestone dated on both sides; a Saturday-dated start moved to its Monday is no
        movement. `totals` counts every milestone row and every project row: `later`/`earlier` are the `MOVED` rows whose END is
        later/earlier (a start-only move is `moved`, neither).
      responses:
        '200':
          description: The comparison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineView'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/roadmap/ranking:
    put:
      tags: [roadmap]
      operationId: replaceRoadmapRanking
      summary: Replace the global project ranking
      description: |
        ADMIN or a holder of the `ROADMAP_EDITOR` permission; every other caller gets `403` BEFORE the body is read (the route addresses
        no node). The permission is re-checked under the plan lock, so a grant revoked while the request was in flight refuses the write.
        Wholesale: the listed projects get positions 1..n in the given order and every other project becomes unranked (omit a project to
        unrank it; append an unranked one to rank it at the end). `expectedRevision` is the ranking's revision (`RoadmapView.revision`, or the previous answer): the PUT is `409` with
        `type` `urn:astrolabe:problem:stale-revision` and nothing is written only when the ranking was written at a later revision (another ranking PUT, or the delete of a
        ranked project) or the value is above the current plan revision - a plan write elsewhere never stales it. Reload the view and retry. `400` when an id is listed
        twice, is unknown or belongs to a deleted project, or more than 1000 ids are sent. Every accepted PUT, even one that keeps the
        order, bumps the plan revision by one and is audited as `roadmap.ranked`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RankingUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The ranking was replaced; the body carries the new plan revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`expectedRevision` is stale (`type` is `urn:astrolabe:problem:stale-revision`)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/milestone-order:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [plan]
      operationId: replaceTeamMilestoneOrder
      summary: Replace a team's milestone order
      description: |
        ADMIN or the team's ACTIVE manager, read-before-guard (`404` for an unknown or deleted team, then `403`, then the body: a forbidden
        caller's malformed body is still `403`). The project owner, the other teams' managers and every other caller get `403`. The
        guard is re-run under the plan lock, so a manager cleared while the request was in flight refuses the write.
        The team's milestone order is the order of ACTUAL EXECUTION and belongs to the team: the global project rank (`/roadmap/ranking`)
        is only the top-down suggestion and the DEFAULT of this order. Wholesale: the listed milestones get positions 1..n in the given
        order; the team's other milestones are unlisted and follow the listed ones in the default order (the project rank). An empty
        list resets the team to the default order. The positions are the team's own and absolute: a later project-rank change never
        reorders them. `expectedRevision` is this TEAM's order revision (`order.revision` of the team view), so another team's reorder or
        any other plan write elsewhere never makes it stale; a team whose order was never written accepts any `expectedRevision` up to
        the current plan revision. A smaller revision than the stored one, or one above the current plan revision, is `409` with `type`
        `urn:astrolabe:problem:stale-revision` and nothing is written - reload the team view and retry. `400` when an id is listed twice,
        names no milestone, a deleted milestone or a milestone of another team, more than 1000 ids are sent, or `expectedRevision` is
        negative. Every accepted PUT, even one that keeps the order, bumps the plan revision by one and is audited as
        `team.milestone_order_changed`; the answer carries that revision, which is now the team's order revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamOrderUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The order was replaced; the body carries the new plan revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamOrderResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`expectedRevision` is stale for THIS team''s order (`type` is `urn:astrolabe:problem:stale-revision`)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/milestone-schedules:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [plan]
      operationId: scheduleTeamMilestones
      summary: Schedule several of a team's milestones at once (the batch accept)
      description: |
        ADMIN or the team's ACTIVE manager, read-before-guard (`404` for an unknown or deleted team, then `403`, then the body: a forbidden
        caller's malformed body is still `403`). The project owner, the other teams' managers and every other caller get `403`. The batch
        is N `PUT /milestones/{id}/schedule` in ONE plan write under the TEAM's guard (a command, not a replace: milestones not listed
        keep their dates); the guard is re-run under the plan lock, so a manager cleared while the request was in flight refuses the
        write (`403`, nothing written, no bump).

        Each item is the single PUT's body without the revision: `startDate` and `endDate` both set or both null (null unschedules),
        inclusive, the end not before the start, a working day inside. `400` before the lock, with nothing written, for a negative
        `expectedRevision`, an empty list, more than 1000 items, a milestone listed twice, or an item with one date only, a bad date, an end
        before the start or a span of only weekend days. `expectedRevision` is the plan revision of the view the items come from (a
        schedule proposal's `revision`): a value above the current plan revision (a view from the future) is `409` with `type`
        `urn:astrolabe:problem:stale-revision` for the WHOLE batch.

        `scopeHash` (optional, the proposal's) turns the call into the accept of THAT proposal: after the revision check, under the lock,
        the team's scope is fingerprinted again from the same rows (its milestones, their estimates, projects and effective order, its
        capacity periods, the links touching it with the dates of their foreign ends, the Monday-Friday holidays) and any other milestone
        of the team that was scheduled after `expectedRevision` and is not in the batch is looked for. A different fingerprint or such a
        milestone is `409` with `type` `urn:astrolabe:problem:stale-scope` for the WHOLE batch: nothing is written and the revision is not
        bumped - propose again. The dates of the batch's OWN milestones are not part of the fingerprint (they stay the per-item `STALE`
        below). Absent = no scope check: N schedule PUTs, the contract before v0.9. A malformed value is `400`.

        Otherwise every item is decided on its own, in body order, under the lock: the first matching `reason` skips it and the rest are
        still written - `GONE` (no active milestone has the id), `NOT_ON_TEAM` (it is, or moved to, another team), `NO_WORKING_DAY` (the
        span holds no working day of the CURRENT holiday calendar - a holiday added since the view), `STALE` (THIS milestone's schedule was
        written after `expectedRevision`, per-milestone as in the single PUT - unrelated plan writes never stale an item). A written item
        has its `schedule_revision` stamped with the new plan revision. The batch bumps the plan revision by ONE, whatever was skipped (an
        all-skipped batch included), and the answer's `revision` is that new revision: send it as the next `expectedRevision`.
        Audited as `milestone.scheduled` per written item whose dates actually changed and ONE `team.schedule_batch_applied`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamScheduleBatchRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The batch was applied; the body lists the written and the skipped milestones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamScheduleBatchResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            `expectedRevision` is above the current plan revision (`type` is `urn:astrolabe:problem:stale-revision`), or the team's plan
            changed since the proposal `scopeHash` names (`type` is `urn:astrolabe:problem:stale-scope`); nothing was written
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/schedule-proposal:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [plan]
      operationId: proposeTeamSchedule
      summary: Propose a schedule for a team's not-yet-started milestones (a computation, nothing is stored)
      description: |
        ADMIN or the team's ACTIVE manager, read-before-guard (`404` for an unknown or deleted team, then `403`, then the body: a forbidden
        caller's malformed body is still `403`, then `asOf` `400`). The project owner, the other teams' managers and every other caller get
        `403`. A COMPUTATION, not a mutation: `200` (no `Location`), nothing is written or stored, no lock is taken, the plan revision does
        not move and no audit event is emitted. The server proposes; the client shows the diff and sends the accepted moves to
        `POST /teams/{id}/milestone-schedules` with this document's `revision` as `expectedRevision`.

        `asOf` is the VIEWER's calendar day (the server reads no clock): a milestone of the team is MOVABLE when it is unscheduled or its
        start is after `asOf`; one that started on or before it (in progress or past) is fixed and so is every other team's milestone.
        Movable milestones are placed greedily in the team's milestone order (the custom order, else the project rank), after their
        dependencies, on the earliest working days that fit: the duration is the estimate over the capacity share (capacity over the WIP
        limit, the whole capacity when there is none), every day within capacity and the WIP limit, on the public-holiday calendar. Days
        without a capacity period, or on hold (0 man-days per week), take no work. A 0 man-day milestone takes one working day and counts
        toward the WIP limit. A link into another team's fixed milestone that the placement breaks is NOT avoided: it is reported in
        `dependencies` with `check.status` `VIOLATED` (and `before` showing what it was).

        `moves` lists the movable milestones that change dates, in the team's effective order; `unchanged` those that land on their
        current dates; `unplaced` those that got no dates (`NO_CAPACITY`: no working day with capacity at or after their earliest start;
        `NO_ROOM`: none fits within 520 weeks of the team's first usable day) - a scheduled milestone in `unplaced` keeps its stored
        dates. `weeks` is the team's weekly load as it would be after accepting EVERY move (the team view's `weeks`), `dependencies` the
        links with an end among the team's milestones, or a project end whose span changed, violated-after first, with the dates of moved
        ends as proposed. Bounded by one team's milestones (about 100, 301 on the largest sample team), at most 520 weeks and the links
        touching the team.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleProposalRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The proposal; nothing was changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleProposal'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/public-holidays:
    get:
      tags: [calendar]
      operationId: listPublicHolidays
      summary: List the public holidays
      description: |
        Any authenticated user. The whole dictionary in date order - a bounded `{items}` list (ADMIN-curated, about 14 rows a year), not
        paged. The dates are the days nobody works: every working-day figure of the views and the schedule write skips them.
      responses:
        '200':
          description: The public holidays
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicHolidayList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [calendar]
      operationId: createPublicHoliday
      summary: Add a public holiday
      description: |
        ADMIN only (guarded before the body decodes - a non-admin's malformed body is still `403`). One holiday per date: a date the
        dictionary already holds is `409`. The dictionary is plan state: an accepted write bumps the plan revision by one (a `409`
        does not) and stamps nothing else, so no client write is staled by it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicHolidayCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new holiday
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicHolidayResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/public-holidays/apply-preset:
    post:
      tags: [calendar]
      operationId: applyHolidayPreset
      summary: Add a preset's public holidays for a year
      description: |
        ADMIN only (guarded before the body decodes). Adds every holiday of the preset's set for `year` that the dictionary does not hold
        yet (`POLISH`: the Polish statutory days, fixed dates plus the Easter-based ones; Sunday-only days such as Easter Sunday are
        stored too). **The preset projects TODAY's statute onto any year** in 1900-2999: it does not model when each day became (or
        stopped being) a statutory holiday - for example Epiphany only since 2011, 3 May since 1990, 11 November since 1989, Christmas
        Eve only from 2025 - so applying it to a past year adds days that were then working days; the ADMIN removes any that do not
        apply. Idempotent: a date that already has a holiday is left as it is (its name is kept) and listed in `skipped`, so
        re-applying adds nothing. It is a plan write and bumps the plan revision by one even when nothing was added. An unknown
        `preset` or a `year` outside 1900-2999 is `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HolidayPresetRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The holidays added and the dates skipped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayPresetResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/public-holidays/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    delete:
      tags: [calendar]
      operationId: deletePublicHoliday
      summary: Remove a public holiday
      description: |
        ADMIN only, guard-before-read (`403` before the `404`, so a probe learns nothing about which ids exist). A hard delete: the date
        is free to be added again. A plan write - an accepted delete bumps the plan revision by one, a `404` does not.
      responses:
        '204':
          description: Removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/baselines:
    get:
      tags: [plan]
      operationId: listBaselines
      summary: List the baselines
      description: |
        Any authenticated user. The ACTIVE baselines, newest first (`createdAt` then `id`, both descending) - a bounded `{items, can}`
        set (at most 100 by the cap; the baseline picker needs all of them at once), not paged. `can.manage` is the caller's right to
        take, rename and delete baselines (ADMIN or a `ROADMAP_EDITOR`).
      responses:
        '200':
          description: The active baselines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [plan]
      operationId: createBaseline
      summary: Take a baseline
      description: |
        ADMIN or a holder of the `ROADMAP_EDITOR` permission; every other caller gets `403` BEFORE the body is read (the route addresses
        no node, like the ranking). The permission is re-checked under the plan lock. A baseline is a named, immutable copy of the plan's
        dated structure - every active milestone (name, project, team, estimate, dates) and every active project (name, program, work
        stream, target window, rank position, derived span) - taken under the plan lock, so it is the plan at ONE revision. Taking one is
        a plan write: it bumps the plan revision by one and the answer's `planRevision` is the revision it left behind (the plan equals
        the baseline at that revision). Links, capacity periods, holidays and team orders are not copied. `409` with `type`
        `urn:astrolabe:problem:baseline-limit` when 100 baselines are already active (delete one first); `409` when another active
        baseline has the name (case-insensitively). Nothing is written on a `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaselineCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new baseline
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The name is taken by another active baseline, or the limit of 100 active baselines is reached (`type` is `urn:astrolabe:problem:baseline-limit`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/baselines/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [plan]
      operationId: getBaseline
      summary: Get a baseline
      description: Any authenticated user. `404` for an unknown or deleted baseline.
      responses:
        '200':
          description: The baseline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [plan]
      operationId: updateBaseline
      summary: Rename / re-describe a baseline
      description: |
        ADMIN or a holder of the `ROADMAP_EDITOR` permission, GUARD-BEFORE-READ (`403` before the body and before the `404`, like the
        ranking and the holiday registry); the permission is re-checked under the plan lock. A full replace of the name and the
        description (omitted = none); the frozen rows never change. A plan write: it bumps the plan revision by one. `409` when another
        active baseline has the name (case-insensitively).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaselineUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [plan]
      operationId: deleteBaseline
      summary: Delete a baseline (soft)
      description: |
        ADMIN or a holder of the `ROADMAP_EDITOR` permission, GUARD-BEFORE-READ; the permission is re-checked under the plan lock. A soft
        delete: the name is free to be reused and the baseline reads as `404` everywhere; its frozen rows are kept. A plan write: it
        bumps the plan revision by one.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/telemetry/current:
    get:
      tags: [telemetry]
      operationId: getTelemetryCurrent
      summary: Astrolabe's own vital signs - processes, storage, request latency
      description: |
        ADMIN only (operational data: process sizes, container limits, storage sizes), read-only, no audit event;
        both telemetry reads share one per-user rate bucket (30/min, `429`). `.claude/docs/observability.md` "Telemetry".
        `processes` lists each sampling process (role `app`) with its latest raw sample: every live process, and the
        newest stale one when none is alive (a process that stopped stays visible for a day). `stale` = no sample for more than three
        sample intervals. A figure the process could not measure is null (no container limit outside a cgroup, no `memory.peak` on an
        old kernel) - never zero; `percentOfLimit` is the cgroup working set over the container limit, in percent. `storage` is the
        newest database / per-schema size (null before the first measurement). `requests` is the latest sample interval of the live
        processes: the `*` total and the 15 busiest routes.
      responses:
        '200':
          description: The current figures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryCurrent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/telemetry/history:
    get:
      tags: [telemetry]
      operationId: getTelemetryHistory
      summary: The trend of one telemetry section over 24 hours, 7 days or 90 days
      description: |
        ADMIN only (guard before the query is read: `403` outranks `400`), read-only, no audit event.
        `group` picks the section and `range` the span; both are required. Buckets: `24h` = the raw sample interval (widened to a whole
        multiple of it when that would exceed 400 points), `7d` = one hour (the hourly rollups plus the raw rows of the hours not yet
        rolled up), `90d` = six hours; `bucketSeconds` says which. At most 400 points per series and 40 series (`truncated` when more
        matched); a series has points only for the buckets that hold data.
        Per-process groups merge the processes of one `role` into one series, so a trend survives a restart (`memory`, `jvm`), or all
        processes into one series per route (`requests`, `role` null); `storage` is cluster-wide (`role` null). `requests` keeps the `*`
        total (count, p50, p95, 5xx, 429) and the ten busiest routes of the range (count, p50, p95). A DELTA series' `avg` is the
        bucket's TOTAL and its `max` the largest single sample interval; a GAUGE or PERCENTILE series' `avg` is the n-weighted mean and
        `max` the largest sample. `historyFrom` is the oldest instant the range can actually hold: the first sampler boot (a fresh
        install, or retention shorter than the range).
      parameters:
        - name: group
          in: query
          required: true
          schema:
            type: string
            enum: [memory, storage, requests, jvm]
          description: The panel section.
        - name: range
          in: query
          required: true
          schema:
            type: string
            enum: [24h, 7d, 90d]
          description: How far back the history reaches.
      responses:
        '200':
          description: The series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHistory'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/integrations/jira/connections:
    get:
      tags: [jira]
      operationId: listJiraConnections
      summary: List Jira connections
      description: |
        ADMIN only (guarded before anything is read).

        - Sortable fields: `id`, `name`, `createdAt`. Default `id` ascending.
        - Filters: none.
        - The API token is never returned; each row carries `hasApiToken`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of Jira connections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraConnectionPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [jira]
      operationId: createJiraConnection
      summary: Create a Jira connection
      description: |
        ADMIN only (guarded before the body decodes - a non-admin's malformed body is still `403`). The `apiToken` is required; it is
        encrypted before it is stored and never returned or logged. `siteUrl` is exactly `https://<tenant>.atlassian.net`. A
        case-insensitive name clash with an active connection is `409`.
      requestBody:
        required: true
        content:
