    put:
      tags: [teams]
      operationId: updateCapacityPeriod
      summary: Replace a capacity period
      description: |
        ADMIN or the period's team's ACTIVE manager, read-before-guard (`404`, then `403`, then the body). A full replace: an absent or null
        `wipLimit` CLEARS the limit. A start date another ACTIVE period of the team already holds is `409`. A PUT that changes nothing is
        `204` and writes (and audits) nothing. Own transaction under the team row lock, the manager re-checked there; no plan revision bump.
      requestBody:
        required: true
        content:
          application/json:
