      description: A link of the project view (and of the team view) - both ends resolved, the check of the pure kernel and the caller's action.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        predecessor: { $ref: '#/components/schemas/DependencyEndpoint' }
        successor: { $ref: '#/components/schemas/DependencyEndpoint' }
        type: { $ref: '#/components/schemas/DependencyType' }
        lagDays: { type: integer, format: int32, minimum: -365, maximum: 365, description: Working days; negative = a lead. }
        check: { $ref: '#/components/schemas/DependencyCheck' }
        can:
          type: object
          required: [delete]
          properties:
            delete: { type: boolean, description: 'The caller may delete the link: an owner on the SUCCESSOR''s project chain, or ADMIN.' }
    DependencyStatus:
      type: string
      enum: [OK, VIOLATED, UNSCHEDULED]
      description: >-
        VIOLATED = the successor is short of what the type requires (a warning only); UNSCHEDULED = an end has no dates (a milestone
        without dates, a project with no scheduled milestone): not evaluated.
    DependencyCheck:
      type: object
      required: [status, shortfallDays, requiredDate, actualDate]
      description: >-
        The check of one link on the Monday-Friday working-day index, with the effective start (the first working day on or after
        `start`) and end (the last working day on or before `end`) of each end. FS requires the successor's start on the working day after
        the predecessor's end; SS its start on the predecessor's start; FF its end on the predecessor's end; SF its end on the
        working day before the predecessor's start - each shifted by `lagDays` working days.
      properties:
        status: { $ref: '#/components/schemas/DependencyStatus' }
        shortfallDays:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: How many working days short the successor is; present (at least 1) only when `status` is `VIOLATED`.
        requiredDate:
          type: string
          format: date
          nullable: true
          description: The working day the type requires for the successor's start or end; null when `UNSCHEDULED`.
        actualDate:
          type: string
          format: date
          nullable: true
          description: The successor's effective start (FS, SS) or end (FF, SF); null when `UNSCHEDULED`.
    DateSpan:
      type: object
      required: [start, end]
      description: An inclusive span of calendar days.
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date, description: Not before `start`. }
    Drift:
      type: object
      required: [startDays, endDays]
      description: Calendar-day deltas of a derived span against a target window; positive = later than the target, negative = ahead, zero = on target.
      properties:
        startDays: { type: integer, format: int64, description: '`span.start` minus `target.start`.' }
        endDays: { type: integer, format: int64, description: '`span.end` minus `target.end`.' }
    ProjectViewProject:
      type: object
      required: [id, programId, workStreamId, programName, workStreamName, name, description, ownerPersonId, ownerName, targetStart, targetEnd, createdAt, updatedAt, can]
      description: The `PlanProject` fields plus the names of the project's program and work stream.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        programId: { type: integer, format: int32, minimum: 0 }
        workStreamId: { type: integer, format: int32, minimum: 0 }
        programName: { type: string }
        workStreamName: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        targetStart: { type: string, format: date, nullable: true }
        targetEnd: { type: string, format: date, nullable: true }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        can:
          type: object
          required: [edit, delete, editTargetWindow, createMilestone, createDependency]
          properties:
            edit: { type: boolean }
            delete: { type: boolean, description: 'A rights flag: the caller may delete the project (its milestones go with it).' }
            editTargetWindow: { type: boolean, description: 'The caller may set the target window (ADMIN, an owner above the project, or a roadmap editor).' }
            createMilestone: { type: boolean, description: 'The caller may create a milestone under the project (an owner on its chain, or ADMIN).' }
            createDependency: { type: boolean, description: 'The caller may create a dependency whose successor is the project or one of its milestones (an owner on its chain, or ADMIN).' }
    ProjectMilestone:
      type: object
      required: [id, projectId, name, description, teamId, teamName, estimateMd, startDate, endDate, createdAt, updatedAt, can]
      description: A milestone as the project view shows it - the `MilestoneResponse` fields plus the caller's actions. Both dates are null in `unscheduled`, both set in `scheduled`.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        projectId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        teamId: { type: integer, format: int32, minimum: 0 }
        teamName: { type: string }
        estimateMd: { type: number, format: double, minimum: 0, description: Man-days with at most two decimals. }
        startDate: { type: string, format: date, nullable: true, description: Null = unscheduled (both dates are null together). }
        endDate: { type: string, format: date, nullable: true }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
        can:
          type: object
          required: [edit, delete, schedule]
          properties:
            edit: { type: boolean, description: 'The caller may change the plan fields (an owner on the project''s chain, or ADMIN).' }
            delete: { type: boolean }
            schedule: { type: boolean, description: 'The caller may set or clear the dates: ADMIN or the active manager of the milestone''s team - never the project''s owner as such.' }

    TeamView:
      type: object
      required: [revision, team, order, capacity, weeks, weeksTruncated, scheduled, unscheduled, dependencies]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The plan revision, read before the rows; send it back as `expectedRevision` of a schedule write.
        team:
          $ref: '#/components/schemas/TeamViewTeam'
        order:
          $ref: '#/components/schemas/TeamViewOrder'
        capacity:
          $ref: '#/components/schemas/TeamViewCapacity'
        weeks:
          type: array
          description: >-
            One row per ISO week, Monday-keyed, from the earliest scheduled start's Monday to the latest scheduled end's Sunday (at most
            520); empty while nothing is scheduled.
          items:
            $ref: '#/components/schemas/WeekLoad'
        weeksTruncated:
          type: boolean
          description: True when the range of scheduled milestones is longer than 520 weeks and `weeks` stops there.
        scheduled:
          type: array
          description: The milestones with dates (the timeline rows) in the team's effective order.
          items:
            $ref: '#/components/schemas/TeamMilestone'
        unscheduled:
          type: array
          description: The milestones without dates (the tray) in the team's effective order (the dates are null, so name and id decide within a project).
          items:
            $ref: '#/components/schemas/TeamMilestone'
        dependencies:
          type: array
          description: >-
            The active links with an end among the team's milestones, violated first (the largest shortfall first), then OK, then
            unscheduled; within a group by successor name, predecessor name and id. Ends are resolved, not listed: there are no ghost rows.
          items:
            $ref: '#/components/schemas/ProjectDependency'
    TeamViewTeam:
      type: object
      required: [id, name, managerPersonId, managerName, createdAt, updatedAt, can]
      description: The `TeamResponse` fields plus what the caller may do with the team's plan.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        managerPersonId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The team's manager (a person); null when unset or when the assigned person was soft-deleted.
        managerName: { type: string, nullable: true, description: The manager's name; null with `managerPersonId`. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
        can:
          type: object
          required: [schedule, editCapacity, editOrder]
          description: Three names with one arithmetic - ADMIN, or the caller is the active manager of THIS team.
          properties:
            schedule: { type: boolean, description: 'The caller may set or clear the dates of this team''s milestones (`PUT /milestones/{id}/schedule`).' }
            editCapacity: { type: boolean, description: 'The caller may add, change and delete this team''s capacity periods.' }
            editOrder: { type: boolean, description: 'The caller may replace this team''s milestone order (`PUT /teams/{id}/milestone-order`).' }
    TeamViewOrder:
      type: object
      required: [custom, revision, milestoneIds]
      properties:
        custom: { type: boolean, description: True when the team's manager has set an order (the project rank is then only the default for the unlisted tail). }
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The team's order revision (0 when never written); send it back as `expectedRevision` of the order PUT.
        milestoneIds:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: integer, format: int32, minimum: 0 }
          description: >-
            The stored custom order: the manager's listed milestones that are still ACTIVE milestones of this team, scheduled or not, in
            stored position order (empty when `custom` is false). The unscheduled ones are listed here only; a client that writes the
            order again keeps their places (`planning-model.md` "The team milestone order").
    TeamViewCapacity:
      type: object
      required: [periods]
      properties:
        periods:
          type: array
          description: The team's active capacity periods in `effectiveFrom` order, with their WIP limits.
          items:
            $ref: '#/components/schemas/CapacityPeriodResponse'
    WeekLoad:
      type: object
      required: [weekStart, load, capacity, overloaded, overloadMd, maxWip, wipExceeded]
      description: One ISO week of the team's load against its capacity and WIP limit. Warnings only.
      properties:
        weekStart: { type: string, format: date, description: The week's Monday. }
        load:
          type: number
          format: double
          minimum: 0
          description: The man-days of the scheduled milestones falling in the week (each estimate spread evenly over its working days), two decimals.
        capacity:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: >-
            The sum over the week's working days of the capacity in force that day, over 5 (two decimals); null when no capacity period
            is in force on any working day of the week.
        overloaded: { type: boolean, description: 'True when `capacity` is set and `load` exceeds it (compared as rounded).' }
        overloadMd: { type: number, format: double, minimum: 0, nullable: true, description: '`load` minus `capacity`; only when `overloaded`.' }
        maxWip:
          type: integer
          format: int32
          minimum: 0
          description: The most scheduled milestones in progress on one working day of the week.
        wipExceeded: { type: boolean, description: Some working day's in-progress count exceeds the WIP limit in force that day. }
    TeamMilestone:
      type: object
      required: [id, projectId, name, description, teamId, teamName, estimateMd, startDate, endDate, createdAt, updatedAt, projectName, programName, workStreamName, rankPosition]
      description: A milestone as the team view shows it - the `MilestoneResponse` fields plus the names of its project chain and its project's rank. Both dates are null in `unscheduled`.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        projectId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        teamId: { type: integer, format: int32, minimum: 0 }
        teamName: { type: string }
        estimateMd: { type: number, format: double, minimum: 0, description: Man-days with at most two decimals. }
        startDate: { type: string, format: date, nullable: true, description: Null = unscheduled (both dates are null together). }
        endDate: { type: string, format: date, nullable: true }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
        projectName: { type: string }
        programName: { type: string }
        workStreamName: { type: string }
        rankPosition: { type: integer, format: int32, minimum: 1, nullable: true, description: The project's position in the global project rank; null = unranked. }

    RoadmapView:
      type: object
      required: [revision, can, ranked, unranked]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The ranking's revision (the plan revision at which the rank was last written), read before the rows; send it back as `expectedRevision`.
        can:
          type: object
          required: [editRank]
          properties:
            editRank: { type: boolean, description: The caller may replace the ranking (ADMIN or a roadmap editor). }
        ranked:
          type: array
          description: The ranked projects in position order.
          items:
            $ref: '#/components/schemas/RoadmapRankedProject'
        unranked:
          type: array
          description: The active projects without a position, by name.
          items:
            $ref: '#/components/schemas/RoadmapProject'
    RoadmapRankedProject:
      type: object
      required: [position, project]
      properties:
        position: { type: integer, format: int32, minimum: 1, description: 'Dense: the ranked projects hold 1..n.' }
        project:
          $ref: '#/components/schemas/RoadmapProject'
    RoadmapProject:
      type: object
      required: [id, name, programId, programName, workStreamId, workStreamName, ownerName, targetStart, targetEnd]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        programId: { type: integer, format: int32, minimum: 0 }
        programName: { type: string }
        workStreamId: { type: integer, format: int32, minimum: 0 }
        workStreamName: { type: string }
        ownerName: { type: string }
        targetStart: { type: string, format: date, nullable: true }
        targetEnd: { type: string, format: date, nullable: true }
    RankingUpdateRequest:
      type: object
      required: [expectedRevision, projectIds]
      properties:
        expectedRevision:
          type: integer
          format: int64
          description: The ranking's revision the client's list was read at (`RoadmapView.revision`); a `409` when the ranking was written at a later revision, or the value is above the current plan revision.
        projectIds:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: integer, format: int32, minimum: 0 }
          description: The COMPLETE ranking in order, best first. Projects not listed become unranked.
    RankingResponse:
      type: object
      required: [revision]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The plan revision after this write, which is also the ranking's new revision (the next `expectedRevision`).

    TeamOrderUpdateRequest:
      type: object
      required: [expectedRevision, milestoneIds]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
          description: The team's order revision the client's list was read at (`order.revision` of the team view); a stale one is a `409`.
        milestoneIds:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: integer, format: int32, minimum: 0 }
          description: >-
            The listed milestones of the team in execution order, first first - every one an ACTIVE milestone of THIS team. The team's
            milestones not listed follow them in the default order (the project rank). An empty list resets the order to the project rank.
    TeamOrderResponse:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, format: int64, minimum: 0, description: The plan revision after this write - the team's order revision from now on. }

    ProblemDetail:
      type: object
      description: RFC 7807 problem detail. Served as `application/problem+json`; instance is the request path without query parameters.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          default: about:blank
          description: >-
            A URI reference identifying the problem type; `about:blank` unless a problem names its own (`urn:astrolabe:problem:stale-revision` on a stale ranking, milestone-schedule or team-order PUT, `urn:astrolabe:problem:dependency-cycle` on a dependency that would close a cycle).
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference of the specific occurrence (the request path).
        cycle:
          type: array
          items: { $ref: '#/components/schemas/ProblemCycleNode' }
          description: >-
            RFC 7807 extension member, present only on `urn:astrolabe:problem:dependency-cycle`: the cycle the refused link would
            close, as entities in order with the first node repeated last. Every other problem omits it.
    ProblemCycleNode:
      type: object
      required: [kind, id, name]
      properties:
        kind: { $ref: '#/components/schemas/EndpointKind' }
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }

    TelemetryCurrent:
      type: object
      required: [generatedAt, sampleIntervalSeconds, processes, storage, requests]
      properties:
        generatedAt: { type: integer, format: int64, description: Epoch millis }
        sampleIntervalSeconds: { type: integer, format: int32, description: The cadence of the raw samples; also the `requests` window. }
        processes:
          type: array
          items: { $ref: '#/components/schemas/TelemetryProcess' }
        storage:
          allOf: [{ $ref: '#/components/schemas/TelemetryStorage' }]
          nullable: true
          description: The newest storage measurement; null until the cluster section has taken one.
        requests: { $ref: '#/components/schemas/TelemetryRequests' }
    TelemetryProcess:
      type: object
      description: One sampling process (a JVM run) with its latest raw sample.
      required: [id, role, instance, startedAt, lastSeenAt, sampledAt, stale, version, commit, memory, jvm]
      properties:
        id: { type: integer, format: int32 }
        role: { type: string, description: 'The process role; `app`.' }
        instance: { type: string, description: The pod or host name. }
        startedAt: { type: integer, format: int64, description: Epoch millis of the JVM start }
        lastSeenAt: { type: integer, format: int64, description: Epoch millis of the latest sample tick }
        sampledAt: { type: integer, format: int64, nullable: true, description: The bucket of the sample the figures come from; null when none is retained. }
        stale: { type: boolean, description: No sample for more than three sample intervals. }
        version: { type: string, nullable: true, description: The image build version (null outside the image). }
        commit: { type: string, nullable: true, description: The image build commit (null outside the image). }
        memory: { $ref: '#/components/schemas/TelemetryMemory' }
        jvm: { $ref: '#/components/schemas/TelemetryJvm' }
    TelemetryMemory:
      type: object
      description: Bytes; a figure the process could not measure is null.
      required:
        - heapUsedBytes
        - heapCommittedBytes
        - heapMaxBytes
        - oldGenPeakBytes
        - nonHeapBytes
        - directBytes
        - rssBytes
        - cgroupCurrentBytes
        - cgroupAnonBytes
        - workingSetBytes
        - cgroupPeakBytes
        - containerLimitBytes
        - percentOfLimit
      properties:
        heapUsedBytes: { type: integer, format: int64, nullable: true }
        heapCommittedBytes: { type: integer, format: int64, nullable: true }
        heapMaxBytes: { type: integer, format: int64 }
        oldGenPeakBytes: { type: integer, format: int64, nullable: true, description: The old generation's peak over the latest sample interval. }
        nonHeapBytes: { type: integer, format: int64, nullable: true }
        directBytes: { type: integer, format: int64, nullable: true }
        rssBytes: { type: integer, format: int64, nullable: true }
        cgroupCurrentBytes: { type: integer, format: int64, nullable: true }
        cgroupAnonBytes: { type: integer, format: int64, nullable: true }
        workingSetBytes: { type: integer, format: int64, nullable: true, description: '`memory.current - inactive_file`: what the kubelet evicts on.' }
        cgroupPeakBytes: { type: integer, format: int64, nullable: true, description: The cgroup's LIFETIME peak. }
        containerLimitBytes: { type: integer, format: int64, nullable: true }
        percentOfLimit:
          type: number
          format: double
          nullable: true
          description: '`workingSetBytes` over `containerLimitBytes`, in percent (one decimal; may exceed 100); null without a limit or a working set.'
    TelemetryJvm:
      type: object
      required: [cpuRatio, threads, gcCount, gcTimeMs, poolAcquired, poolIdle, poolPending, poolAllocated]
      properties:
        cpuRatio: { type: number, format: double, nullable: true, description: Process CPU time over wall time as a fraction of the available processors (0..1). }
        threads: { type: integer, format: int32, nullable: true }
        gcCount: { type: integer, format: int64, nullable: true, description: 'Collections over the latest sample interval, all collectors summed.' }
        gcTimeMs: { type: integer, format: int64, nullable: true, description: 'Collection time over the latest sample interval, all collectors summed.' }
        poolAcquired: { type: integer, format: int32, nullable: true }
        poolIdle: { type: integer, format: int32, nullable: true }
        poolPending: { type: integer, format: int32, nullable: true }
        poolAllocated: { type: integer, format: int32, nullable: true }
    TelemetryStorage:
      type: object
      required: [measuredAt, databaseBytes, schemas]
      properties:
        measuredAt: { type: integer, format: int64, description: Epoch millis of the measurement's bucket }
        databaseBytes: { type: integer, format: int64, description: '`pg_database_size`.' }
        schemas:
          type: array
          items: { $ref: '#/components/schemas/TelemetrySchemaSize' }
    TelemetrySchemaSize:
      type: object
      required: [name, bytes]
      properties:
        name: { type: string, description: 'public or ops (telemetry''s own cost).' }
        bytes: { type: integer, format: int64, description: "Heap, TOAST and indexes of the schema's tables." }
    TelemetryRequests:
      type: object
      required: [windowSeconds, percentileWindowSeconds, measuredAt, total, routes]
      properties:
        windowSeconds: { type: integer, format: int32, description: The window of the counts - the latest sample interval. }
        percentileWindowSeconds:
          type: integer
          format: int32
          description: The window p50 and p95 cover - the sample interval capped at 300 s (the request timers' reservoir), so it can be shorter than `windowSeconds`.
        measuredAt: { type: integer, format: int64, nullable: true, description: The sample bucket the figures describe; null when no live process has a sample. }
        total: { $ref: '#/components/schemas/TelemetryRouteStats' }
        routes:
          type: array
          maxItems: 15
          items: { $ref: '#/components/schemas/TelemetryRouteStats' }
    TelemetryRouteStats:
      type: object
      description: One route (or `*`, every `/api/` route except the telemetry's own and the probes) over the latest sample interval.
      required: [route, count, p50Ms, p95Ms, serverErrors, rateLimited]
      properties:
        route: { type: string, description: 'The normalised route (`/api/v1/users/{id}`) or `*`.' }
        count: { type: integer, format: int64, minimum: 0 }
        p50Ms: { type: number, format: double, nullable: true, description: Null when nothing was served. }
        p95Ms: { type: number, format: double, nullable: true, description: Null when nothing was served. }
        serverErrors: { type: integer, format: int64, minimum: 0, description: 5xx responses. }
        rateLimited: { type: integer, format: int64, minimum: 0, description: 429 responses. }
    TelemetryHistory:
      type: object
      required: [group, range, bucketSeconds, from, to, historyFrom, truncated, series]
      properties:
        group: { type: string, enum: [memory, storage, requests, jvm] }
        range: { type: string, enum: [24h, 7d, 90d] }
        bucketSeconds: { type: integer, format: int32, description: The width of a point's bucket. }
        from: { type: integer, format: int64, description: Epoch millis of the range start (the first bucket may begin up to one bucket earlier). }
        to: { type: integer, format: int64, description: Epoch millis of the read }
        historyFrom: { type: integer, format: int64, description: The oldest instant the range can actually hold data for. }
        truncated: { type: boolean, description: 'More series matched than were returned (40).' }
        series:
          type: array
          maxItems: 40
          items: { $ref: '#/components/schemas/TelemetrySeries' }
    TelemetrySeries:
      type: object
      description: One chart line; `points` are the buckets that hold data, ascending, at most 400.
      required: [key, metric, label, role, unit, kind, points]
      properties:
        key: { type: string, description: 'Unique within the response (`<role>:<metric>:<label>`, empty parts left out).' }
        metric: { type: string, description: 'The metric name (`mem.heap_used`, `http.p95`, ...).' }
        label: { type: string, description: 'A route, a GC collector or a schema; empty when the metric has none.' }
        role: { type: string, nullable: true, description: 'The process role a `memory` / `jvm` series merges (`app`); null for cluster-wide and `requests` series.' }
        unit: { type: string, enum: [BYTES, MILLISECONDS, COUNT, RATIO] }
        kind:
          type: string
          enum: [GAUGE, DELTA, PERCENTILE]
          description: A DELTA point's `avg` is the bucket's total; for the others it is the n-weighted mean.
        points:
          type: array
          maxItems: 400
          items: { $ref: '#/components/schemas/TelemetryPoint' }
    TelemetryPoint:
      type: object
      required: [t, avg, max]
      properties:
        t: { type: integer, format: int64, description: Epoch millis of the bucket start }
        avg: { type: number, format: double }
        max: { type: number, format: double }

