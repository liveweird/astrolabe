        An owner on the project's chain (the project's own owner included) or ADMIN; `404` before `403` before the body. It is
        created unscheduled for every caller; dates enter only through `PUT /milestones/{id}/schedule`. `teamId` must name an
        active team (`400` "Unknown or deleted team ids: N"); `estimateMd` must be finite, `0 <= x < 1000000` with at most two
        decimals (`400`). The name must be unique among the active milestones of this project, case-insensitively (`409`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
