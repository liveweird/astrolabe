        '204':
          description: Replaced
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [teams]
      operationId: deleteCapacityPeriod
      summary: Delete a capacity period (soft)
      description: |
        ADMIN or the period's team's ACTIVE manager, read-before-guard (`404`, then `403`). Soft delete: the start date is free for a new
        period; the weeks it covered fall back to the previous period (or to "no capacity" before the team's first one).
