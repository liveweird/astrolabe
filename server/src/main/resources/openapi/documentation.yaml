              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/milestones:
    get:
      tags: [plan]
      operationId: listMilestones
      summary: List milestones
      description: >-
        Lists the active milestones whose project, program and work stream are active, each with its `projectName`. Any
        authenticated user. Paged; sortable by `id` (default, also the tiebreaker), `name`, `createdAt`, `updatedAt`,
        `projectName`, `teamName`, `rankPosition` (the project's place in the global rank) and `startDate`; the last two put
        their nulls (an unranked project, an unscheduled milestone) after every value, ascending or descending. Filters,
        combined with AND: `name` (case- and accent-insensitive substring), `scheduled`, `teamId`, `projectId`, `programId`
        and `workStreamId`; an id that names no active node matches nothing (an empty page, never `404`). A malformed or
        repeated filter is `400`. A project's own milestones are read through the project view.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/NameQuery'
        - name: scheduled
          in: query
          required: false
          schema: { type: boolean }
          description: Strictly `true` or `false`. `true` lists the scheduled milestones, `false` the ones without dates.
        - name: teamId
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0 }
          description: Only the milestones of this team.
        - name: projectId
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0 }
          description: Only the milestones of this project.
        - name: programId
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0 }
          description: Only the milestones of the projects of this program.
        - name: workStreamId
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0 }
          description: Only the milestones of the projects of this work stream's programs.
      responses:
        '200':
          description: A page of milestones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestonePage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/milestones/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [plan]
      operationId: getMilestone
      summary: Get a milestone
      description: Any authenticated user. `404` when the milestone, or its project, program or work stream, is deleted.
      responses:
        '200':
          description: The milestone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [plan]
      operationId: updateMilestone
      summary: Replace a milestone's plan fields
      description: >-
        Replaces a milestone's name, description, team and estimate; the dates never change here (`PUT .../schedule`). An owner on
        the project's chain (the project's own owner included) or ADMIN; a team manager who owns nothing on the chain gets `403`.
        `404` before `403` before the body. A change of team keeps the dates, so the new team's manager inherits the bar, and
        drops the milestone from the old team's milestone order. The team must be active and the estimate valid (`400`); a name
        clash within the project is `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [plan]
      operationId: deleteMilestone
      summary: Delete a milestone (soft)
      description: >-
        Soft-deletes a milestone and frees its name in the project; it leaves its team's timeline and milestone order. An owner on
        the project's chain (the project's own owner included) or ADMIN; `404` before `403`. Every active dependency with this
        milestone at either end is deleted with it, in the same write.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/milestones/{id}/schedule:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [plan]
      operationId: scheduleMilestone
      summary: Set or clear a milestone's dates
      description: >-
        Sets or clears a milestone's dates. ADMIN or the active manager of the milestone's team; the project's owner alone gets
        `403`. `404` before `403` before the body, and a manager revoked while the request waits gets `403`, not `409`.
        `startDate` and `endDate` are both set or both null (`400` otherwise); both null unschedules and clears the pin, while
        rescheduling keeps it. Dates are inclusive, the end not before the start, and the span must hold a working day: Monday to
        Friday and not a public holiday (`400` "A milestone must cover at least one working day"); a milestone that later loses
        its last working day to a new holiday keeps its dates. `expectedRevision` is the plan revision of the client's view; the
        write is `409` `urn:astrolabe:problem:stale-revision` only when this milestone's schedule was written at a later revision
        or the value is above the current plan revision, so unrelated plan writes never stale it; a negative value is `400`. The
        answer carries the new plan revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestoneScheduleRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The schedule was written; the body carries the new plan revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`expectedRevision` is stale for THIS milestone (`type` is `urn:astrolabe:problem:stale-revision`)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/milestones/{id}/pin:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [plan]
      operationId: pinMilestone
      summary: Pin or unpin a milestone's dates for the auto-proposal
      description: >-
        Pins or unpins a milestone's dates for the schedule proposal: a pinned milestone is fixed (its dates stand, its load is
        booked and its dates bound its successors; `POST /teams/{id}/schedule-proposal` lists the pinned ids). The pin is advice,
        not a lock: a schedule write still moves the milestone and keeps the pin; an unschedule clears it. Who may pin is who may
        set the dates: ADMIN or the active manager of the milestone's team, the project's owner alone gets `403`. `404` before
        `403` before the body, and a manager revoked while the request waits gets `403`. Pinning an unscheduled milestone is `409`
        `urn:astrolabe:problem:milestone-unscheduled` with nothing written; unpinning one is a no-op. Idempotent, with no
        `expectedRevision`, and it never stales a schedule write. Every accepted PUT, a no-op one included, bumps the plan
        revision; the answer carries it. A proposal read before a pin flipped is refused when accepted (`409` `stale-scope`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MilestonePinRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The pin was written; the body carries the new plan revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 'The milestone is unscheduled and cannot be pinned (`type` is `urn:astrolabe:problem:milestone-unscheduled`)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/projects/{id}/dependencies:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [plan]
      operationId: createDependency
      summary: Link a milestone or project to this project or one of its milestones
      description: >-
        Creates a dependency whose successor (the constrained side, which waits for the predecessor) is project `{id}` or one of
        its active milestones (`400` otherwise). An owner on this project's chain (the project's own owner included) or ADMIN; the
        predecessor's owner and team managers are asked nothing. `404` before `403` before the body. The predecessor is any active
        milestone or project, in this or another project (`400` "Unknown or deleted milestone ids: N" or "... project ids: N").
        `type` is FS (the successor starts after the predecessor finishes), SS (starts after it starts), FF (finishes after it
        finishes) or SF (finishes after it starts); `lagDays` are working days, negative = a lead, -365 to 365 (`400` outside;
        default 0). Linking an endpoint to itself is `400`. `409` with nothing written: the endpoints are already linked (one
        active link per unordered pair, any type and direction), or the link would close a cycle on the start/end time-point
        graph, a project containing its milestones (`type` `urn:astrolabe:problem:dependency-cycle`; `cycle` names the entities,
        the first repeated last). A violated link only warns and never moves a date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependencyCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new dependency (`/api/v1/dependencies/{id}`)
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The two endpoints are already linked (either direction), or the link would close a cycle (`type` is
            `urn:astrolabe:problem:dependency-cycle` and `cycle` lists the entities)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/dependencies/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [plan]
      operationId: getDependency
      summary: Get a dependency
      description: |
        Any authenticated user. Both ends are resolved (a project's dates are its DERIVED span, null while nothing in it is
        scheduled). `404` when the dependency, or either end's project, program or work stream, is deleted.
      responses:
        '200':
          description: The dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [plan]
      operationId: updateDependency
      summary: Change a dependency's type and lag
      description: >-
        Replaces a link's `type` and `lagDays`, both required, with the create's ranges; the ends are not editable (delete and
        add). An owner on the successor's project chain (that project's own owner included) or ADMIN; the predecessor's owner is
        asked nothing. `404` before `403` before the body. A changed `type` re-runs the cycle check without this link's old edge:
        `409` `urn:astrolabe:problem:dependency-cycle` (`cycle` names the entities, the predecessor first, repeated last), nothing
        written. A lag-only change cannot close a cycle, and there is no duplicate-pair `409`. An unchanged PUT is `204` too.
        Every accepted PUT, a no-op one included, bumps the plan revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependencyUpdateRequest'
      responses:
        '204':
          description: Updated (or unchanged)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The new type would close a cycle (`type` is `urn:astrolabe:problem:dependency-cycle` and `cycle` lists the entities)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [plan]
      operationId: deleteDependency
      summary: Delete a dependency (soft)
      description: >-
        Soft-deletes a link; its ordered pair is free to link again. An owner on the successor's project chain (that project's own
        owner included) or ADMIN; `404` before `403`. The predecessor's owner may not delete a link another project depends on.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/plan:
    get:
      tags: [plan]
      operationId: getPlanView
      summary: The whole plan tree with the caller's actions
      description: >-
        Answers the whole plan tree: every active work stream with its programs and projects, open work streams first and then closed
        ones, each level by name. Any authenticated user. Every node carries `can`, the actions this caller may take, computed by the
        rules the writes enforce. `revision` is the plan revision read before the rows.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The plan tree
          headers:
            ETag: { $ref: '#/components/headers/ViewETag' }
            Cache-Control: { $ref: '#/components/headers/ViewCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanView'
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/home:
    get:
      tags: [plan]
      operationId: getHomeView
      summary: The plan's figures and the caller's own items
      description: >-
        Answers the plan's figures (`plan`, the same for every caller, each figure another view's own) and the caller's own items
        (`me`). Any authenticated user; no parameter (an unknown query name is ignored). `me` is what the active person linked to the
        caller's login may manage through the owner chain, plus the teams that person manages, administrators included; it is `null`
        when the login has no active linked person. Each list of `me` holds at most 100 rows (`truncated` says one was cut).
        `revision` is the plan revision read before the rows; the view offers no write, so there is no `can`.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The home document
          headers:
            ETag: { $ref: '#/components/headers/ViewETag' }
            Cache-Control: { $ref: '#/components/headers/ViewCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeView'
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/team-load:
    get:
      tags: [plan]
      operationId: getTeamLoadView
      summary: Every team with its milestones and the weeks it flags
      description: >-
        Answers every active team with its milestone counts and the weeks the team view flags, the same for every caller. Any
        authenticated user; no parameter (an unknown query name is ignored). Teams come by name (case-insensitive, then id), at most
        200 (`truncated`); `totals` always count every team, and `totals.overloadedTeams` and `totals.wipExceededTeams` are
        `plan.overloadedTeams` and `plan.wipExceededTeams` of `GET /views/home`. Every figure is the team view's own (`GET
        /views/team/{id}`). Each row lists its `warningWeeks`; the document lists at most 2,000 in all, handed out from
        `currentWeekStart` on first (`warningWeeksTruncated`), and the counts never change with the cut. `revision` is the plan
        revision read before the rows; there is no `can`.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The team-load document
          headers:
            ETag: { $ref: '#/components/headers/ViewETag' }
            Cache-Control: { $ref: '#/components/headers/ViewCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamLoadView'
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/dependencies:
    get:
      tags: [plan]
      operationId: getDependencyListView
      summary: Every dependency of the plan, the ones that do not hold first
      description: >-
        Answers every active dependency whose two ends resolve to a project, the ones that do not hold first, the same for every
        caller except each row's `can`. Any authenticated user; no parameter (an unknown query name is ignored). Rows come in the
        project view's order (violated first, the largest shortfall first, then OK, then unscheduled; the successor's name, the
        predecessor's name case-insensitively, then id), at most 1,000 (`truncated`; the cut drops the tail of that order). `totals`
        always count every link, and `totals.violated` is `plan.conflicts` of `GET /views/home`. A row names its ends by kind and id;
        `projects`, `teams` and `milestones` hold exactly what the listed rows name, once each, so every reference resolves. The check
        is the project view's, on working days. `revision` is the plan revision read before the rows; there is no document-level
        `can`.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The dependency list document
          headers:
            ETag: { $ref: '#/components/headers/ViewETag' }
            Cache-Control: { $ref: '#/components/headers/ViewCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyListView'
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/project/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [plan]
      operationId: getProjectView
      summary: One project with its milestones, the derived span and its drift
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/BaselineQuery'
      description: >-
        Answers one project with its milestones, derived span and drift, dependencies, idle gaps and critical-path upstream, in one
        document bounded by that project. Any authenticated user; `404` when the project, its program or its work stream is deleted,
        for every caller. Milestones are split into `scheduled` (the timeline rows) and `unscheduled` (the tray). `can` blocks are the
        actions this caller may take, by the rules the writes enforce. `dependencies` are every active link with an end in this
        project, checked on the working-day calendar and ordered so the conflicts come first; a violated link only warns, nothing is
        ever moved. The critical path is derived from the planned dates over the whole active plan graph. Nodes bound to a Jira item
        carry `jira` and flags, as `GET /views/roadmap` describes. `revision` is the plan revision read before the rows. With
        `?baseline=N` the document gains `baseline` (`ProjectBaseline`).
      responses:
        '200':
          description: The project view
          headers:
            ETag: { $ref: '#/components/headers/ViewETag' }
            Cache-Control: { $ref: '#/components/headers/ViewCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectView'
        '304': { $ref: '#/components/responses/NotModified' }
        '400':
          description: >-
            Malformed request (an id, or `baseline`, that is not a non-negative integer; a repeated `baseline`), or `baseline` names an
            unknown or deleted baseline (`type` `urn:astrolabe:problem:unknown-baseline`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/team/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [plan]
      operationId: getTeamView
      summary: One team's milestones, weekly load against capacity, and WIP
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/BaselineQuery'
        - $ref: '#/components/parameters/CriticalChainQuery'
      description: >-
        Answers one team's milestones, its weekly load against capacity and WIP, its dependencies and idle gaps, in one document
        bounded by that team. Any authenticated user; `404` when the team is deleted, for every caller. `scheduled` (the timeline
        rows) and `unscheduled` (the tray) both come in the team's effective order (`order`). `weeks` holds the load, capacity and WIP
        of each ISO week, at most 520; an overloaded week and one over the WIP limit are warnings only, nothing is ever moved.
        `team.can` and each dependency's `can` are the actions this caller may take, by the rules the writes enforce. `dependencies`
        are the project view's links with an end among the team's milestones. Milestones carry the critical-path figures toward their
        own project's end and the Jira flags of `GET /views/roadmap`. `revision` is the plan revision read before the rows; the team's
        order revision is `order.revision`. With `?baseline=N` the document gains `baseline` (`TeamBaseline`); with
        `?criticalChain=true`, `criticalChain` (`TeamCriticalChain`), the chain's members of other teams.
      responses:
        '200':
          description: The team view
          headers:
            ETag: { $ref: '#/components/headers/ViewETag' }
            Cache-Control: { $ref: '#/components/headers/ViewCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamView'
        '304': { $ref: '#/components/responses/NotModified' }
        '400':
          description: >-
            Malformed request (an id, or `baseline`, that is not a non-negative integer; a repeated `baseline`), or `baseline` names an
            unknown or deleted baseline (`type` `urn:astrolabe:problem:unknown-baseline`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/programs:
    get:
      tags: [plan]
      operationId: getProgramsView
      summary: The plan tree with derived spans, flag roll-ups and each project's roadmap row
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/BaselineQuery'
        - $ref: '#/components/parameters/CriticalPathQuery'
      description: >-
        Answers the plan tree with derived spans, flag roll-ups and each project's roadmap row, read in one snapshot. Any
        authenticated user. `workStreams` lists every active work stream, open before closed, each level by name (case-insensitive)
        then id; empty programs and work streams are present. A program's `projects` are the roadmap's project rows, ranked projects
        first in rank order, then the unranked by name and id; `teams` and `links` are `GET /views/roadmap`'s for the same plan. A
        program's `span` is derived from its projects' spans and a work stream's from its programs'; `flags` roll the projects'
        WARNING and INFO flags (Jira and Flow ones included) up. `revision` is the plan revision, informational: no write consumes it.
        With `?baseline=N` the document gains `baseline` blocks; with `?criticalPath=N` it gains `criticalPath`, the block `GET
        /views/roadmap?criticalPath=N` answers for the same plan. The two combine and change nothing else.
      responses:
        '200':
          description: The programs view
          headers:
            ETag: { $ref: '#/components/headers/ViewETag' }
            Cache-Control: { $ref: '#/components/headers/ViewCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramsView'
        '304': { $ref: '#/components/responses/NotModified' }
        '400':
          description: >-
            Malformed request (an id, `baseline` or `criticalPath` that is not a non-negative integer; a repeated `baseline` or
            `criticalPath`), `baseline` names an unknown or deleted baseline (`type` `urn:astrolabe:problem:unknown-baseline`), or
            `criticalPath` names an unknown or deleted project (a plain `400`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/roadmap:
    get:
      tags: [roadmap]
      operationId: getRoadmapView
      summary: The global project ranking with spans, flags and rolled-up links
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/BaselineQuery'
        - $ref: '#/components/parameters/CriticalPathQuery'
      description: >-
        Answers the global project ranking: `ranked` in position order (dense 1..n) and `unranked`, the active projects without a
        position, by name. Any authenticated user. Each project carries its program, work stream and owner, its `teamIds`, its derived
        `span`, the `drift` of that span against its target window and its `flags`. `teams` are the active teams with milestones in
        the plan, by name; `links` roll the dependencies up per ordered project pair, by (predecessor, successor) project id (links
        inside one project are not listed). `can.editRank` and each project's `can.editTargetWindow` say whether this caller may `PUT
        /roadmap/ranking` and `PUT /projects/{id}/target-window`. `revision` is the ranking's revision (the plan revision at which the
        rank was last written), read before the rows; send it back as `expectedRevision`. Plan writes elsewhere do not move it. With
        `?baseline=N` the document gains `baseline` blocks; with `?criticalPath=N`, `criticalPath`.
      responses:
        '200':
          description: The ranking
          headers:
            ETag: { $ref: '#/components/headers/ViewETag' }
            Cache-Control: { $ref: '#/components/headers/ViewCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapView'
        '304': { $ref: '#/components/responses/NotModified' }
        '400':
          description: >-
            Malformed request (`baseline` or `criticalPath` that is not a non-negative integer, or repeated), `baseline` names an
            unknown or deleted baseline (`type` `urn:astrolabe:problem:unknown-baseline`), or `criticalPath` names an unknown or deleted
            project.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/deviations:
    get:
      tags: [jira]
      operationId: getDeviationsView
      summary: Where the plan and the bound Jira items disagree
      description: >-
        Answers where the plan and the bound Jira items disagree: one item per binding with its listed deviation lines, from one
        read-only snapshot. Any authenticated user. `connections` lists every active connection, bound or not, enabled or not. Only
        bindings of an active connection and of a live node (it and every ancestor active) are listed, those of a disabled connection
        included. By default only OPEN bindings (at least one listed line without a current acknowledgement) are listed; `all=true`
        adds the others, and `projectId` or `teamId` make `all` default to true (an explicit `all=false` is respected). Order:
        bindings with an open WARNING line first, then work stream, program, project, level (program, project, milestone) and name
        (case-insensitive), then binding id; at most 2,000 items (`truncated`), `totals` computed before the cap. Filters are equality
        (`teamId` matches milestone bindings only); a repeated key or a malformed value is `400`. Acknowledge with the bindings'
        `POST`/`DELETE .../acknowledge`, echoing an item's `fingerprint`.
      parameters:
        - $ref: '#/components/parameters/ConnectionIdQuery'
        - $ref: '#/components/parameters/LevelQuery'
        - name: severity
          in: query
          required: false
          description: >-
            Lists the bindings with a line of this severity in the selected status: an open line by default and under
            `acknowledged=false`, a currently acknowledged one under `acknowledged=true`, any listed line under `all=true` without
            `acknowledged`. The listed binding still shows every line.
          schema: { $ref: '#/components/schemas/Severity' }
        - name: kind
          in: query
          required: false
          description: >-
            Lists the bindings with a line of this kind in the selected status, as `severity` does (so open + `END_DIFFERS` does not
            list a binding whose End line is acknowledged). `ESTIMATE_NOT_COMPARABLE` is listed, as a line, only when named here or
            under an explicit `all=true`, never through the `all` that `projectId` or `teamId` imply.
          schema: { $ref: '#/components/schemas/DeviationKind' }
        - name: workStreamId
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0 }
        - name: programId
          description: The program, its projects and milestones.
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0 }
        - name: projectId
          description: The project and its milestones.
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0 }
        - $ref: '#/components/parameters/TeamIdQuery'
        - name: all
          in: query
          required: false
          schema: { type: boolean }
          description: Also list bindings with no deviation and acknowledged ones. Strictly `true` or `false`; defaults to true when `projectId` or `teamId` is given.
        - name: acknowledged
          in: query
          required: false
          schema: { type: boolean }
          description: >-
            `true` lists only the bindings with at least one currently acknowledged line, `false` the open ones (and, under `all`, the clean
            ones). Strictly `true` or `false`; absent, the default lists the open bindings. A repeated key is a `400`.
      responses:
        '200':
          description: The deviations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviationView'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/jira-links:
    get:
      tags: [jira]
      operationId: getJiraLinksView
      summary: Which programs and projects are linked to which Jira items, and through which connections
      description: >-
        Answers which programs and projects are linked to which Jira items, through which connections, from one read-only snapshot; no
        deviation is computed. Any authenticated user; no parameter (an unknown query name is ignored). It adds nothing to what `GET
        /integrations/jira/bindings` and `connections[]` of `GET /views/deviations` show every login, and hides what they hide: a
        binding of a deleted node, of a node under a deleted ancestor or of a deleted connection. `connections` lists every active
        connection, enabled or not, by name (case-insensitive) then id. `links` lists one entry per active binding of an active
        connection on a live program or project, programs first, then projects, each by node id; a link through a disabled connection
        is listed (its connection says `enabled: false`), a milestone binding never. At most 2,000 links (`truncated`). There is no
        `revision` and no `can`: links are not plan state.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The connections and the links
          headers:
            ETag: { $ref: '#/components/headers/ViewETag' }
            Cache-Control: { $ref: '#/components/headers/ViewCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraLinksView'
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/capacity-deviations:
    get:
      tags: [flow]
      operationId: getCapacityDeviationsView
      summary: Where a linked team's capacity in the plan differs from what Flow would make it carry
      description: >-
        Answers, per linked team and per current or future sprint, where the team's capacity in the plan differs from what the
        capacity import would make it carry, from one read-only snapshot. Any authenticated user; Flow's figures and the connection's
        time zone are open to every login, a base URL, token or account id never. No `revision`. A sprint is compared over its
        working days; a closed sprint never appears, nor one the import skips or longer than 60 calendar days. Linked teams with a deviation are listed, by default only OPEN rows (not currently acknowledged); `all=true` adds the
        acknowledged ones and `teamId` makes `all` default to true. A disabled, failed or stale connection's teams are read from its last
        mirror. A team whose sprint snapshot is incomplete is listed too, as PENDING (`sprintsComplete: false`, no rows,
        never "in line"); the `severity`, `kind` and `acknowledged=true` filters leave it out. Order: teams with an open WARNING
        first, then team name (case-insensitive), then link id; a team's rows by the sprint's first held day, then sprint id. At most
        1,000 teams (`truncated`); `totals` precede the cap. Filters are equality; a repeated key or a malformed value is `400`.
      parameters:
        - $ref: '#/components/parameters/ConnectionIdQuery'
        - $ref: '#/components/parameters/TeamIdQuery'
        - name: severity
          description: Lists only the sprint rows of this severity, so a team with none is not listed.
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Severity' }
        - name: kind
          description: Lists only the sprint rows of this kind, so a team with none is not listed.
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CapacityDeviationKind' }
        - name: all
          in: query
          required: false
          schema: { type: boolean }
          description: Also list the acknowledged rows. Strictly `true` or `false`; defaults to true when `teamId` is given. A repeated key is a `400`.
        - name: acknowledged
          in: query
          required: false
          schema: { type: boolean }
          description: >-
            `true` lists only the rows whose acknowledgement is current, `false` those without a current one. Strictly `true` or `false`;
            absent, the default lists the open rows. A repeated key is a `400`.
      responses:
        '200':
          description: The capacity deviations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityDeviationView'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/views/baseline/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [plan]
      operationId: getBaselineView
      summary: The comparison of one baseline with the plan now, or with a second baseline
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - name: against
          in: query
          required: false
          schema: { type: integer, format: int32, minimum: 0 }
          description: >-
            A second active baseline to compare the path baseline ("then") with instead of the live plan ("now"); absent, the
            comparison is with the live plan and the document has no `against`. `400` for a repeated or non-integer value; the path
            baseline's own id and an unknown or deleted id (`type` `urn:astrolabe:problem:unknown-baseline`) are `400` too, after the
            path baseline's own `404`.
      description: >-
        Compares one baseline with the plan now, or with a second baseline (`?against=N`). Any authenticated user; `404` when the
        baseline is unknown or soft-deleted (the views' `?baseline=` answers `400` instead, because there the id is a query value the
        caller held). `projects` is the union of the baseline's and the live projects (`ADDED` for a project newer than the baseline,
        `REMOVED` for one that is gone); `milestones` lists only the changed rows; `totals` count every row. Movement is measured in
        working days on the current calendar, positive = later. Under `?against=N` the "now" side is N's frozen rows: the fields named
        `live`, `rankNow` and `span` read them, `ADDED` means in N only and `REMOVED` in the path baseline only. `revision` is the
        plan revision read first; the baseline equals the plan at `baseline.planRevision`, so an equal `revision` shows no plan movement.
        `links` and `capacity` compare the links and the teams' capacity periods the baseline froze with the same "now" side; each
        is `captured: false` for a baseline taken before baselines froze them. Capacity is team data outside the plan revision: an
        equal `revision` does not mean the `capacity` block is empty.
      responses:
        '200':
          description: The comparison
          headers:
            ETag: { $ref: '#/components/headers/ViewETag' }
            Cache-Control: { $ref: '#/components/headers/ViewCacheControl' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineView'
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/roadmap/ranking:
    put:
      tags: [roadmap]
      operationId: replaceRoadmapRanking
      summary: Replace the global project ranking
      description: >-
        Replaces the global project ranking wholesale: the listed projects get positions 1 to n in the given order and every other
        project becomes unranked. ADMIN or a holder of `ROADMAP_EDITOR`; every other caller gets `403` before the body is read.
        `expectedRevision` is the ranking's revision (`RoadmapView.revision`, or the previous answer); the write is `409`
        `urn:astrolabe:problem:stale-revision`, nothing written, only when the ranking was written at a later revision (another
        ranking PUT, or the delete of a ranked project) or the value is above the current plan revision, so a plan write elsewhere
        never stales it. `400` for an id listed twice, unknown or of a deleted project, or more than 1000 ids. Every accepted PUT,
        one that keeps the order included, bumps the plan revision by one; the answer carries it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RankingUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The ranking was replaced; the body carries the new plan revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`expectedRevision` is stale (`type` is `urn:astrolabe:problem:stale-revision`)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/milestone-order:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [plan]
      operationId: replaceTeamMilestoneOrder
      summary: Replace a team's milestone order
      description: >-
        Replaces a team's milestone order wholesale: the listed milestones get positions 1 to n, the team's other milestones
        follow in the default order (the project rank), and an empty list resets to the default. The positions are the team's own
        and absolute: a later project-rank change never reorders them. ADMIN or the team's active manager; `404` for an unknown or
        deleted team before the `403`, then the body (a forbidden caller's malformed body is `403`); the guard is re-checked under
        the write, so a manager cleared meanwhile gets `403`, nothing written. `expectedRevision` is this team's order revision
        (`order.revision` of the team view), so no other write stales it; `409` `urn:astrolabe:problem:stale-revision`, nothing
        written, when it is below the stored one or above the current plan revision (a team never ordered accepts any value up to
        the plan revision). `400` for an id listed twice, naming no milestone, a deleted one or one of another team, more than
        1000 ids, or a negative `expectedRevision`. Every accepted PUT, one that keeps the order included, bumps the plan revision
        by one; the answer carries it, now the team's order revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamOrderUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The order was replaced; the body carries the new plan revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamOrderResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`expectedRevision` is stale for THIS team''s order (`type` is `urn:astrolabe:problem:stale-revision`)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/milestone-schedules:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [plan]
      operationId: scheduleTeamMilestones
      summary: Schedule several of a team's milestones at once (the batch accept)
      description: >-
        Schedules several of a team's milestones at once: N schedule PUTs in one plan write; milestones not listed keep their
        dates. ADMIN or the team's active manager; `404` for an unknown or deleted team before the `403`, then the body (a
        forbidden caller's malformed body is `403`). A malformed batch is `400` before anything is written. `expectedRevision`
        above the current plan revision is `409` `urn:astrolabe:problem:stale-revision` for the whole batch. With a proposal's
        `scopeHash` it is that proposal's accept: `409` `urn:astrolabe:problem:stale-scope` for the whole batch when the team's
        plan changed since the proposal or a team milestone outside the batch was scheduled after `expectedRevision`; without it
        there is no scope check. Each item is decided in body order and the first matching `reason` skips it while the rest are
        written (`NO_WORKING_DAY`: no working day on the current holiday calendar). The guard is re-checked under the write: a
        manager cleared meanwhile is `403`, nothing written. The batch bumps the plan revision by one, an all-skipped one
        included, and answers it as `revision`, the next `expectedRevision`. An item that unschedules a pinned milestone clears
        its pin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamScheduleBatchRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The batch was applied; the body lists the written and the skipped milestones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamScheduleBatchResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            `expectedRevision` is above the current plan revision (`type` is `urn:astrolabe:problem:stale-revision`), or the team's plan
            changed since the proposal `scopeHash` names - a changed holiday dictionary only when it changes an accepted date (`type` is
            `urn:astrolabe:problem:stale-scope`); nothing was written
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/schedule-proposal:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [plan]
      operationId: proposeTeamSchedule
      summary: Propose a schedule for a team's not-yet-started milestones (a computation, nothing is stored)
      description: >-
        Computes a schedule proposal for a team's movable milestones: nothing is written and the plan revision does not move.
        Accepted moves go to `POST /teams/{id}/milestone-schedules` with this `revision` as `expectedRevision`. ADMIN or the
        team's active manager; `404` for an unknown or deleted team before the `403`, then the body (a forbidden caller's
        malformed body is `403`), then `asOf` `400`. `asOf` is the viewer's calendar day: a milestone of the team is movable when
        unscheduled or starting after it; started, pinned and every other team's milestones are fixed. Movable milestones are
        placed greedily in the team's milestone order (custom, else the project rank), after their dependencies, on the earliest
        working days that fit: the duration is the estimate over the capacity share (capacity over the WIP limit, the whole
        capacity when there is none), every day within capacity and the WIP limit, on the public-holiday calendar. Days without a
        capacity period, or on hold, take no work; a 0 man-day milestone takes one working day and counts toward the WIP limit. A
        link into another team's fixed milestone that the placement breaks is not avoided but listed in `dependencies` as
        `VIOLATED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleProposalRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The proposal; nothing was changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleProposal'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/schedule-proposals:
    post:
      tags: [plan]
      operationId: proposeCrossTeamSchedule
      summary: Propose a schedule over several teams at once (a computation, nothing is stored)
      description: >-
        Computes ONE schedule proposal over a set of teams (`teamIds`) instead of one team with every other team's dates fixed;
        nothing is written and the plan revision does not move. ADMIN or the active manager of every listed team. Order, because
        the team set is in the body: the body decodes first (`400` even for a caller who would be refused), `teamIds` shape `400`
        (one to 50, none twice), every listed team active else `404` for every caller (naming the missing ids), `403` unless the
        caller manages every listed team, then `asOf` `400`. Teams are placed in dependency order (a team holding a link's
        predecessor before the one holding its successor; a cycle is broken by the team with the most movable milestones, then by
        name), each by the per-team rules with the teams placed so far held fixed, and the round repeats until a pass changes
        nothing an earlier-placed team reads, at most five times. `passes` is the number made; `settled` is false when the limit
        was hit (the last pass's dates stand and the links still failing are in `dependencies`). Pinned milestones are fixed
        everywhere. A run over one team equals that team's proposal, its `scopeHash` apart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrossTeamProposalRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The run; nothing was changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossTeamProposal'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/schedule-proposals/accept:
    post:
      tags: [plan]
      operationId: acceptCrossTeamSchedule
      summary: Accept a cross-team run - schedule several teams' milestones at once (ONE plan write, ONE bump)
      description: >-
        Accepts a cross-team run: schedules the ticked moves of every team of the run, N schedule PUTs in one plan write, one
        revision bump. ADMIN or the active manager of every team in `teamIds`. Order, as for the run: the body decodes first (a
        malformed body, a missing `scopeHash` included, is `400` even for a caller who would be refused), `teamIds` shape `400`,
        every listed team active else `404` for every caller (naming the missing ids), `403` unless the caller manages every
        listed team, then the rest of the shape `400` before any write (a forbidden caller's malformed items stay `403`).
        Re-checked under the write: a team deleted meanwhile is `404`, a manager cleared meanwhile `403`, nothing written. `409`
        for the whole request, nothing written: `expectedRevision` above the plan revision
        (`urn:astrolabe:problem:stale-revision`); or the run's `scopeHash` no longer matches what the run read, or a milestone of
        a listed team that is not an item was scheduled after `expectedRevision` (`urn:astrolabe:problem:stale-scope`). Otherwise
        each item is decided in body order by the batch's rules, the first matching `reason` skipping it; an item that unschedules
        a pinned milestone clears its pin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrossTeamAcceptRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The accept was applied; the body lists the written and the skipped milestones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamScheduleBatchResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            `expectedRevision` is above the current plan revision (`type` is `urn:astrolabe:problem:stale-revision`), or the run's plan
            changed since the proposal `scopeHash` names - a changed holiday dictionary only when it changes an accepted date (`type` is
            `urn:astrolabe:problem:stale-scope`); nothing was written
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/schedule-proposals/check:
    post:
      tags: [plan]
      operationId: checkCrossTeamSchedule
      summary: Check the link verdicts and the weekly load for the ticked subset of a proposal (a computation, nothing is stored)
      description: >-
        Computes which dependency links would be violated, and how loaded each week would be, if only the given `items` were
        accepted: the ticked subset of a proposal. Nothing is written and the plan revision does not move. ADMIN or the active
        manager of every team in `teamIds`; order as for the run: the body decodes first (`400` even for a caller who would be
        refused), `teamIds` shape `400`, every listed team active else `404` for every caller (naming the missing ids), `403`
        unless the caller manages every listed team, then the rest of the shape `400` (a forbidden caller's malformed items stay
        `403`); a milestone that is not an active milestone of a listed team is `400` too. Each listed team's dates are its stored
        dates with exactly the items applied (an item without dates removes the milestone's); every other milestone keeps its
        stored dates, so a successor ticked without its predecessor is judged against the predecessor's stored dates. There is no
        `asOf`. The verdicts are the proposal's own, so the answer for a proposal's dates equals its `weeks` and `dependencies`;
        items an accept would skip (`STALE`, `NO_WORKING_DAY`) are not anticipated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCheckRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The verdicts; nothing was changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleCheckResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/schedule-proposals/teams:
    get:
      tags: [plan]
      operationId: listScheduleProposalTeams
      summary: List the teams the caller may include in a cross-team run
      description: >-
        Lists the active teams the caller may name in a cross-team run: every active team for an ADMIN, otherwise the teams the
        caller currently manages (none = an empty list). Any authenticated caller. The first 1,000 teams by case- and accent-insensitive name,
        then id. `truncated` indicates more eligible teams. The run itself still answers `403` for any team the caller may not manage.
      responses:
        '200':
          description: The teams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalTeamList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/saved-schedule-proposals:
    get:
      tags: [plan]
      operationId: listSavedScheduleProposals
      summary: List the saved cross-team proposals
      description: >-
        Lists the saved proposals, newest first (at most 20; ANY save removes the oldest, whoever saved it). Any authenticated user
        may read them. A saved proposal holds names, dates and load that every login reads in the plan, but also the run's OUTPUT
        (proposed dates, unplaced reasons, the post-check, the ticks, the saver and when), which `POST /schedule-proposals` refuses
        a caller who manages none of its teams; team names stay as saved until the proposal is evicted or deleted. A bounded
        `{items}` set, not paged, without the proposals' documents. `can.delete` is the caller's right to delete that proposal
        (ADMIN, or the active manager of every team it names).
      responses:
        '200':
          description: The saved proposals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedProposalList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [plan]
      operationId: saveScheduleProposal
      summary: Save a cross-team run (the server's own re-computation, nothing of the plan changes)
      description: >-
        Saves the run named by `teamIds` and `asOf` as the server computes it now, with the ticked moves (`selectedMilestoneIds`);
        no client document is stored. Not plan state: no revision bump, no milestone moves, no accept. ADMIN or the active manager of
        every listed team. Rate limited per user (10 a minute, spent first): `429`. Order, because the team set is in the body: the
        body decodes (`400`), `teamIds` shape `400`, every listed team active else `404` for every caller (naming the ids), `403`
        unless the caller manages every one, then the rest of the shape `400`. Then, in one transaction, the guard again once the
        save's lock is won (`403`), and `409`, nothing stored: `expectedRevision` above the plan revision
        (`urn:astrolabe:problem:stale-revision`), or the plan the run read changed (`urn:astrolabe:problem:stale-scope`); a team
        deleted meanwhile is `404`; a selected id that is not a move of the run is `400`. The newest 20 proposals are kept: any save
        removes the older ones, whoever saved them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedProposalSaveRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Saved; `Location` points at the new proposal
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedProposalSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            `expectedRevision` is above the current plan revision (`type` is `urn:astrolabe:problem:stale-revision`), or the plan the
            run read changed (`type` is `urn:astrolabe:problem:stale-scope`); nothing was stored
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/saved-schedule-proposals/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [plan]
      operationId: getSavedScheduleProposal
      summary: Get a saved cross-team proposal with its state
      description: >-
        Any authenticated user; `404` for an unknown id. `state` is derived at read, never stored: `CURRENT` while the plan still
        matches what the run read, `CHANGED` otherwise (a listed team gone included), `UNREADABLE` when the proposal was stored in
        a shape this server no longer reads (then `proposal` and `check` are null). `check` is the stored check of the ticked moves
        and is null when every move was ticked. `can.accept` is the caller's right to accept it (ADMIN, or the active manager of
        every listed team) while it is `CURRENT`; the accept itself is `POST /schedule-proposals/accept` and re-checks everything.
      responses:
        '200':
          description: The saved proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedProposalRecord'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [plan]
      operationId: deleteSavedScheduleProposal
      summary: Delete a saved cross-team proposal
      description: >-
        Removes the proposal (a hard delete; nothing of the plan changes). ADMIN or the active manager of every team the proposal
        names, as stored: a missing id is `404` for every caller, then `403` for anyone else.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/public-holidays:
    get:
      tags: [calendar]
      operationId: listPublicHolidays
      summary: List the public holidays
      description: >-
        Lists the public holidays in date order. Any authenticated user. A bounded `{items}` list (ADMIN-curated, about 14 rows a
        year), not paged. The dates are the days nobody works: every working-day figure and the schedule writes skip them.
      responses:
        '200':
          description: The public holidays
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicHolidayList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [calendar]
      operationId: createPublicHoliday
      summary: Add a public holiday
      description: >-
        Adds a public holiday. ADMIN only; a non-admin's malformed body is still `403`. One holiday per date: a date the
        dictionary already holds is `409`. An accepted write bumps the plan revision by one and stales no client write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicHolidayCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new holiday
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicHolidayResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/public-holidays/apply-preset:
    post:
      tags: [calendar]
      operationId: applyHolidayPreset
      summary: Add a preset's public holidays for a year
      description: >-
        Adds the holidays of a preset's set for a year that the dictionary does not hold yet (`POLISH`: the statutory days, fixed
        dates plus the Easter-based ones; Sunday-only days such as Easter Sunday are stored too). ADMIN only, guarded before the
        body decodes. The preset projects today's statute onto any year in 1900-2999 and does not model when a day became (or
        stopped being) a statutory holiday, so applying it to a past year adds days that were then working days; the ADMIN removes
        any that do not apply. Idempotent: a date that already has a holiday keeps it, its name too, and is listed in `skipped`.
        Bumps the plan revision by one even when nothing was added. An unknown `preset` or a `year` outside 1900-2999 is `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HolidayPresetRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The holidays added and the dates skipped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayPresetResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/public-holidays/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    delete:
      tags: [calendar]
      operationId: deletePublicHoliday
      summary: Remove a public holiday
      description: >-
        Removes a public holiday (a hard delete: the date is free to be added again). ADMIN only, `403` before the `404`, so a
        probe learns nothing about which ids exist. An accepted delete bumps the plan revision by one.
      responses:
        '204':
          description: Removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/baselines:
    get:
      tags: [plan]
      operationId: listBaselines
      summary: List the baselines
      description: >-
        Lists the active baselines, newest first (`createdAt`, then `id`, both descending). Any authenticated user. A bounded
        `{items, can}` set (at most 100), not paged. `can.manage` is the caller's right to take, rename and delete baselines
        (ADMIN or `ROADMAP_EDITOR`).
      responses:
        '200':
          description: The active baselines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [plan]
      operationId: createBaseline
      summary: Take a baseline
      description: >-
        Takes a baseline: a named, immutable copy of the plan's dated structure at one plan revision, every active milestone
        (name, project, team, estimate, dates) and every active project (name, program, work stream, target window, rank position,
        derived span), every active link (the end ids, type, lag) and every active capacity period of every active team;
        holidays and team orders are not copied. ADMIN or a holder of `ROADMAP_EDITOR`;
        every other caller gets `403` before the body is read. Bumps the plan revision by one; the answer's `planRevision` is the
        revision it left behind, which the plan then equals. `409`, nothing written: `urn:astrolabe:problem:baseline-limit` when
        100 baselines are already active; a plain `409` when another active baseline has the name (case-insensitively).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaselineCreateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new baseline
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The name is taken by another active baseline, or the limit of 100 active baselines is reached (`type` is `urn:astrolabe:problem:baseline-limit`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/baselines/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [plan]
      operationId: getBaseline
      summary: Get a baseline
      description: Any authenticated user. `404` for an unknown or deleted baseline.
      responses:
        '200':
          description: The baseline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [plan]
      operationId: updateBaseline
      summary: Rename / re-describe a baseline
      description: >-
        Replaces a baseline's name and description (omitted = none); the frozen rows never change. ADMIN or a holder of
        `ROADMAP_EDITOR`; `403` before the body and before the `404`. Bumps the plan revision by one. `409` when another active
        baseline has the name (case-insensitively).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaselineUpdateRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [plan]
      operationId: deleteBaseline
      summary: Delete a baseline (soft)
      description: >-
        Soft-deletes a baseline: its name is free to reuse and it reads as `404` everywhere. ADMIN or a holder of
        `ROADMAP_EDITOR`; `403` before the `404`. Bumps the plan revision by one.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/telemetry/current:
    get:
      tags: [telemetry]
      operationId: getTelemetryCurrent
      summary: Astrolabe's own vital signs - processes, storage, request latency
      description: >-
        The app's own vital signs. ADMIN only, read-only; both telemetry reads share one per-user bucket of 30 requests a minute
        (`429`). `processes` lists each sampling process (role `app`) with its latest raw sample: every live process, or the newest
        stale one when none is alive (a stopped process stays visible for a day); `stale` means no sample for more than three sample
        intervals. A figure the process could not measure is null, never zero. `storage` is the newest database and per-schema size
        (null before the first measurement). `requests` covers the latest sample interval of the live processes: the `*` total and the
        15 busiest routes. `sync` is always present: whether this process runs the scheduler, its tick, and every active connection with
        its derived `SyncStatus`; it carries no site, email or token.
      responses:
        '200':
          description: The current figures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryCurrent'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/telemetry/history:
    get:
      tags: [telemetry]
      operationId: getTelemetryHistory
      summary: The trend of one telemetry section over 24 hours, 7 days or 90 days
      description: >-
        The trend of one telemetry section. ADMIN only (`403` outranks `400`), read-only; `group` and `range` are both required. Bucket
        width: `24h` the raw sample interval (widened to a whole multiple of it when that would exceed 400 points), `7d` one hour, `90d`
        six hours; `bucketSeconds` says which. At most 400 points per series and 40 series (`truncated` when more matched); a series has
        points only for buckets that hold data. `memory` and `jvm` merge the processes of one `role` into one series, so a trend
        survives a restart; `requests` has one series per route across all processes (`role` null) and keeps the `*` total (count, p50,
        p95, 5xx, 429) and the ten busiest routes of the range (count, p50, p95); `storage` is cluster-wide (`role` null). `historyFrom`
        is the oldest instant the range can hold: the first sampler boot, or the retention limit.
      parameters:
        - name: group
          in: query
          required: true
          schema: { $ref: '#/components/schemas/TelemetryGroup' }
          description: The panel section.
        - name: range
          in: query
          required: true
          schema: { $ref: '#/components/schemas/TelemetryRange' }
          description: How far back the history reaches.
      responses:
        '200':
          description: The series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHistory'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/integrations/jira/connections:
    get:
      tags: [jira]
      operationId: listJiraConnections
      summary: List Jira connections
      description: >-
        Lists Jira connections. ADMIN only, checked before anything is read. Sortable: `id`, `name`, `createdAt`; default `id`
        ascending; no filters. The API token is never returned: each row carries `hasApiToken`. Each row also carries its
        connection's newest run as `lastRun` and its derived sync `status`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of Jira connections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraConnectionPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [jira]
      operationId: createJiraConnection
      summary: Create a Jira connection
      description: >-
        Creates a connection. ADMIN only; a non-admin's malformed body is still `403`. `apiToken` is required, stored encrypted and
        never returned or logged. `siteUrl` is exactly `https://<tenant>.atlassian.net`. A case-insensitive name clash with an
        active connection is `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JiraConnectionRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new connection
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraConnection'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/jira/connections/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [jira]
      operationId: getJiraConnection
      summary: Get a Jira connection
      description: >-
        Returns one connection. ADMIN only, checked before the id lookup, so a non-admin gets `403` whether or not the id exists.
        The API token is never returned.
      responses:
        '200':
          description: The connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraConnection'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [jira]
      operationId: updateJiraConnection
      summary: Update a Jira connection
      description: >-
        Replaces a connection's name, account email, auth scheme, project keys, `enabled` and `pollIntervalMinutes`. ADMIN only,
        checked before the id lookup. An omitted or blank `apiToken` keeps the stored token; a present one rotates it. The site is
        the connection's identity: a different `siteUrl` is `409` (create a new connection), as is a case-insensitive name clash
        with another active connection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JiraConnectionRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [jira]
      operationId: deleteJiraConnection
      summary: Delete a Jira connection (soft)
      description: >-
        Soft-deletes a connection and frees its name; its bindings are unbound and its runs deleted. ADMIN only, checked before the
        id lookup.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/jira/connections/test:
    post:
      tags: [jira]
      operationId: testJiraConnectionAdHoc
      summary: Test a Jira connection that is not (yet) stored
      description: >-
        Probes the Jira site with the credentials in the body (the shape of a create, `apiToken` required) and answers one row per
        endpoint probed. Nothing is stored. ADMIN only, checked before the body decodes; rate limited per IP, 10 a minute by
        default, one bucket shared with the stored-connection test and Peek. Never `502`: a failed probe, an upstream failure and a
        timeout are rows in a `200`. The token is never logged or echoed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JiraConnectionRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The probe rows (and the cloud id once `tenant_info` answered)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraTestResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/jira/connections/{id}/test:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [jira]
      operationId: testJiraConnection
      summary: Test a stored Jira connection
      description: >-
        Probes the site with the stored token and answers one row per endpoint probed. ADMIN only, checked before the id lookup;
        rate limited like the ad-hoc test. Never `502`: a stored token that cannot be decrypted is one failed `stored_token` row
        with code `TOKEN_UNREADABLE` (enter the token again). The outcome is recorded on the connection (`lastTestedAt`,
        `lastTestOk`, `cloudId`), and the field and issue-type discovery is stored whenever both the `field` and `issuetype` probes
        answered, even if another probe failed. `discoveredAt` is the instant of the snapshot now stored; `recorded` is false when
        an edit of the connection raced the test and the result was dropped.
      responses:
        '200':
          description: The probe rows (and the cloud id once `tenant_info` answered)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraTestResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/jira/connections/{id}/discovery:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [jira]
      operationId: getJiraDiscovery
      summary: The stored field and issue-type discovery of a Jira connection
      description: >-
        Returns the snapshot a passing connection test stored: the date, number and recognised fields, the issue types, the
        hierarchy levels and the `markers` the name rules resolved. ADMIN only, checked before the id lookup. `409`
        `urn:astrolabe:problem:jira-not-discovered` before any test has stored a snapshot (both the `field` and `issuetype` probes
        must have answered). A bounded document, not a paged list: at most 2,000 fields and 500 issue types; `fieldsTruncated` says
        the site had more fields.
      responses:
        '200':
          description: The discovery snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraDiscovery'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/jira/connections/{id}/coverage:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [jira]
      operationId: getJiraCoverage
      summary: The coverage summary of a Jira connection (per mapped level)
      description: >-
        Counts, for each mapped plan level, the issues of its hierarchy level in the connection's project keys (`inScope`), those an
        active binding names on the same site (`linked`) and those neither in the Done status category nor linked (`openUnlinked`).
        ADMIN only, checked before the id lookup. Computed from what the runs already stored: nothing is fetched from Jira. Counts
        only, no key, name or summary. `levels` is empty unless `state` is `READY`; `readAt` is when the last successful run
        finished.
      responses:
        '200':
          description: The coverage summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraCoverageResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/jira/connections/{id}/mapping:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [jira]
      operationId: getJiraMapping
      summary: The field mapping of a Jira connection
      description: >-
        Returns the stored, default and effective field mapping. ADMIN only, checked before the id lookup. `mapping` is the document
        last saved (null = never saved), `defaults` what the stored discovery resolves and `effective` the one a run would use
        (`mapping`, else `defaults`). A read never answers `409`: before a discovery `defaults` and `effective` are null. `problems`
        lists why the stored mapping no longer fits the current discovery (empty when it fits).
      responses:
        '200':
          description: The stored, default and effective mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraMappingResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [jira]
      operationId: updateJiraMapping
      summary: Save the field mapping of a Jira connection
      description: >-
        Replaces the field mapping, stored canonical. ADMIN only, checked before the body. The milestone level is required; present
        levels must be strictly decreasing (program above project above milestone); hierarchy levels are 0 or more and each named
        one needs a non-sub-task issue type in the discovery; start and end fields must be `date` fields (a `datetime` is refused),
        the estimate field a `number` field and the Team field the site's `atlassian-team` field; `manDaysPerUnit` is above 0 and at
        most 1000 with at most two decimals. Each violation is `400`. `409` `urn:astrolabe:problem:jira-not-discovered` before any
        discovery (the rules are checked against it). Bindings and observations are not rewritten; the next run reads the mapped
        fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JiraMapping'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Saved
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/jira/connections/{id}/peek:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [jira]
      operationId: peekJiraIssue
      summary: Read one Jira issue through the mapping
      description: >-
        Reads the issue `key` with the stored token through the effective mapping (`mapping`, else `defaults`) and answers its
        system fields, the values the mapping resolves and `raw`, the mapped fields' values as the site sent them. ADMIN only,
        checked before the id lookup; rate limited like the connection test (same bucket). Nothing is stored. `400` for a malformed or
        repeated `key` or a project outside the connection's project keys (a moved issue is judged by its new key); `404` for an
        unknown connection or an issue Jira does not know. `409`: `urn:astrolabe:problem:jira-not-discovered` before a discovery,
        `jira-token-unreadable` for a stored token that cannot be decrypted, `jira-mapping-invalid` for a mapping that no longer
        fits the discovery or cannot be read (same prefix). `502` `urn:astrolabe:problem:jira-upstream` when Jira cannot be reached
        or refuses; the detail names the failure code only.
      parameters:
        - name: key
          in: query
          required: true
          schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,9}-[0-9]{1,10}$', maxLength: 21 }
          description: The Jira issue key, e.g. `ABC-12`.
      responses:
        '200':
          description: The issue read through the mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraPeekResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /api/v1/integrations/jira/connections/{id}/import-preview:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [jira]
      operationId: previewJiraImport
      summary: Preview an import from Jira into one work stream
      description: >-
        Previews importing the connection's Jira scope into one work stream: per Jira item, top-down (programs, projects,
        milestones; Jira ids ascending within a level), whether it would be created, bound to an unbound same-name node, or skipped
        and why. Writes nothing. ADMIN, or an owner of every target the import touches (the defaults, the nodes a row would land
        under or bind to, the work stream when a program would be created; when it touches none, an owner of the work stream or of a node under it); a login that owns no plan node is `403` up front, and
        the `403` names the first target not owned. Order: `429` (per-user bucket, 5 a minute, shared with the apply, spent first),
        `404` connection, `400` body, `404` then `403` for the named targets, `400` shape, `400` connection disabled, `409`
        `urn:astrolabe:problem:jira-token-unreadable`, `jira-not-discovered`, `jira-mapping-invalid` or (with `root`)
        `jira-root-unusable`, `502` `urn:astrolabe:problem:jira-upstream` (detail: the failure code only; `TIMEOUT` past 170
        seconds), `403` for the resolved targets. The read stops at 2,000 issues (`totals.truncated`; an apply refuses a truncated
        scope).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JiraImportScope'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: What the import would do
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraImportPreview'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /api/v1/integrations/jira/connections/{id}/import:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [jira]
      operationId: applyJiraImport
      summary: Apply an import from Jira into one work stream
      description: >-
        Creates the ticked programs, projects and milestones under the picked work stream and binds each to its Jira item, or binds
        an existing unbound same-name node, in one plan write with exactly one revision bump (also when every item is skipped). It
        never updates an existing node; nothing is written to Jira. Rides the preview's per-user bucket (5 a minute, shared with it,
        spent first). ADMIN, or an owner of the target of every ticked CREATE or BIND row; a ticked row whose target the caller does
        not own is `403` for the whole request, nothing written. The checks and their order are the preview's through the browse;
        the items join the `400`s (1 to 2,000, each `jiraId` numeric and named once, every override team and owner active), and a
        browse cut at its caps is `400`. The write re-runs the guards and the connection's state: deleted `404`, disabled or out of
        scope `400`, mapping or discovery changed `409`, ownership revoked `403`. Each item is compared with `expected`; a
        difference, or an item the site no longer holds, is skipped `CHANGED`, never re-homed. A uniqueness violation is `409`.
        `revision` is the plan revision after the bump.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JiraImportApplyRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: What the import wrote and skipped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraImportResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /api/v1/integrations/jira/bindings:
    get:
      tags: [jira]
      operationId: listJiraBindings
      summary: List Jira bindings
      description: >-
        Lists active bindings of live nodes; a binding whose node, or any ancestor of it, was deleted is absent. Any authenticated
        user. Each row carries the node and where it sits, the issue, its browse `url` and the latest observation. Sortable: `id`,
        `createdAt`, `issueKey`; default `id` ascending. Filters: `connectionId` and `level` (equality, `level` by name) and `q`
        (case- and accent-insensitive substring of the node's name, at most 100 characters); a repeated key is `400`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/ConnectionIdQuery'
        - $ref: '#/components/parameters/LevelQuery'
        - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: A page of bindings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraBindingPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [jira]
      operationId: createJiraBinding
      summary: Link a plan node to a Jira issue
      description: >-
        Links a plan node to a Jira issue and stores the issue's first observation. The node's owner chain (the work stream's,
        program's or project's owner; a milestone has its project's chain) or ADMIN; a team manager as such may not. Order: `429`
        (per-user bucket, 30 a minute, spent first), `400` for a body that does not decode (an unknown `level` included), `404` for
        an unknown or deleted node for every caller, `403`, then the body's values (`400`, see the members). `409`
        `urn:astrolabe:problem:jira-not-discovered`, `jira-mapping-invalid` (an administrator must fix it) or
        `jira-token-unreadable` unless the connection is discovered and its mapping, stored or default, fits the site now. `502`
        `urn:astrolabe:problem:jira-upstream` when Jira cannot be reached or refuses (the detail names the failure code only; `BUSY`
        when the outbound permits stayed taken for 5 seconds by default: try again). Bindings are 1:1: `409`
        `urn:astrolabe:problem:already-bound` when the node is linked to another issue or the issue to another node (on any active
        connection of the same site), unless that node was deleted: its binding is then released and the bind goes through. Moves no plan revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JiraBindRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Linked; `Location` points at the new binding
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraBinding'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /api/v1/integrations/jira/bindings/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [jira]
      operationId: getJiraBinding
      summary: Get a Jira binding
      description: >-
        Returns one binding. Any authenticated user. `404` for an unknown or unbound binding and for one whose node, or any ancestor
        of it, was deleted.
      responses:
        '200':
          description: The binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraBinding'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [jira]
      operationId: deleteJiraBinding
      summary: Unlink a plan node from its Jira issue
      description: >-
        Unlinks a node from its Jira issue. A soft delete: the row stays as history and both the node and the issue may be bound
        again. The owner chain of the bound node or ADMIN; `404` before `403`. A binding whose node was deleted since is guarded by
        the chain the node had when it was last stored.
      responses:
        '204':
          description: Unlinked
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/jira/bindings/{id}/acknowledge:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [jira]
      operationId: acknowledgeJiraDeviations
      summary: Acknowledge a binding's deviations until they change
      description: >-
        Acknowledges a binding's deviations until they change. The owner chain of the bound node (the work stream's, program's or
        project's owner; a milestone has its project's chain) or ADMIN; on a milestone binding also the active manager of the
        milestone's team. A manager on a program or project binding, a manager of another team, a roadmap editor, a person-less
        login and a stranger are `403`. Order: `404` for every caller when the binding is unknown or unbound or its node or any
        ancestor was deleted; `403`, whatever the body; `400` unless `fingerprint` is 64 lower-case hexadecimal characters. `409`
        `urn:astrolabe:problem:stale-deviations` when `fingerprint` (always the item's list fingerprint) is not that of the
        deviations now, when the binding has none, or when `kind` names a deviation the list does not hold now. With `kind` that one
        line is acknowledged; without one, the lines with no current acknowledgement (every line when each has one). Acknowledging
        again restamps; a change to a line's deviation reopens that line only. Moves no plan revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acknowledgement'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [jira]
      operationId: unacknowledgeJiraDeviations
      summary: Withdraw a binding's acknowledgement
      description: >-
        Withdraws acknowledgements: with `kind` that line's, without it every stored acknowledgement of the binding (a retired
        kind's included), current or stale alike. The same audience and order as the acknowledge (`404` for every caller when the
        binding is unknown, unbound or its node is gone, then `403`). `404` when none is stored. The `kind` parameter is checked
        after the guard: `400` for an unknown, blank or repeated value and for a query parameter of any other name (a misspelt
        `kinds`).
      parameters:
        - name: kind
          in: query
          required: false
          description: "The deviation whose acknowledgement is withdrawn; absent withdraws every acknowledgement of the binding. A repeated, blank or unknown value is a `400`, and so is any other query parameter name (the request fails closed rather than withdrawing everything)."
          schema: { $ref: '#/components/schemas/DeviationKind' }
      responses:
        '204':
          description: Withdrawn
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/integrations/flow/connections:
    get:
      tags: [flow]
      operationId: listFlowConnections
      summary: List Flow connections
      description: >-
        Lists Flow connections. ADMIN only, checked before anything is read. Sortable: `id`, `name`, `createdAt`; default `id`
        ascending; no filters. The service token is never returned; each row carries `hasApiToken`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: A page of Flow connections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowConnectionPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [flow]
      operationId: createFlowConnection
      summary: Create a Flow connection
      description: >-
        Creates a connection. ADMIN only, checked before the body decodes, so a non-admin's malformed body is still `403`.
        `apiToken` is required, stored encrypted and never returned or logged. `baseUrl` must be one of the origins the server's
        operator allows (`GET /integrations/flow/origins`), in canonical form; a refused `baseUrl` is a `400` that says which rule
        refused it (not canonical: lowercase scheme and host, no default port, path, trailing slash, query or credentials; or a
        well-formed origin that is not on the list) and never quotes the value. `timeZone` is an IANA region id. A case-insensitive
        name clash with an active connection is `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowConnectionRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Created; `Location` points at the new connection
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowConnection'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/flow/connections/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [flow]
      operationId: getFlowConnection
      summary: Get a Flow connection
      description: >-
        Returns one connection. ADMIN only, checked before the id lookup, so a non-admin gets `403` whether or not the id exists.
        The service token is never returned.
      responses:
        '200':
          description: The connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowConnection'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [flow]
      operationId: updateFlowConnection
      summary: Update a Flow connection
      description: >-
        Replaces a connection's name, time zone, `enabled` and polling interval. ADMIN only, checked before the id lookup. An
        omitted or blank `apiToken` keeps the stored token; a present one rotates it. The origin is the connection's identity: a
        different `baseUrl` is `409` (create a new connection), and an origin the operator has since delisted does not stop an
        update. A changed token or time zone clears the last test verdict. A case-insensitive name clash with another active
        connection is `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowConnectionRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Updated
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [flow]
      operationId: deleteFlowConnection
      summary: Delete a Flow connection (soft)
      description: >-
        Soft-deletes a connection and frees its name. ADMIN only, checked before the id lookup. The stored token is destroyed, and
        the connection's runs, its mirror of Flow's teams, sprints and members and its team bindings go with it.
      responses:
        '204':
          description: Deleted
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/flow/connections/test:
    post:
      tags: [flow]
      operationId: testFlowConnectionAdHoc
      summary: Test a Flow connection that is not (yet) stored
      description: >-
        Probes Flow with the credentials in the body (the shape of a create: `apiToken` required, `baseUrl` one of the operator's
        origins) and answers one row per endpoint probed (`me`, then `teams`). Nothing is stored. ADMIN only, checked before the
        body decodes; rate limited per IP (10 a minute by default), in ONE bucket shared with the stored-connection test. Never
        `502`: a failed probe, an upstream failure and a timeout are rows in a `200`. The token travels only in the body and is
        never logged or echoed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowConnectionRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The probe rows (and the size of the teams document once `teams` passed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowTestResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/flow/connections/{id}/test:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [flow]
      operationId: testFlowConnection
      summary: Test a stored Flow connection
      description: >-
        Probes Flow with the stored token and answers one row per endpoint probed. ADMIN only, checked before the id lookup; rate
        limited per IP (10 a minute by default), in ONE bucket shared with the ad-hoc test. Never `502`; a stored token that cannot
        be decrypted is one failed `stored_token` row with code `TOKEN_UNREADABLE` (enter the token again). The verdict is recorded
        on the connection (`lastTestedAt`, `lastTestOk`), and a passing test is what makes the connection pollable; `recorded` is
        false when an edit of the connection raced the test and the result was dropped. A test never writes Flow's data to the
        mirror; only a run does.
      responses:
        '200':
          description: The probe rows (and the size of the teams document once `teams` passed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowTestResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/flow/origins:
    get:
      tags: [flow]
      operationId: listFlowOrigins
      summary: The Flow origins a connection may name
      description: >-
        Lists the origins a Flow connection's `baseUrl` may name, so a client can show them before a save is refused: the operator's
        allowed hosts as `https://host[:port]` (443 omitted) and, in development mode only, the insecure origins as
        `http://host[:port]` (80 omitted), distinct and sorted. ADMIN only, checked first. A small operator-curated set, so the
        plain `{items}` wrapper and no paging. An empty list means no Flow origin is configured and every Flow connection would be
        refused.
      responses:
        '200':
          description: The allowed Flow origins
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowOriginList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/flow/teams:
    get:
      tags: [flow]
      operationId: listFlowTeams
      summary: List the Flow teams a connection has mirrored
      description: >-
        Lists the Flow teams an ACTIVE connection (enabled or not) has mirrored, each with its binding, the unique suggestion for an
        unbound one, and counts. Any authenticated user; never a token, a base URL, an account id or a person's name. One unpaged
        document, because Flow itself caps its document at 1,000 teams and the suggestions need every unbound team at once; teams
        come by name (case-insensitive), then id. `404` for an unknown or deleted connection; `400` for a missing, repeated or
        malformed `connectionId`.
      parameters:
        - name: connectionId
          in: query
          required: true
          schema: { type: integer, format: int32, minimum: 0 }
      responses:
        '200':
          description: The connection's mirrored Flow teams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowTeamList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/flow/team-bindings:
    post:
      tags: [flow]
      operationId: createFlowTeamBinding
      summary: Link a team to a Flow team
      description: >-
        Links a team to a Flow team of a connection's mirror. The link calls Flow never and is not plan state. The team's ACTIVE
        manager or ADMIN. Order: the body decodes first, because the team is in it (an undecodable body is `400` before any guard);
        `404` for an unknown or deleted team, for every caller; `403` (another team's manager, a project owner and a stranger are
        refused, whatever the rest of the body holds); then `400` for an unknown, deleted or disabled connection and for a Flow team
        that is not in its mirror. Links are 1:1 both ways: `409` `urn:astrolabe:problem:already-bound` when the team is already
        linked to a Flow team (on any connection) or the Flow team is already linked to another team, unless that team was deleted,
        in which case its link is released and the new one goes through.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowTeamBindRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '201':
          description: Linked; `Location` points at the new binding
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowTeamBinding'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/flow/team-bindings/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    delete:
      tags: [flow]
      operationId: deleteFlowTeamBinding
      summary: Unlink a team from its Flow team
      description: >-
        Unlinks a team from its Flow team. The binding's team's ACTIVE manager or ADMIN. Order: `404` for every caller when the
        binding is unknown or already unlinked or its team was deleted; then `403`. A soft delete: the team and the Flow team are
        free to be linked again. The capacity periods the team imported from Flow stay, now the manager's data.
      responses:
        '204':
          description: Unlinked
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/flow/team-bindings/{id}/capacity-preview:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [flow]
      operationId: previewFlowCapacityImport
      summary: Preview importing a bound Flow team's sprint capacity
      description: >-
        Previews importing mirrored sprints into the bound team's capacity periods from one read-only snapshot. It makes no Flow call. The
        binding's team's ACTIVE manager or ADMIN. Order: `404` for every caller when the binding is unknown or unlinked or its team
        was deleted; `403`; then `400` for an undecodable body or a malformed or out-of-range `from`. A sprint's man-days are spread
        over its working days (public holidays off), so the weekly capacity adds up to Flow's figure within rounding: `mdPerWeek =
        round2(5 x flowMd / workingDays)`, one period per sprint from its `effectiveFrom`. Each sprint is `CREATE`, `UPDATE`,
        `UNCHANGED`, `MANUAL_PERIOD` (a hand-entered period starts on that day and is never changed) or `SKIP` with a `reason`.
        `from` (default: today in the connection's time zone) is the first day the import is about: a sprint that ended before it is
        closed, listed only with `includeClosed` and never ticked. An absent team (`observedAt` null) or incomplete sprint snapshot
        answers an empty plan. A disabled connection still previews a complete snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapacityPreviewRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: The plan; nothing was stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityPreview'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/flow/team-bindings/{id}/capacity-import:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [flow]
      operationId: applyFlowCapacityImport
      summary: Apply the ticked rows of a capacity-import preview
      description: >-
        Applies the rows ticked in a capacity-import preview to the team's capacity periods. The binding's team's ACTIVE manager or
        ADMIN; the order is the preview's: `404` for every caller when the binding is unknown or unlinked or its team was deleted,
        `403`, then `400` for the body (at most 2,000 `items` and 2,000 `removals`; a sprint or a period named twice is refused).
        The guard is re-run under the team's lock, so a manager cleared while the request waited is `403` and nothing is written
        (`404` if the team was deleted meanwhile). Team data, not plan state: no plan revision moves, and Flow is never called. The
        plan is recomputed from the mirror as it is now, with the echoed `from` and `includeClosed`. An item is written only when
        that plan still says what its `expected` says, a removal only when its period is a Flow-sourced removal of that plan;
        otherwise the row is `skipped` with the reason `CHANGED`. An incomplete snapshot skips every row. A `MANUAL` period is never
        changed. Writes run removals first (soft delete), then updates (the figure, sprint id and sprint name; the WIP
        limit is kept), then creates (a `FLOW` period on `effectiveFrom`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapacityApplyRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: What was written and what was left alone; a skipped row is data, not an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityApplyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/flow/team-bindings/{id}/acknowledge:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [flow]
      operationId: acknowledgeCapacityDeviation
      summary: Acknowledge ONE sprint's capacity deviation until its figures change
      description: >-
        Acknowledges ONE sprint's capacity deviation until its figures change; `sprintId: null` names the team's own `TEAM_GONE`
        row. The binding's team's ACTIVE manager or ADMIN, as for the import; any other caller (a project owner, a roadmap editor,
        another team's manager) is `403`. Order: `404` for every caller when the binding is unknown or unlinked or its team was
        deleted; `403`, whatever the body; `400` unless `sprintId` is present (`null` allowed, else a positive number) and
        `fingerprint` is 64 lower-case hexadecimal characters. `409` `urn:astrolabe:problem:stale-deviations` when the binding has
        no such row now (the sprint is in line, closed or outside the window; the team is not gone; the connection never mirrored a
        document; the team's sprint snapshot is incomplete) or the row's fingerprint is not the one sent. Otherwise the fingerprint, time and login are stored (again:
        restamped). A change of the row reopens it (`acknowledgement.current` false); a new sprint arrives open. This call also
        deletes the binding's acknowledgements whose row is no longer listed, as a connection's refresh does; a team missing from
        Flow keeps its sprint acknowledgements. Moves no plan revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapacityAcknowledgeRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityAcknowledgement'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [flow]
      operationId: unacknowledgeCapacityDeviation
      summary: Withdraw ONE sprint's capacity acknowledgement
      description: >-
        Withdraws the acknowledgement of the row named by `sprintId` (absent = the team's own `TEAM_GONE` row), current or stale.
        The same audience and order as the acknowledge: `404` for every caller when the binding is unknown, unlinked or its team is
        gone, then `403`, then the query parameter `400`; then `404` when no acknowledgement is stored for that row.
      parameters:
        - name: sprintId
          in: query
          required: false
          description: "Flow's id of the sprint whose acknowledgement is withdrawn; absent names the team's own `TEAM_GONE` row. A repeated or malformed value is a `400`."
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '204':
          description: Withdrawn
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/flow/team-bindings/{id}/acknowledge-all:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [flow]
      operationId: acknowledgeCapacityDeviations
      summary: Acknowledge several of a team's capacity deviations at once, all or nothing
      description: >-
        Acknowledges several of a team's capacity deviations at once. `items` are the rows the client lists as open, each the
        `sprintId` (`null` = the team's own `TEAM_GONE` row) and the `fingerprint` it read: 1 to 2,000, no row named twice (`400`).
        The audience and the order are the single acknowledge's: `404` for EVERY caller when the binding is unknown, unlinked or its
        team was deleted, then `403` (the binding's team's ACTIVE manager or ADMIN, whatever the body), then the body `400`. All or
        nothing: a named row that is not listed now (an incomplete sprint snapshot lists none), or whose fingerprint is not the one
        sent, is `409` `urn:astrolabe:problem:stale-deviations` and nothing is stored (read the view again). Otherwise every named row is stamped
        with the same time and login, and only the named rows: an open row the request does not name stays open. Rows no longer
        listed are pruned as in the single acknowledge. Moves no plan revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapacityAcknowledgeAllRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '200':
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityAcknowledgeBatch'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/flow/team-bindings/{id}/unacknowledge-all:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [flow]
      operationId: unacknowledgeCapacityDeviations
      summary: Withdraw several of a team's capacity acknowledgements at once, all or nothing
      description: >-
        Withdraws the acknowledgements of several rows at once. `items` are the rows the client lists as acknowledged, each by its
        `sprintId` (`null` = the team's own `TEAM_GONE` row): 1 to 2,000, no row named twice (`400`). The audience and the order are
        the batch acknowledge's: `404` for EVERY caller when the binding is unknown, unlinked or its team was deleted, then `403`,
        then the body `400`. All or nothing: a named row with no stored acknowledgement (never acknowledged, or withdrawn or pruned
        since the client read the list) is `409` `urn:astrolabe:problem:stale-deviations` and nothing is deleted. Otherwise every
        named row's acknowledgement is deleted, current or stale, and only the named rows. Moves no plan revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapacityUnacknowledgeAllRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '204':
          description: Withdrawn
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/flow/connections/{id}/team-bindings/match:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [flow]
      operationId: matchFlowTeams
      summary: Link every Flow team whose name matches exactly one unbound team ("Link all suggested")
      description: >-
        Links every Flow team of the connection's mirror whose name matches exactly one unbound active team. ADMIN only, checked
        first, so a non-admin gets `403` whether or not the connection exists; then `404` for an unknown or deleted connection and
        `400` for a disabled one. No request body. A Flow team is linked when it is not linked yet, and its name (trimmed,
        whitespace collapsed, lowercased; accents count) equals the name of exactly one unbound active team and of no other unlinked
        Flow team; all links are made in one transaction. The rest is reported: `ALREADY_BOUND` or `NO_MATCH`. Nothing to link is a
        `200` with an empty `bound`.
      responses:
        '200':
          description: What was linked and what was left
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowTeamMatch'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/teams/{id}/flow:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [flow]
      operationId: getTeamFlow
      summary: A team's Flow link, roster and sprints
      description: >-
        Returns a team's Flow link: the binding with the connection's name and sync status, the roster read from the mirror (members
        now and former ones, dates in the connection's time zone, half-open `[validFrom, validTo)` intervals) and the sprint
        summary. Any authenticated user, the roster's display names included; `404` for an unknown or deleted team. `binding`,
        `roster` and `sprints` are null for an unlinked team; `roster` and `sprints` are also null when the Flow team is gone from
        the mirror (`binding.gone`). `can` says whether the CALLER may link, unlink and import (ADMIN or the team's manager). It is
        its own read, not a member of the team view, and calls Flow never. `connections` lists every active connection (id, name,
        enabled; at most 100) so a manager can pick one to link through. No account id, email, token or base URL is ever returned.
      responses:
        '200':
          description: The panel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowTeamPanel'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/integrations/sync/runs:
    get:
      tags: [jira]
      operationId: listSyncRuns
      summary: List sync runs
      description: >-
        Lists sync runs, newest first, as a bounded `{items}` list of at most 50 (the registry keeps the last 50 finished runs per
        connection and kind; with no `connectionId`, the 50 newest over all of them). Any authenticated user, since a run names no
        secret. A run still in flight has no `finishedAt` or `outcome`. Filters: `kind` (equality by name, `JIRA` or `FLOW`) and
        `connectionId` (equality; an id belongs to one kind's registry, so pair it with `kind`); a repeated key is a `400`.
      parameters:
        - name: kind
          in: query
          required: false
          schema: { $ref: '#/components/schemas/SyncKind' }
        - $ref: '#/components/parameters/ConnectionIdQuery'
      responses:
        '200':
          description: The runs, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRunList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [jira]
      operationId: requestSyncRun
      summary: Start a sync run now
      description: >-
        Starts a sync run now for one connection of the request's `kind` (`JIRA` or `FLOW`). ADMIN only, checked before the body
        decodes, so a non-admin's malformed body is still `403`. The per-USER bucket allows 10 presses per fixed 60-second window
        per account, both kinds together (a burst across a window edge can admit up to 20): the eleventh answers `429` with
        `Retry-After`, before the guard, and a refused press spends a token too. Scheduled runs and the list are not limited. The
        run is claimed, then `202` answers with its unfinished row while it executes in the background: poll `GET
        /integrations/sync/runs`. A connection that is unknown, deleted or disabled for the `kind` is a `400` on `connectionId`. One
        run per connection and kind at a time: `409` `urn:astrolabe:problem:run-in-progress` while one is unfinished; a run that
        crashed with the process is abandoned (`ABANDONED`) by the first claim after the maximum run time (10 minutes by default),
        so the `409` lasts at most that long. A run only observes: it writes nothing upstream, takes no plan lock and moves no plan
        revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRunRequest'
      responses:
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '202':
          description: Accepted - the run is claimed and executing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRun'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    RetryAfter:
      description: Whole seconds to wait before retrying. Sent by the rate-bucket 429s only, never by an account-lockout 429.
      schema: { type: integer }
    ViewETag:
      description: >-
        The weak validator (`W/"..."`) of this view answer: a hash of the caller's user id and the document exactly as it is sent, so it
        changes whenever the document does and means nothing to another login. Send it back as `If-None-Match`.
      schema: { type: string }
    ViewCacheControl:
      description: >-
        Always `no-store`: no browser or proxy cache may keep the answer. The `ETag` serves a client that sends `If-None-Match` itself
        and keeps the document in its own memory.
      schema: { type: string }

  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string }
      description: >-
        A previously received view `ETag` (or a list of them, or `*`). A weak match answers `304` with no body. Evaluated only after
        authentication, request validation and the view's own `404`/`400`: a refused request is never `304`. The view itself is still
        computed; the `304` saves the transfer.
    ResourceId:
      name: id
      in: path
      required: true
      # int32: ids are 32-bit server-side; a non-numeric or out-of-range id is a 400. Ids are database sequences that
      # start at 1, so 0 never addresses anything (it answers 404, like any unknown id).
      schema: { type: integer, format: int32, minimum: 1 }
    BaselineQuery:
      name: baseline
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 0 }
      description: >-
        The id of an ACTIVE baseline to compare the view with; absent: no comparison. A repeated key or a value that is not a non-negative
        integer is a `400`, as is an id that is unknown or soft-deleted (`type` `urn:astrolabe:problem:unknown-baseline`), answered after
        the view's own rules, so a deleted project or team is still `404`. The comparison is computed in the view's snapshot.
    CriticalChainQuery:
      name: criticalChain
      in: query
      required: false
      schema: { type: boolean }
      description: >-
        Strictly `true` or `false`; `true` adds `criticalChain` to the team view, absent, blank or `false` leaves it out (the document is
        then byte-identical to one without the parameter). A repeated key or another value is a plain `400`, answered before the team's
        `404` and before an unknown baseline's typed `400`.
    CriticalPathQuery:
      name: criticalPath
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 0 }
      description: >-
        The id of an ACTIVE project to show the critical chain toward; absent, or blank (`?criticalPath=`): no `criticalPath` block. A
        repeated key, a value that is not a non-negative integer and an id that is unknown or soft-deleted are a plain `400`. With
        `baseline` also given, its errors come first (malformed `400`; unknown or deleted: the typed `unknown-baseline` `400`).
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: 1-based page index. Defaults to 1.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Rows per page. Defaults to 20, maximum 100.
    NameQuery:
      name: name
      in: query
      required: false
      schema: { type: string }
    EmailQuery:
      name: email
      in: query
      required: false
      schema: { type: string }
    ConnectionIdQuery:
      name: connectionId
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 0 }
    TeamIdQuery:
      name: teamId
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 0 }
    LevelQuery:
      name: level
      in: query
      required: false
      schema: { $ref: '#/components/schemas/PlanLevel' }
    Q:
      name: q
      in: query
      required: false
      schema: { type: string, maxLength: 100 }
      description: >-
        Free-text search: a case- and accent-insensitive substring of the resource's own name, at most 100 characters. A blank value is no
        filter; a repeated key is a `400`.
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string }
      description: |
        Sort spec. Format: `field` (ascending) or `-field` (descending). Multiple fields are
        comma-separated, leftmost wins: `sort=-updatedAt,name`. The endpoint declares its
        sortable-field whitelist; unknown fields are rejected with `400`. `id` ascending is
        always appended as a deterministic tiebreaker.
  responses:
    NotModified:
      description: >-
        The view's `ETag` is listed in `If-None-Match` (weak comparison), or `If-None-Match` is `*` and the view succeeded: the
        document is the one the caller already holds, and there is no body. Carries the same `ETag` and `Cache-Control` as the `200`
        would. (Over HTTP/1.1 the engine adds `Content-Length: 0`.)
      headers:
        ETag: { $ref: '#/components/headers/ViewETag' }
        Cache-Control: { $ref: '#/components/headers/ViewCacheControl' }
    UnsupportedMediaType:
      description: Request body must use application/json. A missing body or Content-Type remains a 400.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Missing, invalid or no longer valid token (revoked, or the account was deleted, demoted or re-credentialed since it was issued)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Caller is not permitted to perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Conflict with an existing resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TooManyRequests:
      description: >-
        Throttled: a per-IP rate-limit bucket or a per-user one (telemetry reads, Jira bind and import, sync runs, password change) is
        exhausted, the account is locked out on `/login`, or the wrong-current-password lock of a password change is active. The body is a
        `ProblemDetail`. Every rate-bucket `429` carries `Retry-After`; the lockout and lock `429`s do not (the wait is not a bucket
        window).
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    PayloadTooLarge:
      description: >-
        Request body exceeds the global 10 MiB ceiling, shared by every endpoint (field-level `maxLength` rules reject oversized values
        far earlier on ordinary payloads). Declared on every operation that takes a body.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    BadGateway:
      description: >-
        The Jira site could not be reached or refused the request (`type` `urn:astrolabe:problem:jira-upstream`; the detail names the failure
        code only, never a URL, a body or a credential).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InternalServerError:
      description: >-
        Unexpected server error. One case has a type of its own: a statement the database did not finish within its time limit (15 seconds
        by default) is cancelled and answers `type` `urn:astrolabe:problem:database-timeout`. That statement's transaction is rolled back,
        but an earlier committed step of the same request stays, so a retry may meet a `409`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    # Named vocabularies: an enum used in two or more places is declared once. A nullable use spells the values again (`Nullable<X>`):
    # the validator reads a nullable enum behind an allOf as non-null. Value order is the wire's.
    PlanLevel:
      type: string
      enum: [PROGRAM, PROJECT, MILESTONE]
    NullablePlanLevel:
      type: string
      nullable: true
      description: A `PlanLevel` or null (the validator reads a nullable enum behind an `allOf` as non-null, so the values are spelled here).
      enum: [PROGRAM, PROJECT, MILESTONE]
    Severity:
      type: string
      enum: [WARNING, INFO]
    SyncKind:
      type: string
      enum: [JIRA, FLOW]
    EstimateUnit:
      type: string
      enum: [POINTS, HOURS, DAYS]
    NullableEstimateUnit:
      type: string
      nullable: true
      description: An `EstimateUnit` or null (the validator reads a nullable enum behind an `allOf` as non-null, so the values are spelled here).
      enum: [POINTS, HOURS, DAYS]
    StatusCategory:
      type: string
      enum: [TODO, IN_PROGRESS, DONE, UNKNOWN]
    TelemetryGroup:
      type: string
      enum: [memory, storage, requests, jvm]
    TelemetryRange:
      type: string
      enum: [24h, 7d, 90d]
    CapacitySource:
      type: string
      enum: [MANUAL, FLOW]
    SyncTrigger:
      type: string
      enum: [MANUAL, SCHEDULED]
    SyncState:
      type: string
      enum: [NEVER_SYNCED, CURRENT, STALE, FAILED, DISABLED]
    JiraAuthScheme:
      type: string
      enum: [BASIC, BEARER]
    JiraImportParentKind:
      type: string
      enum: [EXISTING, NEW_ROW, DEFAULT]
    SyncOutcome:
      type: string
      nullable: true
      enum: [SUCCEEDED, FAILED, ABANDONED]
    SyncFailureCode:
      type: string
      nullable: true
      description: |-
        Why a run failed, or why a test row failed; null when nothing failed. Values are only ever added, never renamed or removed. A newer
        server may write a code an older client's list lacks, and a rolled-back server may serve one a newer version stored (it never
        rewrites or filters a stored code), so a client must tolerate an unknown value.
        The transport and the probes:
        - `AUTHENTICATION_FAILED`: the upstream answered 401 (Jira: a bad or expired token, and a scoped token missing a scope also answers 401, so one failing probe while `myself` passes means a missing scope; Flow: its one uniform 401, the token is revoked, expired or wrong).
        - `FORBIDDEN_SCOPE`: the upstream answered 403.
        - `NOT_FOUND`: the upstream answered 404 (Flow: a Flow older than 1.57.0).
        - `REDIRECT`: the upstream answered a 3xx; redirects are never followed.
        - `INVALID_RESPONSE`: the answer could not be read, had an unexpected shape or status, or carried a page token the guard refused.
        - `LIMIT_EXCEEDED`: a response, an answer or a run passed one of its size or page ceilings.
        - `BUSY`: no outbound slot was free within an interactive request's wait.
        - `TIMEOUT`: the call, the probe, its budget or a browse passed its deadline.
        - `RATE_LIMITED`: the upstream answered 429, or a `Retry-After` crossed the request's budget.
        - `BLOCKED_HOST`: the origin is not allowed (Jira: not a genuine site of the tenant; Flow: no longer on the operator's list of origins).
        - `UPSTREAM_UNAVAILABLE`: the upstream could not be reached or answered 5xx (Flow: an outage).
        - `SKIPPED`: a test row only: the probe did not run because the first probe (`tenant_info` for Jira, `me` for Flow) failed, so `ok` is false with no `status` and no `scopeHint`; read the first failed row.
        The run itself:
        - `RUN_DEADLINE`: the run was cut at its deadline.
        - `SHUTDOWN`: the application stopped while the run was in flight.
        - `INTERNAL`: an unexpected exception; `errorDetail` names its class only.
        - `ABANDONED`: written by a later claim for a run that never finished (its outcome is `ABANDONED`).
        - `CONNECTION_GONE`: the connection was deleted before or during the run.
        - `CONNECTION_DISABLED`: the connection was disabled before or during the run.
        - `TOKEN_UNREADABLE`: the stored token cannot be decrypted; a run, or the `stored_token` test row (enter it again).
        Jira only:
        - `NOT_DISCOVERED`: the connection has not been tested yet, so there is no discovery snapshot.
        - `MAPPING_UNREADABLE`: the stored mapping cannot be read by this version.
        - `MAPPING_INVALID`: the stored mapping no longer fits the site.
        - `PROJECT_NOT_VISIBLE`: a test row only: a configured project key the token cannot see.
        - `CURSOR_EXPIRED`: a search page's token expired and the one restart failed the same way.
        Flow only:
        - `TIME_ZONE_INVALID`: the connection's time zone is not known to this server.
      enum:
        - AUTHENTICATION_FAILED
        - FORBIDDEN_SCOPE
        - NOT_FOUND
        - REDIRECT
        - INVALID_RESPONSE
        - LIMIT_EXCEEDED
        - BUSY
        - TIMEOUT
        - RATE_LIMITED
        - BLOCKED_HOST
        - UPSTREAM_UNAVAILABLE
        - SKIPPED
        - RUN_DEADLINE
        - SHUTDOWN
        - INTERNAL
        - ABANDONED
        - CONNECTION_GONE
        - CONNECTION_DISABLED
        - TOKEN_UNREADABLE
        - NOT_DISCOVERED
        - MAPPING_UNREADABLE
        - MAPPING_INVALID
        - PROJECT_NOT_VISIBLE
        - CURSOR_EXPIRED
        - TIME_ZONE_INVALID
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Always `ok` on a 200 — a failed probe is a problem body, never a status word.
          example: ok
    PasswordResetConfirmRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Single-use 256-bit reset credential from the email; never logged or returned.
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 71
          description: The new password; at most 71 UTF-8 bytes.

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [token, expiresAt, refreshToken, refreshExpiresAt, userId, roles, disabledFeatures, language]
      properties:
        token:
          type: string
          description: "Short-lived access token; send as the `Authorization: Bearer` value."
        expiresAt:
          type: integer
          format: int64
          description: Access-token expiry as Unix epoch milliseconds.
        refreshToken:
          type: string
          description: Longer-lived token; POST to /api/v1/refresh to obtain a fresh pair.
        refreshExpiresAt:
          type: integer
          format: int64
          description: Refresh-token expiry as Unix epoch milliseconds.
        userId: { type: integer, format: int32, minimum: 0 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles of the authenticated user — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'

    UserRole:
      type: string
      enum: [ADMIN]
      description: >-
        An additional role. Every user is implicitly a regular user; the array only ever
        carries privileges added on top of that baseline.

    Feature:
      type: string
      enum: [MFA]
      description: >-
        A per-user gateable feature; a user's set is the DISABLED one. MFA is the one inverted-default flag: users start with it
        disabled (email MFA is opt-in), and it gates only the login.

    Permission:
      type: string
      enum: [ROADMAP_EDITOR]
      description: >-
        A per-user permission; a user's set is the GRANTED one, read on every request. ROADMAP_EDITOR may rank the projects and set
        any project's target window.

    Language:
      type: string
      enum: [en, pl]
      description: >-
        A supported UI and email language. The one per-user language: set at create, changed only by
        `PUT /users/{id}/language`; drives the UI at sign-in and every email sent to the user.

    UserLanguageUpdateRequest:
      type: object
      required: [language]
      properties:
        language:
          $ref: '#/components/schemas/Language'

    UserFeaturesUpdateRequest:
      type: object
      required: [disabledFeatures]
      properties:
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: The complete new DISABLED set — an empty array enables everything.

    UserPermissionsUpdateRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
          description: The complete new GRANTED set - an empty array revokes everything.

    MfaChallengeResponse:
      type: object
      required: [mfaRequired, challengeId, expiresAt]
      properties:
        mfaRequired:
          type: boolean
          description: Always true — the discriminator against LoginResponse in the login 200.
        challengeId:
          type: string
          description: Opaque single-use challenge id; send it back with the emailed code.
        expiresAt:
          type: integer
          format: int64
          description: Challenge (and code) expiry as Unix epoch milliseconds.

    MfaVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code:
          type: string
          description: The 6-digit code from the sign-in email.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Optional refresh token to revoke together with the access token.

    UserCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        password:
          type: string
          minLength: 10
          maxLength: 71
          description: >-
            Client-generated; at most 71 UTF-8 bytes. Never returned.
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles; omitted/empty = a regular user.
        language:
          allOf: [{ $ref: '#/components/schemas/Language' }]
          nullable: true
          description: Create-only (the whole-user PUT never touches it); omitted = en.
        alsoCreatePerson:
          type: boolean
          nullable: true
          description: >-
            Create-only: true also creates a linked person (the login's name and email) in the same
            transaction; omitted or false = the login alone.

    UserUpdateRequest:
      type: object
      required: [name, email, roles]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, maxLength: 254 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }

    UserResponse:
      type: object
      required: [id, name, email, roles, disabledFeatures, language, permissions]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
          description: Additional roles only — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Per-user feature flags — the admin-disabled set; empty = full access.
        language:
          $ref: '#/components/schemas/Language'
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
          description: Per-user permissions - the GRANTED set; empty = none.
        personId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The id of the active person linked to this login, on every read of a user (the create answer included); null when
            none is linked (a deleted person does not count).

    UserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    PasswordUpdateRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 10
          maxLength: 71
          description: The new password (at least 10 characters, at most 71 UTF-8 bytes).
        currentPassword:
          type: string
          description: >-
            Required when the caller changes their OWN password (even an admin); omitted
            for an admin resetting somebody else's.

    PersonCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email:
          type: string
          maxLength: 254
          nullable: true
          description: Optional mailbox; unique among active people when set (case-insensitive). Blank = none.
        userId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The person's login, a user; must be active (`400` otherwise) and not linked to another active person (`409`).
    PersonUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email:
          type: string
          maxLength: 254
          nullable: true
          description: Optional mailbox; unique among active people when set (case-insensitive). Omitted on PUT (a full replace) = none.
        userId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The person's login, a user; must be active (`400` otherwise) and not linked to another active person (`409`). Omitted on PUT (a full replace) = unlinked.
    PersonResponse:
      type: object
      required: [id, name, email, userId, userEmail, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string, nullable: true }
        userId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The person's login; null when unset or when the linked user was soft-deleted.
        userEmail: { type: string, nullable: true, description: The login's email; null with `userId`. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    PersonListItem:
      type: object
      required: [id, name, email, userId, userEmail, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        email: { type: string, nullable: true }
        userId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The person's login; null when unset or when the linked user was soft-deleted.
        userEmail: { type: string, nullable: true, description: The login's email; null with `userId`. }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    PersonPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PersonListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0

    TeamCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        managerPersonId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The team's manager, a person of the people directory; must be active (`400` otherwise).
    TeamUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        managerPersonId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            The team's manager, a person of the people directory; must be active (`400` otherwise). Omitted on PUT (a full replace) = no manager.
    TeamResponse:
      type: object
      required: [id, name, managerPersonId, managerName, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        managerPersonId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The team's manager (a person); null when unset or when the assigned person was soft-deleted.
        managerName: { type: string, nullable: true, description: The manager's name; null with `managerPersonId`. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    TeamListItem:
      type: object
      required: [id, name, managerPersonId, managerName, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        managerPersonId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The team's manager (a person); null when unset or when the assigned person was soft-deleted.
        managerName: { type: string, nullable: true, description: The manager's name; null with `managerPersonId`. }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    TeamPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0

    CapacityPeriodRequest:
      type: object
      required: [effectiveFrom, mdPerWeek]
      properties:
        effectiveFrom:
          type: string
          format: date
          description: >-
            The first day the capacity applies - any calendar day (years 1900-2999, past or future); a weekend date applies from the next
            working day. The week a period starts in counts each working day at the capacity in force that day.
        mdPerWeek:
          type: number
          format: double
          minimum: 0
          description: Man-days per week, `0 <= x < 1000000` with at most two decimals, else `400`; zero = the team is on hold.
        wipLimit:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
          nullable: true
          description: >-
            The most milestones in progress on one working day while this period is in force, `1..99` (`400` otherwise); absent or null =
            no limit. On PUT (a full replace) absent = the limit is cleared.
    CapacityPeriodResponse:
      type: object
      required: [id, teamId, effectiveFrom, mdPerWeek, wipLimit, createdAt, updatedAt, source, flowSprintName]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        teamId: { type: integer, format: int32, minimum: 0 }
        effectiveFrom: { type: string, format: date }
        mdPerWeek: { type: number, format: double, minimum: 0, description: Man-days per week with at most two decimals. }
        wipLimit: { type: integer, format: int32, minimum: 1, maximum: 99, nullable: true, description: Null = no WIP limit. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
        source:
          allOf: [{ $ref: '#/components/schemas/CapacitySource' }]
          description: >-
            Who wrote the period: `MANUAL` (entered by hand) or `FLOW` (imported for a Flow sprint). A `PUT` of a `FLOW` period makes it
            `MANUAL`.
        flowSprintName:
          type: string
          maxLength: 255
          nullable: true
          description: The Flow sprint a `FLOW` period was imported for; null on a `MANUAL` one.
    CapacityPeriodList:
      type: object
      required: [items]
      description: A team's ACTIVE capacity periods in `effectiveFrom` order - a bounded list (a handful per team per year), not paged.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CapacityPeriodResponse'
    PublicHolidayResponse:
      type: object
      required: [id, date, name]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        date: { type: string, format: date }
        name: { type: string, minLength: 1, maxLength: 100 }
    PublicHolidayList:
      type: object
      required: [items]
      description: The whole public-holiday dictionary in date order - a bounded list (ADMIN-curated, about 14 rows a year), not paged.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicHolidayResponse'
    PublicHolidayCreateRequest:
      type: object
      required: [date, name]
      properties:
        date: { type: string, format: date, description: 'The day nobody works: `YYYY-MM-DD`, years 1900-2999, any weekday (a weekend holiday is stored and changes nothing).' }
        name: { type: string, minLength: 1, maxLength: 100, description: Trimmed; a control character is a `400`. }
    HolidayPresetRequest:
      type: object
      required: [preset, year]
      properties:
        preset:
          type: string
          enum: [POLISH]
          description: The holiday set to add.
        year: { type: integer, format: int32, minimum: 1900, maximum: 2999 }
    HolidayPresetResponse:
      type: object
      required: [added, skipped]
      properties:
        added:
          type: array
          description: The holidays this call stored, in date order.
          items:
            $ref: '#/components/schemas/PublicHolidayResponse'
        skipped:
          type: array
          description: The ISO dates of the preset's set that already had a holiday (left untouched, name included), in date order.
          items: { type: string, format: date }
    BaselineCreator:
      type: object
      required: [userId, name]
      description: The login that took a baseline. `name` is the login's linked ACTIVE person's name, else the login's display name (never its email).
      properties:
        userId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
    BaselineResponse:
      type: object
      required: [id, name, description, planRevision, createdAt, createdBy, milestoneCount, projectCount, dependencyCount, capacityPeriodCount]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        planRevision:
          type: integer
          format: int64
          description: The plan revision this baseline EQUALS - the one its creation left behind. A view whose `revision` equals it shows no movement.
        createdAt: { type: integer, format: int64, description: Epoch millis }
        createdBy:
          nullable: true
          description: Null when the login that took the baseline is gone.
          allOf:
            - $ref: '#/components/schemas/BaselineCreator'
        milestoneCount: { type: integer, format: int32, minimum: 0, description: 'The active milestones the baseline captured.' }
        projectCount: { type: integer, format: int32, minimum: 0, description: 'The active projects the baseline captured.' }
        dependencyCount: { type: integer, format: int32, minimum: 0, nullable: true, description: 'The active links the baseline froze; null = taken before baselines froze them: NOT captured (not "no links").' }
        capacityPeriodCount: { type: integer, format: int32, minimum: 0, nullable: true, description: 'The active capacity periods of the active teams the baseline froze; null = NOT captured, like `dependencyCount`.' }
    BaselineList:
      type: object
      required: [items, can]
      description: The active baselines, newest first - a bounded list (at most 100 by the cap), not paged.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BaselineResponse'
        can:
          $ref: '#/components/schemas/BaselineCan'
    BaselineCan:
      type: object
      required: [manage]
      properties:
        manage: { type: boolean, description: 'The caller may take, rename and delete baselines (ADMIN or a `ROADMAP_EDITOR`).' }
    BaselineCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: 'Trimmed; a control character is a `400`. Unique among the active baselines, case-insensitively.' }
        description: { type: string, maxLength: 500, nullable: true }
    BaselineUpdateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: 'Trimmed; a control character is a `400`. Unique among the active baselines, case-insensitively.' }
        description: { type: string, maxLength: 500, nullable: true, description: 'A full replace - omitted clears it.' }
    Movement:
      type: object
      required: [kind, startDays, endDays, estimateDelta]
      description: >-
        What happened to one row since a baseline. `startDays`/`endDays` are signed WORKING days on the CURRENT calendar (positive =
        later) and are non-null only for a row dated on both sides; `estimateDelta` (live minus frozen, man-days) is non-null whenever
        the row exists on both sides, whatever the kind (an estimate change alone leaves the kind `UNCHANGED`).
      properties:
        kind:
          type: string
          enum: [UNCHANGED, MOVED, SCHEDULED, UNSCHEDULED, ADDED, REMOVED]
          description: >-
            `ADDED` = no row in the baseline; `REMOVED` = no live row; `SCHEDULED`/`UNSCHEDULED` = a dated/undated flip; `MOVED` =
            dated on both sides with a non-zero start or end delta; `UNCHANGED` otherwise.
        startDays: { type: integer, format: int32, nullable: true }
        endDays: { type: integer, format: int32, nullable: true }
        estimateDelta: { type: number, format: double, nullable: true }
    MovementTotals:
      type: object
      required: [unchanged, moved, later, earlier, scheduled, unscheduled, added, removed]
      description: The counts of rows by movement kind; `later`/`earlier` are the `moved` rows whose END is later/earlier.
      properties:
        unchanged: { type: integer, format: int32, minimum: 0 }
        moved: { type: integer, format: int32, minimum: 0 }
        later: { type: integer, format: int32, minimum: 0 }
        earlier: { type: integer, format: int32, minimum: 0 }
        scheduled: { type: integer, format: int32, minimum: 0 }
        unscheduled: { type: integer, format: int32, minimum: 0 }
        added: { type: integer, format: int32, minimum: 0 }
        removed: { type: integer, format: int32, minimum: 0 }
    SpanBaseline:
      type: object
      required: [span, movement]
      description: A project's, program's or work stream's span in the baseline and what became of it.
      properties:
        span:
          nullable: true
          description: The derived span then; null when nothing was scheduled.
          allOf:
            - $ref: '#/components/schemas/DateSpan'
        movement:
          $ref: '#/components/schemas/Movement'
    BaselineMilestone:
      type: object
      required: [milestoneId, teamIdThen, start, end, estimateMd, movement]
      description: A live milestone the baseline also froze - the figures it had then and its movement.
      properties:
        milestoneId: { type: integer, format: int32, minimum: 0 }
        teamIdThen: { type: integer, format: int32, minimum: 0, description: The team the milestone sat on in the baseline. }
        start: { type: string, format: date, nullable: true, description: The start then; null = it was unscheduled. }
        end: { type: string, format: date, nullable: true }
        estimateMd: { type: number, format: double, description: 'The estimate then, in man-days.' }
        movement:
          $ref: '#/components/schemas/Movement'
    RemovedMilestone:
      type: object
      required: [milestoneId, projectId, name, teamId, teamName, estimateMd, start, end]
      description: >-
        A milestone the baseline froze that is no longer where the view looks, as it was then. `now` is present only on the team view
        and only when the milestone still exists on another team; absent = it was deleted.
      properties:
        milestoneId: { type: integer, format: int32, minimum: 0 }
        projectId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        teamId: { type: integer, format: int32, minimum: 0, description: The team it sat on in the baseline. }
        teamName: { type: string }
        estimateMd: { type: number, format: double }
        start: { type: string, format: date, nullable: true }
        end: { type: string, format: date, nullable: true }
        now:
          type: object
          required: [teamId, teamName]
          properties:
            teamId: { type: integer, format: int32, minimum: 0 }
            teamName: { type: string }
    ProjectBaseline:
      type: object
      required: [id, name, planRevision, project, milestones, removed]
      description: Present only with `?baseline=N`.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        planRevision: { type: integer, format: int64 }
        project:
          nullable: true
          description: The project's own span then and its movement; null when the project is newer than the baseline.
          allOf:
            - $ref: '#/components/schemas/SpanBaseline'
        milestones:
          type: array
          description: >-
            One entry per live milestone of the project that the baseline also froze (scheduled or in the tray), by id, with its
            movement in working days on the current calendar; a live milestone without an entry is new since the baseline.
          items:
            $ref: '#/components/schemas/BaselineMilestone'
        removed:
          type: array
          description: The baseline's milestones of this project that are gone, by start (undated last), end, name and id.
          items:
            $ref: '#/components/schemas/RemovedMilestone'
    TeamBaseline:
      type: object
      required: [id, name, planRevision, milestones, removed, capacity]
      description: Present only with `?baseline=N`.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        planRevision: { type: integer, format: int64 }
        milestones:
          type: array
          description: >-
            One entry per live milestone of the team that the baseline also froze (whatever team it sat on then - `teamIdThen`), by
            id; a live milestone without an entry is new since the baseline.
          items:
            $ref: '#/components/schemas/BaselineMilestone'
        removed:
          type: array
          description: The baseline's milestones of THIS team that are not on it any more (deleted, or moved - `now`), by start, end, name and id.
          items:
            $ref: '#/components/schemas/RemovedMilestone'
        capacity:
          $ref: '#/components/schemas/BaselineTeamCapacity'
    BaselineTeamCapacity:
      type: object
      required: [captured, periods]
      description: >-
        The viewed team's capacity as the baseline froze it: its periods as ranges, by start. `captured` is false (and `periods`
        empty) for a baseline taken before baselines froze capacity; true with no periods = the team had no capacity then.
      properties:
        captured: { type: boolean }
        periods:
          type: array
          items:
            $ref: '#/components/schemas/BaselineCapacityRange'
    BaselineCapacityRange:
      type: object
      required: [from, to, mdPerWeek, wipLimit]
      description: One stretch of a team's frozen capacity - a period holds from its start to the day before the next one's.
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date, nullable: true, description: 'Inclusive; null = without end (the last period).' }
        mdPerWeek: { type: number, format: double, minimum: 0, description: Man-days per week; zero = on hold. }
        wipLimit: { type: integer, format: int32, minimum: 1, maximum: 99, nullable: true, description: 'Null = no limit.' }
    RemovedProject:
      type: object
      required: [projectId, name, programId, programName, workStreamId, workStreamName, span]
      description: A project the baseline froze that is gone now, with its names and the ids of its program and work stream as they were.
      properties:
        projectId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        programId: { type: integer, format: int32, minimum: 0, description: The program's id then; the program may be gone too. }
        programName: { type: string }
        workStreamId: { type: integer, format: int32, minimum: 0, description: The work stream's id then; the work stream may be gone too. }
        workStreamName: { type: string }
        span:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DateSpan'
    RoadmapBaseline:
      type: object
      required: [id, name, planRevision, removedProjects]
      description: >-
        Present only with `?baseline=N`, on the roadmap and programs documents: the baseline's identity and the projects it froze that
        are gone. Every project row the baseline also froze gains a `baseline` block (`RoadmapProjectBaseline`; a row without one is
        newer than the baseline), and so does a program or work stream with at least one project it froze (`SpanBaseline`).
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        planRevision: { type: integer, format: int64 }
        removedProjects:
          type: array
          description: The baseline's projects that are gone, by work stream, program and name (case-insensitive) then id.
          items:
            $ref: '#/components/schemas/RemovedProject'
    RoadmapProjectBaseline:
      type: object
      required: [span, movement, rankPosition, targetStart, targetEnd]
      description: >-
        A project row against the baseline: the derived span, rank position and target window it had and the span's movement in
        working days on the current calendar. Present only with `?baseline=N` and only for a project the baseline also froze.
      properties:
        span:
          nullable: true
          description: The derived span then; null when nothing was scheduled.
          allOf:
            - $ref: '#/components/schemas/DateSpan'
        movement:
          $ref: '#/components/schemas/Movement'
        rankPosition: { type: integer, format: int32, minimum: 1, nullable: true, description: The rank position then; null = it was unranked. }
        targetStart: { type: string, format: date, nullable: true }
        targetEnd: { type: string, format: date, nullable: true }
    BaselineView:
      type: object
      required: [revision, baseline, totals, projects, milestones, links, capacity]
      properties:
        revision: { type: integer, format: int64, minimum: 0, description: 'The plan revision, read before the rows.' }
        baseline:
          $ref: '#/components/schemas/BaselineResponse'
        against:
          description: 'Present only for `?against=N`: the second baseline ("now"); the `baseline` above is "then".'
          allOf:
            - $ref: '#/components/schemas/BaselineResponse'
        totals:
          type: object
          required: [milestones, projects]
          description: The movement counts over EVERY milestone row and every project row (changed or not).
          properties:
            milestones:
              $ref: '#/components/schemas/MovementTotals'
            projects:
              $ref: '#/components/schemas/MovementTotals'
        projects:
          type: array
          description: The union of the baseline's and the live projects, by work stream, program and name (case-insensitive) then id.
          items:
            $ref: '#/components/schemas/BaselineViewProject'
        milestones:
          type: array
          description: Only the CHANGED milestone rows (any kind but `UNCHANGED`, or a different estimate), in the projects' order, then by start, end, name and id.
          items:
            $ref: '#/components/schemas/BaselineViewMilestone'
        links:
          $ref: '#/components/schemas/BaselineLinks'
        capacity:
          $ref: '#/components/schemas/BaselineCapacity'
    BaselineLinks:
      type: object
      required: [captured, totals, items, truncated]
      description: >-
        The links the baseline froze against the links now (or, under `?against=N`, N's frozen ones), by dependency id. A link is the
        same when its id has the same type and lag on both sides; a link deleted and made again is a `REMOVED` and an `ADDED`.
        `captured` is false (everything else empty or zero: UNKNOWN, not "nothing changed") when the baseline, or with `against` either
        of the two, was taken before baselines froze links.
      properties:
        captured: { type: boolean }
        totals:
          type: object
          required: [added, removed, changed, unchanged]
          description: The counts over EVERY link of either side (changed or not).
          properties:
            added: { type: integer, format: int32, minimum: 0 }
            removed: { type: integer, format: int32, minimum: 0 }
            changed: { type: integer, format: int32, minimum: 0 }
            unchanged: { type: integer, format: int32, minimum: 0 }
        items:
          type: array
          maxItems: 1000
          description: Only the changed links (`added`, `removed` or `changed`), by dependency id, at most 1,000.
          items:
            $ref: '#/components/schemas/BaselineLinkItem'
        truncated: { type: boolean, description: 'More than 1,000 links changed; `items` holds the first 1,000 by id and the totals the whole.' }
    BaselineLinkItem:
      type: object
      required: [dependencyId, change, predecessor, successor, then, now]
      properties:
        dependencyId: { type: integer, format: int32, minimum: 0 }
        change: { type: string, enum: [ADDED, REMOVED, CHANGED] }
        predecessor: { $ref: '#/components/schemas/BaselineLinkEnd' }
        successor: { $ref: '#/components/schemas/BaselineLinkEnd' }
        then:
          nullable: true
          description: The link's terms in the baseline; null for an `ADDED` link.
          allOf:
            - $ref: '#/components/schemas/BaselineLinkTerms'
        now:
          nullable: true
          description: The link's terms now; null for a `REMOVED` link.
          allOf:
            - $ref: '#/components/schemas/BaselineLinkTerms'
    BaselineLinkEnd:
      type: object
      required: [kind, id, name, projectName]
      description: >-
        One end of a changed link. The name is the "now" side's when the end exists there, else the frozen one; `projectName` is the
        project a MILESTONE end belongs to (null for a project end).
      properties:
        kind: { $ref: '#/components/schemas/EndpointKind' }
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        projectName: { type: string, nullable: true }
    BaselineLinkTerms:
      type: object
      required: [type, lagDays]
      properties:
        type: { $ref: '#/components/schemas/DependencyType' }
        lagDays: { type: integer, format: int32, minimum: -365, maximum: 365, description: Working days; negative = a lead. }
    BaselineCapacity:
      type: object
      required: [captured, totals, teams, truncated]
      description: >-
        The teams' capacity as frozen against capacity now (or N's), as the maximal date ranges on which a team's figure (man-days per
        week AND WIP limit) differs; "no capacity in force" is a figure of its own (null), not zero. Splitting a period into two equal
        ones is no change. `captured` is false (and the rest empty or zero) when the baseline, or with `against` either of the two, was
        taken before baselines froze capacity.
      properties:
        captured: { type: boolean }
        totals:
          type: object
          required: [teams, changedTeams]
          properties:
            teams: { type: integer, format: int32, minimum: 0, description: 'The teams with capacity on either side.' }
            changedTeams: { type: integer, format: int32, minimum: 0, description: 'The teams whose capacity differs.' }
        teams:
          type: array
          description: 'The changed teams by name (case-insensitive) then id; at most 2,000 change rows in all.'
          items:
            $ref: '#/components/schemas/BaselineCapacityTeam'
        truncated: { type: boolean, description: 'More than 2,000 change rows; the list is cut after the 2,000th, the totals count every team.' }
    BaselineCapacityTeam:
      type: object
      required: [teamId, teamName, changes]
      properties:
        teamId: { type: integer, format: int32, minimum: 0 }
        teamName: { type: string, description: 'The team''s name (a team deleted since is still named).' }
        changes:
          type: array
          description: The ranges on which the capacity differs, by start.
          items:
            $ref: '#/components/schemas/BaselineCapacityChange'
    BaselineCapacityChange:
      type: object
      required: [from, to, then, now]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date, nullable: true, description: 'Inclusive; null = without end.' }
        then:
          nullable: true
          description: The figure in the baseline; null = no capacity in force then.
          allOf:
            - $ref: '#/components/schemas/BaselineCapacityFigure'
        now:
          nullable: true
          description: The figure now; null = no capacity in force now.
          allOf:
            - $ref: '#/components/schemas/BaselineCapacityFigure'
    BaselineCapacityFigure:
      type: object
      required: [mdPerWeek, wipLimit]
      properties:
        mdPerWeek: { type: number, format: double, minimum: 0 }
        wipLimit: { type: integer, format: int32, minimum: 1, maximum: 99, nullable: true }
    BaselineViewProject:
      type: object
      required: [projectId, name, programName, workStreamName, rankThen, rankNow, baselineSpan, span, movement, counts]
      properties:
        projectId: { type: integer, format: int32, minimum: 0 }
        name: { type: string, description: The live name; the frozen one for a project that is gone. }
        programName: { type: string }
        workStreamName: { type: string }
        rankThen: { type: integer, format: int32, minimum: 1, nullable: true, description: 'Null = unranked then, or the project is newer than the baseline.' }
        rankNow: { type: integer, format: int32, minimum: 1, nullable: true, description: 'Null = unranked now, or the project is gone.' }
        baselineSpan:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DateSpan'
        span:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DateSpan'
        movement:
          $ref: '#/components/schemas/Movement'
        counts:
          $ref: '#/components/schemas/MovementTotals'
    BaselineFigures:
      type: object
      required: [start, end, estimateMd]
      properties:
        start: { type: string, format: date, nullable: true, description: Null = unscheduled. }
        end: { type: string, format: date, nullable: true }
        estimateMd: { type: number, format: double }
    BaselineViewMilestone:
      type: object
      required: [milestoneId, name, projectId, teamId, teamName, frozen, live, movement]
      description: A changed milestone. `frozen` is null for one added since the baseline, `live` for one removed; the name and team are the live ones when it exists now.
      properties:
        milestoneId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        projectId: { type: integer, format: int32, minimum: 0 }
        teamId: { type: integer, format: int32, minimum: 0 }
        teamName: { type: string }
        frozen:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/BaselineFigures'
        live:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/BaselineFigures'
        movement:
          $ref: '#/components/schemas/Movement'
    WorkStreamCreateRequest:
      type: object
      required: [name, ownerPersonId, startDate]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        ownerPersonId:
          type: integer
          format: int32
          minimum: 0
          description: The owner, an active person of the people directory (`400` otherwise).
        startDate: { type: string, format: date, description: 'YYYY-MM-DD, years 1900-2999.' }
        endDate:
          type: string
          format: date
          nullable: true
          description: Set only when the work stream is closed; not before `startDate`.
    WorkStreamUpdateRequest:
      type: object
      required: [name, ownerPersonId, startDate]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true, description: Omitted on PUT (a full replace) = none. }
        ownerPersonId:
          type: integer
          format: int32
          minimum: 0
          description: The owner, an active person of the people directory (`400` otherwise).
        startDate: { type: string, format: date, description: 'YYYY-MM-DD, years 1900-2999.' }
        endDate:
          type: string
          format: date
          nullable: true
          description: Omitted on PUT (a full replace) = open (reopens a closed stream); set = closed. Not before `startDate`.
    WorkStreamResponse:
      type: object
      required: [id, name, description, ownerPersonId, ownerName, startDate, endDate, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true, description: Set only when the work stream is closed. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    WorkStreamPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkStreamResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    ProgramCreateRequest:
      type: object
      required: [name, ownerPersonId]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        ownerPersonId:
          type: integer
          format: int32
          minimum: 0
          description: The owner, an active person of the people directory (`400` otherwise).
    ProgramUpdateRequest:
      type: object
      required: [name, ownerPersonId]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true, description: Omitted on PUT (a full replace) = none. }
        ownerPersonId:
          type: integer
          format: int32
          minimum: 0
          description: The owner, an active person of the people directory (`400` otherwise).
    ProgramResponse:
      type: object
      required: [id, workStreamId, name, description, ownerPersonId, ownerName, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        workStreamId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    ProgramListItem:
      type: object
      required: [id, workStreamId, name, description, ownerPersonId, ownerName, workStreamName, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        workStreamId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        workStreamName: { type: string, description: The name of the program's work stream. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    ProgramPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProgramListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    ProjectCreateRequest:
      type: object
      required: [name, ownerPersonId]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        ownerPersonId:
          type: integer
          format: int32
          minimum: 0
          description: The owner, an active person of the people directory (`400` otherwise).
        targetStart: { type: string, format: date, nullable: true, description: Both target dates or neither. }
        targetEnd: { type: string, format: date, nullable: true, description: Both target dates or neither; not before `targetStart`. }
    ProjectUpdateRequest:
      type: object
      required: [name, ownerPersonId]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true, description: Omitted on PUT (a full replace) = none. }
        ownerPersonId:
          type: integer
          format: int32
          minimum: 0
          description: The owner, an active person of the people directory (`400` otherwise).
    ProjectDetailsRequest:
      type: object
      required: [name, ownerPersonId, targetStart, targetEnd]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true, description: Omitted on PUT (a full replace) = none. }
        ownerPersonId:
          type: integer
          format: int32
          minimum: 0
          description: The owner, an active person of the people directory (`400` otherwise).
        targetStart: { type: string, format: date, nullable: true, description: Both dates or both null. }
        targetEnd: { type: string, format: date, nullable: true, description: Both dates or both null; not before `targetStart`. }
    ProgramMoveRequest:
      type: object
      required: [workStreamId]
      properties:
        workStreamId:
          type: integer
          format: int32
          minimum: 0
          description: The work stream to move the program under (`400` when it is unknown or deleted).
    ProjectMoveRequest:
      type: object
      required: [programId]
      properties:
        programId:
          type: integer
          format: int32
          minimum: 0
          description: The program to move the project under (`400` when it is unknown or deleted).
    TargetWindowRequest:
      type: object
      properties:
        targetStart: { type: string, format: date, nullable: true, description: Both dates or neither; omitted = none. }
        targetEnd: { type: string, format: date, nullable: true, description: Both dates or neither; not before `targetStart`. }
    ProjectResponse:
      type: object
      required: [id, programId, workStreamId, name, description, ownerPersonId, ownerName, targetStart, targetEnd, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        programId: { type: integer, format: int32, minimum: 0 }
        workStreamId: { type: integer, format: int32, minimum: 0, description: The work stream of the project's program. }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        targetStart: { type: string, format: date, nullable: true }
        targetEnd: { type: string, format: date, nullable: true }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    ProjectListItem:
      type: object
      required: [id, programId, workStreamId, name, description, ownerPersonId, ownerName, targetStart, targetEnd, programName, workStreamName, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        programId: { type: integer, format: int32, minimum: 0 }
        workStreamId: { type: integer, format: int32, minimum: 0, description: The work stream of the project's program. }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        targetStart: { type: string, format: date, nullable: true }
        targetEnd: { type: string, format: date, nullable: true }
        programName: { type: string, description: The name of the project's program. }
        workStreamName: { type: string, description: The name of the project's work stream. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    ProjectPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    MilestoneListItem:
      type: object
      required: [id, projectId, projectName, name, description, teamId, teamName, rankPosition, estimateMd, startDate, endDate, pinned, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        projectId: { type: integer, format: int32, minimum: 0 }
        projectName: { type: string, description: The name of the milestone's project. }
        name: { type: string }
        description: { type: string, nullable: true }
        teamId: { type: integer, format: int32, minimum: 0 }
        teamName: { type: string }
        rankPosition: { type: integer, format: int32, minimum: 1, nullable: true, description: The project's position in the global project rank; null = the project is unranked. }
        estimateMd: { type: number, format: double, minimum: 0, description: Man-days with at most two decimals. }
        startDate: { type: string, format: date, nullable: true, description: Null = unscheduled (both dates are null together). }
        endDate: { type: string, format: date, nullable: true }
        pinned: { type: boolean, description: 'The schedule proposal keeps this milestone on its dates; only ever true while it is scheduled. Set by the milestone team''s manager or ADMIN (`PUT /milestones/{id}/pin`), cleared by an unschedule.' }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    MilestonePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MilestoneListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    MilestoneCreateRequest:
      type: object
      required: [name, teamId, estimateMd]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
        teamId:
          type: integer
          format: int32
          minimum: 0
          description: The milestone's one team, an active team (`400` otherwise). It decides who may schedule the milestone.
        estimateMd:
          type: number
          format: double
          minimum: 0
          description: Man-days, `0 <= x < 1000000` with at most two decimals (quarter days fit), else `400`; zero is a zero-effort checkpoint.
    MilestoneUpdateRequest:
      type: object
      required: [name, teamId, estimateMd]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true, description: Omitted on PUT (a full replace) = none. }
        teamId:
          type: integer
          format: int32
          minimum: 0
          description: The milestone's one team, an active team (`400` otherwise). Changing it keeps the dates.
        estimateMd:
          type: number
          format: double
          minimum: 0
          description: Man-days, `0 <= x < 1000000` with at most two decimals, else `400`.
    MilestoneScheduleRequest:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
          description: The plan revision of the client's view; a `409` only when THIS milestone's schedule was written at a later revision.
        startDate: { type: string, format: date, nullable: true, description: Inclusive. Both dates or neither (neither unschedules). }
        endDate: { type: string, format: date, nullable: true, description: Inclusive; not before `startDate`; the span needs a working day. }
    MilestonePinRequest:
      type: object
      required: [pinned]
      properties:
        pinned: { type: boolean, description: 'True keeps the milestone on its dates for the auto-proposal; false releases it. Idempotent.' }
    ScheduleResponse:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, format: int64, minimum: 0, description: The plan revision after this write. }
    MilestoneResponse:
      type: object
      required: [id, projectId, name, description, teamId, teamName, estimateMd, startDate, endDate, pinned, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        projectId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        teamId: { type: integer, format: int32, minimum: 0 }
        teamName: { type: string }
        estimateMd: { type: number, format: double, minimum: 0, description: Man-days with at most two decimals. }
        startDate: { type: string, format: date, nullable: true, description: Null = unscheduled (both dates are null together). }
        endDate: { type: string, format: date, nullable: true }
        pinned: { type: boolean, description: 'The schedule proposal keeps this milestone on its dates; only ever true while it is scheduled. Set by the milestone team''s manager or ADMIN (`PUT /milestones/{id}/pin`), cleared by an unschedule.' }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    DependencyType:
      type: string
      enum: [FS, SS, FF, SF]
      description: >-
        Finish-to-start (the successor starts after the predecessor finishes), start-to-start, finish-to-finish or
        start-to-finish. The SUCCESSOR is always the constrained side.
    EndpointKind:
      type: string
      enum: [MILESTONE, PROJECT]
    EndpointRef:
      type: object
      required: [kind, id]
      properties:
        kind: { $ref: '#/components/schemas/EndpointKind' }
        id: { type: integer, format: int32, minimum: 1 }
    DependencyCreateRequest:
      type: object
      required: [predecessor, successor, type]
      properties:
        predecessor:
          allOf: [{ $ref: '#/components/schemas/EndpointRef' }]
          description: >-
            Any active milestone or project (`400` "Unknown or deleted milestone ids: N" / "... project ids: N").
        successor:
          allOf: [{ $ref: '#/components/schemas/EndpointRef' }]
          description: The path project itself or one of its active milestones (`400` otherwise); never equal to the predecessor (`400`).
        type: { $ref: '#/components/schemas/DependencyType' }
        lagDays:
          type: integer
          format: int32
          minimum: -365
          maximum: 365
          default: 0
          description: WORKING days (Monday-Friday without the public holidays) the successor waits after the predecessor's anchor; negative = a lead.
    DependencyUpdateRequest:
      type: object
      required: [type, lagDays]
      description: The editable part of a link; the ends are fixed.
      properties:
        type: { $ref: '#/components/schemas/DependencyType' }
        lagDays:
          type: integer
          format: int32
          minimum: -365
          maximum: 365
          description: WORKING days (Monday-Friday without the public holidays) the successor waits after the predecessor's anchor; negative = a lead.
    DependencyEndpoint:
      type: object
      description: >-
        One resolved end of a dependency. A project's dates are its DERIVED span (earliest start to latest end over its scheduled
        milestones), never its target window; they are null while nothing in it is scheduled.
      required: [kind, id, name, projectId, projectName, teamId, teamName, startDate, endDate]
      properties:
        kind: { $ref: '#/components/schemas/EndpointKind' }
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        projectId: { type: integer, format: int32, minimum: 0, description: The milestone's project; the project's own id for a project. }
        projectName: { type: string }
        teamId: { type: integer, format: int32, minimum: 0, nullable: true, description: A milestone's team; null for a project. }
        teamName: { type: string, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
    DependencyResponse:
      type: object
      required: [id, predecessor, successor, type, lagDays, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        predecessor: { $ref: '#/components/schemas/DependencyEndpoint' }
        successor: { $ref: '#/components/schemas/DependencyEndpoint' }
        type: { $ref: '#/components/schemas/DependencyType' }
        lagDays: { type: integer, format: int32, minimum: -365, maximum: 365, description: Working days; negative = a lead. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    PlanView:
      type: object
      required: [revision, can, workStreams]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The plan revision, read before the rows; bumped by every plan write.
        can:
          type: object
          required: [createWorkStream]
          properties:
            createWorkStream: { type: boolean, description: The caller may create a work stream (ADMIN). }
        workStreams:
          type: array
          items:
            $ref: '#/components/schemas/PlanWorkStream'
    PlanWorkStream:
      type: object
      required: [id, name, description, ownerPersonId, ownerName, startDate, endDate, createdAt, updatedAt, can, programs]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true, description: Set only when the work stream is closed. }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        can:
          type: object
          required: [edit, delete, createProgram]
          properties:
            edit: { type: boolean }
            delete: { type: boolean, description: 'A rights flag: the caller may delete the node. The server can still answer 409 while it has active children.' }
            createProgram: { type: boolean }
        programs:
          type: array
          items:
            $ref: '#/components/schemas/PlanProgram'
    PlanProgram:
      type: object
      required: [id, workStreamId, name, description, ownerPersonId, ownerName, createdAt, updatedAt, can, projects]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        workStreamId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        can:
          type: object
          required: [edit, delete, createProject, move]
          properties:
            edit: { type: boolean }
            delete: { type: boolean, description: 'A rights flag: the caller may delete the node. The server can still answer 409 while it has active children.' }
            createProject: { type: boolean }
            move: { type: boolean, description: 'The caller may move this program to another work stream (ADMIN, or the owner of its work stream); offer the work streams whose `createProgram` is set.' }
        projects:
          type: array
          items:
            $ref: '#/components/schemas/PlanProject'
    PlanProject:
      type: object
      required: [id, programId, workStreamId, name, description, ownerPersonId, ownerName, targetStart, targetEnd, createdAt, updatedAt, can]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        programId: { type: integer, format: int32, minimum: 0 }
        workStreamId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        targetStart: { type: string, format: date, nullable: true }
        targetEnd: { type: string, format: date, nullable: true }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        can:
          type: object
          required: [edit, delete, editTargetWindow, move, createMilestone, createDependency]
          properties:
            edit: { type: boolean }
            delete: { type: boolean, description: 'A rights flag: the caller may delete the node. The server can still answer 409 while it has active children.' }
            editTargetWindow: { type: boolean, description: 'The caller may set the target window (ADMIN, an owner above the project, or a roadmap editor).' }
            move: { type: boolean, description: 'The caller may move this project to another program (ADMIN, or an owner of its program or work stream - the project''s own owner alone may not); offer the programs whose `createProject` is set.' }
            createMilestone: { type: boolean, description: 'The caller may add milestones to this project (ADMIN, or an owner of its chain, the project''s own owner included): the project view''s flag of the same name, and the guard of a rooted Jira import under it.' }
            createDependency: { type: boolean, description: 'The caller may add a dependency whose successor is this project or one of its milestones (ADMIN, or an owner of its chain, the project''s own owner included): the project view''s flag of the same name. The predecessor''s owner is asked nothing.' }

    ProjectView:
      type: object
      required: [revision, project, span, drift, scheduled, unscheduled, dependencies, idleGaps, criticalPath, jiraSites]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The plan revision, read before the rows; send it back as `expectedRevision` of a schedule write.
        project:
          $ref: '#/components/schemas/ProjectViewProject'
        span:
          nullable: true
          description: The earliest start to the latest end over the scheduled milestones; null when none is scheduled.
          allOf:
            - $ref: '#/components/schemas/DateSpan'
        drift:
          nullable: true
          description: '`span` against the project''s target window; null unless both exist.'
          allOf:
            - $ref: '#/components/schemas/Drift'
        scheduled:
          type: array
          description: The milestones with dates, by start date, end date, name (case-insensitive) and id.
          items:
            $ref: '#/components/schemas/ProjectMilestone'
        unscheduled:
          type: array
          description: The milestones without dates (the tray), by name (case-insensitive) and id.
          items:
            $ref: '#/components/schemas/ProjectMilestone'
        dependencies:
          type: array
          description: >-
            The active links with an end in this project, violated first (the largest shortfall first), then OK, then unscheduled;
            within a group by successor name, predecessor name and id.
          items:
            $ref: '#/components/schemas/ProjectDependency'
        idleGaps:
          type: array
          description: >-
            The idle gaps inside the span of the milestones that hold a working day: the maximal runs of 3 or more working days on which none of the project's milestones is in
            progress (weekends and public holidays neither count nor break a run), by start date; empty when there are none.
          items:
            $ref: '#/components/schemas/IdleGap'
        criticalPath:
          $ref: '#/components/schemas/CriticalPath'
        jiraSites:
          type: array
          description: >-
            The Jira connections, enabled or not, that a binding in this document's scope links to (a roadmap or programs document also lists a connection that only has milestone bindings), by connection id, once per document; the client builds a row's
            browse URL as `siteUrl + "/browse/" + jira.issueKey`. Empty when nothing is linked.
          items:
            $ref: '#/components/schemas/JiraSite'
        baseline:
          $ref: '#/components/schemas/ProjectBaseline'
    CriticalPath:
      type: object
      required: [upstream, upstreamTruncated]
      description: >-
        The milestones and projects of other projects upstream of this project's end (their slip would eventually move it), derived
        from the planned dates over the whole active plan graph: the critical ones first, then the rest by slack. A project is listed
        only when an included link (not violated, both ends scheduled) names it; entities that only lie downstream, or are unconnected
        to the end, are absent.
      properties:
        upstream:
          type: array
          description: >-
            The critical entries in full (the chain from its origin: start date, end date, name case-insensitive, kind, id), then at most
            100 others by slack ascending (then like the chain).
          items:
            $ref: '#/components/schemas/UpstreamEntity'
        upstreamTruncated:
          type: boolean
          description: True when more than 100 non-critical entries existed (the critical ones are never cut).
    UpstreamEntity:
      type: object
      required: [kind, id, name, projectId, projectName, startDate, endDate, slackDays, critical, hops]
      description: A milestone or project of another project upstream of the viewed project's end.
      properties:
        kind: { $ref: '#/components/schemas/EndpointKind' }
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        projectId: { type: integer, format: int32, minimum: 0, description: 'The entity''s own project (for a project, its own id).' }
        projectName: { type: string }
        startDate: { type: string, format: date, description: The stored start (a project's derived span start). }
        endDate: { type: string, format: date }
        slackDays: { type: integer, format: int32, minimum: 0, description: Working days it could slip before the viewed project's end moves. }
        critical: { type: boolean, description: Zero slack - it drives the viewed project's end. }
        hops: { type: integer, format: int32, minimum: 1, description: 'The fewest links between it and the viewed project (containment is free, so every milestone of a project a link names is 1); not a filter for the ends already in `dependencies`.' }
    ProjectDependency:
      type: object
      required: [id, predecessor, successor, type, lagDays, check, critical, can]
      description: A link of the project view (and of the team view) - both ends resolved, its check and the caller's action.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        predecessor: { $ref: '#/components/schemas/DependencyEndpoint' }
        successor: { $ref: '#/components/schemas/DependencyEndpoint' }
        type: { $ref: '#/components/schemas/DependencyType' }
        lagDays: { type: integer, format: int32, minimum: -365, maximum: 365, description: Working days; negative = a lead. }
        check: { $ref: '#/components/schemas/DependencyCheck' }
        critical: { type: boolean, description: "A zero-slack link on the viewed project's critical chain; a violated link is never critical and ends the chain at the violation. On the team view: on the chain of a project one of the team's milestones belongs to (a link that drives only a project none of the team's milestones belongs to is not marked)." }
        can: { $ref: '#/components/schemas/DependencyCan' }
        newSinceBaseline: { type: boolean, description: 'Present only on the PROJECT view with `?baseline=N` and only when that baseline froze its links: true = the link is not among them (made since the baseline), false = it is. Absent otherwise (no parameter, a baseline that froze no links, the team view): unknown, not "all new".' }
    DependencyCan:
      type: object
      required: [edit, delete]
      description: >-
        What this caller may do with one dependency, by the rules of the writes (an owner on the SUCCESSOR's project chain, or ADMIN;
        the predecessor's owner is asked nothing). Each flag is true exactly when the write would not be refused with `403` for the
        caller.
      properties:
        edit: { type: boolean, description: "The caller may change the link's type and lag (`PUT /dependencies/{id}`): an owner on the SUCCESSOR's project chain, or ADMIN. The write may still answer `409` for a cycle or `400` for a bad lag." }
        delete: { type: boolean, description: 'The caller may delete the link: an owner on the SUCCESSOR''s project chain, or ADMIN.' }
    DependencyStatus:
      type: string
      enum: [OK, VIOLATED, UNSCHEDULED]
      description: >-
        VIOLATED = the successor is short of what the type requires (a warning only); UNSCHEDULED = an end has no dates (a milestone
        without dates, a project with no scheduled milestone): not evaluated.
    DependencyCheck:
      type: object
      required: [status, shortfallDays, slackDays, requiredDate, actualDate]
      description: >-
        The check of one link on the working-day index (Monday-Friday without the public holidays), with the effective start (the first working day on or after
        `start`) and end (the last working day on or before `end`) of each end. FS requires the successor's start on the working day after
        the predecessor's end; SS its start on the predecessor's start; FF its end on the predecessor's end; SF its end on the
        working day before the predecessor's start - each shifted by `lagDays` working days.
      properties:
        status: { $ref: '#/components/schemas/DependencyStatus' }
        shortfallDays:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: How many working days short the successor is; present (at least 1) only when `status` is `VIOLATED`.
        slackDays:
          type: integer
          format: int32
          nullable: true
          description: >-
            The link's own float in working days, `actual - required`: 0 or more when `OK` (how far the successor's constrained side could
            slip before the link breaks), `-shortfallDays` when `VIOLATED`; null when `UNSCHEDULED`. Not the critical path's slack of a
            milestone, which is measured toward a project's end.
        requiredDate:
          type: string
          format: date
          nullable: true
          description: The working day the type requires for the successor's start or end; null when `UNSCHEDULED`.
        actualDate:
          type: string
          format: date
          nullable: true
          description: The successor's effective start (FS, SS) or end (FF, SF); null when `UNSCHEDULED`.
    DateSpan:
      type: object
      required: [start, end]
      description: An inclusive span of calendar days.
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date, description: Not before `start`. }
    Drift:
      type: object
      required: [startDays, endDays]
      description: Calendar-day deltas of a derived span against a target window; positive = later than the target, negative = ahead, zero = on target.
      properties:
        startDays: { type: integer, format: int64, description: '`span.start` minus `target.start`.' }
        endDays: { type: integer, format: int64, description: '`span.end` minus `target.end`.' }
    ProjectViewProject:
      type: object
      required: [id, programId, workStreamId, programName, workStreamName, name, description, ownerPersonId, ownerName, targetStart, targetEnd, createdAt, updatedAt, can, jira, flags]
      description: The `PlanProject` fields plus the names of the project's program and work stream.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        programId: { type: integer, format: int32, minimum: 0 }
        workStreamId: { type: integer, format: int32, minimum: 0 }
        programName: { type: string }
        workStreamName: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        targetStart: { type: string, format: date, nullable: true }
        targetEnd: { type: string, format: date, nullable: true }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        jira:
          nullable: true
          description: The project's own Jira item; null when it is unbound. Through a disabled connection it is kept with null dates.
          allOf:
            - $ref: '#/components/schemas/JiraLink'
        flags:
          type: array
          description: >-
            The project's Jira flags: `JIRA_DEVIATION` per open deviation of its own binding and the `JIRA_MILESTONES` roll-up of its
            milestones, the same Jira flags the roadmap row carries; WARNING first.
          items:
            $ref: '#/components/schemas/PlanFlag'
        can:
          type: object
          required: [edit, delete, editTargetWindow, createMilestone, createDependency]
          properties:
            edit: { type: boolean }
            delete: { type: boolean, description: 'A rights flag: the caller may delete the project (its milestones go with it).' }
            editTargetWindow: { type: boolean, description: 'The caller may set the target window (ADMIN, an owner above the project, or a roadmap editor).' }
            createMilestone: { type: boolean, description: 'The caller may create a milestone under the project (an owner on its chain, or ADMIN).' }
            createDependency: { type: boolean, description: 'The caller may create a dependency whose successor is the project or one of its milestones (an owner on its chain, or ADMIN).' }
    ProjectMilestone:
      type: object
      required: [id, projectId, name, description, teamId, teamName, estimateMd, startDate, endDate, createdAt, updatedAt, slackDays, critical, pinned, can, jira, flags]
      description: A milestone as the project view shows it - the `MilestoneResponse` fields plus the caller's actions. Both dates are null in `unscheduled`, both set in `scheduled`.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        projectId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        teamId: { type: integer, format: int32, minimum: 0 }
        teamName: { type: string }
        estimateMd: { type: number, format: double, minimum: 0, description: Man-days with at most two decimals. }
        startDate: { type: string, format: date, nullable: true, description: Null = unscheduled (both dates are null together). }
        endDate: { type: string, format: date, nullable: true }
        pinned: { type: boolean, description: "The auto-proposal keeps this milestone on its dates; only ever true while it is scheduled. Set by the milestone team's manager or ADMIN (`PUT /milestones/{id}/pin`), cleared by an unschedule." }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
        slackDays: { type: integer, format: int32, minimum: 0, nullable: true, description: "Working days this milestone could slip, with everything downstream of it allowed to slip too, before this project's end moves; null while unscheduled." }
        critical: { type: boolean, description: 'Zero slack: on the critical path of this project.' }
        jira:
          nullable: true
          description: The node's Jira item; null when it is unbound. Through a disabled connection it is kept with null dates.
          allOf:
            - $ref: '#/components/schemas/JiraLink'
        flags:
          type: array
          description: >-
            The milestone's flags, WARNING first: `NO_WORKING_DAY` (the scheduled span holds no working day on the current calendar)
            and one `JIRA_DEVIATION` per open deviation; empty when none applies (unscheduled, a clean or unbound row, acknowledged or
            on a disabled connection).
          items:
            $ref: '#/components/schemas/PlanFlag'
        can:
          type: object
          required: [edit, delete, schedule]
          properties:
            edit: { type: boolean, description: 'The caller may change the plan fields (an owner on the project''s chain, or ADMIN).' }
            delete: { type: boolean }
            schedule: { type: boolean, description: 'The caller may set or clear the dates: ADMIN or the active manager of the milestone''s team - never the project''s owner as such.' }

    TeamView:
      type: object
      required: [revision, team, order, capacity, weeks, weeksTruncated, scheduled, unscheduled, dependencies, idleGaps, jiraSites]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The plan revision, read before the rows; send it back as `expectedRevision` of a schedule write.
        team:
          $ref: '#/components/schemas/TeamViewTeam'
        order:
          $ref: '#/components/schemas/TeamViewOrder'
        capacity:
          $ref: '#/components/schemas/TeamViewCapacity'
        weeks:
          type: array
          description: >-
            One row per ISO week, Monday-keyed, from the earliest scheduled start's Monday to the latest scheduled end's Sunday (at most
            520); empty while nothing is scheduled.
          items:
            $ref: '#/components/schemas/WeekLoad'
        weeksTruncated:
          type: boolean
          description: True when the range of scheduled milestones is longer than 520 weeks and `weeks` stops there.
        scheduled:
          type: array
          description: The milestones with dates (the timeline rows) in the team's effective order.
          items:
            $ref: '#/components/schemas/TeamMilestone'
        unscheduled:
          type: array
          description: The milestones without dates (the tray) in the team's effective order (the dates are null, so name and id decide within a project).
          items:
            $ref: '#/components/schemas/TeamMilestone'
        dependencies:
          type: array
          description: >-
            The active links with an end among the team's milestones, violated first (the largest shortfall first), then OK, then
            unscheduled; within a group by successor name, predecessor name and id. Ends are resolved, not listed: there are no ghost rows
            here (`criticalChain` lists the chain's).
          items:
            $ref: '#/components/schemas/ProjectDependency'
        idleGaps:
          type: array
          description: >-
            The idle gaps inside the span of the team's scheduled milestones: the maximal runs of 3 or more working days on which none of
            them is in progress (weekends and public holidays neither count nor break a run), by start date; empty when there are none.
          items:
            $ref: '#/components/schemas/IdleGap'
        jiraSites:
          type: array
          description: >-
            The Jira connections, enabled or not, that a binding in this document's scope links to (a roadmap or programs document also lists a connection that only has milestone bindings), by connection id, once per document; the client builds a row's
            browse URL as `siteUrl + "/browse/" + jira.issueKey`. Empty when nothing is linked.
          items:
            $ref: '#/components/schemas/JiraSite'
        baseline:
          $ref: '#/components/schemas/TeamBaseline'
        criticalChain:
          $ref: '#/components/schemas/TeamCriticalChain'
    TeamCriticalChain:
      type: object
      required: [members, links, truncated]
      description: >-
        Present only with `?criticalChain=true`: the critical chain THROUGH the team's milestones, measured toward the end of each project
        the team works on (as `critical` is), minus the team's own milestones. A member lies on a zero-slack path that runs through one of
        those milestones: everything that drives it, back to the chain's origin and through upstream projects, or everything it drives,
        up to the project's end (never both at once: a sibling branch that merely meets the chain is left out). The same for every caller.
      properties:
        members:
          type: array
          maxItems: 100
          description: >-
            The milestones of other teams, and a project as a whole when a chain link names it, one per kind and id whatever number of
            the team's milestones or projects share it, nearest first (`hops`, start date, end date, name case-insensitively, kind, id).
            At most 100: the cut keeps every member with fewer hops, so it shortens the far end of the chain and opens no gap.
          items:
            $ref: '#/components/schemas/TeamChainMember'
        links:
          type: array
          maxItems: 500
          description: >-
            The chain's links with NO end among the team's milestones, both ends listed in `members`, one per id, nearest first (the larger
            of its two ends' `hops`, then id). A chain link with an end among the team's milestones is in `dependencies` with
            `critical: true` and is not repeated. At most 500.
          items:
            $ref: '#/components/schemas/TeamChainLink'
        truncated: { type: boolean, description: 'True when either list was cut at its cap.' }
    TeamChainMember:
      type: object
      required: [kind, id, name, projectId, projectName, teamId, teamName, startDate, endDate, hops, chainOf]
      description: A milestone of another team, or a whole project, on the chain through the team's milestones.
      properties:
        kind: { $ref: '#/components/schemas/EndpointKind' }
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        projectId: { type: integer, format: int32, minimum: 0, description: 'Its own project (for a project, its own id).' }
        projectName: { type: string }
        teamId: { type: integer, format: int32, minimum: 0, nullable: true, description: 'Its team; null for a project.' }
        teamName: { type: string, nullable: true }
        startDate: { type: string, format: date, description: The stored start (a project's derived span start). }
        endDate: { type: string, format: date }
        hops:
          type: integer
          format: int32
          minimum: 0
          description: >-
            The fewest links between it and one of the team's milestones (containment and a milestone's own start-to-end cost nothing, so
            0 is a project that holds one of them and is named by a chain link).
        chainOf:
          type: array
          description: The ids of the team's projects, ascending, whose chain holds it (at least one).
          items: { type: integer, format: int32, minimum: 0 }
    TeamChainLink:
      type: object
      required: [id, predecessor, successor, type, lagDays]
      description: A link of the chain between two listed members; the members carry the names and dates.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        predecessor: { $ref: '#/components/schemas/EndpointRef' }
        successor: { $ref: '#/components/schemas/EndpointRef' }
        type: { $ref: '#/components/schemas/DependencyType' }
        lagDays: { type: integer, format: int32, minimum: -365, maximum: 365, description: Working days; negative = a lead. }
    IdleGap:
      type: object
      required: [start, end, workingDays]
      description: A run of idle working days, answered as its first and last working day.
      properties:
        start: { type: string, format: date, description: The first idle working day. }
        end: { type: string, format: date, description: 'The last idle working day (a working day, never a weekend or holiday).' }
        workingDays: { type: integer, format: int32, minimum: 3, description: The number of idle working days from `start` to `end` (weekends and holidays not counted). }
    TeamViewTeam:
      type: object
      required: [id, name, managerPersonId, managerName, createdAt, updatedAt, can, flags]
      description: The `TeamResponse` fields plus what the caller may do with the team's plan and the team-level flags.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        managerPersonId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: The team's manager (a person); null when unset or when the assigned person was soft-deleted.
        managerName: { type: string, nullable: true, description: The manager's name; null with `managerPersonId`. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
        can:
          type: object
          required: [schedule, editCapacity, editOrder]
          description: >-
            The actions on this team's plan, all by one rule: ADMIN, or the caller is the active manager of this team.
          properties:
            schedule: { type: boolean, description: 'The caller may set or clear the dates of this team''s milestones (`PUT /milestones/{id}/schedule`).' }
            editCapacity: { type: boolean, description: 'The caller may add, change and delete this team''s capacity periods.' }
            editOrder: { type: boolean, description: 'The caller may replace this team''s milestone order (`PUT /teams/{id}/milestone-order`).' }
        flags:
          type: array
          description: >-
            The team-level flags: `FLOW_CAPACITY`, one roll-up of the team's open Flow capacity deviations (`GET
            /views/capacity-deviations`), its severity the worst of them; or `FLOW_CAPACITY_PENDING` (neutral; the severity is a
            placeholder) when its sprint snapshot is incomplete, never both. Empty without a Flow link, with a disabled connection or
            when every row is acknowledged.
          items:
            $ref: '#/components/schemas/PlanFlag'
    TeamViewOrder:
      type: object
      required: [custom, revision, milestoneIds]
      properties:
        custom: { type: boolean, description: "True when the team's manager has set an order. Listed milestones then come first, as listed; the rest (all of them when false) follow by the global project rank (ranked before unranked, then project name and id), then start date, end date, name and id, undated last. A rank change never reshuffles the listed ones. Applies to `scheduled` and `unscheduled`." }
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The team's order revision (0 when never written); send it back as `expectedRevision` of the order PUT.
        milestoneIds:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: integer, format: int32, minimum: 0 }
          description: >-
            The stored custom order: the manager's listed milestones that are still active milestones of this team, scheduled or not,
            in stored position order (empty when `custom` is false). The unscheduled ones are listed here only; a client that writes
            the order again keeps their places.
    TeamViewCapacity:
      type: object
      required: [periods]
      properties:
        periods:
          type: array
          description: The team's active capacity periods in `effectiveFrom` order, with their WIP limits.
          items:
            $ref: '#/components/schemas/CapacityPeriodResponse'
    WeekLoad:
      type: object
      required: [weekStart, load, capacity, overloaded, overloadMd, maxWip, wipExceeded]
      description: One ISO week of the team's load against its capacity and WIP limit. Warnings only.
      properties:
        weekStart: { type: string, format: date, description: The week's Monday. }
        load:
          type: number
          format: double
          minimum: 0
          description: >-
            The man-days of the scheduled milestones falling in the week, two decimals: each estimate is spread evenly over its
            working days (Monday-Friday without the public holidays).
        capacity:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: >-
            The sum over the week's working days of the capacity in force that day, over 5 (two decimals); null when no capacity period
            is in force on any working day of the week.
        overloaded: { type: boolean, description: 'True when `capacity` is set and `load` exceeds it (compared as rounded).' }
        overloadMd: { type: number, format: double, minimum: 0, nullable: true, description: '`load` minus `capacity`; only when `overloaded`.' }
        maxWip:
          type: integer
          format: int32
          minimum: 0
          description: >-
            The most scheduled milestones in progress on one working day of the week (a milestone is in progress from the first
            working day on or after its start to the last on or before its end).
        wipExceeded: { type: boolean, description: "Some working day's in-progress count exceeds the WIP limit in force that day; a day without a limit never flags." }
        flowCapacity:
          allOf: [{ $ref: '#/components/schemas/Severity' }]
          description: >-
            Present only on `GET /views/team/{id}` and only when an open Flow capacity row's held days (`effectiveFrom` to the
            sprint's end) meet the week: the worst severity among the rows that meet it (a `TEAM_GONE` row marks no week, nor does a
            team whose Flow comparison is pending). Absent otherwise, and always absent on a proposal's or a check's weeks.
    TeamMilestone:
      type: object
      required: [id, projectId, name, description, teamId, teamName, estimateMd, startDate, endDate, createdAt, updatedAt, projectName, programName, workStreamName, rankPosition, slackDays, critical, pinned, jira, flags]
      description: A milestone as the team view shows it - the `MilestoneResponse` fields plus the names of its project chain and its project's rank. Both dates are null in `unscheduled`.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        projectId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        description: { type: string, nullable: true }
        teamId: { type: integer, format: int32, minimum: 0 }
        teamName: { type: string }
        estimateMd: { type: number, format: double, minimum: 0, description: Man-days with at most two decimals. }
        startDate: { type: string, format: date, nullable: true, description: Null = unscheduled (both dates are null together). }
        endDate: { type: string, format: date, nullable: true }
        pinned: { type: boolean, description: "The auto-proposal keeps this milestone on its dates; only ever true while it is scheduled. Set by the milestone team's manager or ADMIN (`PUT /milestones/{id}/pin`), cleared by an unschedule." }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
        projectName: { type: string }
        programName: { type: string }
        workStreamName: { type: string }
        rankPosition: { type: integer, format: int32, minimum: 1, nullable: true, description: The project's position in the global project rank; null = unranked. }
        slackDays: { type: integer, format: int32, minimum: 0, nullable: true, description: "Working days this milestone could slip before its own project's end moves (the project view's figure); null while unscheduled." }
        critical: { type: boolean, description: 'Zero slack: on the critical path toward its own project''s end.' }
        jira:
          nullable: true
          description: The node's Jira item; null when it is unbound. Through a disabled connection it is kept with null dates.
          allOf:
            - $ref: '#/components/schemas/JiraLink'
        flags:
          type: array
          description: >-
            The milestone's flags, WARNING first: `NO_WORKING_DAY` (the scheduled span holds no working day on the current calendar)
            and one `JIRA_DEVIATION` per open deviation; empty when none applies (unscheduled, a clean or unbound row, acknowledged or
            on a disabled connection).
          items:
            $ref: '#/components/schemas/PlanFlag'

    DeviationKind:
      description: >-
        INFO unless noted. `GONE` (WARNING, alone): issue gone. `LEVEL_MISMATCH`, `PARENT_MISMATCH` (WARNING): level or parent
        differs. `RENAMED`: name differs. `START_DIFFERS`, `END_DIFFERS`: dates differ (working days), WARNING if the plan's end is
        later. `TARGET_DIFFERS` (projects): target window differs. `UNSCHEDULED_IN_PLAN`, `UNSCHEDULED_IN_JIRA` (milestones): one side
        has dates. `ESTIMATE_DIFFERS`; `ESTIMATE_NOT_COMPARABLE`: no factor or unit. `PROGRESS_MISMATCH`: status against dates.
        `UNLINKED_IN_JIRA` (WARNING), `UNLINKED_IN_PLAN`, `CHILDREN_DONE`, `CHILDREN_OPEN`: coverage.
      type: string
      enum: [GONE, LEVEL_MISMATCH, PARENT_MISMATCH, RENAMED, START_DIFFERS, END_DIFFERS, TARGET_DIFFERS, UNSCHEDULED_IN_PLAN, UNSCHEDULED_IN_JIRA, ESTIMATE_DIFFERS, ESTIMATE_NOT_COMPARABLE, PROGRESS_MISMATCH, UNLINKED_IN_JIRA, UNLINKED_IN_PLAN, CHILDREN_DONE, CHILDREN_OPEN]
    NullableDeviationKind:
      type: string
      nullable: true
      description: A `DeviationKind` or null (the validator reads a nullable enum behind an `allOf` as non-null, so the values are spelled here).
      enum: [GONE, LEVEL_MISMATCH, PARENT_MISMATCH, RENAMED, START_DIFFERS, END_DIFFERS, TARGET_DIFFERS, UNSCHEDULED_IN_PLAN, UNSCHEDULED_IN_JIRA, ESTIMATE_DIFFERS, ESTIMATE_NOT_COMPARABLE, PROGRESS_MISMATCH, UNLINKED_IN_JIRA, UNLINKED_IN_PLAN, CHILDREN_DONE, CHILDREN_OPEN]
    DeviationDetail:
      type: object
      description: >-
        Evidence of a deviation; a member that does not apply is absent, never `null`. `jira`/`plan` hold each side: the gone reason;
        the level (`unknown` when none); the parent's key, the plan parent's name; the summary, the name; the status category, the
        contradicting plan date; the man-days figure (`ESTIMATE_DIFFERS`) or raw (`ESTIMATE_NOT_COMPARABLE`), the plan's;
        `done/children` or `open/children`, the plan's end. Dates: two ISO dates, `days`; `TARGET_DIFFERS`: `days` only.
        `UNLINKED_IN_JIRA`: Jira keys; `UNLINKED_IN_PLAN`: plan names (at most 10, comma-joined, by id). `UNSCHEDULED_*`: `{}`.
      properties:
        jira: { type: string }
        plan: { type: string }
        days: { type: integer, format: int32, description: "Working days on the live calendar, POSITIVE = the plan is later." }
        count: { type: integer, format: int32, description: "The full count behind a truncated list (`UNLINKED_*`: items, at most 10 listed) or the children (`CHILDREN_DONE`, `CHILDREN_OPEN`); absent for every other kind." }
    FlagDeviation:
      type: object
      description: >-
        The evidence a `JIRA_DEVIATION` flag carries: a deviation's `kind` and `detail`. Its severity is the flag's own
        (`PlanFlag.severity`), so it is not repeated here.
      required: [kind, detail]
      properties:
        kind: { $ref: '#/components/schemas/DeviationKind' }
        detail: { $ref: '#/components/schemas/DeviationDetail' }
    SyncLastRun:
      type: object
      description: A connection's newest sync run, any trigger (the run list carries the full row).
      required: [id, startedAt, finishedAt, outcome, errorCode, trigger, running]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        startedAt: { type: integer, format: int64 }
        finishedAt: { type: integer, format: int64, nullable: true }
        outcome: { $ref: '#/components/schemas/SyncOutcome' }
        errorCode: { $ref: '#/components/schemas/SyncFailureCode' }
        trigger: { $ref: '#/components/schemas/SyncTrigger' }
        running: { type: boolean, description: "True only for an unfinished run younger than the maximum run time (10 minutes by default); an older unfinished run was interrupted." }
    SyncStatus:
      type: object
      description: >-
        A connection's derived sync state (nothing is stored). In order: disabled is DISABLED; the newest FINISHED run failed or was
        abandoned, or the newest run was interrupted (unfinished and older than the claim window), is FAILED; no run ever succeeded is
        NEVER_SYNCED; a polling interval and a last success that started more than three intervals ago is STALE; else CURRENT (a
        manual-only connection stays CURRENT after any success).
      required: [state, lastRun, lastSucceededAt, consecutiveFailures, nextPollAt]
      properties:
        state: { $ref: '#/components/schemas/SyncState' }
        lastRun:
          allOf:
            - $ref: '#/components/schemas/SyncLastRun'
          nullable: true
        lastSucceededAt: { type: integer, format: int64, nullable: true, description: "Epoch millis the newest SUCCEEDED run STARTED (the data is as of then); null before the first." }
        consecutiveFailures: { type: integer, format: int32, minimum: 0, description: "The trailing finished runs that failed or were abandoned (an interrupted newest run adds one), back to the last success." }
        nextPollAt: { type: integer, format: int64, nullable: true, description: "Epoch millis the scheduler claims next (now when due); null for a disabled, untested, manual-only or running connection. Computed by the scheduler's own rule, back-off and the per-connection retry jitter after a failure included." }
    JiraLinksView:
      type: object
      required: [connections, links, truncated]
      properties:
        connections:
          type: array
          items: { $ref: '#/components/schemas/JiraLinkConnection' }
        links:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/JiraNodeLink' }
        truncated: { type: boolean, description: "True when the 2,000-link cap dropped links." }
    JiraLinkConnection:
      type: object
      description: A connection as the links view shows it - exactly the members `GET /views/deviations` `connections[]` already shows every login.
      required: [id, name, siteUrl, enabled, projectKeys, mappingOk]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        siteUrl: { type: string }
        enabled: { type: boolean, description: "An import or a bind goes through an enabled connection only; a disabled one is listed because its links are." }
        projectKeys:
          type: array
          maxItems: 50
          items: { type: string }
        mappingOk: { type: boolean, description: "False when the effective mapping cannot be resolved against the discovery now." }
    JiraNodeLink:
      type: object
      required: [level, nodeId, bindingId, connectionId, issueKey, gone]
      properties:
        level: { type: string, enum: [PROGRAM, PROJECT] }
        nodeId: { type: integer, format: int32, minimum: 0, description: "The program or project the binding sits on." }
        bindingId: { type: integer, format: int32, minimum: 0 }
        connectionId: { type: integer, format: int32, minimum: 0 }
        issueKey: { type: string }
        gone: { type: boolean, description: "The binding's observation says the issue is gone from Jira (false when never observed)." }
    DeviationConnection:
      description: >-
        A connection as the view lists it: its name, site and project keys, never the email, token or mapping. `mappingOk` is false
        when its effective mapping cannot be resolved against its discovery now (never discovered, unreadable or stale). `status` is
        the derived sync state, computed per read from the same snapshot (nothing stored); it and `lastRun` are operational and
        secret-free (never the token, an error message or a count). The registry itself is ADMIN only.
      type: object
      required: [id, name, siteUrl, enabled, projectKeys, mappingOk, lastRun, status]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        siteUrl: { type: string }
        enabled: { type: boolean, description: "A bind goes through an enabled connection only; a disabled one is listed because its bindings are." }
        projectKeys:
          type: array
          maxItems: 50
          items: { type: string }
          description: The connection's Jira project keys, the import's scope options (not secrets, so every login reads them).
        mappingOk: { type: boolean, description: "False when the effective mapping cannot be resolved against the discovery now: no level or estimate comparison is raised for this connection's bindings, and a bind through it is refused with `409`." }
        lastRun:
          allOf:
            - $ref: '#/components/schemas/SyncLastRun'
          nullable: true
        status: { $ref: '#/components/schemas/SyncStatus' }
    DeviationTotals:
      type: object
      description: >-
        Before the 2,000-item cap. `bindings` counts what the list answers (the filtered ones, so only open ones unless `all`,
        `acknowledged` or a project or team filter applies - not the number of links); `warnings`, `infos`, `gone`, `stillInJira` and
        `acknowledged` share one basis, the bindings matching every filter but the acknowledgement state, so all are known whichever
        state the list shows.
      required: [warnings, infos, bindings, gone, stillInJira, acknowledged]
      properties:
        warnings: { type: integer, format: int32, minimum: 0, description: "The OPEN WARNING lines (listed deviations without a current acknowledgement) of the open bindings matching every filter but the acknowledgement state." }
        infos: { type: integer, format: int32, minimum: 0, description: "The OPEN INFO lines of the open bindings matching every filter but the acknowledgement state." }
        bindings: { type: integer, format: int32, minimum: 0, description: "The bindings the list answers (the open ones by default), before the cap." }
        gone: { type: integer, format: int32, minimum: 0, description: "The OPEN bindings (matching every filter but the acknowledgement state) whose issue is gone." }
        stillInJira: { type: integer, format: int32, minimum: 0, description: "Part of `gone` (never more), on the same basis: the open gone bindings whose `goneReason` is `MOVED_OUT` or `NOT_LISTED`, i.e. the issue still exists in Jira but outside the connection's scope." }
        acknowledged: { type: integer, format: int32, minimum: 0, description: "The bindings with at least one CURRENTLY acknowledged line among those matching every filter but `acknowledged` (and the default that hides them)." }
    DeviationNode:
      type: object
      description: The bound node and every level it sits under (its own level included); a program has no project and only a milestone has a team.
      required: [kind, id, name, projectId, projectName, programId, programName, workStreamId, workStreamName, teamId, teamName]
      properties:
        kind: { $ref: '#/components/schemas/PlanLevel' }
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        projectId: { type: integer, format: int32, minimum: 0, nullable: true }
        projectName: { type: string, nullable: true }
        programId: { type: integer, format: int32, minimum: 0, nullable: true }
        programName: { type: string, nullable: true }
        workStreamId: { type: integer, format: int32, minimum: 0 }
        workStreamName: { type: string }
        teamId: { type: integer, format: int32, minimum: 0, nullable: true }
        teamName: { type: string, nullable: true }
    JiraRollup:
      type: object
      description: >-
        An epic's children as the last census holds them: the non-sub-task Jira issues at the child level (the milestone mapping's
        hierarchy level minus one, never below 0) whose parent is the bound issue. Read from the mirror the sync run keeps, never from
        Jira at request time; absent (null where it is a member) while the issue has no mirrored child.
      required: [children, done, points, observedAt]
      properties:
        children: { type: integer, format: int32, minimum: 1, description: The children counted. }
        done: { type: integer, format: int32, minimum: 0, description: "How many of them are in a `done` status category (at most `children`)." }
        points: { type: number, format: double, nullable: true, description: "The sum of the children's story points (the discovery's story-points field, unit points, never converted to man-days); null when no child carries a value." }
        observedAt: { type: integer, format: int64, description: Epoch millis of the newest observation of any counted child. }
    DeviationJira:
      type: object
      description: Jira's side as last observed; everything after `url` is null for a binding never observed (`rollup` also for a binding that is not a milestone or whose issue has no mirrored child).
      required: [issueId, key, previousKey, url, summary, typeName, hierarchyLevel, statusName, statusCategory, start, end, estimate, estimateUnit, parentKey, teamName, observedAt, gone, rollup]
      properties:
        issueId: { type: string }
        key: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,9}-[0-9]{1,10}$', maxLength: 21, description: "The issue's current key as Jira last answered it: after a run's by-id probe read a gone issue, the key that answer carried (an issue moved to another project, possibly one outside the connection's project keys, shows its new key)." }
        previousKey: { type: string, nullable: true, description: "The key the issue was last READ under (usually the one it was linked with; an issue renamed in scope is read under its new key) when a probe has since followed it to the current `key` (a moved issue); null when the two are equal or the binding was never observed. The same value the bindings list carries as `observation.issueKey`." }
        url: { type: string, description: "`<site>/browse/<key>`, under the current key." }
        summary: { type: string, nullable: true, maxLength: 255 }
        typeName: { type: string, nullable: true }
        hierarchyLevel: { type: integer, format: int32, nullable: true }
        statusName: { type: string, nullable: true }
        statusCategory: { type: string, enum: [TODO, IN_PROGRESS, DONE, UNKNOWN], nullable: true }
        start: { type: string, format: date, nullable: true }
        end: { type: string, format: date, nullable: true }
        estimate: { type: number, format: double, nullable: true, description: "In `estimateUnit`." }
        estimateUnit: { $ref: '#/components/schemas/NullableEstimateUnit' }
        parentKey: { type: string, nullable: true }
        teamName: { type: string, nullable: true }
        observedAt: { type: integer, format: int64, nullable: true }
        gone: { type: boolean }
        rollup:
          allOf:
            - $ref: '#/components/schemas/JiraRollup'
          nullable: true
    DeviationPlan:
      type: object
      description: "The plan's side. `start`/`end` are the dates compared: a milestone's stored dates, a project's or program's derived span (then equal to `spanStart`/`spanEnd`, which are null for a milestone)."
      required: [start, end, estimateMd, targetStart, targetEnd, spanStart, spanEnd]
      properties:
        start: { type: string, format: date, nullable: true }
        end: { type: string, format: date, nullable: true }
        estimateMd: { type: number, format: double, nullable: true, description: A milestone's man-days. }
        targetStart: { type: string, format: date, nullable: true }
        targetEnd: { type: string, format: date, nullable: true }
        spanStart: { type: string, format: date, nullable: true }
        spanEnd: { type: string, format: date, nullable: true }
    DeviationItem:
      type: object
      required: [bindingId, connectionId, level, node, jira, plan, deviations, fingerprint, can]
      properties:
        bindingId: { type: integer, format: int32, minimum: 0 }
        connectionId: { type: integer, format: int32, minimum: 0 }
        level: { $ref: '#/components/schemas/PlanLevel' }
        node: { $ref: '#/components/schemas/DeviationNode' }
        jira: { $ref: '#/components/schemas/DeviationJira' }
        plan: { $ref: '#/components/schemas/DeviationPlan' }
        deviations:
          type: array
          description: WARNING first, then by kind; empty for a binding with no deviation (only with `all`). Every listed line, each with the state of its own acknowledgement, whatever the status filter.
          items:
            $ref: '#/components/schemas/DeviationLine'
        fingerprint:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            The SHA-256 (lower-case hex) of the canonical JSON of the binding's FULL deviation list (`ESTIMATE_NOT_COMPARABLE`
            included even where `deviations` hides it), the same for every filter and stable across reads while nothing changes: the
            token to send back to `POST .../acknowledge`, for one line (with `kind`) or for all.
        can: { $ref: '#/components/schemas/DeviationCan' }
    DeviationLine:
      type: object
      description: One listed deviation with the state of its own acknowledgement.
      required: [kind, severity, detail, acknowledgement]
      properties:
        kind: { $ref: '#/components/schemas/DeviationKind' }
        severity: { $ref: '#/components/schemas/Severity' }
        detail: { $ref: '#/components/schemas/DeviationDetail' }
        acknowledgement:
          allOf:
            - $ref: '#/components/schemas/DeviationAcknowledgement'
          nullable: true
    DeviationAcknowledgement:
      type: object
      description: A stored acknowledgement of one line. A line that leaves the list and returns identical is still acknowledged.
      required: [at, by, current]
      properties:
        at: { type: integer, format: int64, description: "When it was acknowledged (epoch milliseconds)." }
        by: { type: string, nullable: true, description: "The acknowledging login's ACTIVE person's name, else its display name; never the email; null once that login is deleted." }
        current:
          type: boolean
          description: "True while the stored fingerprint equals the line's now. False = acknowledged, then changed since, so the line is open again."
    DeviationCan:
      type: object
      required: [acknowledge]
      properties:
        acknowledge: { type: boolean, description: "The caller may acknowledge and unacknowledge this binding: ADMIN, the person owning the bound node or anything above it, or - on a milestone binding only - the active manager of the milestone's team." }
    AcknowledgeRequest:
      type: object
      description: >-
        `kind`, optional and nullable, is the one deviation to acknowledge; absent or null acknowledges the lines without a current
        acknowledgement (every line when each has one).
      required: [fingerprint]
      properties:
        fingerprint:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The `fingerprint` of the ITEM the client read (the list's, for one line or for all).
        kind: { $ref: '#/components/schemas/NullableDeviationKind' }
    Acknowledgement:
      type: object
      description: "`kind` is the line acknowledged, null for the kind-less call."
      required: [bindingId, kind, fingerprint, acknowledgedAt, acknowledgedBy]
      properties:
        bindingId: { type: integer, format: int32, minimum: 0 }
        kind: { $ref: '#/components/schemas/NullableDeviationKind' }
        fingerprint: { type: string, pattern: '^[0-9a-f]{64}$', description: "The ITEM's list fingerprint the client sent (the per-line fingerprints are stored, never returned)." }
        acknowledgedAt: { type: integer, format: int64, description: Epoch milliseconds. }
        acknowledgedBy: { type: string, nullable: true, description: "The acknowledging login's active person's name, else its display name; never the email." }
    DeviationView:
      type: object
      required: [revision, asOf, connections, totals, items, truncated]
      properties:
        revision: { type: integer, format: int64, minimum: 0, description: "The PLAN's revision, read before the rows; this view moves none." }
        asOf: { type: string, format: date, description: "The UTC date `PROGRESS_MISMATCH` measured against." }
        connections:
          type: array
          description: EVERY active connection, by name (case-insensitive) and id - bound or not, enabled or not.
          items:
            $ref: '#/components/schemas/DeviationConnection'
        totals: { $ref: '#/components/schemas/DeviationTotals' }
        items:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/DeviationItem'
        truncated: { type: boolean, description: "True when more than 2,000 bindings matched and the tail was dropped." }
    RoadmapView:
      type: object
      required: [revision, can, teams, ranked, unranked, links, jiraSites]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The ranking's revision (the plan revision at which the rank was last written), read before the rows; send it back as `expectedRevision`.
        can:
          type: object
          required: [editRank]
          properties:
            editRank: { type: boolean, description: The caller may replace the ranking (ADMIN or a roadmap editor). }
        teams:
          type: array
          description: The active teams with at least one active milestone in the plan, by name (case-insensitive) and id.
          items:
            $ref: '#/components/schemas/TeamRef'
        ranked:
          type: array
          description: The ranked projects in position order.
          items:
            $ref: '#/components/schemas/RoadmapRankedProject'
        unranked:
          type: array
          description: The active projects without a position, by name.
          items:
            $ref: '#/components/schemas/RoadmapProject'
        links:
          type: array
          description: The dependencies between projects, rolled up per ordered pair (predecessor, successor project id).
          items:
            $ref: '#/components/schemas/RoadmapLink'
        jiraSites:
          type: array
          description: >-
            The Jira connections, enabled or not, that a binding in this document's scope links to (a roadmap or programs document also lists a connection that only has milestone bindings), by connection id, once per document; the client builds a row's
            browse URL as `siteUrl + "/browse/" + jira.issueKey`. Empty when nothing is linked.
          items:
            $ref: '#/components/schemas/JiraSite'
        baseline:
          $ref: '#/components/schemas/RoadmapBaseline'
        criticalPath:
          $ref: '#/components/schemas/RoadmapCriticalPath'
    RoadmapCriticalPath:
      type: object
      required: [projectId, projects, pairs]
      description: >-
        Present only with `?criticalPath=N`, on `GET /views/roadmap` and `GET /views/programs` (the same block for the same plan): the
        critical chain toward project N's end over the whole plan graph on the planned dates (the project view's rule), rolled up to
        projects and project pairs. A project with nothing scheduled answers both lists empty.
      properties:
        projectId: { type: integer, format: int32, minimum: 0, description: The target project (N). }
        projects:
          type: array
          description: >-
            The OTHER projects upstream of the target's end, by hops, slack and id (the target is implied); empty while nothing is
            scheduled in it.
          items:
            $ref: '#/components/schemas/RoadmapCriticalProject'
        pairs:
          type: array
          description: >-
            The ordered project pairs holding at least one link on the chain, by (predecessor, successor) project id; a pair with a
            direct link and several milestone links is critical when any of them is (the per-link truth is the project view's).
          items:
            $ref: '#/components/schemas/RoadmapCriticalPair'
    RoadmapCriticalProject:
      type: object
      required: [projectId, slackDays, critical, hops]
      properties:
        projectId: { type: integer, format: int32, minimum: 0 }
        slackDays: { type: integer, format: int32, minimum: 0, description: "The least slack, in working days, among the project's upstream milestones (itself, when a link names it)." }
        critical: { type: boolean, description: Any of them is on the chain (zero slack). }
        hops: { type: integer, format: int32, minimum: 1, description: The fewest links between any of them and the target. }
    RoadmapCriticalPair:
      type: object
      required: [predecessorProjectId, successorProjectId]
      description: An ordered project pair with a link on the chain; marks the pair's direct and bundle arrows.
      properties:
        predecessorProjectId: { type: integer, format: int32, minimum: 0 }
        successorProjectId: { type: integer, format: int32, minimum: 0 }
    TeamRef:
      type: object
      description: A team named by its id and its name.
      required: [id, name]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
    RoadmapRankedProject:
      type: object
      required: [position, project]
      properties:
        position: { type: integer, format: int32, minimum: 1, description: 'Dense: the ranked projects hold 1..n.' }
        project:
          $ref: '#/components/schemas/RoadmapProject'
    RoadmapProject:
      type: object
      required: [id, name, programId, programName, workStreamId, workStreamName, ownerPersonId, ownerName, targetStart, targetEnd, rankPosition, teamIds, span, drift, flags, can, jira]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        programId: { type: integer, format: int32, minimum: 0 }
        programName: { type: string }
        workStreamId: { type: integer, format: int32, minimum: 0 }
        workStreamName: { type: string }
        ownerPersonId: { type: integer, format: int32, minimum: 0 }
        ownerName: { type: string }
        targetStart: { type: string, format: date, nullable: true }
        targetEnd: { type: string, format: date, nullable: true }
        rankPosition: { type: integer, format: int32, minimum: 1, nullable: true, description: The project's position in the global rank; null = unranked. }
        teamIds:
          type: array
          description: The distinct teams of the project's active milestones (scheduled or not), ascending.
          items: { type: integer, format: int32, minimum: 0 }
        span:
          nullable: true
          description: The earliest start to the latest end over the project's scheduled milestones; null when none is scheduled.
          allOf:
            - $ref: '#/components/schemas/DateSpan'
        drift:
          nullable: true
          description: '`span` against the target window; null unless both exist.'
          allOf:
            - $ref: '#/components/schemas/Drift'
        flags:
          type: array
          description: >-
            The drift and rank-inversion flags, the Jira ones (`JIRA_DEVIATION` per open line of its own binding, one
            `JIRA_MILESTONES` roll-up of its milestones, never one flag per milestone) and one `FLOW_CAPACITY_MILESTONES` per team
            with an open Flow capacity difference over its scheduled milestones; WARNING first, then by kind, team and other project.
          items:
            $ref: '#/components/schemas/PlanFlag'
        flowPendingTeamIds:
          type: array
          description: >-
            The teams (ids ascending) with a scheduled milestone of this project whose Flow capacity comparison is pending (the
            team's sprint snapshot is incomplete): a neutral marker, never a warning and in no flag count. Absent when there is none.
          items: { type: integer, format: int32, minimum: 0 }
        can:
          type: object
          required: [editTargetWindow]
          properties:
            editTargetWindow: { type: boolean, description: 'The caller may `PUT /projects/{id}/target-window`: ADMIN, an owner above the project, or a ROADMAP_EDITOR holder.' }
        jira:
          nullable: true
          description: The project's own Jira item; null when it is unbound. Through a disabled connection it is kept with null dates.
          allOf:
            - $ref: '#/components/schemas/JiraLink'
        baseline:
          $ref: '#/components/schemas/RoadmapProjectBaseline'
    PlanFlag:
      type: object
      required: [kind, severity]
      description: >-
        A flag raised on a project, a milestone or a team; a warning only, nothing is ever moved. Only `kind` and `severity` are
        always present; every other member is absent (never `null`) when it does not apply to the kind. `FLOW_CAPACITY_MILESTONES` is
        raised when a scheduled milestone of the project on that team lies in days an open capacity difference of the team covers:
        WARNING when the plan holds more capacity than Flow in a sprint such a milestone meets, else INFO. An acknowledged difference,
        a disabled Flow connection, an unscheduled milestone or a team whose Flow team is gone raises nothing.
      properties:
        kind:
          type: string
          enum: [DRIFT_END_LATE, DRIFT_START_LATE, DRIFT_END_EARLY, RANK_INVERSION, NO_WORKING_DAY, JIRA_DEVIATION, JIRA_MILESTONES, FLOW_CAPACITY, FLOW_CAPACITY_MILESTONES, FLOW_CAPACITY_PENDING]
          description: >-
            Drift: `DRIFT_END_LATE` (WARNING), `DRIFT_START_LATE` and `DRIFT_END_EARLY` (INFO). `RANK_INVERSION`. `NO_WORKING_DAY`.
            `JIRA_DEVIATION`: one open line. `JIRA_MILESTONES`: a project's roll-up. `FLOW_CAPACITY`: a team's roll-up. 
            `FLOW_CAPACITY_MILESTONES`: one team's share of a project. `FLOW_CAPACITY_PENDING`: a neutral team flag (severity INFO).
        severity: { $ref: '#/components/schemas/Severity' }
        days:
          type: integer
          format: int32
          minimum: 1
          description: 'Calendar days: the drift, or for a rank inversion how much earlier this project starts than `otherProjectId`; absent on every other kind.'
        teamId:
          type: integer
          format: int32
          minimum: 0
          description: The shared team of a per-team rank inversion, or the team of a `FLOW_CAPACITY_MILESTONES` flag; absent for drift, for the no-shared-team INFO and on every other kind.
        otherProjectId:
          type: integer
          format: int32
          minimum: 0
          description: >-
            The higher-ranked project A of a `RANK_INVERSION`, raised on the lower-ranked B; absent on every other kind. Per team,
            adjacent ranked projects with scheduled work there where B starts strictly before A: WARNING with that `teamId`, `days` =
            how much earlier. Adjacent ranked projects sharing no team with scheduled work, B's span starting before A's: INFO, no
            `teamId`. A tie is no inversion.
        deviation:
          description: The evidence of a `JIRA_DEVIATION` flag (its severity is the flag's, not repeated inside); absent on every other kind.
          allOf:
            - $ref: '#/components/schemas/FlagDeviation'
        count:
          type: integer
          format: int32
          minimum: 1
          description: >-
            The milestones of the project that raised a Jira flag, for `JIRA_MILESTONES` (the flag's severity is the worst among
            them); the open sprint rows for `FLOW_CAPACITY` (a sprint the plan has no capacity for counts as an INFO row); the
            project's milestones on the team in the disputed days for `FLOW_CAPACITY_MILESTONES`. Absent on every other kind.
    JiraLink:
      type: object
      required: [bindingId, connectionId, issueKey, start, end, rollup]
      description: >-
        A plan node's Jira item. Find its connection in the document's `jiraSites`. Present for every bound node; through a disabled
        connection the dates and the roll-up are null (nothing refreshes it) and the node raises no flag. Through an enabled one the
        node's open deviation lines raise `JIRA_DEVIATION` flags (`ESTIMATE_NOT_COMPARABLE` never does) and a project's milestones add
        one `JIRA_MILESTONES` roll-up.
      properties:
        bindingId: { type: integer, format: int32, minimum: 0 }
        connectionId: { type: integer, format: int32, minimum: 0 }
        issueKey: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,9}-[0-9]{1,10}$', maxLength: 21, description: "The issue's current key as Jira last answered it, possibly outside the connection's project keys (a moved issue shows its new key)." }
        start: { type: string, format: date, nullable: true, description: 'The start Jira was last observed to hold; null when never observed, absent in Jira, or the item is gone.' }
        end: { type: string, format: date, nullable: true, description: 'The end Jira was last observed to hold; null when never observed, absent in Jira, or the item is gone.' }
        rollup:
          description: >-
            A milestone's epic's children as the last census holds them, the figure `GET /views/deviations` serves as `jira.rollup`;
            null for a project link, a disabled connection, a gone issue, or an epic with no mirrored child.
          allOf:
            - $ref: '#/components/schemas/JiraRollup'
          nullable: true
    JiraSite:
      type: object
      required: [connectionId, siteUrl, state, mappingOk]
      description: >-
        A Jira connection (enabled or not) that a binding in the document's scope links to, with its derived sync state and whether
        its mapping fits, so a client can say a figure may be out of date. `state` and `mappingOk` are operational and already public
        (`connections[].status.state` and `connections[].mappingOk` of `GET /views/deviations`). Never the connection's name, project
        keys, last run, error code or any credential.
      properties:
        connectionId: { type: integer, format: int32, minimum: 0 }
        siteUrl: { type: string, description: 'The site''s origin, e.g. `https://example.atlassian.net`; append `/browse/` and an issue key.' }
        state:
          allOf: [{ $ref: '#/components/schemas/SyncState' }]
          description: >-
            The connection's derived sync state: `DISABLED` switched off; `FAILED` the newest finished run failed or was abandoned, or
            the newest run was interrupted; `NEVER_SYNCED` no run ever succeeded; `STALE` the last success is older than three polling
            intervals; else `CURRENT` (a manual-only connection stays `CURRENT` after any success).
        mappingOk:
          type: boolean
          description: Whether the connection's effective mapping resolves against its stored discovery now (`GET /views/deviations` `connections[].mappingOk`).
    RoadmapLink:
      type: object
      required: [predecessorProjectId, successorProjectId, direct, milestoneLinks]
      description: The dependencies between two projects, rolled up for one ORDERED pair. Links inside one project are not listed.
      properties:
        predecessorProjectId: { type: integer, format: int32, minimum: 0 }
        successorProjectId: { type: integer, format: int32, minimum: 0 }
        direct:
          nullable: true
          description: The project-to-project link of the pair (at most one per ordered pair); null when there is none.
          allOf:
            - $ref: '#/components/schemas/RoadmapDirectLink'
        milestoneLinks:
          $ref: '#/components/schemas/RoadmapLinkBundle'
    RoadmapDirectLink:
      type: object
      required: [id, type, lagDays, check]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        type: { $ref: '#/components/schemas/DependencyType' }
        lagDays: { type: integer, format: int32, description: Working days; negative = a lead. }
        check: { $ref: '#/components/schemas/DependencyCheck' }
    RoadmapLinkBundle:
      type: object
      required: [count, violated, unscheduled]
      description: The links between the pair that have a milestone on either end (a milestone-to-project link counts here).
      properties:
        count: { type: integer, format: int32, minimum: 0 }
        violated: { type: integer, format: int32, minimum: 0, description: How many of them are violated. }
        unscheduled: { type: integer, format: int32, minimum: 0, description: How many could not be evaluated (an end has no dates). }
    FlagCounts:
      type: object
      required: [warnings, infos]
      description: The roll-up of the flags raised on a set of projects (a program's or a work stream's).
      properties:
        warnings: { type: integer, format: int32, minimum: 0, description: How many flags are WARNINGs. }
        infos: { type: integer, format: int32, minimum: 0, description: How many flags are INFOs. }
    HomeView:
      type: object
      required: [revision, plan, me, jiraSites]
      description: >-
        The plan's figures (`plan`) and the caller's own items (`me`). Every figure is one an existing view shows, so Home never
        disagrees with the view it links to.
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The PLAN revision, read before the rows. Informational - Home sends nothing back.
        plan:
          $ref: '#/components/schemas/HomePlan'
        me:
          nullable: true
          description: The caller's own items; null when the login is not linked to an ACTIVE person.
          allOf:
            - $ref: '#/components/schemas/HomeMe'
        jiraSites:
          type: array
          description: The roadmap view's `jiraSites`, entry for entry (the connections behind the bound projects and milestones).
          items:
            $ref: '#/components/schemas/JiraSite'
    HomePlan:
      type: object
      required: [workStreams, programs, projects, rankedProjects, unrankedProjects, milestones, unscheduledMilestones, flags, conflicts, overloadedTeams, wipExceededTeams]
      description: The whole plan in figures; the same for every caller.
      properties:
        workStreams: { type: integer, format: int32, minimum: 0, description: "The active work streams." }
        programs: { type: integer, format: int32, minimum: 0, description: The active programs. }
        projects: { type: integer, format: int32, minimum: 0, description: The active projects. }
        rankedProjects: { type: integer, format: int32, minimum: 0, description: "The projects with a position in the global rank." }
        unrankedProjects: { type: integer, format: int32, minimum: 0, description: The projects without a position. }
        milestones: { type: integer, format: int32, minimum: 0, description: The active milestones. }
        unscheduledMilestones: { type: integer, format: int32, minimum: 0, description: The active milestones without dates. }
        flags:
          description: The warnings and infos the roadmap view raises over every project, Jira's included.
          allOf:
            - $ref: '#/components/schemas/FlagCounts'
        conflicts: { type: integer, format: int32, minimum: 0, description: 'The violated dependencies: each link once, a link inside one project included.' }
        overloadedTeams: { type: integer, format: int32, minimum: 0, description: "The teams with at least one week the team view flags overloaded." }
        wipExceededTeams: { type: integer, format: int32, minimum: 0, description: The teams with at least one week over their WIP limit. }
    HomeMe:
      type: object
      required: [personId, name, workStreams, programs, projects, teams, truncated]
      description: >-
        What the caller's linked person may manage through the owner chain and the teams that person manages, each list holding at
        most 100 rows: the work streams they own; the programs they own or that sit in a work stream they own; the projects they own
        or that sit in one of those programs (each of the last two says whose it is and whether it is the person's own, `direct`).
      properties:
        personId: { type: integer, format: int32, minimum: 0 }
        name: { type: string, description: The person's name. }
        workStreams:
          type: array
          description: Open work streams first, then closed ones, each by name (case-insensitive, then id).
          items:
            $ref: '#/components/schemas/HomeWorkStream'
        programs:
          type: array
          description: By name (case-insensitive, then id).
          items:
            $ref: '#/components/schemas/HomeProgram'
        projects:
          type: array
          description: Ranked projects in rank order, then the unranked ones by name (case-insensitive, then id).
          items:
            $ref: '#/components/schemas/HomeProject'
        teams:
          type: array
          description: By name (case-insensitive, then id).
          items:
            $ref: '#/components/schemas/HomeTeam'
        truncated: { type: boolean, description: At least one of the four lists was cut at 100 rows. }
    HomeWorkStream:
      type: object
      required: [id, name, endDate, programs, projects, flags]
      description: A work stream's row.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        endDate: { type: string, format: date, nullable: true, description: Set only when the work stream is closed. }
        programs: { type: integer, format: int32, minimum: 0 }
        projects: { type: integer, format: int32, minimum: 0, description: The projects under all its programs. }
        flags:
          description: The flags of those projects, rolled up.
          allOf:
            - $ref: '#/components/schemas/FlagCounts'
    HomeProgram:
      type: object
      required: [id, name, workStreamName, ownerName, direct, projects, flags]
      description: A program's row.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        workStreamName: { type: string }
        ownerName: { type: string, description: The program's owner (a person's name). }
        direct: { type: boolean, description: 'True when the caller''s person is the program''s owner; false when the row is listed because that person owns its work stream.' }
        projects: { type: integer, format: int32, minimum: 0 }
        flags:
          description: The flags of its projects, rolled up.
          allOf:
            - $ref: '#/components/schemas/FlagCounts'
    HomeProject:
      type: object
      required: [id, name, programName, ownerName, direct, rankPosition, milestones, unscheduledMilestones, flags, conflicts]
      description: A project's roadmap row with the project view's milestone figures and conflicts count.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        programName: { type: string }
        ownerName: { type: string, description: The project's owner (a person's name). }
        direct: { type: boolean, description: 'True when the caller''s person is the project''s owner; false when the row is listed because that person owns its program or work stream.' }
        rankPosition: { type: integer, format: int32, minimum: 1, nullable: true, description: The position in the global rank; null = unranked. }
        milestones: { type: integer, format: int32, minimum: 0 }
        unscheduledMilestones: { type: integer, format: int32, minimum: 0 }
        flags:
          description: The warnings and infos the Roadmap counts for this project, Jira's included.
          allOf:
            - $ref: '#/components/schemas/FlagCounts'
        conflicts: { type: integer, format: int32, minimum: 0, description: 'The violated dependencies with an end in this project, each once.' }
    HomeTeam:
      type: object
      required: [id, name, milestones, unscheduledMilestones, conflicts, overloadedWeeks, wipExceededWeeks, jira, flags]
      description: A managed team's figures, the team view's own.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        milestones: { type: integer, format: int32, minimum: 0 }
        unscheduledMilestones: { type: integer, format: int32, minimum: 0 }
        conflicts: { type: integer, format: int32, minimum: 0, description: 'The violated dependencies with a milestone end in this team, each once.' }
        overloadedWeeks: { type: integer, format: int32, minimum: 0, description: "The weeks the team view flags overloaded." }
        wipExceededWeeks: { type: integer, format: int32, minimum: 0, description: The weeks over the WIP limit. }
        jira:
          description: The open Jira deviations of the team's milestones, by severity.
          allOf:
            - $ref: '#/components/schemas/FlagCounts'
        flags:
          type: array
          description: The team view's `team.flags` - at most one `FLOW_CAPACITY` or `FLOW_CAPACITY_PENDING` flag.
          items:
            $ref: '#/components/schemas/PlanFlag'
    TeamLoadView:
      type: object
      required: [revision, currentWeekStart, totals, teams, truncated, warningWeeksTruncated]
      description: >-
        Every team's milestones and flagged weeks. Every figure is one the team view shows, so the list never disagrees with it or
        with Home.
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The plan revision, read before the rows. Informational: nothing sends it back.
        currentWeekStart:
          type: string
          format: date
          description: >-
            The Monday of the server's current week (UTC), the same for every caller and never the caller's clock: the week from which
            the 2,000-week budget of the rows' `warningWeeks` is handed out first.
        totals:
          $ref: '#/components/schemas/TeamLoadTotals'
        teams:
          type: array
          maxItems: 200
          description: 'The active teams by name (case-insensitive, then id), at most 200.'
          items:
            $ref: '#/components/schemas/TeamLoadRow'
        truncated: { type: boolean, description: True when `teams` was cut at 200 rows. }
        warningWeeksTruncated:
          type: boolean
          description: >-
            True when a listed row left a warning week out because the document lists at most 2,000 in all: the weeks from
            `currentWeekStart` on first, the nearest first, then the earlier ones, the latest first (a tie goes to the earlier row; a
            team cut from `teams` uses none). The week counts of a row and `totals` never change with the cut.
    TeamLoadTotals:
      type: object
      required: [teams, overloadedTeams, wipExceededTeams]
      description: The figures over EVERY active team, whatever the rows cut.
      properties:
        teams: { type: integer, format: int32, minimum: 0, description: The active teams. }
        overloadedTeams: { type: integer, format: int32, minimum: 0, description: "The teams with at least one week the team view flags overloaded (Home's `plan.overloadedTeams`)." }
        wipExceededTeams: { type: integer, format: int32, minimum: 0, description: 'The teams with at least one week over the WIP limit (Home''s `plan.wipExceededTeams`).' }
    TeamLoadRow:
      type: object
      required: [id, name, managerName, milestones, unscheduledMilestones, overloadedWeeks, wipExceededWeeks, weeksWithoutCapacity, warningWeeks]
      description: One team's figures.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        managerName:
          type: string
          nullable: true
          description: The team's active manager; null when it has none (a deleted person is none).
        milestones: { type: integer, format: int32, minimum: 0, description: The team's active milestones. }
        unscheduledMilestones: { type: integer, format: int32, minimum: 0, description: The team's active milestones without dates. }
        overloadedWeeks: { type: integer, format: int32, minimum: 0, description: "The weeks the team view flags overloaded." }
        wipExceededWeeks: { type: integer, format: int32, minimum: 0, description: The weeks over the WIP limit. }
        weeksWithoutCapacity: { type: integer, format: int32, minimum: 0, description: 'The weeks of the team''s load with no capacity period in force (never flagged overloaded).' }
        warningWeeks:
          type: array
          maxItems: 520
          description: >-
            The team's overloaded or over-WIP-limit weeks, oldest first, each the team view's own `weeks[]` item (never with
            `flowCapacity`). While nothing is cut, `overloadedWeeks` is the number of listed weeks with `overloaded` and
            `wipExceededWeeks` the number with `wipExceeded`; the document lists at most 2,000 weeks in all (`warningWeeksTruncated`),
            so a row may list none or only some.
          items:
            $ref: '#/components/schemas/WeekLoad'
    DependencyListView:
      type: object
      required: [revision, totals, projects, teams, milestones, dependencies, truncated]
      description: >-
        Every dependency of the plan. A row names its ends by kind and id and carries the project view's own type, lag and check, so
        the list never disagrees with it; `totals.violated` is Home's `plan.conflicts`. `projects`, `teams` and `milestones` hold
        exactly what the listed rows name. The document is the same for every caller except each row's `can`.
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The plan revision, read before the rows. Informational: nothing sends it back.
        totals:
          $ref: '#/components/schemas/DependencyListTotals'
        projects:
          type: array
          maxItems: 2000
          description: >-
            The projects the listed rows name: a project end, and the project of every milestone in `milestones`; each once, by
            ascending id.
          items:
            $ref: '#/components/schemas/DependencyListProject'
        teams:
          type: array
          maxItems: 2000
          description: The teams of the milestones in `milestones`, each once, by ascending id.
          items:
            $ref: '#/components/schemas/TeamRef'
        milestones:
          type: array
          maxItems: 2000
          description: The milestones the listed rows name as an end, each once, by ascending id.
          items:
            $ref: '#/components/schemas/DependencyListMilestone'
        dependencies:
          type: array
          maxItems: 1000
          description: 'The dependencies in the project view''s order (violated first), at most 1000.'
          items:
            $ref: '#/components/schemas/DependencyListRow'
        truncated: { type: boolean, description: True when `dependencies` was cut at 1000 rows. }
    DependencyListTotals:
      type: object
      required: [links, violated, unscheduled]
      description: The figures over EVERY dependency, whatever the rows cut.
      properties:
        links: { type: integer, format: int32, minimum: 0, description: The active dependencies whose two ends resolve. }
        violated: { type: integer, format: int32, minimum: 0, description: 'The dependencies that do not hold, each once, one inside a single project included (Home''s `plan.conflicts`).' }
        unscheduled: { type: integer, format: int32, minimum: 0, description: The dependencies with an end that has no dates. }
    DependencyListProject:
      type: object
      required: [id, name]
      description: A project a listed dependency names (as an end, or as the project of a named milestone).
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        name: { type: string }
    DependencyListMilestone:
      type: object
      required: [id, name, projectId, teamId]
      description: A milestone a listed dependency names as an end; its project is in `projects`, its team in `teams`.
      properties:
        id: { type: integer, format: int32, minimum: 1 }
        name: { type: string }
        projectId: { type: integer, format: int32, minimum: 1, description: 'Its project, in the document''s `projects`.' }
        teamId: { type: integer, format: int32, minimum: 1, description: 'Its team, in the document''s `teams`.' }
    DependencyListRow:
      type: object
      required: [id, predecessor, successor, type, lagDays, check, can]
      description: >-
        One dependency: the project view's item (`ProjectDependency`) without `critical`, its two ends by kind and id; the names are
        in the document's `milestones`, `projects` and `teams`. `can` is the caller's own.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        predecessor: { $ref: '#/components/schemas/EndpointRef' }
        successor: { $ref: '#/components/schemas/EndpointRef' }
        type: { $ref: '#/components/schemas/DependencyType' }
        lagDays: { type: integer, format: int32, minimum: -365, maximum: 365, description: Working days; negative = a lead. }
        check: { $ref: '#/components/schemas/DependencyCheck' }
        can: { $ref: '#/components/schemas/DependencyCan' }
    ProgramsView:
      type: object
      required: [revision, teams, links, workStreams, jiraSites]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The plan revision, read before the rows. Informational: nothing sends it back.
        teams:
          type: array
          description: The roadmap view's `teams` (active teams with milestones in the plan, by name).
          items:
            $ref: '#/components/schemas/TeamRef'
        links:
          type: array
          description: The roadmap view's `links` (the dependencies between projects, rolled up per ordered pair).
          items:
            $ref: '#/components/schemas/RoadmapLink'
        workStreams:
          type: array
          description: Open work streams first, then closed ones, each by name (case-insensitive) then id.
          items:
            $ref: '#/components/schemas/ProgramsWorkStream'
        jiraSites:
          type: array
          description: >-
            The Jira connections, enabled or not, that a binding in this document's scope links to (a roadmap or programs document also lists a connection that only has milestone bindings), by connection id, once per document; the client builds a row's
            browse URL as `siteUrl + "/browse/" + jira.issueKey`. Empty when nothing is linked.
          items:
            $ref: '#/components/schemas/JiraSite'
        baseline:
          $ref: '#/components/schemas/RoadmapBaseline'
        criticalPath:
          $ref: '#/components/schemas/RoadmapCriticalPath'
    ProgramsWorkStream:
      type: object
      required: [id, name, ownerName, startDate, endDate, span, flags, programs]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        ownerName: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true, description: Set only when the work stream is closed. }
        span:
          nullable: true
          description: The earliest start to the latest end over its programs' spans; null when none of its projects is scheduled.
          allOf:
            - $ref: '#/components/schemas/DateSpan'
        flags:
          $ref: '#/components/schemas/FlagCounts'
        programs:
          type: array
          description: Every active program of the work stream (empty ones included), by name (case-insensitive) then id.
          items:
            $ref: '#/components/schemas/ProgramsProgram'
        baseline:
          $ref: '#/components/schemas/SpanBaseline'
    ProgramsProgram:
      type: object
      required: [id, name, ownerName, span, flags, projects]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        ownerName: { type: string }
        span:
          nullable: true
          description: The earliest start to the latest end over its projects' derived spans; null when none is scheduled.
          allOf:
            - $ref: '#/components/schemas/DateSpan'
        flags:
          $ref: '#/components/schemas/FlagCounts'
        projects:
          type: array
          description: The program's projects as the roadmap view's rows; ranked first in rank order, then the unranked by name and id.
          items:
            $ref: '#/components/schemas/RoadmapProject'
        baseline:
          $ref: '#/components/schemas/SpanBaseline'
    RankingUpdateRequest:
      type: object
      required: [expectedRevision, projectIds]
      properties:
        expectedRevision:
          type: integer
          format: int64
          description: The ranking's revision the client's list was read at (`RoadmapView.revision`); a `409` when the ranking was written at a later revision, or the value is above the current plan revision.
        projectIds:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: integer, format: int32, minimum: 0 }
          description: The COMPLETE ranking in order, best first. Projects not listed become unranked.
    RankingResponse:
      type: object
      required: [revision]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The plan revision after this write, which is also the ranking's new revision (the next `expectedRevision`).

    TeamOrderUpdateRequest:
      type: object
      required: [expectedRevision, milestoneIds]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
          description: The team's order revision the client's list was read at (`order.revision` of the team view); a stale one is a `409`.
        milestoneIds:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: integer, format: int32, minimum: 0 }
          description: >-
            The listed milestones of the team in execution order, first first - every one an ACTIVE milestone of THIS team. The team's
            milestones not listed follow them in the default order (the project rank). An empty list resets the order to the project rank.
    TeamOrderResponse:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, format: int64, minimum: 0, description: The plan revision after this write - the team's order revision from now on. }
    WorkStreamOrderUpdateRequest:
      type: object
      required: [expectedRevision, workStreamIds]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
          description: The work stream order's revision the client's list was read at; a stale one is a `409`.
        workStreamIds:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: integer, format: int32, minimum: 0 }
          description: >-
            The listed work streams in order, first first - every one an ACTIVE work stream. The streams not listed follow them by name.
            An empty list resets the order to name order. Closed streams are shown last whatever their position.
    ProgramOrderUpdateRequest:
      type: object
      required: [expectedRevision, programIds]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
          description: This work stream's program order revision the client's list was read at; a stale one is a `409`.
        programIds:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: integer, format: int32, minimum: 0 }
          description: >-
            The listed programs of the work stream in order, first first - every one an ACTIVE program OF THIS work stream. Its other
            programs follow them by name. An empty list resets the order to name order.
    PlanOrderResponse:
      type: object
      required: [revision]
      properties:
        revision: { type: integer, format: int64, minimum: 0, description: The plan revision after this write - the written list's order revision from now on. }
    TeamScheduleBatchRequest:
      type: object
      required: [expectedRevision, items]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The plan revision of the view the items were derived from (a proposal's `revision`). Negative is `400`. An item is
            skipped as `STALE` only when its milestone's schedule was written after it; above the current plan revision is `409`
            for the whole batch.
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/TeamScheduleBatchItem' }
          description: >-
            One to 1000 entries, one per milestone (an id twice is `400`), applied in this order. An item with one date, a bad
            date, an end before the start or a span of only weekend days is `400`; a span with no working day on the current
            holiday calendar is skipped as `NO_WORKING_DAY`.
        scopeHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            The proposal's `scopeHash`, an opaque token (64 lowercase hex digits, else `400`) to send back unchanged. Present =
            the whole batch is refused (`409`, `stale-scope`) when the team's plan changed since that proposal, or when a changed
            holiday dictionary would give an accepted milestone another date; absent = no scope check. A run's `scopeHash` never
            matches.
    TeamScheduleBatchItem:
      type: object
      required: [milestoneId]
      description: The single schedule PUT's body for one milestone.
      properties:
        milestoneId: { type: integer, format: int32, minimum: 0 }
        startDate: { type: string, format: date, nullable: true, description: Inclusive. Both dates or neither (neither unschedules). }
        endDate: { type: string, format: date, nullable: true, description: Inclusive; not before `startDate`; the span needs a working day. }
    TeamScheduleBatchResponse:
      type: object
      required: [revision, accepted, skipped]
      properties:
        revision: { type: integer, format: int64, minimum: 0, description: The plan revision after this write (one bump for the whole batch). }
        accepted:
          type: array
          items: { type: integer, format: int32, minimum: 0 }
          description: The milestones whose dates were written, in request order.
        skipped:
          type: array
          items: { $ref: '#/components/schemas/SkippedSchedule' }
          description: The milestones that were not written, in request order, each with its reason.
    SkippedSchedule:
      type: object
      required: [milestoneId, reason]
      properties:
        milestoneId: { type: integer, format: int32, minimum: 0 }
        reason:
          type: string
          enum: [STALE, GONE, NOT_ON_TEAM, NO_WORKING_DAY]
          description: >-
            STALE: the milestone's schedule was written after `expectedRevision`. GONE: no active milestone has this id. NOT_ON_TEAM: the
            milestone is not on this team. NO_WORKING_DAY: the span holds no working day of the current holiday calendar.
    ScheduleProposalRequest:
      type: object
      required: [asOf]
      properties:
        asOf:
          type: string
          format: date
          description: >-
            The viewer's calendar day, 1900-01-01 to 2990-01-05 (a later day is `400`). Milestones of the team that start after
            it, or have no dates, may move; the others are fixed.
    ScheduleProposal:
      type: object
      required: [revision, asOf, teamId, moves, unchanged, unplaced, pinned, weeks, weeksTruncated, dependencies, scopeHash]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The plan revision the proposal was computed from; send it back as `expectedRevision` of the batch accept.
        scopeHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            An opaque 64-hex token fingerprinting what the proposal read about the team beyond its milestones' schedule revisions
            (the public holidays and `asOf` included); send it back unchanged as the batch's `scopeHash`. Stable for one `asOf`
            while the team's plan and the holidays are unchanged.
        asOf: { type: string, format: date, description: 'The request''s `asOf`, echoed.' }
        teamId: { type: integer, format: int32, minimum: 0 }
        moves:
          type: array
          description: The movable milestones that change dates, in the team's effective order.
          items: { $ref: '#/components/schemas/ScheduleProposalMove' }
        unchanged:
          type: array
          description: The movable milestones that land on their current dates, in the team's effective order.
          items: { type: integer, format: int32, minimum: 0 }
        unplaced:
          type: array
          description: >-
            The movable milestones that got no dates, in the team's effective order; a scheduled one keeps its stored dates.
          items: { $ref: '#/components/schemas/ScheduleProposalUnplaced' }
        pinned:
          type: array
          description: >-
            The team's pinned, scheduled milestones starting after `asOf`, kept on their dates; in the team's effective order, in
            neither `moves` nor `unchanged`. Empty without pins.
          items: { type: integer, format: int32, minimum: 0 }
        weeks:
          type: array
          description: The team's weekly load AFTER accepting every move, in the team view's row shape (at most 520); empty while nothing would be scheduled.
          items: { $ref: '#/components/schemas/WeekLoad' }
        weeksTruncated: { type: boolean, description: True when `weeks` stops at 520 weeks. }
        dependencies:
          type: array
          description: >-
            The links touching the team (an end among its milestones, or a project end whose span changes) whose verdict is or was
            VIOLATED - before or after the moves; a link that is fine both times, or unscheduled and then fine, is not listed. Violated-after
            first. `before` is the link's status on the stored dates, `check` its check after; the dates are in the check.
          items: { $ref: '#/components/schemas/ScheduleProposalLink' }
    ScheduleProposalMove:
      type: object
      required: [milestoneId, name, projectId, projectName, estimateMd, from, to, workingDays, shiftDays]
      properties:
        milestoneId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        projectId: { type: integer, format: int32, minimum: 0 }
        projectName: { type: string }
        estimateMd: { type: number, format: double, minimum: 0 }
        from:
          allOf:
            - $ref: '#/components/schemas/DateSpan'
          nullable: true
          description: The stored dates; null = unscheduled.
        to:
          allOf:
            - $ref: '#/components/schemas/DateSpan'
          description: The proposed dates (both working days).
        workingDays: { type: integer, format: int32, minimum: 1, description: The working days in `to`. }
        shiftDays:
          type: integer
          format: int32
          nullable: true
          description: >-
            Working days from the current start to the proposed start - positive later, negative earlier; null when newly scheduled. A stored
            span that starts on a weekend or holiday counts from the next working day, so a move can have `shiftDays: 0` while its dates differ.
    ScheduleProposalUnplaced:
      type: object
      required: [milestoneId, name, projectId, projectName, reason]
      properties:
        milestoneId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        projectId: { type: integer, format: int32, minimum: 0 }
        projectName: { type: string }
        reason:
          type: string
          enum: [NO_CAPACITY, NO_ROOM]
          description: >-
            NO_CAPACITY: no working day with capacity at or after the milestone's earliest start (add a capacity period). NO_ROOM: usable
            days exist but no span fits within 520 weeks of the team's first usable day.
    ScheduleProposalLink:
      type: object
      required: [id, predecessor, successor, type, lagDays, before, check]
      description: A link the proposal touches whose verdict is or was VIOLATED - both ends named, the dates in the `check`.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        predecessor: { $ref: '#/components/schemas/ScheduleProposalEnd' }
        successor: { $ref: '#/components/schemas/ScheduleProposalEnd' }
        type: { $ref: '#/components/schemas/DependencyType' }
        lagDays: { type: integer, format: int32, minimum: -365, maximum: 365, description: Working days; negative = a lead. }
        before: { $ref: '#/components/schemas/DependencyStatus' }
        check: { $ref: '#/components/schemas/DependencyCheck' }
    ScheduleProposalEnd:
      type: object
      required: [kind, id, name, projectName]
      description: One end of a proposal link, named and nothing else (no dates, no team).
      properties:
        kind: { $ref: '#/components/schemas/EndpointKind' }
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        projectName:
          type: string
          nullable: true
          description: The milestone's project for a milestone end; null for a project end, whose `name` is the project.
    CrossTeamProposalRequest:
      type: object
      required: [asOf, teamIds]
      properties:
        asOf:
          type: string
          format: date
          description: >-
            The viewer's calendar day, 1900-01-01 to 2990-01-05 (a later day is `400`). A milestone of a run team that starts
            after it, or has no dates, may move; the others are fixed.
        teamIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: integer, format: int32, minimum: 0 }
          description: >-
            The run's teams: one to 50, each once, in any order (the server places them in dependency order). The caller must manage
            every one, or be ADMIN.
    CrossTeamAcceptRequest:
      type: object
      required: [expectedRevision, scopeHash, teamIds, items]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The run's `revision`. Negative is `400`. An item is skipped as `STALE` only when its milestone's schedule was written
            after it; above the current plan revision is `409` for the whole accept.
        scopeHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            The run's `scopeHash`, REQUIRED: an opaque token (64 lowercase hex digits, else `400`) to send back unchanged; a
            per-team proposal's never matches. The whole accept is refused (`409`, `stale-scope`) when the plan the run read
            changed, a milestone of a listed team that is not an item was scheduled since, or a changed holiday dictionary would
            give an accepted milestone another date.
        teamIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: integer, format: int32, minimum: 0 }
          description: >-
            The run's teams, exactly the proposal request's (a team whose moves were all unticked stays in the set: it is part of the run's
            premise and is checked and re-guarded). The caller must manage every one, or be ADMIN.
        items:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: '#/components/schemas/TeamScheduleBatchItem' }
          description: >-
            One to 2000 entries, one per milestone of any listed team (an id twice is `400`), applied in this order. An item with
            one date, a bad date, an end before the start or a span of only weekend days is `400`; a span with no working day on
            the current holiday calendar is skipped as `NO_WORKING_DAY`.
    CrossTeamProposal:
      type: object
      required: [revision, asOf, passes, settled, teams, scopeHash]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: The plan revision the run was computed from.
        asOf: { type: string, format: date, description: 'The request''s `asOf`, echoed.' }
        passes: { type: integer, format: int32, minimum: 1, description: The passes made (at most five). }
        settled:
          type: boolean
          description: >-
            True when another pass would reproduce every team's result; false when the pass limit was hit (the last pass's dates stand).
        teams:
          type: array
          maxItems: 50
          description: One block per requested team, in PLACEMENT order.
          items: { $ref: '#/components/schemas/CrossTeamProposalTeam' }
        scopeHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            An opaque 64-hex token fingerprinting what the run read beyond the milestones' schedule revisions, over the whole team
            set ("foreign" means outside the run), the public holidays and `asOf`; send it back unchanged. Stable for one `asOf`
            while the run teams' plan and the holidays are unchanged.
    CrossTeamProposalTeam:
      type: object
      required: [teamId, name, moves, unchanged, unplaced, pinned, weeks, weeksTruncated, dependencies]
      description: One team's block of a cross-team run, in the per-team proposal's shape.
      properties:
        teamId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        moves:
          type: array
          description: The team's movable milestones that change dates, in the team's effective order.
          items: { $ref: '#/components/schemas/ScheduleProposalMove' }
        unchanged:
          type: array
          description: The team's movable milestones that land on their current dates, in the team's effective order.
          items: { type: integer, format: int32, minimum: 0 }
        unplaced:
          type: array
          description: The team's movable milestones that got no dates, in the team's effective order.
          items: { $ref: '#/components/schemas/ScheduleProposalUnplaced' }
        pinned:
          type: array
          description: The team's pinned milestones starting after `asOf` (fixed by their pin), in the team's effective order.
          items: { type: integer, format: int32, minimum: 0 }
        weeks:
          type: array
          description: The team's weekly load AFTER accepting every move of the run (at most 520); empty while nothing would be scheduled.
          items: { $ref: '#/components/schemas/WeekLoad' }
        weeksTruncated: { type: boolean, description: True when `weeks` stops at 520 weeks. }
        dependencies:
          type: array
          description: >-
            The links touching the team (an end among its milestones, or a project end holding one of them whose span changes) whose
            verdict is or was VIOLATED - before the run or over its final dates; violated-after first. A link between two run teams is
            listed in both blocks.
          items: { $ref: '#/components/schemas/ScheduleProposalLink' }
    ScheduleCheckRequest:
      type: object
      required: [teamIds, items]
      properties:
        teamIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: integer, format: int32, minimum: 0 }
          description: >-
            The teams to check: one to 50, each once (the proposal's team set). The caller must manage every one, or be ADMIN.
        items:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: '#/components/schemas/TeamScheduleBatchItem' }
          description: >-
            The ticked moves: one entry per milestone of a listed team (an id twice, or of a milestone outside the listed teams, is a
            `400`). Both dates or neither (the pair of nulls unschedules).
    ScheduleCheckResponse:
      type: object
      required: [teams]
      properties:
        teams:
          type: array
          maxItems: 50
          description: One block per requested team, in the REQUEST's order.
          items: { $ref: '#/components/schemas/ScheduleCheckTeam' }
    ScheduleCheckTeam:
      type: object
      required: [teamId, weeks, weeksTruncated, dependencies]
      description: One team's verdicts for the dates the ticked items would give the listed teams.
      properties:
        teamId: { type: integer, format: int32, minimum: 0 }
        weeks:
          type: array
          description: The team's weekly load with the items applied over its stored dates (at most 520); empty while nothing would be scheduled.
          items: { $ref: '#/components/schemas/WeekLoad' }
        weeksTruncated: { type: boolean, description: True when `weeks` stops at 520 weeks. }
        dependencies:
          type: array
          description: >-
            The links touching the team (an end among its milestones, or a project end holding one of them whose span changes) whose
            verdict is or was VIOLATED - on the stored dates or with the items applied; violated-after first. A link between two listed
            teams is in both blocks.
          items: { $ref: '#/components/schemas/ScheduleProposalLink' }
    ProposalTeamList:
      type: object
      required: [items, truncated]
      description: The first 1,000 active teams the caller may include in a cross-team run, ordered by name and then id.
      properties:
        items:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/TeamRef' }
        truncated: { type: boolean, description: True when additional eligible teams were left out. }
    SavedProposalSaveRequest:
      type: object
      required: [name, asOf, teamIds, expectedRevision, scopeHash, selectedMilestoneIds]
      description: The run of `POST /schedule-proposals` (`asOf`, `teamIds`, its `revision` and `scopeHash`) with a name and the ticked moves.
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: 'Trimmed; a control character is a `400`. Not unique.' }
        asOf:
          type: string
          format: date
          description: The run's `asOf` (1900-01-01 to 2990-01-05; a later day is `400`).
        teamIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: integer, format: int32, minimum: 0 }
          description: 'The run''s teams: one to 50, each once. The caller must manage every one, or be ADMIN.'
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
          description: The run's `revision`. Negative is `400`; above the current plan revision is `409`.
        scopeHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            The run's `scopeHash`, sent back unchanged (else `400`). The save is refused (`409`, `stale-scope`) when the run it
            would compute carries another one, or a milestone of a listed team was scheduled after `expectedRevision`.
        selectedMilestoneIds:
          type: array
          minItems: 1
          maxItems: 2000
          uniqueItems: true
          items: { type: integer, format: int32, minimum: 0 }
          description: >-
            The ticked moves: milestones the run proposes to move (one that is not a move is `400`), each once. Every move ticked
            stores no check document; a subset stores the check of exactly those moves.
    SavedProposalTeam:
      type: object
      required: [id, name]
      description: A team of a saved proposal, named as it was at the save.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
    SavedProposalListCan:
      type: object
      required: [delete]
      properties:
        delete: { type: boolean, description: 'The caller may delete the proposal (ADMIN, or the active manager of every team it names).' }
    SavedProposalCan:
      type: object
      required: [accept, delete]
      properties:
        accept:
          type: boolean
          description: >-
            The caller may accept it: ADMIN or the active manager of every team, and its `state` is `CURRENT`. A client must also
            require the proposal's `asOf` to be today before offering Accept (the state does not read the clock).
        delete: { type: boolean, description: 'The caller may delete the proposal.' }
    SavedProposalSummary:
      type: object
      required: [id, name, asOf, planRevision, createdAt, createdBy, teams, moveCount, selectedCount, passes, settled, can]
      description: One saved proposal's facts, without its documents.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 100 }
        asOf: { type: string, format: date }
        planRevision: { type: integer, format: int64, minimum: 0, description: The plan revision the run was computed at. }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        createdBy:
          nullable: true
          description: Null when the login that saved it is gone.
          allOf:
            - $ref: '#/components/schemas/BaselineCreator'
        teams:
          type: array
          maxItems: 50
          description: The run's teams as named at the save, by id.
          items: { $ref: '#/components/schemas/SavedProposalTeam' }
        moveCount: { type: integer, format: int32, minimum: 0, description: The moves the run proposed. }
        selectedCount: { type: integer, format: int32, minimum: 1, description: The moves ticked at the save. }
        passes: { type: integer, format: int32, minimum: 1 }
        settled: { type: boolean }
        can:
          $ref: '#/components/schemas/SavedProposalListCan'
    SavedProposalList:
      type: object
      required: [items]
      description: The saved proposals, newest first - a bounded set (at most 20), not paged.
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/SavedProposalSummary' }
    SavedProposalState:
      type: string
      enum: [CURRENT, CHANGED, UNREADABLE]
      description: >-
        Derived at read: CURRENT = the plan still matches what the run read; CHANGED = it moved (a listed team gone included);
        UNREADABLE = stored in a shape this server no longer reads.
    SavedProposalRecord:
      type: object
      required: [id, name, asOf, planRevision, createdAt, createdBy, teams, moveCount, selectedCount, passes, settled, state, selectedMilestoneIds, proposal, check, can]
      description: One saved proposal with its state and its stored documents.
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 100 }
        asOf: { type: string, format: date }
        planRevision: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        createdBy:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/BaselineCreator'
        teams:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/SavedProposalTeam' }
        moveCount: { type: integer, format: int32, minimum: 0 }
        selectedCount: { type: integer, format: int32, minimum: 1 }
        passes: { type: integer, format: int32, minimum: 1 }
        settled: { type: boolean }
        state:
          $ref: '#/components/schemas/SavedProposalState'
        selectedMilestoneIds:
          type: array
          maxItems: 2000
          description: The ticked moves, ascending.
          items: { type: integer, format: int32, minimum: 0 }
        proposal:
          nullable: true
          description: The server's run as stored (its `revision` and `scopeHash` are the save's); null when `state` is `UNREADABLE`.
          allOf:
            - $ref: '#/components/schemas/CrossTeamProposal'
        check:
          nullable: true
          description: The stored check of the ticked moves when only a subset was ticked; null when every move was, or when `state` is `UNREADABLE`.
          allOf:
            - $ref: '#/components/schemas/ScheduleCheckResponse'
        can:
          $ref: '#/components/schemas/SavedProposalCan'

    ProblemDetail:
      type: object
      description: RFC 7807 problem detail. Served as `application/problem+json`; instance is the request path without query parameters.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          default: about:blank
          description: |
            A URI reference identifying the problem type: `about:blank` unless a problem names its own. The complete list, one per line
            (status, when):
            - `urn:astrolabe:problem:already-bound` (409) - a bind finds its target taken: the node or team already has a link, or the Jira issue or Flow team is already linked elsewhere
            - `urn:astrolabe:problem:baseline-limit` (409) - a baseline create at the cap of 100 active baselines: delete one first
            - `urn:astrolabe:problem:database-timeout` (500) - a statement the database cancelled at its time limit: try again shortly
            - `urn:astrolabe:problem:dependency-cycle` (409) - a dependency that would close a cycle; `cycle` lists the entities
            - `urn:astrolabe:problem:jira-mapping-invalid` (409) - the connection's stored mapping no longer fits the site's discovery: an administrator must fix it
            - `urn:astrolabe:problem:jira-not-discovered` (409) - a mapping or import needs a discovery and no passing Test connection has stored one
            - `urn:astrolabe:problem:jira-root-unusable` (409) - the linked Jira item a rooted import starts from cannot be used
            - `urn:astrolabe:problem:jira-token-unreadable` (409) - the stored Jira API token cannot be decrypted: enter it again
            - `urn:astrolabe:problem:jira-upstream` (502) - Jira did not answer a Peek or an import read; the detail names the failure code only
            - `urn:astrolabe:problem:last-admin` (409) - the last active administrator cannot be demoted or deleted
            - `urn:astrolabe:problem:milestone-unscheduled` (409) - a pin of an unscheduled milestone
            - `urn:astrolabe:problem:password-change-locked` (429) - the self password change is locked after repeated wrong current passwords
            - `urn:astrolabe:problem:person-email-taken` (409) - an active person already has this email (a person create or update, or a user create with `alsoCreatePerson`)
            - `urn:astrolabe:problem:person-login-taken` (409) - another active person is already linked to this login
            - `urn:astrolabe:problem:run-in-progress` (409) - a sync run of this kind is already unfinished for the connection
            - `urn:astrolabe:problem:stale-deviations` (409) - an acknowledge whose fingerprint is no longer the binding's, or whose binding has no deviation
            - `urn:astrolabe:problem:stale-revision` (409) - a write whose `expectedRevision` is stale (a ranking, schedule or team-order PUT, or a batch schedule from a future revision)
            - `urn:astrolabe:problem:stale-scope` (409) - a batch accept whose team plan changed since its proposal (a pin flipped meanwhile included)
            - `urn:astrolabe:problem:unknown-baseline` (400) - a view's `?baseline=` names a baseline that is unknown or deleted: clear the pick and reload
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference of the specific occurrence (the request path).
        cycle:
          type: array
          items: { $ref: '#/components/schemas/ProblemCycleNode' }
          description: >-
            RFC 7807 extension member, present only on `urn:astrolabe:problem:dependency-cycle`: the cycle the refused link would
            close, as entities in order with the first node repeated last. Every other problem omits it.
    ProblemCycleNode:
      type: object
      required: [kind, id, name]
      properties:
        kind: { $ref: '#/components/schemas/EndpointKind' }
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }

    TelemetryCurrent:
      type: object
      required: [generatedAt, sampleIntervalSeconds, processes, storage, requests, sync]
      properties:
        generatedAt: { type: integer, format: int64, description: Epoch millis }
        sampleIntervalSeconds: { type: integer, format: int32, description: The cadence of the raw samples; also the `requests` window. }
        processes:
          type: array
          items: { $ref: '#/components/schemas/TelemetryProcess' }
        storage:
          allOf: [{ $ref: '#/components/schemas/TelemetryStorage' }]
          nullable: true
          description: The newest storage measurement; null until the cluster section has taken one.
        requests: { $ref: '#/components/schemas/TelemetryRequests' }
        sync: { $ref: '#/components/schemas/TelemetrySync' }
    TelemetrySync:
      type: object
      description: >-
        The connector sync, always present. `schedulerEnabled` is whether THIS process runs the scheduler;
        `tickSeconds` its configured cadence, reported either way; `connections` every active connection of every registered connector
        (empty when there is none), by connector then id.
      required: [schedulerEnabled, tickSeconds, connections]
      properties:
        schedulerEnabled: { type: boolean }
        tickSeconds: { type: integer, format: int32, minimum: 15, maximum: 600 }
        connections:
          type: array
          items: { $ref: '#/components/schemas/TelemetrySyncConnection' }
    TelemetrySyncConnection:
      type: object
      description: One connection's derived sync status. Never its site, email or token.
      required: [kind, connectionId, name, pollIntervalMinutes, ready, status]
      properties:
        kind: { $ref: '#/components/schemas/SyncKind' }
        connectionId: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        pollIntervalMinutes: { type: integer, format: int32, nullable: true, description: Minutes between scheduled runs; null means manual only. }
        ready: { type: boolean, description: "Whether the connection is pollable: a Jira discovery is stored, or a Flow test passed or a Flow run has already mirrored a document (sticky: a later token or zone edit does not clear it). A connection that is not ready is never polled." }
        status: { $ref: '#/components/schemas/SyncStatus' }
    TelemetryProcess:
      type: object
      description: One sampling process (a JVM run) with its latest raw sample.
      required: [id, role, instance, startedAt, lastSeenAt, sampledAt, stale, version, commit, memory, jvm]
      properties:
        id: { type: integer, format: int32 }
        role: { type: string, description: 'The process role; `app`.' }
        instance: { type: string, description: The pod or host name. }
        startedAt: { type: integer, format: int64, description: Epoch millis of the JVM start }
        lastSeenAt: { type: integer, format: int64, description: Epoch millis of the latest sample tick }
        sampledAt: { type: integer, format: int64, nullable: true, description: The bucket of the sample the figures come from; null when none is retained. }
        stale: { type: boolean, description: No sample for more than three sample intervals. }
        version: { type: string, nullable: true, description: The image build version (null outside the image). }
        commit: { type: string, nullable: true, description: The image build commit (null outside the image). }
        memory: { $ref: '#/components/schemas/TelemetryMemory' }
        jvm: { $ref: '#/components/schemas/TelemetryJvm' }
    TelemetryMemory:
      type: object
      description: Bytes; a figure the process could not measure is null.
      required:
        - heapUsedBytes
        - heapCommittedBytes
        - heapMaxBytes
        - oldGenPeakBytes
        - nonHeapBytes
        - directBytes
        - rssBytes
        - cgroupCurrentBytes
        - cgroupAnonBytes
        - workingSetBytes
        - cgroupPeakBytes
        - containerLimitBytes
        - percentOfLimit
      properties:
        heapUsedBytes: { type: integer, format: int64, nullable: true }
        heapCommittedBytes: { type: integer, format: int64, nullable: true }
        heapMaxBytes: { type: integer, format: int64 }
        oldGenPeakBytes: { type: integer, format: int64, nullable: true, description: The old generation's peak over the latest sample interval. }
        nonHeapBytes: { type: integer, format: int64, nullable: true }
        directBytes: { type: integer, format: int64, nullable: true }
        rssBytes: { type: integer, format: int64, nullable: true }
        cgroupCurrentBytes: { type: integer, format: int64, nullable: true }
        cgroupAnonBytes: { type: integer, format: int64, nullable: true }
        workingSetBytes: { type: integer, format: int64, nullable: true, description: '`memory.current - inactive_file`: what the kubelet evicts on.' }
        cgroupPeakBytes: { type: integer, format: int64, nullable: true, description: The cgroup's LIFETIME peak. }
        containerLimitBytes: { type: integer, format: int64, nullable: true }
        percentOfLimit:
          type: number
          format: double
          nullable: true
          description: '`workingSetBytes` over `containerLimitBytes`, in percent (one decimal; may exceed 100); null without a limit or a working set.'
    TelemetryJvm:
      type: object
      required: [cpuRatio, threads, gcCount, gcTimeMs, poolAcquired, poolIdle, poolPending, poolAllocated]
      properties:
        cpuRatio: { type: number, format: double, nullable: true, description: Process CPU time over wall time as a fraction of the available processors (0..1). }
        threads: { type: integer, format: int32, nullable: true }
        gcCount: { type: integer, format: int64, nullable: true, description: 'Collections over the latest sample interval, all collectors summed.' }
        gcTimeMs: { type: integer, format: int64, nullable: true, description: 'Collection time over the latest sample interval, all collectors summed.' }
        poolAcquired: { type: integer, format: int32, nullable: true }
        poolIdle: { type: integer, format: int32, nullable: true }
        poolPending: { type: integer, format: int32, nullable: true }
        poolAllocated: { type: integer, format: int32, nullable: true }
    TelemetryStorage:
      type: object
      required: [measuredAt, databaseBytes, schemas]
      properties:
        measuredAt: { type: integer, format: int64, description: Epoch millis of the measurement's bucket }
        databaseBytes: { type: integer, format: int64, description: '`pg_database_size`.' }
        schemas:
          type: array
          items: { $ref: '#/components/schemas/TelemetrySchemaSize' }
    TelemetrySchemaSize:
      type: object
      required: [name, bytes]
      properties:
        name: { type: string, description: 'public or ops (telemetry''s own cost).' }
        bytes: { type: integer, format: int64, description: "Heap, TOAST and indexes of the schema's tables." }
    TelemetryRequests:
      type: object
      required: [windowSeconds, percentileWindowSeconds, measuredAt, total, routes]
      properties:
        windowSeconds: { type: integer, format: int32, description: The window of the counts - the latest sample interval. }
        percentileWindowSeconds:
          type: integer
          format: int32
          description: The window p50 and p95 cover - the sample interval capped at 300 s (the request timers' reservoir), so it can be shorter than `windowSeconds`.
        measuredAt: { type: integer, format: int64, nullable: true, description: The sample bucket the figures describe; null when no live process has a sample. }
        total: { $ref: '#/components/schemas/TelemetryRouteStats' }
        routes:
          type: array
          maxItems: 15
          items: { $ref: '#/components/schemas/TelemetryRouteStats' }
    TelemetryRouteStats:
      type: object
      description: One route (or `*`, every `/api/` route except the telemetry's own and the probes) over the latest sample interval.
      required: [route, count, p50Ms, p95Ms, serverErrors, rateLimited]
      properties:
        route: { type: string, description: 'The normalised route (`/api/v1/users/{id}`) or `*`.' }
        count: { type: integer, format: int64, minimum: 0 }
        p50Ms: { type: number, format: double, nullable: true, description: Null when nothing was served. }
        p95Ms: { type: number, format: double, nullable: true, description: Null when nothing was served. }
        serverErrors: { type: integer, format: int64, minimum: 0, description: 5xx responses. }
        rateLimited: { type: integer, format: int64, minimum: 0, description: 429 responses. }
    TelemetryHistory:
      type: object
      required: [group, range, bucketSeconds, from, to, historyFrom, truncated, series]
      properties:
        group: { $ref: '#/components/schemas/TelemetryGroup' }
        range: { $ref: '#/components/schemas/TelemetryRange' }
        bucketSeconds: { type: integer, format: int32, description: The width of a point's bucket. }
        from: { type: integer, format: int64, description: Epoch millis of the range start (the first bucket may begin up to one bucket earlier). }
        to: { type: integer, format: int64, description: Epoch millis of the read }
        historyFrom: { type: integer, format: int64, description: The oldest instant the range can actually hold data for. }
        truncated: { type: boolean, description: 'More series matched than were returned (40).' }
        series:
          type: array
          maxItems: 40
          items: { $ref: '#/components/schemas/TelemetrySeries' }
    TelemetrySeries:
      type: object
      description: One chart line; `points` are the buckets that hold data, ascending, at most 400.
      required: [key, metric, label, role, unit, kind, points]
      properties:
        key: { type: string, description: 'Unique within the response (`<role>:<metric>:<label>`, empty parts left out).' }
        metric: { type: string, description: 'The metric name (`mem.heap_used`, `http.p95`, ...).' }
        label: { type: string, description: 'A route, a GC collector or a schema; empty when the metric has none.' }
        role: { type: string, nullable: true, description: 'The process role a `memory` / `jvm` series merges (`app`); null for cluster-wide and `requests` series.' }
        unit: { type: string, enum: [BYTES, MILLISECONDS, COUNT, RATIO] }
        kind:
          type: string
          enum: [GAUGE, DELTA, PERCENTILE]
          description: A DELTA point's `avg` is the bucket's total; for the others it is the n-weighted mean.
        points:
          type: array
          maxItems: 400
          items: { $ref: '#/components/schemas/TelemetryPoint' }
    TelemetryPoint:
      type: object
      required: [t, avg, max]
      properties:
        t: { type: integer, format: int64, description: Epoch millis of the bucket start }
        avg: { type: number, format: double }
        max: { type: number, format: double, description: "The largest single sample in the bucket; for a DELTA series, the largest sample interval's total." }
    JiraConnectionRequest:
      type: object
      required: [name, siteUrl, email, projectKeys]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        siteUrl:
          type: string
          maxLength: 253
          pattern: '^https://[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.atlassian\.net$'
          description: The site's origin, exactly `https://<tenant>.atlassian.net` (no path, query, port or trailing slash; Atlassian's own surfaces such as `api` are refused).
        email:
          type: string
          maxLength: 254
          description: The Atlassian account the token belongs to; folded to lower case.
        apiToken:
          type: string
          format: password
          writeOnly: true
          nullable: true
          maxLength: 1000
          description: >-
            Required on create (non-blank). On update an omitted, empty or blank token keeps the stored one and a present one rotates it. Encrypted at rest;
            never returned, logged or audited.
        authScheme:
          allOf: [{ $ref: '#/components/schemas/JiraAuthScheme' }]
          default: BASIC
          description: "`BASIC` = `base64(email:token)` (an Atlassian API token), `BEARER` = the token alone."
        projectKeys:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,9}$' }
          description: The Jira project keys in scope (1 to 50, distinct).
        enabled: { type: boolean, default: true }
        pollIntervalMinutes:
          type: integer
          format: int32
          nullable: true
          minimum: 5
          maximum: 1440
          # No `default:` here on purpose: openapi-typescript would make the member REQUIRED in the web's request type (as it does for `enabled`),
          # and the server's omitted-means-15 rule is stated in the description instead.
          description: >-
            Minutes between scheduled runs. Omitted means 15 (a PUT is a full replace, so a PUT without the member resets it to 15); an
            explicit `null` means manual only (a manual refresh still works).
    JiraConnection:
      type: object
      required: [id, name, siteUrl, email, hasApiToken, authScheme, projectKeys, enabled, pollIntervalMinutes, cloudId, discoveredAt, lastTestedAt, lastTestOk, mappingSet, lastRun, status, createdAt, updatedAt, stub]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        siteUrl: { type: string }
        email: { type: string }
        hasApiToken:
          type: boolean
          description: Whether a token is stored. The token itself is write-only and appears in no response.
        authScheme: { $ref: '#/components/schemas/JiraAuthScheme' }
        projectKeys:
          type: array
          maxItems: 50
          items: { type: string }
        enabled: { type: boolean }
        pollIntervalMinutes: { type: integer, format: int32, nullable: true, description: Minutes between scheduled runs; null means manual only. }
        cloudId: { type: string, nullable: true, description: "The site's cloud id, persisted by a passing connection test; null until then." }
        discoveredAt: { type: integer, format: int64, nullable: true, description: Epoch millis of the last field discovery; null until one ran. }
        lastTestedAt: { type: integer, format: int64, nullable: true, description: Epoch millis of the last connection test. }
        lastTestOk: { type: boolean, nullable: true, description: Whether the last connection test passed; null until one ran. }
        mappingSet: { type: boolean, description: Whether a field mapping has been saved. }
        lastRun:
          allOf:
            - $ref: '#/components/schemas/SyncLastRun'
          nullable: true
          description: "This connection's own newest run (the other connections' runs never count); null before the first. `running` is the server's verdict."
        status: { $ref: '#/components/schemas/SyncStatus' }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
        stub: { type: boolean, description: "True when this connection's calls go to the development Jira stub rather than Atlassian (development mode, a site label starting with `stub-`). Derived per request, never stored." }
    JiraConnectionPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JiraConnection'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    JiraTestRow:
      type: object
      required: [name, path, required, ok]
      properties:
        name: { type: string, description: "The probe: `tenant_info`, `myself`, `issuetype`, `search`, `field`, `projects`, `project:<KEY>` (one per configured key), `issue` or `stored_token`." }
        path: { type: string, description: The endpoint probed (no query string). }
        required: { type: boolean, description: Whether a failure fails the test. }
        ok: { type: boolean }
        status: { type: integer, format: int32, nullable: true, description: The upstream HTTP status when one answered. }
        code: { $ref: '#/components/schemas/SyncFailureCode' }
        scopeHint: { type: string, nullable: true, description: The Atlassian scope(s) the probe needs; a comma+space separated list. }
    JiraTestResult:
      type: object
      required: [rows, recorded, stub]
      properties:
        rows:
          type: array
          maxItems: 60
          items:
            $ref: '#/components/schemas/JiraTestRow'
        cloudId: { type: string, nullable: true, description: "The site's cloud id once `tenant_info` answered (validated as a UUID)." }
        discoveredAt: { type: integer, format: int64, nullable: true, description: Epoch millis of the discovery snapshot now stored on the connection (stored-token variant); null when none or ad hoc. }
        recorded: { type: boolean, description: "Whether the result was stored on the connection (false for an ad-hoc test, or when an edit raced the test)." }
        stub: { type: boolean, description: "True when the probes were answered by the development Jira stub (development mode, a site label starting with `stub-`), not by Atlassian." }
    JiraDiscoveredField:
      type: object
      required: [id, name]
      properties:
        id: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        type: { type: string, nullable: true, maxLength: 64, description: "`schema.type`, e.g. `date`, `datetime`, `number`." }
        custom: { type: string, nullable: true, maxLength: 64, description: "`schema.custom`, null for a system field." }
    JiraDiscoveredIssueType:
      type: object
      required: [id, name, subtask]
      properties:
        id: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        hierarchyLevel: { type: integer, format: int32, nullable: true, description: "Jira's hierarchy level (Epic 1, sub-task -1); null when the site did not say." }
        subtask: { type: boolean }
    JiraDiscoveredLevel:
      type: object
      required: [level, typeNames]
      properties:
        level: { type: integer, format: int32 }
        typeNames:
          type: array
          items: { type: string }
    JiraDiscoveryMarkers:
      type: object
      description: >-
        What the name rules resolved: Plans' Target start and Target end (by date-typed name, else by their custom type), Start date,
        `duedate`, story points, the Team field and the two legacy parent links. An absent member is "not found".
      properties:
        targetStart: { $ref: '#/components/schemas/JiraDiscoveredField' }
        targetEnd: { $ref: '#/components/schemas/JiraDiscoveredField' }
        startDate: { $ref: '#/components/schemas/JiraDiscoveredField' }
        dueDate: { $ref: '#/components/schemas/JiraDiscoveredField' }
        storyPoints: { $ref: '#/components/schemas/JiraDiscoveredField' }
        team: { $ref: '#/components/schemas/JiraDiscoveredField' }
        legacyEpicLink: { $ref: '#/components/schemas/JiraDiscoveredField' }
        legacyParentLink: { $ref: '#/components/schemas/JiraDiscoveredField' }
    JiraDiscovery:
      type: object
      required: [discoveredAt, fieldCount, issueTypeCount, fieldsTruncated, fields, issueTypes, levels, markers]
      properties:
        discoveredAt: { type: integer, format: int64, description: Epoch millis }
        fieldCount: { type: integer, format: int32, description: "How many fields the site reported (the snapshot keeps at most 2,000 of them)." }
        issueTypeCount: { type: integer, format: int32 }
        fieldsTruncated: { type: boolean, description: Whether the site had more date/number/recognised fields than the snapshot keeps (the markers are kept first). }
        fields:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/JiraDiscoveredField' }
        issueTypes:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/JiraDiscoveredIssueType' }
        levels:
          type: array
          items: { $ref: '#/components/schemas/JiraDiscoveredLevel' }
        markers: { $ref: '#/components/schemas/JiraDiscoveryMarkers' }
    JiraLevelFields:
      type: object
      description: The Jira field ids one level reads; an omitted or null member is "not mapped".
      properties:
        start: { type: string, nullable: true, maxLength: 64, description: "A `date` field id (`customfield_10015`, `duedate`)." }
        end: { type: string, nullable: true, maxLength: 64, description: "A `date` field id." }
        estimate: { type: string, nullable: true, maxLength: 64, description: "A `number` field id." }
    JiraLevelMapping:
      type: object
      required: [hierarchyLevel]
      properties:
        hierarchyLevel: { type: integer, format: int32, minimum: 0, description: "Jira's hierarchy level (Epic 1, Initiative 2; sub-tasks, -1, are never a plan level); the discovery lists the levels the site has." }
        fields: { $ref: '#/components/schemas/JiraLevelFields' }
    JiraMappingLevels:
      type: object
      required: [milestone]
      properties:
        program:
          nullable: true
          description: Optional; must sit above the project (or milestone) level.
          allOf:
            - $ref: '#/components/schemas/JiraLevelMapping'
        project:
          nullable: true
          description: Optional; must sit above the milestone level.
          allOf:
            - $ref: '#/components/schemas/JiraLevelMapping'
        milestone: { $ref: '#/components/schemas/JiraLevelMapping' }
    JiraEstimateMapping:
      type: object
      properties:
        unit: { allOf: [{ $ref: '#/components/schemas/EstimateUnit' }], description: "What the estimate field counts (default `POINTS`). `DAYS` compares as man-days without a factor." }
        manDaysPerUnit:
          type: number
          format: double
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          maximum: 1000
          description: Man-days per unit; greater than 0 and at most 1000 with at most two decimals. Without a factor (and not `DAYS`) the Jira figure is shown, never compared.
    JiraMapping:
      type: object
      required: [levels]
      properties:
        levels: { $ref: '#/components/schemas/JiraMappingLevels' }
        estimate: { $ref: '#/components/schemas/JiraEstimateMapping' }
        teamFieldId: { type: string, nullable: true, maxLength: 64, description: The Team field's id (a field of the discovery). }
    JiraMappingResponse:
      type: object
      required: [mapping, defaults, effective, discoveredAt, problems]
      properties:
        mapping:
          nullable: true
          description: The document last saved; null when none was.
          allOf:
            - $ref: '#/components/schemas/JiraMapping'
        defaults:
          nullable: true
          description: >-
            What the stored discovery resolves: start and end from Plans' Target start and Target end, else Start date and `duedate`; the
            estimate from the first story-points number field; the Team field; milestone = hierarchy level 1, project = 2, program = 3
            when the site has them. Null before any discovery.
          allOf:
            - $ref: '#/components/schemas/JiraMapping'
        effective:
          nullable: true
          description: The mapping a run would use - `mapping`, else `defaults`.
          allOf:
            - $ref: '#/components/schemas/JiraMapping'
        discoveredAt: { type: integer, format: int64, nullable: true, description: Epoch millis of the discovery the defaults come from. }
        problems:
          type: array
          items: { type: string }
          description: >-
            Why the stored `mapping` no longer fits the discovery as it is now (a level the site lost, a field that changed type) or
            cannot be read at all. Empty when it fits or none is saved. Nothing is rewritten: save a corrected mapping.
    JiraCoverageLevel:
      type: object
      description: One mapped plan level's counts over the connection's census mirror. Counts only; never a key, name or summary.
      required: [level, hierarchyLevel, inScope, linked, openUnlinked]
      properties:
        level: { $ref: '#/components/schemas/PlanLevel' }
        hierarchyLevel: { type: integer, format: int32, minimum: 0, description: "The Jira hierarchy level the plan level is mapped to." }
        inScope: { type: integer, format: int32, minimum: 0, description: "The level's issues in the connection's project keys (the census mirror)." }
        linked: { type: integer, format: int32, minimum: 0, description: "Of those, the ones an active binding names (same site)." }
        openUnlinked: { type: integer, format: int32, minimum: 0, description: "Of those, the ones not in the Done status category and not linked." }
    JiraCoverageResponse:
      type: object
      required: [state, readAt, levels]
      properties:
        state:
          type: string
          enum: [NOT_SYNCED, MAPPING_UNUSABLE, MAPPING_CHANGED, READY]
          description: >-
            `NOT_SYNCED`: no run ever censused the site (no counts). `MAPPING_UNUSABLE`: the effective mapping is missing, unreadable or no
            longer fits the discovery, so the mapped levels are unknown (no counts). `MAPPING_CHANGED`: the mapping was saved after the
            last successful run began, so the mirror may not hold the mapped levels yet (no counts until the next run). `READY`: `levels`
            holds the counts.
        readAt:
          type: integer
          format: int64
          nullable: true
          description: >-
            Epoch millis when the connection's last SUCCESSFUL run finished: the counted rows are as of then (a run upserts and prunes the
            mapped levels every time). Null before any success (or once the run history no longer holds one).
        levels:
          type: array
          maxItems: 3
          description: The mapped levels, top down (program, project, milestone); empty unless `state` is `READY`.
          items:
            $ref: '#/components/schemas/JiraCoverageLevel'
    JiraPeekIssue:
      type: object
      required: [id, key, statusCategory]
      properties:
        id: { type: string }
        key: { type: string }
        summary: { type: string, nullable: true, maxLength: 255 }
        typeName: { type: string, nullable: true }
        hierarchyLevel: { type: integer, format: int32, nullable: true, description: "From the issue's own type when the site sent it, else the discovery's." }
        statusCategory: { $ref: '#/components/schemas/StatusCategory' }
        parentKey: { type: string, nullable: true }
    JiraPeekResolved:
      type: object
      required: [unit]
      properties:
        level: { allOf: [{ $ref: '#/components/schemas/NullablePlanLevel' }], nullable: true, description: "The Astrolabe level the issue's hierarchy level maps to; null when it maps to none (then start, end and estimate are null too)." }
        start: { type: string, format: date, nullable: true }
        end: { type: string, format: date, nullable: true }
        estimate: { type: number, format: double, nullable: true, description: "The mapped estimate field in `unit`, read the way a sync reads it: at two decimals, half up; null for a figure a sync would not observe (a string, a non-number, 10 billion or more, or a literal over 40 characters)." }
        unit: { $ref: '#/components/schemas/EstimateUnit' }
        teamName: { type: string, nullable: true, maxLength: 100 }
    JiraPeekResponse:
      type: object
      required: [issue, resolved, raw]
      properties:
        issue: { $ref: '#/components/schemas/JiraPeekIssue' }
        resolved: { $ref: '#/components/schemas/JiraPeekResolved' }
        raw:
          type: object
          additionalProperties: true
          description: The mapped fields' values exactly as the site sent them, keyed by field id (a field the issue lacks is absent); nothing else of the issue.
    JiraImportDefaults:
      type: object
      description: >-
        The parent of an orphan row and the team of a milestone with no name match. Each id must lie under the picked work stream / be
        active. With a `root`, `programId` is `400` and `projectId` must be a project of the root program (`400` for a project root).
      properties:
        programId: { type: integer, format: int32, minimum: 0, nullable: true, description: "The parent program of a project whose Jira parent is neither in the plan nor in the browse." }
        projectId: { type: integer, format: int32, minimum: 0, nullable: true, description: "The parent project of a milestone, likewise." }
        teamId: { type: integer, format: int32, minimum: 0, nullable: true, description: "The team of a milestone whose Jira Team value matches no Astrolabe team." }
    JiraImportScope:
      type: object
      required: [workStreamId, ownerPersonId]
      properties:
        workStreamId: { type: integer, format: int32, minimum: 0, description: "The picked work stream; every target lies under it (work streams are never imported). With `root` it must be the root's own work stream: `400` for a caller who may start from the root (its owner chain or ADMIN), while a caller who may not gets the root's `403` first." }
        ownerPersonId: { type: integer, format: int32, minimum: 0, description: "The owner of every created program and project (an ACTIVE person)." }
        projectKeys:
          type: array
          nullable: true
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: string }
          description: "A subset of the connection's project keys to browse; default (null or absent): all of them."
        defaults:
          allOf:
            - $ref: '#/components/schemas/JiraImportDefaults'
          nullable: true
        copyDates: { type: boolean, default: true, description: "Copy Jira's dates: to a milestone, only where the caller may schedule the milestone's team; to a project the import creates, as its target window (both dates or neither; the caller, who may always set it as ADMIN or the stream's or program's owner, needs no further check)." }
        filter:
          allOf:
            - $ref: '#/components/schemas/JiraImportFilter'
          nullable: true
          description: >-
            What the browse leaves out; null or absent reads everything. The apply must carry the filter its preview was read under.
        root:
          allOf:
            - $ref: '#/components/schemas/JiraImportRoot'
          nullable: true
          description: >-
            Starts the import from one linked node: only what Jira lists under that node's Jira item is read, and the root itself is never
            a row. Null or absent = the whole scope. The apply must carry the root its preview was read under.
        matches:
          type: array
          nullable: true
          maxItems: 2000
          items: { $ref: '#/components/schemas/JiraImportMatch' }
          description: >-
            The suggested matches the user confirmed, each Jira item named once (`400` otherwise; `jiraId` a numeric Jira id). Honoured
            only when equal to the server's own current suggestion for that row; null, absent or empty = none. The apply must carry the
            matches its preview was read under.
    JiraImportMatch:
      type: object
      required: [jiraId, nodeId]
      properties:
        jiraId: { type: string, pattern: '^[0-9]{1,20}$', description: "The numeric Jira issue id of the CREATE row to link." }
        nodeId: { type: integer, format: int32, minimum: 0, description: "The unlinked plan item of the row's level that the row's `suggestion` named." }
    JiraImportSuggestion:
      type: object
      required: [nodeId, nodeName]
      properties:
        nodeId: { type: integer, format: int32, minimum: 0 }
        nodeName: { type: string }
    JiraImportRoot:
      type: object
      description: >-
        The linked node a rooted import starts from: a program or project of the picked work stream with an active link through this
        connection (else `409` `urn:astrolabe:problem:jira-root-unusable`; so too when its Jira item cannot be read, lies outside the
        connection's projects or sits at a level the mapping does not give the node). Only what Jira lists under that item is read, at
        most 2,000 rows (more: `truncated`) and one budget of 200 requests (`502`, code `LIMIT_EXCEEDED`). Created rows land under the
        root's own node only; no program is created. The caller must own the root's chain or be ADMIN.
      required: [level, nodeId]
      properties:
        level: { type: string, enum: [PROGRAM, PROJECT], description: "The plan level of the root node; a `MILESTONE` root is `400`." }
        nodeId: { type: integer, format: int32, minimum: 0, description: "The id of the program or project; it must lie under `workStreamId`." }
    JiraImportFilter:
      type: object
      description: >-
        What an import's browse leaves out, per request (nothing is stored): done items and items not updated for a while; both off reads
        everything. Every mapped level is narrowed in the search query. The direct parent of an item that is read is fetched by id when
        the filter left it out and kept (`KEPT_AS_PARENT`), if it is inside the import's projects and readable by the account; more than
        200 such reads make the scope `truncated`. Only the import reads through the filter. The answer does not say how many items were
        left out.
      properties:
        excludeDone: { type: boolean, default: false, description: "Leave out the items whose Jira status category is Done." }
        updatedWithinDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 3650
          nullable: true
          description: >-
            Read only the items Jira updated within this many days (1 to 3,650, `400` otherwise); null or absent = any age.
    JiraImportParent:
      type: object
      required: [kind, nodeName]
      description: Where a CREATE row lands (absent for a program, which lands under the picked work stream).
      properties:
        kind: { allOf: [{ $ref: '#/components/schemas/JiraImportParentKind' }], description: "An existing node, the node another row of the batch creates, or the level's default parent." }
        nodeId: { type: integer, format: int32, minimum: 0, nullable: true }
        nodeName: { type: string }
        rowJiraId: { type: string, nullable: true, description: "The batch row the parent depends on (a NEW_ROW parent, or the row of a BIND parent)." }
    JiraImportTarget:
      type: object
      required: [nodeId, nodeName]
      description: "For BIND the unbound same-name node; for ALREADY_BOUND the holder (then `nodeKind` and `connectionId` are set: the connection may be another one of the site)."
      properties:
        nodeId: { type: integer, format: int32, minimum: 0 }
        nodeName: { type: string }
        nodeKind: { $ref: '#/components/schemas/NullablePlanLevel' }
        connectionId: { type: integer, format: int32, minimum: 0, nullable: true }
    JiraImportTeam:
      type: object
      required: [id, name, rule]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        rule: { type: string, enum: [MATCHED, DEFAULT], description: "By the Jira Team value's name, or the default team." }
    JiraImportItem:
      type: object
      description: >-
        For a caller who is not ADMIN a skipped row other than `ALREADY_BOUND` carries no Jira text: `summary` is empty, `name` is the
        issue key and `infos` is empty; without a `filter`, key, level, type name, `reason` and parent keys stay and the row order is the
        full one; under an active `filter` the key, parent keys and `name` go too and such rows follow every visible row. `totals` are the full
        ones.
      required: [jiraId, issueKey, summary, level, action, name, canSchedule, scheduled, infos]
      properties:
        jiraId: { type: string, description: "The numeric Jira issue id; `hidden-<row position>` on a row redacted for a non-admin under an active filter." }
        issueKey: { type: string, nullable: true, description: "Null on a row redacted for a non-admin under an active `filter` (the filter is a probe; a key is the handle): such a row also has a blank `name` and no parent id or key, and comes after every other row. A visible row whose Jira parent is such a row has no parent id or key either. Always set otherwise." }
        summary: { type: string }
        typeName: { type: string, nullable: true }
        hierarchyLevel: { type: integer, format: int32, nullable: true }
        parentJiraId: { type: string, nullable: true }
        parentIssueKey: { type: string, nullable: true }
        level: { allOf: [{ $ref: '#/components/schemas/PlanLevel' }], description: "The plan level the issue's hierarchy level maps to (an unmapped one keeps the nearest, with action SKIP)." }
        action: { type: string, enum: [CREATE, BIND, SKIP] }
        reason:
          type: string
          nullable: true
          enum: [ALREADY_BOUND, NO_PARENT, NAME_TAKEN, LEVEL_UNMAPPED, NO_TEAM, PARENT_SKIPPED, OUTSIDE_ROOT]
          description: "SKIP rows only. PARENT_SKIPPED: the Jira parent is in the browse and its row is skipped (never re-homed under a default). OUTSIDE_ROOT (a rooted import): the row would land under a plan item outside the root's subtree - skipped for every caller."
        parent:
          allOf:
            - $ref: '#/components/schemas/JiraImportParent'
          nullable: true
        target:
          allOf:
            - $ref: '#/components/schemas/JiraImportTarget'
          nullable: true
        name: { type: string, maxLength: 100, description: "The plan name: the summary with control characters and runs of whitespace collapsed, cut at 100 characters; the issue key when blank. Blank (\"\") on a row redacted for a non-admin under an active `filter`, whose key is withheld." }
        estimateMd: { type: number, format: double, nullable: true, description: "A milestone's converted man-days (0 when none or not convertible)." }
        startDate: { type: string, format: date, nullable: true, description: "A milestone: Jira's start, shown when `copyDates` is on (written only if `scheduled`). A project that would be created: the start of its target window, present only when `copyDates` is on and Jira gives both dates in order; never on a BIND or skipped project." }
        endDate: { type: string, format: date, nullable: true, description: "As `startDate`: a milestone's Jira end, or the end of a created project's target window." }
        team:
          allOf:
            - $ref: '#/components/schemas/JiraImportTeam'
          nullable: true
        canSchedule: { type: boolean, description: "The caller may schedule the milestone's team (ADMIN: always)." }
        scheduled: { type: boolean, description: "What WILL happen: the milestone is created with Jira's dates (`copyDates`, the caller may schedule, a valid span with a working day)." }
        infos:
          type: array
          items: { type: string, enum: [NAME_TRUNCATED, ESTIMATE_NOT_CONVERTED, DATES_NOT_COPIED, DATES_INVALID, NO_WORKING_DAY, TARGET_NOT_COPIED, KEPT_AS_PARENT, PARENT_UNREADABLE, MATCH_CONFIRMED] }
          description: >-
            Notes on the row. `TARGET_NOT_COPIED`: a PROJECT to be created gets no target window (Jira gives one date, or an end before
            the start). `KEPT_AS_PARENT`: the filter would have left the item out but a read item sits under it. `PARENT_UNREADABLE`: its
            Jira parent answered `404` for the connection's account, so the row is skipped `NO_PARENT`. `MATCH_CONFIRMED`: a BIND through
            a confirmed suggestion.
        suggestion:
          allOf:
            - $ref: '#/components/schemas/JiraImportSuggestion'
          description: >-
            Absent unless the row is a CREATE whose name has the same words as exactly one unlinked, unclaimed plan item of its level
            under the same parent (case, accents, punctuation and word order aside; the longer name may only add words); never on a
            redacted row. Confirm it by sending `matches` with the next preview.
    JiraImportTotals:
      type: object
      required: [items, create, bind, skip, truncated]
      properties:
        items: { type: integer, format: int32, minimum: 0 }
        create: { type: integer, format: int32, minimum: 0 }
        bind: { type: integer, format: int32, minimum: 0 }
        skip: { type: integer, format: int32, minimum: 0 }
        truncated: { type: boolean, description: "What is shown is incomplete and cannot be imported: more than 2,000 issues were in scope (the parents read by id count), or, under a filter, more than 200 parents would have to be read one by one. Narrow `projectKeys` or the filter." }
    JiraImportPreview:
      type: object
      required: [connectionId, workStreamId, revision, asOf, totals, unmatchedTeams, items]
      properties:
        connectionId: { type: integer, format: int32, minimum: 0 }
        workStreamId: { type: integer, format: int32, minimum: 0 }
        revision: { type: integer, format: int64, description: "The plan revision of the snapshot the rows were computed on." }
        asOf: { type: integer, format: int64, description: "Epoch milliseconds of the read." }
        totals: { $ref: '#/components/schemas/JiraImportTotals' }
        unmatchedTeams:
          type: array
          items: { type: string }
          description: "Jira Team names that matched no Astrolabe team, among the milestones that needed one."
        items:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/JiraImportItem' }
    JiraImportExpected:
      type: object
      required: [action, level]
      description: What the preview showed for a ticked row. A difference after the apply's re-browse and re-read is a `CHANGED` skip.
      properties:
        action: { type: string, enum: [CREATE, BIND], description: "A BIND carries `nodeId`, a CREATE does not." }
        level: { $ref: '#/components/schemas/PlanLevel' }
        parentJiraId: { type: string, nullable: true, description: "The row's `parentJiraId` as previewed." }
        nodeId: { type: integer, format: int32, minimum: 0, nullable: true, description: "The BIND target node as previewed." }
        parent:
          allOf:
            - $ref: '#/components/schemas/JiraImportExpectedParent'
          nullable: true
          description: "Where a CREATE landed in the preview (its `parent`: absent for a program). A different landing after the re-browse and the re-read - for example the default parent because the Jira parent was bound elsewhere meanwhile - is a `CHANGED` skip, never a silent re-homing. Required (`400` without it) for a CREATE below a program; ignored for a BIND."
        teamId:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: "For a milestone CREATE: the team the preview row showed (its `team.id`: the Jira Team name's match or `defaults.teamId`, WITHOUT any override). A different team after the re-browse - the Jira Team field moved - is a `CHANGED` skip. An `overrides.teamId` is applied on top and is not compared. Absent for other rows."
    JiraImportExpectedParent:
      type: object
      required: [kind]
      properties:
        kind: { allOf: [{ $ref: '#/components/schemas/JiraImportParentKind' }], description: "The preview row's `parent.kind`." }
        nodeId: { type: integer, format: int32, minimum: 0, nullable: true, description: "The preview row's `parent.nodeId` (null for a NEW_ROW)." }
    JiraImportOverrides:
      type: object
      properties:
        teamId: { type: integer, format: int32, minimum: 0, nullable: true, description: "The team of this milestone; an ACTIVE team, else 400. Ignored on a program or project row." }
        ownerPersonId: { type: integer, format: int32, minimum: 0, nullable: true, description: "The owner of this program or project when the apply creates it, instead of the request's `ownerPersonId`; an active person, else `400` (checked wherever it is sent). Ignored on a milestone, BIND or skipped row; no extra guard applies." }
    JiraImportApplyItem:
      type: object
      required: [jiraId, expected]
      properties:
        jiraId: { type: string, pattern: '^[0-9]{1,20}$', description: "The numeric Jira issue id, named once per request." }
        expected: { $ref: '#/components/schemas/JiraImportExpected' }
        overrides:
          allOf:
            - $ref: '#/components/schemas/JiraImportOverrides'
          nullable: true
    JiraImportApplyRequest:
      description: The members of `JiraImportScope` (flat) plus the ticked items.
      allOf:
        - $ref: '#/components/schemas/JiraImportScope'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              minItems: 1
              maxItems: 2000
              items: { $ref: '#/components/schemas/JiraImportApplyItem' }
    JiraImportCreated:
      type: object
      required: [jiraId, issueKey, kind, id, bindingId, name, scheduled]
      properties:
        jiraId: { type: string }
        issueKey: { type: string }
        kind: { $ref: '#/components/schemas/PlanLevel' }
        id: { type: integer, format: int32, minimum: 0, description: "The new node's id." }
        bindingId: { type: integer, format: int32, minimum: 0 }
        name: { type: string, maxLength: 100, description: "The plan name the node was created with: the Jira summary cut at 100 characters (the key when blank)." }
        scheduled: { type: boolean, description: "A milestone created with Jira's dates: only when `copyDates` is on, its dates are valid, the caller manages its team (ADMIN: any) and the span holds a working day; otherwise it is created unscheduled." }
    JiraImportBound:
      type: object
      required: [jiraId, issueKey, kind, id, bindingId]
      properties:
        jiraId: { type: string }
        issueKey: { type: string }
        kind: { $ref: '#/components/schemas/PlanLevel' }
        id: { type: integer, format: int32, minimum: 0, description: "The existing node that was bound." }
        bindingId: { type: integer, format: int32, minimum: 0 }
    JiraImportSkipped:
      type: object
      required: [jiraId, reason]
      properties:
        jiraId: { type: string }
        issueKey: { type: string, nullable: true, description: "Null for an item the re-browse no longer finds and, for a non-admin under an active `filter`, for a ticked id the same-scope preview redacts (answered `CHANGED`, exactly like an absent id)." }
        reason: { type: string, enum: [ALREADY_BOUND, NO_PARENT, NAME_TAKEN, LEVEL_UNMAPPED, NO_TEAM, PARENT_SKIPPED, OUTSIDE_ROOT, CHANGED], description: "`CHANGED`: the item differs from the preview's `expected`, or the site no longer holds it. `NAME_TAKEN` also covers a BIND target bound elsewhere meanwhile; `PARENT_SKIPPED` an item whose parent row was skipped; `OUTSIDE_ROOT` a row outside the root's subtree. The rest are the preview's." }
    JiraImportResult:
      type: object
      required: [revision, created, bound, skipped]
      properties:
        revision: { type: integer, format: int64, description: "The plan revision after the ONE bump (also when everything was skipped)." }
        created: { type: array, items: { $ref: '#/components/schemas/JiraImportCreated' } }
        bound: { type: array, items: { $ref: '#/components/schemas/JiraImportBound' } }
        skipped: { type: array, items: { $ref: '#/components/schemas/JiraImportSkipped' }, description: "The ticked items that were not written: the visible skips first, in row order; for a non-admin under an active `filter` every other one after them (CHANGED, no key), in the order ticked." }
    JiraBindRequest:
      type: object
      required: [connectionId, level, nodeId, issueKey]
      properties:
        connectionId: { type: integer, format: int32, minimum: 0, description: "The connection; `400` when it is unknown, deleted or disabled." }
        level: { allOf: [{ $ref: '#/components/schemas/PlanLevel' }], description: "The kind of plan node; `nodeId` is the id of a program, project or milestone accordingly. `400` when the connection's mapping does not map the level." }
        nodeId: { type: integer, format: int32, minimum: 0 }
        issueKey: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,9}-[0-9]{1,10}$', maxLength: 21, description: "The Jira issue key, e.g. `ABC-12`; trimmed. `400` for a key outside the connection's project keys, an unknown issue, or an issue whose hierarchy level is not the one the mapping gives `level` (the message names both)." }
    JiraBindingNode:
      type: object
      required: [kind, id, name]
      properties:
        kind: { $ref: '#/components/schemas/PlanLevel' }
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        projectName: { type: string, nullable: true, description: "A milestone's project." }
        programName: { type: string, nullable: true, description: "A milestone's or project's program." }
        workStreamName: { type: string, nullable: true }
    JiraBindingCreator:
      type: object
      required: [userId, name]
      properties:
        userId: { type: integer, format: int32, minimum: 0 }
        name: { type: string, description: "The login's active person's name, else its display name - never its email." }
    JiraBindingObservation:
      type: object
      description: The latest observed state of the bound issue, as the site sent it (dates are Jira's own, with no order check).
      required: [observedAt, statusCategory, gone]
      properties:
        observedAt: { type: integer, format: int64 }
        issueKey: { type: string, nullable: true }
        summary: { type: string, nullable: true, maxLength: 255 }
        typeId: { type: string, nullable: true }
        typeName: { type: string, nullable: true }
        hierarchyLevel: { type: integer, format: int32, nullable: true }
        statusName: { type: string, nullable: true }
        statusCategory: { $ref: '#/components/schemas/StatusCategory' }
        parentIssueId: { type: string, nullable: true }
        parentIssueKey: { type: string, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        estimate: { type: number, format: double, nullable: true, description: "In `estimateUnit`, at two decimals; null when the mapping reads none or the site sent no usable number." }
        estimateUnit: { $ref: '#/components/schemas/NullableEstimateUnit' }
        teamName: { type: string, nullable: true, maxLength: 100 }
        jiraUpdatedAt: { type: integer, format: int64, nullable: true }
        gone: { type: boolean, description: "The issue could not be read on a later run (set by the run, never by a bind)." }
        goneReason:
          type: string
          nullable: true
          enum: [DELETED, OUT_OF_SCOPE, MOVED_OUT, NOT_LISTED, FORBIDDEN]
          description: >-
            Why the issue is gone. `DELETED`: the probe's `404`; `FORBIDDEN`: its `403`; `OUT_OF_SCOPE`: the sweep's verdict until the
            probe answers; `MOVED_OUT`: Jira still has the issue but its key is outside the connection's project keys; `NOT_LISTED`: its
            key is inside them but the listing no longer holds it. The last two are derived on read against the current keys.
    JiraBinding:
      type: object
      required: [id, connectionId, level, node, issueId, issueKey, url, createdAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        connectionId: { type: integer, format: int32, minimum: 0 }
        level: { $ref: '#/components/schemas/PlanLevel' }
        node: { $ref: '#/components/schemas/JiraBindingNode' }
        issueId: { type: string, description: The numeric Jira issue id (a key changes when an issue moves project). }
        issueKey: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,9}-[0-9]{1,10}$', maxLength: 21, description: "The issue's current key as Jira last answered it: it follows the issue when a run sees it in another project (a moved issue shows its new key, possibly in a project outside the connection's keys, to every caller who may read the bindings); `observation.issueKey` keeps the key the issue was last read under." }
        url: { type: string, description: "`<site>/browse/<key>`, under the current key." }
        observation:
          allOf:
            - $ref: '#/components/schemas/JiraBindingObservation'
          nullable: true
        createdAt: { type: integer, format: int64 }
        createdBy:
          allOf:
            - $ref: '#/components/schemas/JiraBindingCreator'
          nullable: true
    JiraBindingPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JiraBinding'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    FlowConnectionRequest:
      type: object
      required: [name, baseUrl, timeZone]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        baseUrl:
          type: string
          maxLength: 255
          description: >-
            Flow's origin, exactly one the operator allows (`GET /integrations/flow/origins`), in canonical form: lowercase scheme and
            host, the scheme's default port omitted, no path (a trailing slash included), query, fragment or credentials. An origin that
            is not allowed is a `400`; the registry can never widen the list.
        timeZone:
          type: string
          maxLength: 64
          description: >-
            An IANA region id (`Europe/Warsaw`, Flow's own metrics zone by default): Flow's sprint and membership instants become dates in it.
            A bare offset such as `+02:00` is refused.
        apiToken:
          type: string
          format: password
          writeOnly: true
          nullable: true
          maxLength: 1000
          description: >-
            Flow's read-only service token (`flow_int_` followed by 43 base64url characters). Required on create (non-blank). On update an
            omitted, empty or blank token keeps the stored one and a present one rotates it. Encrypted at rest; never returned, logged or audited.
        enabled: { type: boolean, default: true }
        pollIntervalMinutes:
          type: integer
          format: int32
          nullable: true
          minimum: 5
          maximum: 1440
          # No `default:` here on purpose (as for the Jira connection): openapi-typescript would make the member REQUIRED in the web's request type.
          description: >-
            Minutes between scheduled runs. Omitted means 60 (a PUT is a full replace, so a PUT without the member resets it to 60); an explicit
            `null` means manual only (Refresh now still works).
    FlowConnection:
      type: object
      required: [id, name, baseUrl, timeZone, hasApiToken, enabled, pollIntervalMinutes, lastTestedAt, lastTestOk, teamsAt, lastRun, status, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        baseUrl: { type: string }
        timeZone: { type: string }
        hasApiToken:
          type: boolean
          description: Whether a token is stored. The token itself is write-only and appears in no response.
        enabled: { type: boolean }
        pollIntervalMinutes: { type: integer, format: int32, nullable: true, description: Minutes between scheduled runs; null means manual only. }
        lastTestedAt: { type: integer, format: int64, nullable: true, description: Epoch millis of the last connection test. }
        lastTestOk: { type: boolean, nullable: true, description: "Whether the last connection test passed; null until one ran, and again after a changed token or time zone." }
        teamsAt: { type: integer, format: int64, nullable: true, description: Epoch millis of the run that last replaced the mirror of Flow's teams; null until one ran. }
        lastRun:
          allOf:
            - $ref: '#/components/schemas/SyncLastRun'
          nullable: true
          description: "This connection's own newest run (the other connections' runs never count); null before the first. `running` is the server's verdict."
        status: { $ref: '#/components/schemas/SyncStatus' }
        createdAt: { type: integer, format: int64, description: Epoch millis }
        updatedAt: { type: integer, format: int64, description: Epoch millis }
    FlowConnectionPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FlowConnection'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
    FlowOriginList:
      type: object
      required: [items]
      description: The Flow origins the operator allows a connection to name - a small operator-curated set (not paged).
      properties:
        items:
          type: array
          items:
            type: string
            description: An origin, `https://` or `http://` + a host of at most 253 characters + `:65535` at most, hence the length bound; the list has no count cap.
            maxLength: 267
    FlowTestRow:
      type: object
      required: [name, path, required, ok]
      properties:
        name: { type: string, description: "The probe: `me` (the token is live), `teams` (the document decodes) or `stored_token` (the stored token cannot be decrypted)." }
        path: { type: string, description: The endpoint probed (no query string). }
        required: { type: boolean, description: Whether a failure fails the test. }
        ok: { type: boolean }
        status: { type: integer, format: int32, nullable: true, description: The upstream HTTP status when one answered. }
        code: { $ref: '#/components/schemas/SyncFailureCode' }
        scopeHint: { type: string, nullable: true, description: What the probe needs of Flow (`Flow 1.57.0 or later`); absent on a row that never ran. }
    FlowTestResult:
      type: object
      required: [rows, truncated, recorded]
      properties:
        rows:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/FlowTestRow'
        teamCount: { type: integer, format: int32, nullable: true, minimum: 0, description: Teams in the decoded document; null unless the `teams` probe passed. }
        sprintCount: { type: integer, format: int32, nullable: true, minimum: 0, description: Sprints across those teams; null unless the `teams` probe passed. }
        truncated: { type: boolean, description: "Whether Flow cut the document at its caps (1,000 teams, 2,000 sprints); the run keeps what it got and warns." }
        recorded: { type: boolean, description: "Whether the result was stored on the connection (false for an ad-hoc test, or when an edit raced the test)." }
    FlowTeamBindRequest:
      type: object
      required: [connectionId, flowTeamId, teamId]
      properties:
        connectionId: { type: integer, format: int32, minimum: 0, description: The Flow connection (active and enabled). }
        flowTeamId: { type: integer, format: int32, minimum: 1, description: "The Flow team's id, as `GET /integrations/flow/teams` lists it." }
        teamId: { type: integer, format: int32, minimum: 0, description: The Astrolabe team to link. }
    CapacityPreviewRequest:
      type: object
      description: An empty object is a valid request (today, closed sprints left out).
      properties:
        from:
          type: string
          format: date
          description: "The first day the import is about (`YYYY-MM-DD`, years 1900-2999); a sprint that ended before it is closed. Absent = today in the connection's time zone."
        includeClosed: { type: boolean, default: false, description: Also list the closed sprints (unticked). }
    CapacityInfo:
      type: object
      required: [code, date]
      properties:
        code:
          type: string
          enum: [MANUAL_PERIOD_INSIDE, ZERO_CAPACITY, LONG_WINDOW, FIXED_FIGURE]
          description: >-
            `MANUAL_PERIOD_INSIDE`: a hand-entered period starts inside the sprint, so its figure will not hold from `date`.
            `ZERO_CAPACITY`: Flow's figure is 0. `LONG_WINDOW`: the sprint spans more than 60 calendar days, claims only the days no other
            sprint holds, and is never ticked. `FIXED_FIGURE`: Flow's figure is a fixed per-sprint total, spread over the working days of
            the sprint's own window (`days`).
        date: { type: string, format: date, nullable: true, description: Set for `MANUAL_PERIOD_INSIDE` only. }
        days: { type: integer, format: int32, minimum: 1, nullable: true, description: "Set for `FIXED_FIGURE` only (null otherwise): the working days of the sprint's own window the figure is spread over." }
    CapacityExisting:
      type: object
      description: The ACTIVE period that already starts on the sprint's start date.
      required: [periodId, mdPerWeek, source]
      properties:
        periodId: { type: integer, format: int32, minimum: 0 }
        mdPerWeek: { type: number, format: double, minimum: 0 }
        source: { $ref: '#/components/schemas/CapacitySource' }
    CapacityImportItem:
      type: object
      required: [sprintId, name, state, start, end, effectiveFrom, workingDays, flowMd, mdPerWeek, action, reason, infos, ticked, existing]
      properties:
        sprintId: { type: integer, format: int64 }
        name: { type: string, maxLength: 255 }
        state: { type: string, maxLength: 10, description: "Flow's sprint state as sent (`closed`, `active`, `future`; an unknown one is kept)." }
        start: { type: string, format: date, nullable: true, description: "The sprint's start in the connection's time zone; null when Flow sent none." }
        end: { type: string, format: date, nullable: true, description: "The sprint's last day in the connection's time zone: the day of `max(startAt, (endAt ?: completeAt) - 1 ms)` - the planned end first; null without a start or an end." }
        effectiveFrom: { type: string, format: date, nullable: true, description: "The day the sprint's period starts: `max(start, the last day an earlier sprint holds + 1 day)`. A sprint with a start holds at least that day, even without a usable end; a `LONG_WINDOW` sprint claims last, so its day is the first one no other sprint holds. Null when the sprint has no dates or lies wholly inside earlier sprints." }
        workingDays: { type: integer, format: int32, minimum: 0, nullable: true, description: "Working days from `effectiveFrom` to `end`, both counted, on Astrolabe's calendar; null without usable dates or when the sprint lies wholly inside an earlier sprint." }
        flowMd: { type: number, format: double, minimum: 0, nullable: true, description: "Flow's man-days for the whole sprint; null when Flow has none." }
        mdPerWeek: { type: number, format: double, minimum: 0, nullable: true, description: "`round2(5 x flowMd / workingDays)`, rounded half up, except for a `TEAM_DEFAULT` (or legacy `CONFIGURED`) sprint (a fixed per-sprint figure in Flow), which divides by the working days of its own window `[start, end]`; null when the sprint is skipped before a figure exists or the figure is out of range." }
        action:
          type: string
          enum: [CREATE, UPDATE, UNCHANGED, MANUAL_PERIOD, SKIP]
          description: >-
            What the import would do. `MANUAL_PERIOD`: a hand-entered period starts on `effectiveFrom`, and it is never changed.
        reason:
          type: string
          nullable: true
          enum: [NO_DATES, NO_CAPACITY, NO_WORKING_DAY, OVERLAPS, OUT_OF_RANGE]
          description: >-
            Why the sprint is skipped; set exactly when `action` is `SKIP`. The first rule that fires, in this order: `NO_DATES` (no
            start, no end or completion, or an end before the start), `NO_CAPACITY` (Flow has no figure), `OVERLAPS` (wholly inside
            earlier sprints), `NO_WORKING_DAY` (none from `effectiveFrom` to `end`), `OUT_OF_RANGE` (the figure is beyond a period's
            man-day bounds).
        infos:
          type: array
          items:
            $ref: '#/components/schemas/CapacityInfo'
        ticked: { type: boolean, description: "The default selection: the sprint is not closed, not `ZERO_CAPACITY`, not `LONG_WINDOW`, and is a `CREATE` or an `UPDATE`." }
        existing:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CapacityExisting'
    CapacityImportRemoval:
      type: object
      description: A Flow-sourced period the import would remove. Never preselected by a client.
      required: [periodId, effectiveFrom, mdPerWeek, flowSprintId, flowSprintName]
      properties:
        periodId: { type: integer, format: int32, minimum: 0 }
        effectiveFrom: { type: string, format: date }
        mdPerWeek: { type: number, format: double, minimum: 0 }
        flowSprintId: { type: integer, format: int64, nullable: true, description: The Flow sprint the period was imported for. }
        flowSprintName: { type: string, maxLength: 255, nullable: true }
    CapacityImportTotals:
      type: object
      description: "`skip` counts the `SKIP` and the `MANUAL_PERIOD` rows: the sprints the import leaves alone."
      required: [create, update, unchanged, skip, removals]
      properties:
        create: { type: integer, format: int32, minimum: 0 }
        update: { type: integer, format: int32, minimum: 0 }
        unchanged: { type: integer, format: int32, minimum: 0 }
        skip: { type: integer, format: int32, minimum: 0 }
        removals: { type: integer, format: int32, minimum: 0 }
    CapacityPreview:
      type: object
      description: >-
        What importing a bound Flow team's mirrored sprints would do to its capacity periods. A sprint is covered when it is not closed,
        not a long window (`LONG_WINDOW`) and a `CREATE`, `UPDATE` or `UNCHANGED`.
      required: [bindingId, teamId, observedAt, sprintsComplete, zone, from, includeClosed, totals, items, removals]
      properties:
        bindingId: { type: integer, format: int32, minimum: 0 }
        teamId: { type: integer, format: int32, minimum: 0 }
        observedAt: { type: integer, format: int64, nullable: true, description: "Epoch millis the mirror last saw the Flow team; null when the team is not in the mirror (then `items` and `removals` are empty)." }
        sprintsComplete:
          type: boolean
          description: >-
            True when the team's mirrored sprint snapshot is complete. False when the team is absent, the snapshot was truncated or
            it predates completeness tracking. In that case items and removals are empty and the totals are zero.
        zone: { type: string, description: "The connection's IANA time zone id every date is in." }
        from: { type: string, format: date, description: "The resolved `from` the plan was computed with: the request's, else today in `zone`." }
        includeClosed: { type: boolean, description: "Echo of the request; with `from`, what the apply sends back to re-run the same plan." }
        totals: { $ref: '#/components/schemas/CapacityImportTotals' }
        items:
          type: array
          maxItems: 2000
          description: The listed sprints in start order (undated last); at most Flow's own cap of 2,000 sprints per document.
          items:
            $ref: '#/components/schemas/CapacityImportItem'
        removals:
          type: array
          description: >-
            Flow-sourced periods the import would remove, by date; never preselected; a hand-entered one is never listed. Those no listed
            sprint reuses that belong to a sprint missing from Flow's document (dated `from` or later, or any date with `includeClosed`),
            start inside a covered sprint, or belong to a listed sprint without being its period. A refused sprint that still holds days
            keeps its period.
          items:
            $ref: '#/components/schemas/CapacityImportRemoval'
    CapacityApplyExpected:
      type: object
      description: What the preview showed for a ticked row; the apply imports the row only while its re-computed plan says the same.
      required: [action, effectiveFrom, mdPerWeek]
      properties:
        action: { type: string, enum: [CREATE, UPDATE], description: "Only a `CREATE` or an `UPDATE` can be imported (`400` otherwise)." }
        effectiveFrom: { type: string, format: date, description: "The item's `effectiveFrom`." }
        mdPerWeek: { type: number, format: double, minimum: 0, description: "The item's `mdPerWeek` (at most two decimals, below 1,000,000)." }
    CapacityApplyItem:
      type: object
      required: [sprintId, expected]
      properties:
        sprintId: { type: integer, format: int64 }
        expected: { $ref: '#/components/schemas/CapacityApplyExpected' }
    CapacityApplyRequest:
      type: object
      required: [items, removals]
      properties:
        from: { type: string, format: date, description: "The preview's echoed `from` (the apply re-runs the plan with it). Absent = today in the connection's time zone." }
        includeClosed: { type: boolean, default: false, description: "The preview's echoed `includeClosed`." }
        items:
          type: array
          maxItems: 2000
          description: The ticked sprints; each sprint at most once.
          items:
            $ref: '#/components/schemas/CapacityApplyItem'
        removals:
          type: array
          maxItems: 2000
          description: The ticked removals (period ids); each at most once.
          items: { type: integer, format: int32, minimum: 0 }
    CapacityAppliedPeriod:
      type: object
      required: [periodId, sprintId]
      properties:
        periodId: { type: integer, format: int32, minimum: 0 }
        sprintId: { type: integer, format: int64, description: The Flow sprint the period is for. }
    CapacityApplySkipped:
      type: object
      description: A row the apply left alone. `sprintId` is set for an item, `periodId` for a removal (the other is null).
      required: [sprintId, periodId, reason]
      properties:
        sprintId: { type: integer, format: int64, nullable: true }
        periodId: { type: integer, format: int32, minimum: 0, nullable: true }
        reason:
          type: string
          enum: [CHANGED]
          description: "The plan, recomputed at the apply, no longer says what the preview did (or the row was never in it)."
    CapacityApplyResponse:
      type: object
      required: [created, updated, deleted, skipped]
      properties:
        created:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/CapacityAppliedPeriod' }
        updated:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/CapacityAppliedPeriod' }
        deleted:
          type: array
          maxItems: 2000
          description: The soft-deleted period ids.
          items: { type: integer, format: int32, minimum: 0 }
        skipped:
          type: array
          maxItems: 4000
          items: { $ref: '#/components/schemas/CapacityApplySkipped' }
    FlowTeamBinding:
      type: object
      required: [id, connectionId, teamId, teamName, flowTeamId, flowTeamName, createdAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        connectionId: { type: integer, format: int32, minimum: 0 }
        teamId: { type: integer, format: int32, minimum: 0 }
        teamName: { type: string }
        flowTeamId: { type: integer, format: int32 }
        flowTeamName: { type: string, description: The Flow team's name when it was linked; a rename in Flow does not change it (the link follows `flowTeamId`). }
        createdAt: { type: integer, format: int64, description: Epoch millis }
    FlowMatchBound:
      type: object
      required: [bindingId, teamId, flowTeamId]
      properties:
        bindingId: { type: integer, format: int32, minimum: 0 }
        teamId: { type: integer, format: int32, minimum: 0 }
        flowTeamId: { type: integer, format: int32 }
    FlowMatchSkipped:
      type: object
      required: [flowTeamId, reason]
      properties:
        flowTeamId: { type: integer, format: int32 }
        reason: { type: string, enum: [NO_MATCH, ALREADY_BOUND] }
    FlowTeamMatch:
      type: object
      required: [bound, skipped]
      properties:
        bound:
          type: array
          items:
            $ref: '#/components/schemas/FlowMatchBound'
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/FlowMatchSkipped'
    FlowTeamListItem:
      type: object
      required: [flowTeamId, name, bindingId, boundTeamId, boundTeamName, suggestedTeamId, suggestedTeamName, members, sprints, observedAt]
      properties:
        flowTeamId: { type: integer, format: int32 }
        name: { type: string }
        bindingId: { type: integer, format: int32, nullable: true, minimum: 0, description: The ACTIVE binding of an ACTIVE team to this Flow team; null when it is not linked. }
        boundTeamId: { type: integer, format: int32, nullable: true, minimum: 0 }
        boundTeamName: { type: string, nullable: true }
        suggestedTeamId:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          description: >-
            The one unbound active team whose name equals this Flow team's (trimmed, whitespace collapsed, lowercased; accents count), and only
            if no other unlinked Flow team folds to the same name. Null for a linked Flow team and when there is no unique match.
        suggestedTeamName: { type: string, nullable: true }
        members: { type: integer, format: int32, minimum: 0, description: "The roster's membership intervals of the team (a person with two intervals counts twice)." }
        sprints: { type: integer, format: int32, minimum: 0, description: Mirrored sprints. }
        observedAt: { type: integer, format: int64, description: Epoch millis of the run that last saw the team. }
    FlowTeamList:
      type: object
      required: [connectionId, teamsAt, items]
      properties:
        connectionId: { type: integer, format: int32, minimum: 0 }
        teamsAt: { type: integer, format: int64, nullable: true, description: Epoch millis of the run that last replaced the mirror; null until one ran (then `items` is empty). }
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/FlowTeamListItem'
    FlowPanelCan:
      type: object
      description: The caller's rights on the team's Flow link - ADMIN or the team's ACTIVE manager; the three flags carry the same verdict today.
      required: [link, unlink, importCapacity]
      properties:
        link: { type: boolean }
        unlink: { type: boolean }
        importCapacity: { type: boolean }
    FlowPanelBinding:
      type: object
      required: [id, connectionId, connectionName, flowTeamId, flowTeamName, connectionEnabled, status, observedAt, gone]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        connectionId: { type: integer, format: int32, minimum: 0 }
        connectionName: { type: string }
        flowTeamId: { type: integer, format: int32 }
        flowTeamName: { type: string }
        connectionEnabled: { type: boolean }
        status: { $ref: '#/components/schemas/SyncStatus' }
        observedAt: { type: integer, format: int64, nullable: true, description: "Epoch millis the mirror last saw the Flow team; for a gone team, when the connection last replaced the mirror (null before any run)." }
        gone:
          type: boolean
          description: The connection has mirrored a document and the linked Flow team is not in it. Derived at read time, never stored; the link stays until it is removed.
    FlowRosterCurrent:
      type: object
      required: [displayName, since]
      properties:
        displayName: { type: string, description: 'Flow''s display name, or "Unknown account" when Flow sent none.' }
        since: { type: string, format: date, description: "The start of the membership, in the connection's time zone." }
    FlowRosterFormer:
      type: object
      required: [displayName, from, to]
      properties:
        displayName: { type: string, description: 'Flow''s display name, or "Unknown account" when Flow sent none.' }
        from: { type: string, format: date }
        to: { type: string, format: date, description: The first day the person was no longer a member (the interval is half-open). }
    FlowRoster:
      type: object
      description: >-
        Memberships by half-open instant interval `[validFrom, validTo)`: current when `validFrom <= now < validTo` (an open end never
        ends), former when `validTo <= now`; a membership that has not started is in neither list. A person with two intervals appears
        once per interval. `current` and `former` have no `maxItems`; they hold what the mirror has for ONE team.
      required: [current, former]
      properties:
        current:
          type: array
          items:
            $ref: '#/components/schemas/FlowRosterCurrent'
        former:
          type: array
          items:
            $ref: '#/components/schemas/FlowRosterFormer'
    FlowSprintSummary:
      type: object
      required: [count, nextStart]
      properties:
        count: { type: integer, format: int32, minimum: 0 }
        nextStart: { type: string, format: date, nullable: true, description: "The first mirrored sprint start that is today or later, in the connection's time zone; null when none." }
    FlowPanelConnection:
      type: object
      description: >-
        One ACTIVE Flow connection, as much as a client needs to pick one to link through and no more - never a base URL, token, time
        zone, poll interval or test detail (the registry is ADMIN-only).
      required: [id, name, enabled]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        enabled: { type: boolean, description: "A disabled connection is listed too; linking through it is a `400`." }
    FlowTeamPanel:
      type: object
      required: [team, can, binding, roster, sprints, connections]
      properties:
        team: { $ref: '#/components/schemas/TeamRef' }
        can: { $ref: '#/components/schemas/FlowPanelCan' }
        binding:
          allOf:
            - $ref: '#/components/schemas/FlowPanelBinding'
          nullable: true
        roster:
          allOf:
            - $ref: '#/components/schemas/FlowRoster'
          nullable: true
        sprints:
          allOf:
            - $ref: '#/components/schemas/FlowSprintSummary'
          nullable: true
        connections:
          type: array
          maxItems: 100
          description: >-
            Always present, whoever asks: every ACTIVE Flow connection, enabled or not, by name then id, so a manager who cannot read the
            ADMIN-only registry can pick one to link through. Cut at 100 (the first 100 by name).
          items:
            $ref: '#/components/schemas/FlowPanelConnection'
    CapacityDeviationKind:
      type: string
      enum: [CAPACITY_DIFFERS, CAPACITY_MISSING, TEAM_GONE]
      description: >-
        `CAPACITY_DIFFERS` (`abs(gapMd) >= 0.5`: WARNING when the plan has more capacity than Flow, INFO when less; a day before the
        team's first period counts 0), `CAPACITY_MISSING` (INFO: no capacity period is in force on any working day of the sprint),
        `TEAM_GONE` (WARNING: the connection has mirrored a document and the linked Flow team is not in it; it is the team's only row
        and every `detail` member is null; a truncated document never raises one). A team whose connection never mirrored a document
        is not listed.
    CapacityDeviationDetail:
      type: object
      description: >-
        The evidence of one deviation, over the days the sprint holds (`effectiveFrom` to its end, working days on the live calendar).
        Every member is null for `TEAM_GONE`; `planMd` and `gapMd` are null for `CAPACITY_MISSING`. Man-days are decimal numbers
        rounded to two decimals, and the figures are rounded before they are compared.
      required: [sprintId, sprintName, start, end, effectiveFrom, workingDays, flowMd, flowTotalMd, planMd, gapMd]
      properties:
        sprintId: { type: integer, format: int64, nullable: true }
        sprintName: { type: string, nullable: true }
        start: { type: string, format: date, nullable: true, description: "The sprint's first day in the connection's time zone." }
        end: { type: string, format: date, nullable: true, description: "The sprint's last day in the connection's time zone." }
        effectiveFrom: { type: string, format: date, nullable: true, description: "The first day the sprint holds (the capacity import's claim: a day an earlier sprint holds is not here)." }
        workingDays: { type: integer, format: int32, minimum: 0, nullable: true, description: "Working days from `effectiveFrom` to `end`." }
        flowMd: { type: number, format: double, nullable: true, description: "What the capacity import would make the plan carry over those days." }
        flowTotalMd: { type: number, format: double, nullable: true, description: "Flow's own total for the whole sprint; it differs from `flowMd` for a fixed per-sprint figure that shares days with an earlier sprint." }
        planMd: { type: number, format: double, nullable: true, description: "The plan's capacity over those days (the team view's arithmetic); null when no capacity period is in force on any of them." }
        gapMd: { type: number, format: double, nullable: true, description: "`planMd - flowMd`: POSITIVE = the plan has more than Flow." }
    CapacityDeviation:
      type: object
      required: [kind, severity, detail, fingerprint, acknowledgement]
      properties:
        kind: { $ref: '#/components/schemas/CapacityDeviationKind' }
        severity: { $ref: '#/components/schemas/Severity' }
        detail: { $ref: '#/components/schemas/CapacityDeviationDetail' }
        fingerprint:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            The SHA-256 of the row's kind, severity and figures, the sprint's name excluded (a rename in Flow changes nothing), stable
            across reads while nothing changes: what an acknowledgement of this row is keyed on. Send it back to `POST
            .../acknowledge` with the row's `detail.sprintId`.
        acknowledgement:
          allOf:
            - $ref: '#/components/schemas/CapacityDeviationAcknowledgement'
          nullable: true
          description: "The row's stored acknowledgement, null until someone acknowledges it."
    CapacityDeviationAcknowledgement:
      type: object
      description: >-
        A row's stored acknowledgement. The unit is the sprint row: acknowledging one leaves the team's other listed rows alone.
      required: [at, by, current]
      properties:
        at: { type: integer, format: int64, description: "When it was acknowledged (epoch milliseconds)." }
        by: { type: string, nullable: true, description: "The acknowledging login's ACTIVE person's name, else its display name; never the email; null once that login is deleted." }
        current:
          type: boolean
          description: >-
            True while the stored fingerprint equals the row's now. False = acknowledged, then changed since (its dates, held days,
            working days, either figure, the gap or the severity; a rename in Flow changes nothing), so the row is open again.
    CapacityAcknowledgeRequest:
      type: object
      required: [sprintId, fingerprint]
      properties:
        sprintId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: "Flow's id of the sprint (the row's `detail.sprintId`); null names the binding's own `TEAM_GONE` row. REQUIRED: an absent key is a `400`."
        fingerprint:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The `fingerprint` of the row the client read.
    CapacityAcknowledgement:
      type: object
      required: [bindingId, sprintId, fingerprint, acknowledgedAt, acknowledgedBy]
      properties:
        bindingId: { type: integer, format: int32, minimum: 0 }
        sprintId: { type: integer, format: int64, minimum: 1, nullable: true, description: "The acknowledged sprint; null = the team's own row." }
        fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        acknowledgedAt: { type: integer, format: int64, description: Epoch milliseconds. }
        acknowledgedBy: { type: string, nullable: true, description: "The acknowledging login's active person's name, else its display name; never the email." }
    CapacityAcknowledgeAllRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 2000
          description: "The rows to acknowledge, the single acknowledge's pair each; no row (`sprintId`) twice."
          items:
            $ref: '#/components/schemas/CapacityAcknowledgeRequest'
    CapacityAcknowledgeBatch:
      type: object
      required: [acknowledged]
      properties:
        acknowledged:
          type: array
          description: "The stored acknowledgements, in the request's order; all stamped with one time and login."
          items:
            $ref: '#/components/schemas/CapacityAcknowledgement'
    CapacityUnacknowledgeAllRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 2000
          description: "The rows whose acknowledgement is withdrawn; no row (`sprintId`) twice."
          items:
            type: object
            required: [sprintId]
            properties:
              sprintId:
                type: integer
                format: int64
                minimum: 1
                nullable: true
                description: "Flow's id of the sprint (the row's `detail.sprintId`); null names the binding's own `TEAM_GONE` row. REQUIRED: an absent key is a `400`."
    CapacityDeviationConnection:
      type: object
      description: An ACTIVE Flow connection, enabled or not - never a base URL, token or time zone.
      required: [id, name, enabled, status, teamsAt]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        name: { type: string }
        enabled: { type: boolean }
        status: { $ref: '#/components/schemas/SyncStatus' }
        teamsAt: { type: integer, format: int64, nullable: true, description: "Epoch millis the connection last replaced its mirror; null before any run." }
    CapacityDeviationFlowTeam:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int32 }
        name: { type: string, description: "The Flow team's name when it was linked." }
    CapacityDeviationCan:
      type: object
      required: [acknowledge]
      properties:
        acknowledge: { type: boolean, description: "The caller may acknowledge and unacknowledge this team's rows: ADMIN, or the team's active manager." }
    CapacityDeviationItem:
      type: object
      description: >-
        One linked team with its deviations: never empty in a listed item unless `sprintsComplete` is false (the filters narrow it).
      required: [bindingId, connectionId, team, flowTeam, observedAt, zone, can, sprintsComplete, deviations]
      properties:
        bindingId: { type: integer, format: int32, minimum: 0 }
        connectionId: { type: integer, format: int32, minimum: 0 }
        team: { $ref: '#/components/schemas/TeamRef' }
        flowTeam: { $ref: '#/components/schemas/CapacityDeviationFlowTeam' }
        observedAt: { type: integer, format: int64, nullable: true, description: "Epoch millis the mirror last saw the Flow team; null when it is gone." }
        zone: { type: string, description: "The connection's IANA time zone id, the zone of the sprint dates." }
        can: { $ref: '#/components/schemas/CapacityDeviationCan' }
        sprintsComplete:
          type: boolean
          description: >-
            False = the team's stored sprint snapshot is incomplete (a document cut at the sprint cap, or a mirror older than the
            flag): the comparison is PENDING a complete Flow refresh and `deviations` is empty. No warning is ever derived from
            partial data and the team is never "in line".
        deviations:
          type: array
          items:
            $ref: '#/components/schemas/CapacityDeviation'
    CapacityDeviationTotals:
      type: object
      description: Before the 1,000-team cap. `warnings`, `infos`, `gone`, `acknowledged` and `pending` share one basis, what matches every filter but the acknowledgement state; `teams` is the exception (the teams the list answers with a row).
      required: [warnings, infos, gone, acknowledged, teams, pending]
      properties:
        warnings: { type: integer, format: int32, minimum: 0, description: "The OPEN (not currently acknowledged) WARNING rows, `TEAM_GONE` included." }
        infos: { type: integer, format: int32, minimum: 0, description: "The OPEN INFO rows." }
        gone: { type: integer, format: int32, minimum: 0, description: "The OPEN `TEAM_GONE` rows." }
        acknowledged: { type: integer, format: int32, minimum: 0, description: "The rows with a CURRENT acknowledgement among those matching every filter but `acknowledged` (and the default that hides them)." }
        teams: { type: integer, format: int32, minimum: 0, description: "Teams the list answers with a row (the ones with an open row by default), before the cap; `items` holds at most the first 1,000." }
        pending: { type: integer, format: int32, minimum: 0, description: "The teams whose sprint snapshot is incomplete (`sprintsComplete` false), before the cap and whatever the acknowledgement state (so `acknowledged=true` still counts them, though it lists none): no row, in none of the other figures; 0 under a `severity` or `kind` filter (a team without a row matches neither)." }
    CapacityDeviationView:
      type: object
      required: [asOf, connections, totals, items, truncated]
      properties:
        asOf: { type: string, format: date, description: The UTC date of the read. }
        connections:
          description: >-
            Every active Flow connection (at most 100), enabled or not, by name then id, with its sync `status` and `teamsAt`.
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CapacityDeviationConnection'
        totals: { $ref: '#/components/schemas/CapacityDeviationTotals' }
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/CapacityDeviationItem'
        truncated: { type: boolean, description: "More than 1,000 teams matched and the rest were dropped." }
    SyncRunRequest:
      type: object
      required: [kind, connectionId]
      properties:
        kind: { $ref: '#/components/schemas/SyncKind' }
        connectionId: { type: integer, format: int32, minimum: 0 }
    SyncRun:
      type: object
      description: One run of a connector over one connection. Unfinished while `finishedAt` and `outcome` are null.
      required: [id, kind, connectionId, trigger, startedAt, running, observedCount, goneCount, callCount, rateLimitedCount, backoffMs]
      properties:
        id: { type: integer, format: int32, minimum: 0 }
        kind: { $ref: '#/components/schemas/SyncKind' }
        connectionId: { type: integer, format: int32, minimum: 0 }
        trigger: { $ref: '#/components/schemas/SyncTrigger' }
        requestedByUserId: { type: integer, format: int32, minimum: 0, nullable: true, description: The login that asked; null for a scheduled run. }
        startedAt: { type: integer, format: int64 }
        finishedAt: { type: integer, format: int64, nullable: true }
        outcome: { allOf: [{ $ref: '#/components/schemas/SyncOutcome' }], nullable: true, description: "`ABANDONED` is written by a later claim for a run that never finished." }
        errorCode: { $ref: '#/components/schemas/SyncFailureCode' }
        errorDetail: { type: string, nullable: true, maxLength: 500, description: "A short hint of at most 500 characters; never a URL, a query string or a credential." }
        running: { type: boolean, description: "The server's verdict: true only for an unfinished run younger than the maximum run time (10 minutes by default). An unfinished run that is not running was interrupted; no client judges a run's age by its own clock." }
        observedCount: { type: integer, format: int32, minimum: 0, description: "Bound issues whose observation this run wrote (`JIRA`); the Flow teams the document carried (`FLOW`)." }
        goneCount: { type: integer, format: int32, minimum: 0, description: "Bound issues the run's sweep found out of scope, flagged `gone` (`JIRA`); the bound Flow teams missing from the document (`FLOW`)." }
        callCount: { type: integer, format: int32, minimum: 0, description: "Requests the run issued to the upstream (a retry is not counted); 1 for a `FLOW` run." }
        rateLimitedCount: { type: integer, format: int32, minimum: 0, description: Responses that were a 429. }
        backoffMs: { type: integer, format: int64, minimum: 0, description: Milliseconds the run's calls asked to sleep in backoff or in a tenant pause. }
    SyncRunList:
      type: object
      required: [items]
      description: The newest runs first, at most 50 - a bounded list, not paged.
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/SyncRun'
