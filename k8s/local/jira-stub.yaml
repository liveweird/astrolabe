# The Jira stub for the OrbStack overlay: WireMock over the deterministic dataset in sample-data/jira-stub (generated by
# sample-data/jira/generate.mjs from sample-data/plan/*.json). DEVELOPMENT ONLY, like k8s/local/front-door.yaml: apply-local.sh
# applies this file, the base k8s/*.yaml never contain the stub, and the app only learns its address from the overlay ConfigMap's
# JIRA_STUB_BASE_URL (the base app Deployment reads that key as OPTIONAL, so production, whose ConfigMap lacks it, sets no variable).
# The application REFUSES to boot in production mode with a stub URL (jira.stubBaseUrl, plugins `configureJira`).
#
# The app does not depend on the stub: it boots without it, and a Jira call fails with a typed code until the stub is Ready.
#
# Network (k8s/network-policies.yaml is default-deny): the app's egress policy excludes every private range, which includes the pod
# network, so reaching the stub NEEDS the explicit egress rule below (without it a Test connection against the stub fails on
# Kubernetes while passing on compose); the stub needs the matching ingress rule. The stub opens no connection of its own.
#
# The image is built by apply-local.sh from sample-data/jira-stub (`astrolabe-jira-stub:<tag>`); the image line below is the render placeholder it substitutes.
# Reset the day-2 scenario / flip it: kubectl -n astrolabe port-forward svc/jira-stub 8096:8080, then
#   curl -X PUT http://localhost:8096/__admin/scenarios/jira-day2/state -d '{"state":"day2"}'
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: jira-stub
  name: jira-stub
  namespace: astrolabe
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      io.kompose.service: jira-stub
  template:
    metadata:
      labels:
        io.kompose.service: jira-stub
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jira-stub
          image: astrolabe-jira-stub:local-build
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          # Measured on the image: ~125 MiB idle, ~150-165 MiB after a full sync run (the JVM heap is 25 % of the limit).
          resources:
            requests:
              cpu: "50m"
              memory: "192Mi"
            limits:
              memory: "384Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # WireMock loads ~1,600 mappings on start (~15-30 s on a laptop): a generous startup probe.
          startupProbe:
            httpGet:
              path: /__admin/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /__admin/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /__admin/health
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: jira-stub
  name: jira-stub
  namespace: astrolabe
spec:
  # ClusterIP: reachable from the app (http://jira-stub:8080), not from outside; port-forward for the admin API.
  ports:
    - name: "8080"
      port: 8080
      targetPort: 8080
  selector:
    io.kompose.service: jira-stub
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-jira-stub-from-app
  namespace: astrolabe
spec:
  podSelector:
    matchLabels:
      io.kompose.service: jira-stub
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              io.kompose.service: app
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-egress-to-jira-stub
  namespace: astrolabe
spec:
  podSelector:
    matchLabels:
      io.kompose.service: app
  policyTypes: [Egress]
  egress:
    # The Service is a ClusterIP; the policy is evaluated against the pod it resolves to.
    - to:
        - podSelector:
            matchLabels:
              io.kompose.service: jira-stub
      ports:
        - protocol: TCP
          port: 8080
