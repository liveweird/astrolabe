# The Flow stub for the OrbStack overlay: WireMock over the deterministic dataset in sample-data/flow-stub (generated by
# sample-data/flow/generate.mjs from the contract in sample-data/flow/contract.mjs). DEVELOPMENT ONLY, like k8s/local/front-door.yaml and
# k8s/local/jira-stub.yaml: apply-local.sh applies this file, the base k8s/*.yaml never contain the stub, and the app only learns its address
# from the overlay ConfigMap's FLOW_INSECURE_ORIGINS (the base app Deployment reads that key as OPTIONAL, so production, whose ConfigMap lacks
# it, sets no variable). The application REFUSES to boot in production mode with a non-blank FLOW_INSECURE_ORIGINS (v1.5.0 C3 on).
#
# The app does not depend on the stub: it boots without it, and a Flow call fails with a typed code until the stub is Ready.
#
# Network (k8s/network-policies.yaml is default-deny): the app's egress policy excludes every private range, which includes the pod
# network, so reaching the stub NEEDS the explicit egress rule below (without it a Test connection against the stub fails on
# Kubernetes while passing on compose); the stub needs the matching ingress rule. The stub opens no connection of its own.
#
# The image is built by apply-local.sh from sample-data/flow-stub (`astrolabe-flow-stub:<tag>`); the image line below is the render placeholder it substitutes.
# Reset / flip the scenarios: kubectl -n astrolabe port-forward svc/flow-stub 8097:8080, then
#   curl -X PUT http://localhost:8097/__admin/scenarios/flow-day2/state -d '{"state":"day2"}'   (or flow-outage / "down")
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: flow-stub
  name: flow-stub
  namespace: astrolabe
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      io.kompose.service: flow-stub
  template:
    metadata:
      labels:
        io.kompose.service: flow-stub
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flow-stub
          image: astrolabe-flow-stub:local-build
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          # Nine mappings and a 130 KB document (the JVM heap is 25 % of the limit); ~115 MiB RSS measured.
          resources:
            requests:
              cpu: "25m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # WireMock starts in a few seconds with this few mappings (nine); the generous startup probe is the Jira stub's.
          startupProbe:
            httpGet:
              path: /__admin/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /__admin/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /__admin/health
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: flow-stub
  name: flow-stub
  namespace: astrolabe
spec:
  # ClusterIP: reachable from the app (http://flow-stub:8080), not from outside; port-forward for the admin API.
  ports:
    - name: "8080"
      port: 8080
      targetPort: 8080
  selector:
    io.kompose.service: flow-stub
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-flow-stub-from-app
  namespace: astrolabe
spec:
  podSelector:
    matchLabels:
      io.kompose.service: flow-stub
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              io.kompose.service: app
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-egress-to-flow-stub
  namespace: astrolabe
spec:
  podSelector:
    matchLabels:
      io.kompose.service: app
  policyTypes: [Egress]
  egress:
    # The Service is a ClusterIP; the policy is evaluated against the pod it resolves to.
    - to:
        - podSelector:
            matchLabels:
              io.kompose.service: flow-stub
      ports:
        - protocol: TCP
          port: 8080
