apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: app
  name: app
  namespace: astrolabe
spec:
  replicas: 1
  # Never overlap old password writers with the credential-revision-aware server (V7).
  # This single-instance deployment accepts brief downtime during application upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      io.kompose.service: app
  template:
    metadata:
      labels:
        io.kompose.service: app
    spec:
      # The app never calls the Kubernetes API — do not mount a ServiceAccount token into the pod.
      automountServiceAccountToken: false
      # SIGTERM to SIGKILL: Ktor's stop (shutdown grace + timeout) fits inside the 20 s STOP_WAIT_SECONDS of plugins/OpenTelemetry.kt,
      # and the OpenTelemetry SDK then needs up to 10 s more to flush and close: 30 s, exactly the 30 s default, with no margin.
      # 45 s leaves 15 s; JvmMemoryFlagsTest pins it against STOP_WAIT_SECONDS.
      terminationGracePeriodSeconds: 45
      # The image runs as uid 10001 (Dockerfile), the root filesystem is read-only (the JVM
      # only needs a writable /tmp), no privilege escalation.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - env:
            # Secrets come from the `astrolabe-secrets` Secret — see k8s/secret.yaml for how to
            # create it (never commit real values). In PRODUCTION mode (the base k8s/front-door.yaml)
            # the app fail-closes on placeholder/burned JWT secrets and on unrotated seed passwords, so
            # a misconfigured deploy crash-loops instead of running with a backdoor. Under the local
            # overlay (development mode) those only warn; a malformed DATA_ENCRYPTION_KEY (the
            # placeholder) still refuses startup in any mode.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: astrolabe-secrets
                  key: JWT_SECRET
            - name: DATA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: astrolabe-secrets
                  key: DATA_ENCRYPTION_KEY
            # Rotation only: the OLD key, decrypt-only (security.md "Encryption at rest"). Absent from the Secret = no previous key.
            - name: DATA_ENCRYPTION_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: astrolabe-secrets
                  key: DATA_ENCRYPTION_KEY_PREVIOUS
                  optional: true
            - name: ADMIN_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: astrolabe-secrets
                  key: ADMIN_INITIAL_PASSWORD
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: astrolabe-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: astrolabe-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_JDBC_URL
              value: jdbc:postgresql://postgres:5432/astrolabe
            - name: POSTGRES_R2DBC_URL
              value: r2dbc:postgresql://postgres:5432/astrolabe
            # The front-door posture (KTOR_DEVELOPMENT, HTTP_BEHIND_PROXY, HTTP_PROXY_HOPS) comes from
            # the `astrolabe-front-door` ConfigMap, read when the container starts. The base
            # k8s/front-door.yaml is the production posture (TLS-terminating ingress; UNSAFE behind a
            # bare LoadBalancer); apply-local.sh applies k8s/local/front-door.yaml (the OrbStack
            # overlay) instead — see both files' headers.
            - name: KTOR_DEVELOPMENT
              valueFrom:
                configMapKeyRef:
                  name: astrolabe-front-door
                  key: KTOR_DEVELOPMENT
            - name: HTTP_BEHIND_PROXY
              valueFrom:
                configMapKeyRef:
                  name: astrolabe-front-door
                  key: HTTP_BEHIND_PROXY
            - name: HTTP_PROXY_HOPS
              valueFrom:
                configMapKeyRef:
                  name: astrolabe-front-door
                  key: HTTP_PROXY_HOPS
            # The Jira stub's origin, DEVELOPMENT ONLY: it exists in the OrbStack overlay ConfigMap (k8s/local/front-door.yaml, with
            # k8s/local/jira-stub.yaml) and nowhere else. The production ConfigMap has no such key, so `optional: true` leaves the
            # variable UNSET there (the app refuses to boot in production mode with a non-blank value).
            - name: JIRA_STUB_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: astrolabe-front-door
                  key: JIRA_STUB_BASE_URL
                  optional: true
            # The Test connection / Peek per-IP bucket, raised to 30 in the OrbStack overlay only (e2e); absent from the production
            # ConfigMap, so `optional: true` leaves it UNSET there and the application keeps its default of 10.
            - name: JIRA_TEST_RATE_LIMIT_PER_MINUTE
              valueFrom:
                configMapKeyRef:
                  name: astrolabe-front-door
                  key: JIRA_TEST_RATE_LIMIT_PER_MINUTE
                  optional: true
            # The Flow origins a connection may name (the stub's, in the OrbStack overlay), DEVELOPMENT ONLY: like JIRA_STUB_BASE_URL it exists in
            # k8s/local/front-door.yaml and nowhere else, `optional: true` leaves it UNSET in production (the app refuses to boot in production mode
            # with a non-blank value). Read by the application from v1.5.0 C3 on.
            - name: FLOW_INSECURE_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: astrolabe-front-door
                  key: FLOW_INSECURE_ORIGINS
                  optional: true
            # The Flow Test connection per-IP bucket, raised to 30 in the OrbStack overlay only (e2e); `optional: true` keeps the default of 10 elsewhere. Read from v1.5.0 C4 on.
            - name: FLOW_TEST_RATE_LIMIT_PER_MINUTE
              valueFrom:
                configMapKeyRef:
                  name: astrolabe-front-door
                  key: FLOW_TEST_RATE_LIMIT_PER_MINUTE
                  optional: true
            # Password reset and email MFA need outbound mail. This deployment ships with
            # mail disabled — set "smtp" plus real SMTP_HOST/MAIL_FROM/MAIL_APP_URL to enable
            # those flows (production refuses the `log` transport). MAIL_APP_URL is the https origin
            # (e.g. https://astrolabe.example.com, no path) the reset link is built from; a malformed value
            # refuses startup, blank makes the self-service reset answer 503.
            # SMTP credentials come from the Secret.
            - name: MAIL_TRANSPORT
              value: "disabled"
            - name: SMTP_HOST
              value: ""
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_STARTTLS
              value: "true"
            - name: MAIL_FROM
              value: "astrolabe@localhost"
            - name: MAIL_APP_URL
              value: ""
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: astrolabe-secrets
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: astrolabe-secrets
                  key: SMTP_PASSWORD
                  optional: true
          # Local render placeholder. apply-local.sh substitutes an immutable per-build tag
          # before kubectl sees the manifest; OrbStack shares Docker's image store.
          image: astrolabe-app:local-build
          imagePullPolicy: IfNotPresent
          name: astrolabe-app
          ports:
            - containerPort: 8086
              protocol: TCP
          # Sized for the tuned JVM baked into the image (SerialGC + -Xmx256m + C1 + the heap/thread
          # sizing flags of server/build.gradle.kts): ~200 MiB RSS idle (inherited sizing, to be
          # re-measured). Request covers steady state; the 512 MiB limit bounds it with headroom.
          resources:
            requests:
              cpu: "250m"
              memory: "320Mi"
            limits:
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # /api/v1/ready round-trips the database (SELECT 1) — the pod leaves the Service while
          # postgres is unreachable; /api/v1/health only proves the process answers. The
          # startupProbe gives JVM boot + Flyway migrations up to ~150s (30 x 5s) before the
          # liveness clock starts, so a slow first boot cannot trigger a restart.
          # Every probe sends X-Forwarded-Proto: https — the header the TLS-terminating ingress
          # sets (the base ConfigMap's HTTP_BEHIND_PROXY=true makes the app trust it; under the
          # local overlay the header is ignored, harmlessly — development mode never redirects).
          # Without it, production mode answers the plain-HTTP probe with a 301 to https://<pod-ip>/, which the kubelet
          # FOLLOWS (same host) into a refused :443 — probes never pass and the pod crash-loops
          # (a past incident, reproduced in production). startupProbe/livenessProbe
          # hit /api/v1/health, which never waits on the database (plugins/Health.kt) — the
          # kubelet's default timeoutSeconds: 1 is sane as-is; only readinessProbe (below) needs
          # a longer one.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8086
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8086
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 5
            # /ready can wait in the R2DBC pool queue up to READINESS_TIMEOUT_MS (3s,
            # plugins/Health.kt) before answering — the kubelet's default 1s probe timeout would
            # abort the HTTP call (and count it as a failed probe) well before that budget is
            # spent. timeoutSeconds must exceed 3s; failureThreshold above the kubelet default
            # (3) tolerates a few probes landing during a brief pool-saturation spike (a burst of
            # concurrent requests, not an actual outage) without flapping the pod out of the
            # Service.
            timeoutSeconds: 4
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8086
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
