apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: app
  name: app
  namespace: astrolabe
spec:
  # OrbStack provisions local LoadBalancers; `kubectl -n astrolabe port-forward svc/app` is
  # the fallback. Port 8086 (not 8080-8085) so Astrolabe's LB can coexist with other
  # local stacks.
  type: LoadBalancer
  ports:
    - name: "8086"
      port: 8086
      targetPort: 8086
  selector:
    io.kompose.service: app
