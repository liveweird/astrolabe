services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    container_name: astrolabe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: astrolabe
      POSTGRES_USER: astrolabe
      POSTGRES_PASSWORD: astrolabe
    ports:
      # Host port 5437 (not 5432-5436) so Astrolabe can run beside other local stacks on the same
      # machine; in-network consumers still use postgres:5432. Loopback-bound: the demo database
      # is never reachable from the LAN.
      - "127.0.0.1:5437:5432"
    volumes:
      # postgres 18+ images keep data in a versioned subdir of /var/lib/postgresql;
      # mounting the pre-18 /var/lib/postgresql/data path makes the container unhealthy.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrolabe -d astrolabe"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Bounded; the foundation's data is tiny. Raise it when real datasets arrive.
    mem_limit: 512m

  mailpit:
    # Local mail catcher for the demo: password-reset and MFA email lands here.
    # Read it at http://localhost:8029 (8025-8028 belong to other local stacks).
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    container_name: astrolabe-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8029:8025"
    mem_limit: 128m

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Optional build identity for the telemetry process rows (unset = empty = recorded as null).
      args:
        ASTROLABE_BUILD_VERSION: ${ASTROLABE_BUILD_VERSION:-}
        ASTROLABE_BUILD_COMMIT: ${ASTROLABE_BUILD_COMMIT:-}
    container_name: astrolabe-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/astrolabe
      POSTGRES_R2DBC_URL: r2dbc:postgresql://postgres:5432/astrolabe
      POSTGRES_USER: astrolabe
      POSTGRES_PASSWORD: astrolabe
      # This compose file is the LOCAL DEMO (clone & run over plain http://localhost:8086).
      # Development mode keeps HSTS/HTTPS-redirect off and tolerates the demo credentials
      # below. Any real deployment runs the image as shipped (KTOR_DEVELOPMENT=false), which
      # fail-closes on this JWT key and on the seeded 'changeme' password.
      KTOR_DEVELOPMENT: "true"
      # Bundled-demo signing key so tokens can't be forged with the placeholder "secret".
      # It is committed to the repo and therefore BURNED: production mode refuses to start
      # with it. Set your own (e.g. `openssl rand -hex 32`) for any real deployment.
      JWT_SECRET: "${JWT_SECRET:-dev-only-e6ff3a373320b01eedd36dc3d5e03f03b10cfaacc19e2e885ebb63d40297d0e3}"
      # Demo key for stored credentials (encrypted at rest). Committed and
      # therefore BURNED like the JWT key: production mode refuses it. `openssl rand -hex 32`.
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:-d68246b14fd596319e5f3ee40be4d3ded6f53cd873a1285df6a53950de4c5126}"
      # Rotation only: the OLD key, decrypt-only. Blank (the default) means no previous key (security.md "Encryption at rest").
      DATA_ENCRYPTION_KEY_PREVIOUS: "${DATA_ENCRYPTION_KEY_PREVIOUS:-}"
      # Real SMTP delivery into the bundled Mailpit (the image default is MAIL_TRANSPORT=disabled).
      MAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      MAIL_FROM: astrolabe@localhost
      # The password-reset link's origin; the isolated e2e stack points it at its own port.
      MAIL_APP_URL: ${MAIL_APP_URL:-http://localhost:8086}
      # The Jira stub (below) stands in for BOTH the tenant_info host and the Atlassian gateway of a `stub-` site, so a connection to
      # `https://stub-sample.atlassian.net` tests green offline (any other site reaches Atlassian). Development mode ONLY: production startup refuses a non-blank value
      # (KTOR_DEVELOPMENT above is "true" for exactly this demo). There is deliberately NO depends_on the stub: the app boots without it.
      # Careful: this reads the HOST's JIRA_STUB_BASE_URL first. A value exported for `./gradlew :server:run` (say http://localhost:8096) is passed into
      # THIS container, where `localhost` is the container itself, not the stub, and Test connection then fails; unset it for compose. An EMPTY value
      # (JIRA_STUB_BASE_URL= docker compose up) disables the stub; only an UNSET variable gets the default below.
      JIRA_STUB_BASE_URL: ${JIRA_STUB_BASE_URL-http://jira-stub:8080}
      # The per-IP Test connection / Peek bucket: 30/min here (the e2e suite drives the Jira specs from one host and a retried group
      # would exhaust the default 10); the shipped production manifests keep the default (security.md "Per-IP login bucket").
      JIRA_TEST_RATE_LIMIT_PER_MINUTE: "30"
      # The Flow stub (below), the origin a Flow connection may name: a comma-separated list of exact `http://host[:port]` origins, development mode
      # ONLY (production startup refuses a non-blank value). Read from v1.5.0 C3 on; until then the app ignores it. Like the Jira stub there is
      # NO depends_on, and the same host-environment caveat applies: an exported FLOW_INSECURE_ORIGINS reaches this container, and an EMPTY value
      # (FLOW_INSECURE_ORIGINS= docker compose up) disables the stub; only an UNSET variable gets the default below. For a real
      # Flow running as its own compose stack use the committed override (docker-compose.real-flow.yaml: it joins Flow's network and lists
      # http://flow-app:8084); `host.docker.internal` is NOT usable on OrbStack (0.250.250.254 is in the never-allowed 0.0.0.0/8).
      FLOW_INSECURE_ORIGINS: ${FLOW_INSECURE_ORIGINS-http://flow-stub:8080}
      # The per-IP Flow Test connection bucket (`flow-test`, read from v1.5.0 C4 on): 30/min here for the e2e suite, as for `jira-test`; the production default is 10.
      FLOW_TEST_RATE_LIMIT_PER_MINUTE: "30"
    ports:
      - "127.0.0.1:8086:8086"
    # Mirrors the image's HEALTHCHECK (stated here so `depends_on: service_healthy` and the e2e
    # global setup can wait on the app the way the app waits on postgres).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8086/api/v1/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    # One process (no worker role): the image's baked -Xmx256m heap plus non-heap (~150 MiB) fits 512m with headroom.
    mem_limit: 512m
    # SIGTERM to SIGKILL, the k8s figure (terminationGracePeriodSeconds: 45): STOP_WAIT_SECONDS 20 s (plugins/OpenTelemetry.kt)
    # + the OpenTelemetry SDK close 10 s + 15 s margin; compose's 10 s default would SIGKILL the app mid-flush.
    # JvmMemoryFlagsTest pins it against STOP_WAIT_SECONDS.
    stop_grace_period: 45s
    # Hardened like the k8s pod (k8s/app-deployment.yaml): the image runs as uid 10001 and writes only /tmp
    # (logs go to stdout; the AppCDS archive is read-only), so no capability and no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  jira-stub:
    # WireMock over the deterministic Jira dataset (sample-data/jira-stub, generated by sample-data/jira/generate.mjs; never hand-edit).
    # Built with its own directory as the context, so the root .dockerignore (which keeps sample-data/ out of the app image) does not
    # apply. Host port 8096 (the sibling table in ci.md; the stubs of the other stacks sit on 8089/8094/8095), loopback-only. Flip the
    # day-2 scenario with: curl -X PUT http://localhost:8096/__admin/scenarios/jira-day2/state -d '{"state":"day2"}'
    build:
      context: sample-data/jira-stub
    image: astrolabe-jira-stub
    container_name: astrolabe-jira-stub
    restart: unless-stopped
    ports:
      - "127.0.0.1:8096:8080"
    # Measured (1.2.0: 1,612 mappings, 1,567 bodies, 26.8 MB of file bytes, 36 MB by `du` on disk; the image's JVM sizes its heap at 25 % of the limit): ~146 MiB RSS measured after the mappings load and a
    # walk of the IMP and single-key scopes. 1.4.0 grows the set to 2,278 mappings, 2,208 bodies, 31.4 MB of file bytes (46 MB by `du`) with the stories, the child-level type set and `COV`; ~144 MiB RSS measured after boot at that size (1.1.0, 1,503 mappings: ~125 MiB idle, ~165 MiB after 300 concurrent admin reads, ~150 MiB after a full 1,120-binding sync run, 25 calls).
    # 384m (a 96 MiB heap) leaves ~2.3x headroom; 256m also booted and served, but with little margin for the request journal.
    mem_limit: 384m
    # Hardened like the app: the image runs as root by default, but WireMock only reads /home/wiremock and needs a writable /tmp
    # (verified: boots and serves a full sync run with exactly these settings).
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  flow-stub:
    # WireMock over the deterministic Flow dataset (sample-data/flow-stub, generated by sample-data/flow/generate.mjs from the contract in
    # sample-data/flow/contract.mjs; never hand-edit): Flow 1.57.0's /api/v1/integration/{me,teams} and ONE accepted service token
    # (sample-data/flow/README.md). The same pinned WireMock image as the Jira stub. Host port 8097 (the sibling table in ci.md), loopback-only.
    # Flip the day-2 scenario with: curl -X PUT http://localhost:8097/__admin/scenarios/flow-day2/state -d '{"state":"day2"}'
    # and simulate an outage with the `flow-outage` scenario, state `down`.
    build:
      context: sample-data/flow-stub
    image: astrolabe-flow-stub
    container_name: astrolabe-flow-stub
    restart: unless-stopped
    ports:
      - "127.0.0.1:8097:8080"
    # 9 mappings and 6 bodies (0.26 MB of file bytes, a 130 KB document); ~115 MiB RSS measured after boot and a walk of every shape (ci.md). The image's JVM sizes its heap at
    # 25 % of the limit: 256m (a 64 MiB heap) is ample here, where the Jira stub needs 384m for its ~2,300 mappings.
    mem_limit: 256m
    # Hardened like the Jira stub and the app: WireMock only reads /home/wiremock and needs a writable /tmp.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
